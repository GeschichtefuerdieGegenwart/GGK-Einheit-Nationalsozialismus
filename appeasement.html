<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Frieden durch Zugeständnisse? – Appeasement</title>
<meta name="description" content="GGK M19 Appeasement: hybride Unterrichtsstunde mit Tablet-Arbeitsphasen und Plenum am Smartboard (Prototyp).">
<style>
/* Schriften lokal im Repository (SIL Open Font License), keine Verbindung zu Google */
@font-face{font-family:"Fraunces";src:url(assets/fonts/Fraunces72pt-SemiBold.woff) format("woff");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Fraunces";src:url(assets/fonts/Fraunces72pt-SemiBoldItalic.woff) format("woff");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}

:root{
  --bg:#F3EFE7; --surface:#FAF8F3; --surface2:#FFFDF8; --offset:#E9E2D7; --line:#D5CEC3; --border:rgba(36,34,31,.14);
  --ink:#24221F; --muted:#625F59; --faint:#79746C; --inverse:#FFFAF2;
  --red:#9B402D; --red-hi:#EAD7CF; --green:#2E5A47; --green-hi:#D6E4DC; --gold:#8C6717; --gold-hi:#EEE2BF;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:.75rem; --r-lg:1rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;text-size-adjust:none}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1rem,.95rem + .25vw,1.125rem);line-height:1.58;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;text-wrap:balance}
p,li{text-wrap:pretty}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:.35rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Gemeinsame Bausteine */
.mark{width:34px;height:34px;flex:0 0 auto}
.modus{display:inline-flex;align-items:center;gap:.55rem;font-weight:700;font-size:.92rem;padding:.35rem .85rem .35rem .6rem;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.modus i{width:.7rem;height:.7rem;border-radius:50%;background:currentColor;display:inline-block}
.modus small{font-weight:400;color:var(--muted);font-size:inherit}
.m-input{color:var(--ink)} .m-arbeit{color:var(--red)} .m-plenum{color:var(--ink)} .m-abstimmung{color:var(--green)} .m-reflexion{color:var(--gold)} .m-sicherung{color:var(--gold)}
.btn{min-height:48px;border:1px solid var(--border);border-radius:var(--r);padding:.6rem 1.3rem;background:var(--surface2);font-weight:700}
.btn:hover{background:var(--offset)}
.btn.primary{background:var(--red);color:var(--inverse);border-color:transparent}
.btn.primary:hover{background:#7A3122}
.btn.green{background:var(--green);color:var(--inverse);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.karte{display:inline-grid;place-items:center;min-width:2.4rem;height:2.4rem;border-radius:.55rem;font-weight:700;background:var(--green);color:var(--inverse)}
.hinweis{font-size:.88rem;color:var(--muted)}
.lead{font-size:clamp(1.15rem,1rem + .6vw,1.4rem);color:var(--muted);margin-bottom:2rem;max-width:40rem}
.meld{list-style:none;border-top:1px solid var(--line);margin-bottom:2rem;counter-reset:m}
.meld li{counter-increment:m;display:grid;grid-template-columns:2rem 1fr;gap:.5rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.meld li::before{content:counter(m);font-family:var(--display);color:var(--red);font-size:1.25rem;line-height:1.3}
@keyframes auf{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ Tablet ============ */
.t-top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.t-top-in{max-width:1280px;margin:auto;min-height:64px;padding:0 1.25rem;display:flex;align-items:center;gap:.9rem}
.brand{font-weight:700;line-height:1.2}.brand small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.t-prog{margin-left:auto;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.t-shell{max-width:1280px;margin:auto;display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100dvh - 65px)}
.weg{border-right:1px solid var(--border);padding:1.6rem 1rem;position:sticky;top:65px;height:calc(100dvh - 65px);overflow:auto}
.weg h2{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:700;margin:0 .6rem 1rem}
.weg .kap{font-size:.82rem;font-weight:700;color:var(--red);margin:1.2rem .6rem .35rem}
.weg button{width:100%;display:grid;grid-template-columns:1.8rem 1fr 1.3rem;gap:.4rem;align-items:center;text-align:left;border:0;background:transparent;border-radius:.6rem;padding:.65rem .6rem;color:var(--muted);min-height:48px}
.weg button .n{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
.weg button.akt{background:var(--surface2);color:var(--ink);box-shadow:0 1px 2px rgba(65,48,34,.08)}
.weg button.zu{opacity:.55;cursor:default}
.weg .st{width:1.2rem;height:1.2rem;border-radius:50%;border:1px solid var(--border);font-size:.72rem;display:grid;place-items:center}
.weg .st.ok{background:var(--green);border-color:var(--green);color:var(--inverse)}
.t-main{padding:clamp(1.5rem,4vw,3.5rem);min-width:0}
.seite{max-width:46rem;animation:auf .35s cubic-bezier(.16,1,.3,1)}
.seite h1{font-size:clamp(1.9rem,1.3rem + 2vw,2.8rem);margin:1rem 0 .6rem}
.auftrag{background:var(--ink);color:var(--inverse);border-radius:var(--r-lg);padding:1.4rem 1.6rem;margin-bottom:1.6rem}
.auftrag h2{font-size:1.3rem;margin-bottom:.4rem}
.auftrag p{color:#DCD5CA}
.frage{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.3;margin:.2rem 0 .7rem}
.zeile{padding:1.1rem 0;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.seg button,.wahl{border:1.5px solid var(--border);background:var(--surface2);border-radius:.65rem;padding:.75rem .7rem;min-height:52px;text-align:left;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--red);background:var(--red-hi);font-weight:700}
.wahl{display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;width:100%;margin:.45rem 0}
.wahl .box{width:1.35rem;height:1.35rem;border-radius:.35rem;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:.85rem;margin-top:.1rem}
.wahl[aria-pressed="true"]{border-color:var(--red);background:var(--red-hi)}
.wahl[aria-pressed="true"] .box{background:var(--red);border-color:var(--red);color:var(--inverse)}
.pos{display:grid;gap:.6rem;margin:.6rem 0}
.pos button{display:grid;grid-template-columns:2.6rem 1fr;gap:.8rem;align-items:center;text-align:left;border:1.5px solid var(--border);background:var(--surface2);border-radius:.8rem;padding:.7rem .9rem;min-height:60px}
.pos button[aria-pressed="true"]{border-color:var(--green);background:var(--green-hi);font-weight:700}
.pos button .karte{background:var(--surface);color:var(--green);border:1.5px solid var(--green)}
.pos button[aria-pressed="true"] .karte{background:var(--green);color:var(--inverse)}
.fuss{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--line);margin-top:2.2rem;padding-top:1.3rem;flex-wrap:wrap}
.code{display:flex;gap:.6rem;align-items:stretch;margin-top:.4rem;flex-wrap:wrap}
.code input{flex:1 1 12rem;min-height:52px;border:1.5px solid var(--border);border-radius:var(--r);padding:.5rem 1rem;font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase;background:var(--surface2)}
.fehler{color:var(--red);margin-top:.5rem;min-height:1.5em}
.schau{margin-top:1rem;padding:1.4rem 1.6rem;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border)}
.schau b{font-family:var(--display);font-size:1.35rem;font-weight:600;display:block;margin-bottom:.3rem}
.stopp-t{min-height:60dvh;display:grid;align-content:center;gap:.6rem}
.stopp-t h1{font-size:clamp(2.6rem,2rem + 3vw,4.2rem)}
.stimmkarte{position:fixed;inset:0;z-index:50;background:var(--green);color:var(--inverse);display:grid;place-content:center;text-align:center;padding:2rem;gap:1rem}
.stimmkarte .gross{font-family:var(--display);font-weight:600;font-size:min(50vw,50vh);line-height:.9}
.stimmkarte p{font-size:1.35rem;max-width:30rem;margin:auto}
.stimmkarte .zu{position:absolute;top:1rem;right:1rem;background:transparent;border:1px solid rgba(255,250,242,.5);color:var(--inverse);border-radius:var(--r);padding:.6rem 1rem;min-height:48px}
.vgl{display:grid;gap:.6rem;margin:1rem 0}
.vgl div{display:grid;grid-template-columns:1fr auto;gap:1rem;padding:.8rem 1rem;background:var(--surface);border-radius:.6rem;border-left:4px solid var(--line)}
.vgl div.ok{border-left-color:var(--green)} .vgl div.nein{border-left-color:var(--red)}
.mobil-weg{display:none}
@media (max-width:860px){
  .t-shell{grid-template-columns:1fr}
  .weg{display:none}
  .mobil-weg{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem 1.25rem;border-bottom:1px solid var(--border);scrollbar-width:none}
  .mobil-weg button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.4rem .8rem;font-size:.88rem;min-height:40px}
  .mobil-weg button.akt{background:var(--ink);color:var(--inverse)}
  .mobil-weg button.zu{opacity:.5}
  .seg{grid-template-columns:1fr}
  .vgl div{grid-template-columns:1fr}
}

/* ============ Smartboard ============ */
body.board{overflow:hidden}
.b{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.b-top{display:grid;grid-template-columns:auto 1fr;gap:1.6rem;align-items:center;padding:1rem 2.4rem .6rem}
.tl{position:relative;height:2.4rem;margin-right:2rem}
.tl .ax{position:absolute;left:0;right:0;top:1rem;height:2px;background:var(--line)}
.tl .ps{position:absolute;left:0;top:1rem;height:2px;background:var(--ink)}
.tl .yr{position:absolute;top:1.35rem;transform:translateX(-50%);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .pt{position:absolute;top:.62rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.tl .pt.now{background:var(--red);box-shadow:0 0 0 5px var(--red-hi)}
.tl .lb{position:absolute;top:-.55rem;transform:translateX(-50%);font-size:.85rem;font-weight:700;white-space:nowrap}
.b-main{min-height:0;overflow:auto;padding:1rem 2.4rem;display:grid;align-content:center}
.b-foot{display:flex;align-items:center;gap:1.5rem;padding:.8rem 2.4rem 1.1rem;border-top:1px solid var(--border);font-size:.95rem}
.b-foot .stn{font-weight:700;min-width:12rem}
.phasen{display:flex;gap:.35rem;flex:1;list-style:none}
.phasen li{flex:1;padding:.5rem .7rem;border-radius:.55rem;color:var(--faint);border-top:3px solid var(--line);font-weight:700}
.phasen li.vorbei{color:var(--muted);border-top-color:var(--muted)}
.phasen li.jetzt{color:var(--ink);border-top-color:var(--red);background:var(--surface)}
.b-nav{display:flex;gap:.4rem}
.b-nav button{width:52px;height:52px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);font-size:1.4rem}
.dunkel{background:var(--ink);color:var(--inverse)}
.dunkel .b-foot{border-top-color:rgba(255,250,242,.14)}
.dunkel .phasen li{border-top-color:#4A4640;color:#8D867C}
.dunkel .phasen li.vorbei{border-top-color:#B9B1A6;color:#B9B1A6}
.dunkel .phasen li.jetzt{background:#2F2C28;color:var(--inverse);border-top-color:#9CC7B2}
.dunkel .b-nav button{background:#2F2C28;border-color:#4A4640;color:var(--inverse)}
.dunkel .tl .ax{background:#4A4640}.dunkel .tl .ps,.dunkel .tl .pt{background:var(--inverse)}.dunkel .tl .yr{color:#A79F94}
.dunkel .tl .pt.now{background:#9CC7B2;box-shadow:0 0 0 5px #3B4A43}
.dunkel .modus{background:#2F2C28;border-color:#4A4640}
.dunkel .modus small{color:#B9B1A6}
.dunkel .m-plenum,.dunkel .m-input{color:var(--inverse)} .dunkel .m-abstimmung{color:#9CC7B2}

.lage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3rem;align-items:center}
.lage .datum{font-family:var(--display);font-weight:600;font-size:clamp(3rem,6.2vw,6.4rem);line-height:.95;margin:1.2rem 0 1rem}
.lage .ereignis{font-size:clamp(1.4rem,2.2vw,2.2rem);color:var(--muted);font-family:var(--display);font-style:italic;font-weight:600;max-width:20ch;line-height:1.2}
.bild{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.bild img,.bild svg{display:block;width:100%;height:auto;max-height:56vh;object-fit:cover}
.bild figcaption{padding:.7rem 1rem;font-size:.82rem;color:var(--muted);line-height:1.4}
.bildfehlt{padding:2rem;font-size:1.05rem;color:var(--muted);min-height:16rem;display:grid;align-content:center}
.gross-frage{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,4.6vw,4.8rem);line-height:1.08;max-width:18ch;margin:1.4rem 0}
.mittel{font-size:clamp(2rem,3.4vw,3.4rem);max-width:24ch;margin:1rem 0 .4rem}
.unter{font-size:clamp(1.1rem,1.6vw,1.6rem);color:#C9C1B6;max-width:40rem}
.arbeit-b{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:3rem;align-items:center}
.arbeit-b h2{font-size:clamp(2.2rem,4vw,4rem);margin:1.2rem 0 1rem}
.codewort{border:2px solid var(--red);border-radius:var(--r-lg);padding:1.6rem 2rem;background:var(--surface2)}
.codewort span{display:block;color:var(--muted);font-weight:700}
.codewort b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(2.8rem,5.4vw,5.6rem);letter-spacing:.05em;color:var(--red);line-height:1.05;margin:.3rem 0;word-break:break-word}
.codewort.refl{border-color:var(--gold)} .codewort.refl b{color:var(--gold)}
.uhr{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,4vw,4rem);font-variant-numeric:tabular-nums}
.uhr.aus{color:var(--red)}
.ergebnis{display:grid;gap:1.3rem;margin-top:1.6rem;max-width:76rem}
.eb{display:grid;grid-template-columns:4rem minmax(12rem,22rem) 1fr auto;gap:1.2rem;align-items:center}
.eb .karte{width:4rem;height:4rem;font-size:2rem;font-family:var(--display);font-weight:600;background:transparent;border:2px solid #9CC7B2;color:#9CC7B2}
.eb .txt{font-size:clamp(1.05rem,1.4vw,1.4rem);line-height:1.3}
.eb .bars{display:grid;gap:.35rem}
.eb .bar{height:1.3rem;border-radius:.35rem;background:#2F2C28;overflow:hidden}
.eb .bar i{display:block;height:100%;background:#9CC7B2;transition:width .6s cubic-bezier(.16,1,.3,1)}
.eb .bar.r1 i{background:#5F7F70}
.eb .zahl{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,2.4vw,2.6rem);font-variant-numeric:tabular-nums;min-width:7rem;text-align:right;white-space:nowrap}
.eb .zahl small{font-family:var(--body);font-weight:400;font-size:.9rem;color:#A79F94;display:block}
.zaehl{display:flex;gap:.4rem;margin-top:.4rem}
.zaehl button{width:2.6rem;height:2.6rem;border-radius:.5rem;border:1px solid #4A4640;background:#2F2C28;color:var(--inverse);font-size:1.25rem}
.legende{color:#A79F94;font-size:.95rem;margin-top:.6rem}
.quiz-b{display:grid;max-width:76rem;margin-top:.6rem}
.qz{display:grid;grid-template-columns:1fr 15rem;gap:.4rem 1.6rem;align-items:center;padding:.9rem 0;border-bottom:1px solid #4A4640}
.qz p{font-size:clamp(1.05rem,1.45vw,1.45rem);line-height:1.35}
.qz .lsg{font-weight:700;padding:.5rem .9rem;border-radius:.55rem;text-align:center}
.qz .lsg.A{background:var(--inverse);color:var(--ink)} .qz .lsg.B{background:var(--gold-hi);color:#5E450F} .qz .lsg.C{background:var(--red-hi);color:#6E2C1F}
.qz .lsg.zu{background:transparent;border:1.5px dashed #6A645B;color:#A79F94;font-weight:400}
.qz .erkl{grid-column:1/-1;color:#B9B1A6;font-size:1rem}
.zitate{display:grid;gap:2rem;max-width:72rem;margin-top:1.6rem}
.zitat{display:grid;grid-template-columns:15rem 1fr;gap:2rem;animation:auf .5s ease}
.zitat .wer b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600}
.zitat .wer{color:#C9C1B6}
.zitat q{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,2.3vw,2.4rem);line-height:1.25;quotes:"„" "“"}
.zitat .orig{display:block;color:#A79F94;font-size:.95rem;margin-top:.5rem}
.vergleich{display:grid;grid-template-columns:1fr 1fr;gap:4rem;margin-top:1.6rem}
.vergleich .z{font-family:var(--display);font-weight:600;font-size:clamp(4rem,9vw,9rem);line-height:1;font-variant-numeric:tabular-nums}
.vergleich h3{font-family:var(--body);font-size:1.15rem;font-weight:700;color:#C9C1B6}
.vergleich p{color:#A79F94;font-size:1rem;max-width:30rem}
.ton{max-width:64rem}
.ton p.de{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,2vw,2rem);line-height:1.3;margin:1rem 0 .2rem}
.ton p.en{color:var(--muted);font-size:.98rem}
.ton audio{width:100%;max-width:36rem;margin:.6rem 0 .2rem}
.def{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,2.6vw,2.6rem);line-height:1.25;max-width:42ch;margin:1.2rem 0 1.4rem}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:3rem;max-width:70rem}
.zwei h3{font-family:var(--body);font-size:1.1rem;font-weight:700;margin-bottom:.4rem}
.zwei ul{padding-left:1.2rem;font-size:clamp(1.05rem,1.4vw,1.35rem)}
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem 2.2rem;margin-top:1.4rem}
.lk>div{border-top:3px solid var(--ink);padding-top:.7rem;min-height:8rem}
.lk>div.leer{border-top:2px dashed var(--line);color:var(--faint)}
.lk b{font-family:var(--display);font-weight:600;font-size:1.35rem;display:block}
.lk i{display:block;color:var(--muted);font-size:.95rem;margin:.2rem 0 .5rem}
.lk ul{padding-left:1.1rem}
.start-b h1{font-size:clamp(3.2rem,7vw,7.2rem);line-height:.95;margin:1.4rem 0 1.2rem;max-width:14ch}
.start-b .lf{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(1.4rem,2.2vw,2.2rem);color:var(--muted);max-width:34ch;line-height:1.25}
.start-b .wie{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2rem;margin-top:2.6rem;color:var(--muted);max-width:80rem}
.start-b .wie span{border-top:3px solid var(--line);padding-top:.6rem}
.start-b .wie b{display:block;color:var(--ink);font-size:1.1rem}
.start-b .wie span:nth-child(2){border-top-color:var(--red)} .start-b .wie span:nth-child(4){border-top-color:var(--green)}
dialog{border:none;border-radius:var(--r-lg);padding:1.6rem;max-width:34rem;width:92vw;background:var(--surface2);color:var(--ink)}
dialog::backdrop{background:rgba(36,34,31,.55)}
dialog h3{margin-bottom:.8rem}
dialog label{display:block}
dialog select,dialog textarea{width:100%;border:1px solid var(--border);border-radius:.5rem;padding:.6rem;margin:.3rem 0 .8rem;background:#fff}
dialog menu{display:flex;justify-content:flex-end;gap:.6rem}
@media (max-width:900px){

<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ==================================================================
   M19 Appeasement – hybrides Lagezentrum (Prototyp)
   ?ansicht=tablet    Schüler*innen: kurze Arbeitsphasen, Stimmkarte
   ?ansicht=board     Smartboard: Lage, Plenum, Abstimmung (Lehrkraft)
   ?ansicht=lehrkraft zweites Fenster auf dem Laptop (Impulse, Ablauf)
   Tablets und Smartboard sind NICHT verbunden (kein Server). Die
   Lehrkraft gibt Arbeitsphasen per Codewort frei und zählt die
   hochgehaltenen Tablets. Gespeichert wird nur lokal, ohne Namen.
   ================================================================== */

const ANSICHT = new URLSearchParams(location.search).get("ansicht");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lade = (k, d) => { try { const x = JSON.parse(localStorage.getItem(k)); return x ?? d; } catch(e) { return d; } };
const speichere = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

/* Zeichen: Regierungs- und Oppositionsbank, dazwischen der Gang */
const MARK = `<svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="6" width="28" height="7" rx="3.5" fill="#2E5A47"/><rect x="3" y="21" width="28" height="7" rx="3.5" fill="#2E5A47" opacity=".55"/><rect x="15" y="13" width="4" height="8" rx="2" fill="#9B402D"/></svg>`;

/* ---------------------- Inhalte ---------------------- */

const KAT = {A:"damals bekannt", B:"damals vermutet", C:"erst später bekannt"};

const QUIZ = [
  { t:"Hitler hat in „Mein Kampf“ „Lebensraum im Osten“ gefordert.", a:"A",
    e:"Das Buch war seit 1925/26 öffentlich und auch in Großbritannien bekannt – viele hielten es aber für Propaganda aus früheren Jahren." },
  { t:"Hitler will nur Gebiete mit deutschsprachiger Bevölkerung.", a:"B",
    e:"Viele in London hielten das für plausibel; die NS-Propaganda sprach von „Selbstbestimmung“. Ob es stimmt, ist im März 1938 offen." },
  { t:"Hitler hat im November 1937 intern Pläne vorgetragen, Österreich und die Tschechoslowakei bei günstiger Gelegenheit zu überwältigen.", a:"C",
    e:"Die Hoßbach-Niederschrift (5.11.1937) war ein internes Protokoll; öffentlich wurde sie erst im Nürnberger Prozess 1945/46. Wer „damals bekannt“ gewählt hat, hat mit unserem Wissen entschieden." },
  { t:"Die Wehrmacht ist 1938 bereit für einen großen europäischen Krieg.", a:"B",
    e:"Damals befürchtet, vor allem mit Blick auf die Luftwaffe. Die Forschung urteilt heute, dass die Wehrmacht 1938 für einen langen, großen Krieg nicht gerüstet war." }
];

const S2 = {
  datum:"12./13. März 1938", ereignis:"Deutsche Truppen marschieren in Österreich ein",
  meldungen:[
    "Am 12. März überschreiten deutsche Truppen die österreichische Grenze. Sie stoßen auf keinen Widerstand; viele Menschen jubeln ihnen zu.",
    "Am 13. März wird Österreich per Gesetz Teil des Deutschen Reiches. Die NS-Führung begründet das damit, alle Deutschen in einem Reich zu vereinen.",
    "In Wien werden Regimegegner verhaftet, Jüdinnen und Juden öffentlich gedemütigt und beraubt. London und Paris protestieren, handeln aber nicht."
  ]
};

const S3 = {
  datum:"27. September 1938", ereignis:"Sudetenkrise: Steht Europa vor einem Krieg?",
  meldungen:[
    "Hitler fordert, dass die Tschechoslowakei ihre überwiegend deutschsprachigen Grenzgebiete – das „Sudetengebiet“ – abtritt. Dort leben rund drei Millionen Deutschsprachige.",
    "Premierminister Chamberlain ist zweimal zu Hitler geflogen (15. und 22. September). Beim zweiten Treffen verschärft Hitler seine Forderungen und setzt eine Frist.",
    "Frankreich ist mit der Tschechoslowakei verbündet; Großbritannien hat mit Prag keinen Vertrag. In London werden Gasmasken ausgegeben und Schutzgräben ausgehoben."
  ],
  argumente:[
    "Ein neuer Weltkrieg wäre schlimmer als jedes Zugeständnis. 1914–1918 darf sich nicht wiederholen.",
    "Wer jetzt nachgibt, belohnt Drohungen. Hitler wird weitere Forderungen stellen.",
    "Unsere Luftverteidigung ist noch nicht bereit. Jedes Jahr Aufrüstung macht uns stärker.",
    "Die Tschechoslowakei ist eine Demokratie und mit Frankreich verbündet. Wir dürfen sie nicht im Stich lassen.",
    "Im Sudetengebiet leben vor allem Deutschsprachige. Die Forderung hat einen nachvollziehbaren Kern.",
    "Ohne ihre Grenzbefestigungen ist die Tschechoslowakei schutzlos – und Deutschland wird stärker."
  ],
  frage:"Was soll Großbritannien jetzt tun?",
  opt:{ A:"Der Abtretung zustimmen, um den Frieden zu sichern.",
        B:"Zustimmen – aber nur gegen eine internationale Garantie für die übrige Tschechoslowakei.",
        C:"Hitler entgegentreten – notfalls Krieg an der Seite Frankreichs." },
  kurz:{ A:"Abtretung zustimmen", B:"Nur gegen Garantie", C:"Hitler entgegentreten" }
};

const ZITATE = [
  { wer:"Neville Chamberlain", rolle:"Premierminister, Konservative<br>3. Oktober 1938",
    de:"… eine Katastrophe abgewendet, die die Zivilisation, wie wir sie kennen, beendet hätte.",
    en:"… averted a catastrophe which would have ended civilisation as we have known it", sp:"Sp. 45" },
  { wer:"Clement Attlee", rolle:"Oppositionsführer, Labour<br>3. Oktober 1938",
    de:"Das war kein Sieg der Vernunft und der Menschlichkeit. Es war ein Sieg der rohen Gewalt.",
    en:"This has not been a victory for reason and humanity. It has been a victory for brute force.", sp:"Sp. 51" },
  { wer:"Winston Churchill", rolle:"Abgeordneter, Konservative<br>5. Oktober 1938",
    de:"Das ist erst der Anfang der Abrechnung.",
    en:"This is only the beginning of the reckoning.", sp:"Sp. 371" }
];

const FOTO = {
  src:"https://coimages.sciencemuseumgroup.org.uk/164/976/large_1983_5236_10691_1.jpg",
  lokal:"media/schutzgraeben-1938.jpg",
  alt:"Mittagspause in London: Eine Menschenmenge schaut Arbeitern zu, die in Lincoln’s Inn Schutzgräben gegen Luftangriffe ausheben.",
  cap:"Schutzgräben in Lincoln’s Inn, London, 27. September 1938. Foto: Reg Sayers, Daily Herald Archive · Science Museum Group Collection, Inv. 1983-5236/10691 · nicht-kommerzielle Nutzung nach den Bedingungen der Science Museum Group (vor Veröffentlichung prüfen)."
};
const TON = {
  mp3:"https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a1/Another_talk_with_the_German_Chancellor%2C_Herr_Hitler.ogg/Another_talk_with_the_German_Chancellor%2C_Herr_Hitler.ogg.mp3",
  ogg:"https://upload.wikimedia.org/wikipedia/commons/a/a1/Another_talk_with_the_German_Chancellor%2C_Herr_Hitler.ogg"
};

/* Lageskizze März 1938 – bewusst keine Landkarte: nur, wer an wen grenzt */
const SKIZZE = `<svg viewBox="0 0 900 470" role="img" aria-label="Lageskizze März 1938: Die Tschechoslowakei grenzt im Norden, Westen und Süden an das Deutsche Reich einschließlich des angegliederten Österreich; im Osten an Polen und Ungarn.">
  <style>.w{font:700 22px 'Atkinson Hyperlegible',Arial,sans-serif;fill:#FFFAF2}.l{font:700 23px 'Atkinson Hyperlegible',Arial,sans-serif;fill:#24221F}.k{font:italic 600 20px Fraunces,Georgia,serif;fill:#79746C}.s{font:16px 'Atkinson Hyperlegible',Arial,sans-serif;fill:#FFFAF2}</style>
  <rect width="900" height="470" fill="#FAF8F3"/>
  <path d="M70 40H560V200H330V390H70Z" fill="#625F59"/>
  <path d="M330 290H560V390H330Z" fill="#8E877D"/>
  <path d="M330 290H560" stroke="#FAF8F3" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M330 200H800V290H330Z" fill="#FFFDF8" stroke="#9B402D" stroke-width="4"/>
  <path d="M560 40H830V200H560ZM560 290H830V390H560Z" fill="none" stroke="#D5CEC3" stroke-width="2"/>
  <text x="96" y="104" class="w">Deutsches Reich</text>
  <text x="350" y="332" class="w">Österreich</text><text x="350" y="358" class="s">angegliedert 12./13. März</text>
  <text x="352" y="253" class="l">Tschechoslowakei</text>
  <text x="650" y="128" class="k">Polen</text><text x="650" y="348" class="k">Ungarn</text>
  <text x="400" y="440" class="k">Italien</text><text x="140" y="440" class="k">Schweiz</text>
</svg>`;

function modus(kl, text, zusatz){ return `<span class="modus ${kl}"><i></i>${text}${zusatz?` <small>· ${zusatz}</small>`:""}</span>`; }

/* ======================================================
   TABLET
   ====================================================== */

const TKEY = "ggk-appeasement-tablet:v2";
const WEG = [
  {kap:"Einstieg", id:"rolle", n:"0", t:"Deine Rolle", code:null},
  {kap:"I · Vertragsbrüche", id:"s1", n:"1", t:"Rheinland 1936", spaeter:true},
  {kap:"II · Expansion", id:"s2", n:"2", t:"„Anschluss“ 1938", code:"WIEN"},
  {id:"s3", n:"3", t:"Sudetenkrise 1938", code:"SUDETEN"},
  {kap:"III · Wendepunkt", id:"s4", n:"4", t:"Prag 1939", spaeter:true},
  {id:"s5", n:"5", t:"Polen 1939", spaeter:true},
  {kap:"IV · Rückblick", id:"rb", n:"6", t:"Dein Weg", code:"RUECKBLICK"}
];
let T = Object.assign({ seite:"rolle", offen:{rolle:true}, fertig:{}, quiz:{}, arg:[], pos:null, sicher:null, karte:false }, lade(TKEY, {}));
const tSave = () => speichere(TKEY, T);

function tablet(){
  const w = WEG.find(x=>x.id===T.seite) || WEG[0];
  const nOffen = WEG.filter(x=>!x.spaeter).length, nFertig = Object.keys(T.fertig).length;
  let weg = "", mob = "";
  for(const x of WEG){
    if(x.kap) weg += `<div class="kap">${x.kap}</div>`;
    const zu = x.spaeter, akt = x.id===T.seite;
    const st = T.fertig[x.id] ? `<span class="st ok" aria-label="erledigt">✓</span>` : `<span class="st"></span>`;
    weg += `<button class="${akt?"akt":""} ${zu?"zu":""}" data-weg="${x.id}" ${zu?'aria-disabled="true"':""} ${akt?'aria-current="step"':""}><span class="n">${x.n}</span><span>${esc(x.t)}${zu?' <small class="hinweis">· folgt</small>':""}</span>${st}</button>`;
    if(!zu) mob += `<button class="${akt?"akt":""} ${T.offen[x.id]?"":"zu"}" data-weg="${x.id}">${x.n} · ${esc(x.t)}</button>`;
  }
  $("#app").innerHTML = `
  <header class="t-top"><div class="t-top-in">${MARK}<div class="brand">Frieden durch Zugeständnisse?<small>M19 · Appeasement · deine Arbeitsseite</small></div><div class="t-prog">${nFertig} von ${nOffen} erledigt</div></div></header>
  <nav class="mobil-weg" aria-label="Lernweg">${mob}</nav>
  <div class="t-shell">
    <nav class="weg" aria-label="Dein Lernweg"><h2>Dein Lernweg</h2>${weg}
      <p class="hinweis" style="margin:2rem .6rem 0">Deine Antworten bleiben auf diesem Tablet. Es werden keine Namen gespeichert.</p></nav>
    <main class="t-main">${T.offen[w.id] ? tSeite(w.id) : tGesperrt(w)}</main>
  </div>
  ${T.karte ? stimmkarte() : ""}`;
  tVerdrahten();
}

function tGesperrt(w){
  return `<section class="seite">${modus("m-plenum","Plenum","schau nach vorn")}
    <h1>${esc(w.t)}</h1>
    <p class="lead">Dieser Schritt öffnet sich, sobald am Smartboard das Codewort erscheint.</p>
    <label for="code" class="frage" style="display:block">Codewort</label>
    <div class="code"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="vom Smartboard"><button class="btn primary" id="codeOk">Öffnen</button></div>
    <p class="fehler" id="codeF" role="status"></p></section>`;
}

function tSeite(id){
  if(id==="rolle") return `<section class="seite">${modus("m-input","Einstieg","lies kurz")}
    <h1>Sie sind Abgeordnete im House of Commons.</h1>
    <p class="lead">Sie entscheiden über die britische Reaktion auf das Vorgehen des nationalsozialistischen Deutschlands. Sie kennen den späteren Verlauf nicht. Entscheiden Sie nur mit dem, was Sie im jeweiligen Moment wissen.</p>
    <div class="auftrag"><h2>So läuft die Stunde</h2><p>Vorn am Smartboard führt die Lehrkraft in jede Lage ein. Dann arbeiten Sie hier kurz allein – ein Codewort öffnet den Schritt. Danach diskutieren wir gemeinsam, und Ihr Tablet wird zur Stimmkarte.</p></div>
    <p class="frage">Leitfrage der Stunde</p>
    <p class="lead" style="font-family:var(--display);font-style:italic;font-weight:600;color:var(--ink)">Warum setzte Großbritannien bis 1939 auf Appeasement – und wie gerecht ist unser heutiges Urteil darüber?</p>
    <div class="fuss"><span class="hinweis">Weiter geht es mit dem Codewort für Schritt 2.</span><button class="btn primary" data-fertig="rolle" data-nach="s2">Verstanden</button></div></section>`;

  if(id==="s2"){
    if(T.fertig.s2) return stopp("Was wusste London im März 1938?", "Tablet zur Seite. Die Auflösung kommt vorn – vergleichen Sie sie mit Ihren Zuordnungen.", tQuizUebersicht());
    const zeilen = QUIZ.map((q,i)=>`<div class="zeile"><p style="margin-bottom:.6rem">${esc(q.t)}</p><div class="seg" role="group" aria-label="Aussage ${i+1}">${["A","B","C"].map(k=>`<button data-quiz="${i}" data-k="${k}" aria-pressed="${T.quiz[i]===k}">${KAT[k]}</button>`).join("")}</div></div>`).join("");
    const alle = QUIZ.every((q,i)=>T.quiz[i]);
    return `<section class="seite">${modus("m-arbeit","Arbeitsphase","allein · 4 Minuten")}
      <h1>Was weiß London im März 1938?</h1>
      <p class="lead">${S2.datum}: ${S2.ereignis}.</p>
      <ol class="meld">${S2.meldungen.map(m=>`<li>${esc(m)}</li>`).join("")}</ol>
      <div class="auftrag"><h2>Ihr Auftrag</h2><p>Ordnen Sie jede Aussage ein: Was konnte man in London im März 1938 wissen – was nur vermuten – und was erfuhr man erst später?</p></div>
      ${zeilen}
      <div class="fuss"><span class="hinweis">${alle?"Alle vier eingeordnet.":"Ordnen Sie alle vier Aussagen ein."}</span><button class="btn primary" data-fertig="s2" ${alle?"":"disabled"}>Fertig</button></div></section>`;
  }

  if(id==="s3"){
    if(T.fertig.s3) return stopp("Wie entscheiden wir als Parlament?", "Tablet zur Seite – wir diskutieren vorn. Zur Abstimmung wird Ihr Tablet zur Stimmkarte.",
      `<div class="schau"><b>Ihre Position: ${T.pos} – ${esc(S3.kurz[T.pos])}</b><span class="hinweis">Sicherheit: ${esc(T.sicher)} · Ihre Argumente: Nr. ${T.arg.map(i=>i+1).join(" und ")}</span></div>
       <div class="fuss"><button class="btn" data-aendern="1">Position ändern</button><button class="btn green" data-karte="1">Stimmkarte zeigen</button></div>`);
    const args = S3.argumente.map((a,i)=>`<button class="wahl" data-arg="${i}" aria-pressed="${T.arg.includes(i)}"><span class="box">${T.arg.includes(i)?"✓":""}</span><span><b>${i+1}</b> · ${esc(a)}</span></button>`).join("");
    const pos = ["A","B","C"].map(k=>`<button data-pos="${k}" aria-pressed="${T.pos===k}"><span class="karte">${k}</span><span>${esc(S3.opt[k])}</span></button>`).join("");
    const sich = ["sehr sicher","eher sicher","unsicher"].map(s=>`<button data-sicher="${s}" aria-pressed="${T.sicher===s}">${s}</button>`).join("");
    const ok = T.arg.length===2 && T.pos && T.sicher;
    return `<section class="seite">${modus("m-arbeit","Arbeitsphase","allein oder zu zweit · 5 Minuten")}
      <h1>Was soll Großbritannien jetzt tun?</h1>
      <p class="lead">${S3.datum}. ${S3.ereignis}</p>
      <ol class="meld">${S3.meldungen.map(m=>`<li>${esc(m)}</li>`).join("")}</ol>
      <div class="auftrag"><h2>Ihr Auftrag</h2><p>Wählen Sie die zwei Argumente, die für Sie am schwersten wiegen. Legen Sie sich dann fest: Was soll die Regierung tun – und wie sicher sind Sie?</p></div>
      <p class="frage">1 · Die zwei stärksten Argumente <span class="hinweis" style="font-family:var(--body)">(${T.arg.length} von 2)</span></p>
      <p class="hinweis">Die Argumente sind sinngemäß zugespitzt, keine Zitate.</p>
      ${args}
      <p class="frage" style="margin-top:1.8rem">2 · Ihre Position</p>
      <div class="pos">${pos}</div>
      <p class="frage" style="margin-top:1.4rem">3 · Wie sicher sind Sie?</p>
      <div class="seg">${sich}</div>
      <div class="fuss"><span class="hinweis">${ok?"Bereit für das Plenum.":"Zwei Argumente, eine Position, eine Sicherheit."}</span><button class="btn primary" data-fertig="s3" ${ok?"":"disabled"}>Fertig</button></div></section>`;
  }

  if(id==="rb"){
    const hoss = T.quiz[2];
    return `<section class="seite">${modus("m-reflexion","Reflexion","allein · 3 Minuten")}
      <h1>Ihr Weg – und was wir heute wissen</h1>
      <p class="lead">Es geht nicht um richtig oder falsch, sondern darum, wo Sie heutiges Wissen benutzt haben.</p>
      <p class="frage">März 1938 · Was wusste London?</p>
      <div class="vgl">${QUIZ.map((q,i)=>`<div class="${T.quiz[i]===q.a?"ok":"nein"}"><span>${esc(q.t)}</span><span class="hinweis">Sie: ${esc(KAT[T.quiz[i]]||"–")}<br>tatsächlich: ${KAT[q.a]}</span></div>`).join("")}</div>
      ${hoss==="A"?`<p class="hinweis">Die internen Pläne von 1937 haben Sie für damals bekannt gehalten – das ist Wissen aus unserer Zeit.</p>`:""}
      <p class="frage" style="margin-top:1.8rem">September 1938 · Ihre Entscheidung</p>
      <div class="vgl"><div><span>Sie: ${T.pos?T.pos+" – "+esc(S3.kurz[T.pos]):"–"}${T.sicher?" ("+esc(T.sicher)+")":""}</span></div>
        <div><span>Tatsächlich: Großbritannien stimmt in München der Abtretung zu. Eine internationale Garantie für die übrige Tschechoslowakei wird in einem Zusatz angekündigt, kommt aber nie zustande. Das Unterhaus billigt die Politik der Regierung am 6. Oktober mit 366 zu 144 Stimmen.</span></div></div>
      <div class="auftrag" style="margin-top:1.6rem"><h2>Denken Sie kurz nach</h2><p>Wo haben Sie mit Wissen entschieden, das 1938 niemand hatte? Und welche Kritik an Appeasement bleibt trotzdem – auch mit dem Wissen von damals?</p></div>
      <div class="fuss"><span class="hinweis">Danach: kognitive Landkarte vorn.</span><button class="btn primary" data-fertig="rb">Fertig</button></div></section>`;
  }
  return "";
}

function tQuizUebersicht(){
  return `<div class="vgl">${QUIZ.map((q,i)=>`<div><span>${esc(q.t)}</span><span class="hinweis">Sie: ${esc(KAT[T.quiz[i]]||"–")}</span></div>`).join("")}</div>`;
}
function stopp(titel, text, extra){
  return `<section class="seite stopp-t">${modus("m-plenum","Plenum","Tablet zur Seite")}
    <h1>Stopp.</h1><p class="frage">${esc(titel)}</p><p class="lead" style="margin-bottom:.6rem">${esc(text)}</p>${extra||""}</section>`;
}
function stimmkarte(){
  const k = T.pos || "?";
  return `<div class="stimmkarte" role="dialog" aria-label="Stimmkarte"><button class="zu" data-karte="0">Schließen</button>
    <div class="gross">${k}</div><p>${esc(S3.opt[k]||"Noch keine Position gewählt.")}</p>
    <p style="font-size:1rem;opacity:.8">Hochhalten, wenn die Lehrkraft das Zeichen gibt.</p></div>`;
}

function tVerdrahten(){
  document.querySelectorAll("[data-weg]").forEach(b=>b.onclick=()=>{ const w=WEG.find(x=>x.id===b.dataset.weg); if(w.spaeter) return; T.seite=w.id; tSave(); tablet(); scrollTo(0,0); });
  const ok = $("#codeOk");
  if(ok){ const pr=()=>{ const w=WEG.find(x=>x.id===T.seite); const v=($("#code").value||"").trim().toUpperCase().replace(/Ü/g,"UE");
      if(v===w.code){ T.offen[w.id]=true; tSave(); tablet(); } else { $("#codeF").textContent="Das Codewort passt nicht. Schauen Sie noch einmal nach vorn."; } };
    ok.onclick=pr; $("#code").onkeydown=e=>{ if(e.key==="Enter") pr(); }; }
  document.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>{ T.quiz[b.dataset.quiz]=b.dataset.k; tSave(); tablet(); });
  document.querySelectorAll("[data-arg]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.arg; if(T.arg.includes(i)) T.arg=T.arg.filter(x=>x!==i); else if(T.arg.length<2) T.arg=[...T.arg,i]; else T.arg=[T.arg[1],i]; tSave(); tablet(); });
  document.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>{ T.pos=b.dataset.pos; tSave(); tablet(); });
  document.querySelectorAll("[data-sicher]").forEach(b=>b.onclick=()=>{ T.sicher=b.dataset.sicher; tSave(); tablet(); });
  document.querySelectorAll("[data-fertig]").forEach(b=>b.onclick=()=>{ T.fertig[b.dataset.fertig]=true; if(b.dataset.nach) T.seite=b.dataset.nach; tSave(); tablet(); scrollTo(0,0); });
  document.querySelectorAll("[data-karte]").forEach(b=>b.onclick=()=>{ T.karte = b.dataset.karte==="1"; tSave(); tablet(); });

}

const bSave = () => { speichere(BKEY, B); if(kanal) kanal.postMessage({B}); };

function zeitleiste(j){
  const x = v => ((v-1933)/(1939.9-1933)*100).toFixed(2)+"%";
  let h = `<div class="tl" aria-label="Zeitleiste 1933 bis 1939"><div class="ax"></div><div class="ps" style="width:${x(j)}"></div>`;
  for(let y=1933;y<=1939;y++) h+=`<div class="yr" style="left:${x(y)}">${y}</div>`;
  const pts=[[1938.2,"März 1938"],[1938.74,"Sept. 1938"]].filter(([v])=>v<=j+.001);
  pts.forEach(([v,l],k)=>{ const now=k===pts.length-1; h+=`<div class="pt ${now?"now":""}" style="left:${x(v)}"></div>${now?`<div class="lb" style="left:${x(v)}">${l}</div>`:""}`; });
  return h+"</div>";
}

function zeichneBoard(){
  if(ANSICHT==="lehrkraft") return lehrkraftfenster();

  $("#app").innerHTML = `<div class="b ${dunkel?"dunkel":""}">
    <header class="b-top">${MARK}${s.jahr?zeitleiste(s.jahr):"<div></div>"}</header>
    <main class="b-main">${bInhalt(s)}</main>
    <footer class="b-foot"><span class="stn">${esc(s.stn)}</span>${phasen}
      <span class="b-nav"><button data-b="zurueck" aria-label="Zurück">‹</button><button data-b="weiter" aria-label="Weiter">›</button></span></footer></div>`;
  bVerdrahten(); uhrStarten(s);
}

/* Uhr der Arbeitsphase */
let uhrT=null;
const fmt = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function restZeit(s){ const st=B.uhr[s.id]; return st ? s.min*60-(Date.now()-st)/1000 : s.min*60; }
function uhrStarten(s){
  clearInterval(uhrT);
  if(s.typ!=="arbeit") return;
  if(!B.uhr[s.id]){ B.uhr[s.id]=Date.now(); bSave(); }
  uhrT=setInterval(()=>{ const u=$("#uhr"); if(!u) return; const r=restZeit(s); u.textContent=fmt(r); u.classList.toggle("aus", r<=0); },1000);
}

function weiter(){
  const s=SCHRITTE[B.i];
  if(s.typ==="quiz" && B.quizAuf<QUIZ.length) return setB(b=>b.quizAuf++);
  if(s.typ==="zitate" && B.zit<ZITATE.length) return setB(b=>b.zit++);
  setB(b=>{ b.i=Math.min(SCHRITTE.length-1,b.i+1); });
}
function zurueck(){
  const s=SCHRITTE[B.i];
  if(s.typ==="quiz" && B.quizAuf>0) return setB(b=>b.quizAuf--);
  if(s.typ==="zitate" && B.zit>1) return setB(b=>b.zit--);
  setB(b=>b.i=Math.max(0,b.i-1));
}

function bVerdrahten(){
  document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=> b.dataset.b==="weiter"?weiter():zurueck());
  document.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{ const [r,k,d]=b.dataset.z.split(":"); setB(x=>x.votes[r][k]=Math.max(0,x.votes[r][k]+(+d))); });
}
window.bildFehler = img => {
  if(img.dataset.alt2){ const u=img.dataset.alt2; delete img.dataset.alt2; img.src=u; return; }
  const d=document.createElement("div"); d.className="bildfehlt"; d.textContent="Bild nicht geladen (kein Internet oder Datei fehlt). Bildbeschreibung: "+img.alt; img.replaceWith(d);
};

function notiz(){
  const d=$("#dlg");
  d.innerHTML=`<form method="dialog"><h3>Notiz für die Landkarte</h3>
    <label>Begriff<select name="t">${["Retrospektivität","Perspektivität","Kontingenz","Agency","Sachurteil","Werturteil"].map(t=>`<option>${t}</option>`).join("")}</select></label>
    <label>Beobachtung aus dem Gespräch (ohne Namen)<textarea name="x" rows="3" maxlength="200"></textarea></label>
    <menu><button class="btn" value="x">Abbrechen</button><button class="btn primary" value="ok">Übernehmen</button></menu></form>`;
  d.onclose=()=>{ if(d.returnValue!=="ok") return; const f=new FormData(d.querySelector("form")); const x=(f.get("x")||"").trim(); if(x) setB(b=>b.notizen.push({t:f.get("t"),x})); };
  d.showModal();
}

  const s=SCHRITTE[B.i], imp=(IMPULSE[s.id]||[]).map(t=>`<li>${esc(t)}</li>`).join("")||`<li class="hinweis">Keine Impulse für diesen Schritt.</li>`;
  $("#app").innerHTML=`<main class="t-main" style="max-width:60rem;margin:auto">${modus("m-plenum","Lehrkraftfenster","gleicher Stand wie das Smartboard")}
    <h1 style="font-size:2rem;margin:1rem 0 .3rem">${esc(s.stn)} – ${esc(s.name)}</h1>
    <p class="hinweis">Schritt ${B.i+1} von ${SCHRITTE.length}${SCHRITTE[B.i+1]?" · als Nächstes: "+esc(SCHRITTE[B.i+1].name):""}</p>
    <div class="fuss" style="border:0;justify-content:flex-start;gap:.6rem"><button class="btn" data-b="zurueck">Zurück</button><button class="btn primary" data-b="weiter">Weiter</button><button class="btn" id="nz">Notiz für die Landkarte</button><button class="btn" id="rs">Alles zurücksetzen</button></div>
    <h2 style="font-size:1.3rem;margin:1.4rem 0 .4rem">Impulse (sinngemäße Zuspitzungen)</h2><ul style="padding-left:1.2rem;font-size:1.15rem">${imp}</ul>
    <h2 style="font-size:1.3rem;margin:1.4rem 0 .4rem">Ablauf</h2><ol style="padding-left:1.8rem">${SCHRITTE.map((x,i)=>`<li style="${i===B.i?"color:var(--red);font-weight:700":""}"><a href="#" data-sprung="${i}" style="color:inherit">${esc(x.stn)} · ${esc(x.name)}</a></li>`).join("")}</ol></main>`;
  bVerdrahten();
  $("#nz").onclick=notiz;
  $("#rs").onclick=()=>{ if(confirm("Alle Stimmen, Uhren und Notizen löschen und zum Start zurück?")) setB(b=>Object.assign(b,LEERB())); };
  document.querySelectorAll("[data-sprung]").forEach(a=>a.onclick=e=>{ e.preventDefault(); const n=+a.dataset.sprung; setB(b=>b.i=n); });
}

/* Auswahl der Ansicht */
function auswahl(){
  $("#app").innerHTML=`<main class="wahl-a">${MARK}
    <h1>Frieden durch Zugeständnisse?</h1>
    <p class="lead" style="margin:0">M19 · Appeasement. Wählen Sie Ihre Ansicht.</p>
    <div class="zwei-a"><a href="?ansicht=tablet"><b>Tablet</b>Für Schüler*innen: Arbeitsphasen und Stimmkarte.</a>
    <a class="dk" href="?ansicht=board"><b>Smartboard</b>Für die Lehrkraft: Lage, Plenum, Abstimmung.<br><span style="opacity:.75;font-size:.9rem">Tasten: → weiter · ← zurück · N Notiz · L Lehrkraftfenster · F Vollbild</span></a></div></main>`;
}

document.addEventListener("keydown", e=>{
  if(ANSICHT!=="board" && ANSICHT!=="lehrkraft") return;
  if($("#dlg").open || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(["ArrowRight"," ","PageDown"].includes(e.key)){ e.preventDefault(); weiter(); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); zurueck(); }
  else if(e.key==="n"||e.key==="N") notiz();
  else if(e.key==="l"||e.key==="L") window.open(location.pathname+"?ansicht=lehrkraft","m19-lehrkraft","width=1000,height=760");
  else if(e.key==="f"||e.key==="F"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
});

if(ANSICHT==="tablet") tablet();
else if(ANSICHT==="board"||ANSICHT==="lehrkraft") zeichneBoard();
else auswahl();
</script>
</body>
</html>
