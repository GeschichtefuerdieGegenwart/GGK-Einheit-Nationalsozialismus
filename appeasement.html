<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>M19 Appeasement – Der Weg zum Frieden oder in den Krieg?</title>
<meta name="description" content="GGK M19: Appeasement-Politik 1933–1939 auf dem iPad – fünf Bausteine nach der Print-Stunde, drei Entscheidungen, Sicherung an der Tafel.">
<script src="assets/karten.js"></script>
<link rel="stylesheet" href="assets/motion.css">
<script src="assets/motion.js"></script>
<style>
/* Schriften lokal im Repository (SIL Open Font License) – keine Verbindung zu Google */
@font-face{font-family:"Fraunces";src:url(assets/fonts/Fraunces72pt-SemiBold.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Fraunces";src:url(assets/fonts/Fraunces72pt-SemiBoldItalic.woff) format("woff");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
:root{
  --bg:#F3EFE7; --surface:#FAF8F3; --surface2:#FFFDF8; --offset:#E9E2D7; --line:#D5CEC3; --border:rgba(36,34,31,.14);
  --ink:#24221F; --muted:#625F59; --faint:#6A655E; --inverse:#FFFAF2;
  --red:#9B402D; --red-hi:#EAD7CF; --green:#2E5A47; --green-hi:#D6E4DC; --gold:#8C6717; --gold-hi:#EEE2BF;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:.75rem; --r-lg:1rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;text-size-adjust:none}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1rem,.95rem + .25vw,1.125rem);line-height:1.58;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.12;text-wrap:balance}
p,li{text-wrap:pretty}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:.35rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes auf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Kopf mit Lernweg */
.kopf{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 93%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.kopf-in{max-width:1100px;margin:auto;padding:.55rem 1.25rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.mark{width:32px;height:32px;flex:0 0 auto}
.titel{font-weight:700;line-height:1.2;margin-right:auto}.titel small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.protokoll-btn{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:.45rem 1rem;font-weight:700;min-height:44px}
a.protokoll-btn{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none}
.weg{max-width:1100px;margin:auto;padding:0 1.25rem .6rem;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none}
.weg button{flex:1 0 auto;min-width:7.2rem;border:0;border-top:3px solid var(--line);background:transparent;text-align:left;padding:.45rem .5rem .2rem;color:var(--faint);font-size:.85rem;line-height:1.25;min-height:48px}
.weg button b{display:block;color:inherit;font-size:.78rem}
.weg button.da{color:var(--muted);border-top-color:var(--muted)}
.weg button.akt{color:var(--ink);border-top-color:var(--red)}
.weg button.zu{cursor:default;opacity:.55}

main{max-width:46rem;margin:auto;padding:clamp(1.5rem,4vw,3rem) 1.25rem 5rem}
.seite{}
.zeit{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;color:var(--red);font-weight:700;font-size:.95rem}
.zeit .nr{font-family:var(--display);font-size:1.1rem}
.seite h1{font-size:clamp(2rem,1.4rem + 2.4vw,3.1rem);margin:.5rem 0 .7rem}
.datum{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(1.3rem,1.1rem + .8vw,1.7rem);color:var(--muted);margin-bottom:1.6rem}
.lead{font-size:clamp(1.1rem,1rem + .5vw,1.3rem);color:var(--muted);margin-bottom:1.6rem}
h2.abschnitt{font-size:1.45rem;margin:2.4rem 0 .8rem}
.meld{list-style:none;border-top:1px solid var(--line);margin-bottom:1rem;counter-reset:m}
.meld li{counter-increment:m;display:grid;grid-template-columns:2rem 1fr;gap:.5rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.meld li::before{content:counter(m);font-family:var(--display);color:var(--red);font-size:1.25rem;line-height:1.3}
.mehr{margin:.2rem 0 1.4rem}
.auftrag{background:var(--ink);color:var(--inverse);border-radius:var(--r-lg);padding:1.3rem 1.5rem;margin:1.6rem 0 1.2rem}
.auftrag h3{font-size:1.25rem;margin-bottom:.35rem}
.auftrag p{color:#DCD5CA}
.frage{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.3;margin:1.4rem 0 .6rem}
.hinweis{font-size:.88rem;color:var(--muted)}
.btn{min-height:48px;border:1px solid var(--border);border-radius:var(--r);padding:.6rem 1.3rem;background:var(--surface2);font-weight:700}
.btn:hover{background:var(--offset)}
.btn.primary{background:var(--red);color:var(--inverse);border-color:transparent}
.btn.green{background:var(--green);color:var(--inverse);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fuss{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--line);margin-top:2.2rem;padding-top:1.3rem;flex-wrap:wrap}
.liste{display:grid;gap:.5rem;margin:.6rem 0}
.wahl{display:grid;grid-template-columns:1.7rem 1fr;gap:.7rem;align-items:start;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface2);border-radius:.7rem;padding:.75rem .9rem;min-height:52px;line-height:1.35}
.wahl .box{width:1.4rem;height:1.4rem;border-radius:.35rem;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:.85rem;margin-top:.05rem}
.wahl.rund .box{border-radius:50%}
.wahl[aria-pressed="true"]{border-color:var(--red);background:var(--red-hi)}
.wahl[aria-pressed="true"] .box{background:var(--red);border-color:var(--red);color:var(--inverse)}
.wahl.richtig{border-color:var(--green);background:var(--green-hi)}
.wahl.richtig .box{background:var(--green);border-color:var(--green);color:var(--inverse)}
.wahl.falsch{border-color:var(--red)}
.wahl .fb{display:block;font-size:.9rem;color:var(--muted);margin-top:.35rem}
.seg{display:flex;gap:.5rem;flex-wrap:wrap}
.seg button{flex:1 1 4rem;border:1.5px solid var(--border);background:var(--surface2);border-radius:.6rem;padding:.6rem .4rem;min-height:52px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--red);background:var(--red-hi)}
textarea{width:100%;min-height:5.2rem;border:1.5px solid var(--border);border-radius:var(--r);padding:.7rem .9rem;background:var(--surface2);resize:vertical}
input[type=number]{width:100%;min-height:48px;border:1.5px solid var(--border);border-radius:.6rem;padding:.4rem .7rem;background:var(--surface2);font-size:1.2rem;text-align:center}
input[type=text]{width:100%;min-height:48px;border:1.5px solid var(--border);border-radius:.6rem;padding:.5rem .8rem;background:var(--surface2)}

/* Entscheidungen */
.entscheidung{border:2px solid var(--green);border-radius:var(--r-lg);padding:1.4rem 1.4rem 1.2rem;margin:2rem 0 1rem;background:var(--surface)}
.entscheidung .kopfzeile{color:var(--green);font-weight:700;font-size:.95rem}
.entscheidung h2{font-size:clamp(1.5rem,1.2rem + 1vw,1.9rem);margin:.3rem 0 .4rem}
.opt{display:grid;grid-template-columns:2.8rem 1fr;gap:.9rem;align-items:start;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface2);border-radius:.8rem;padding:.85rem 1rem;margin:.55rem 0;min-height:64px}
.opt .k{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:.55rem;border:1.5px solid var(--green);color:var(--green);font-family:var(--display);font-weight:600;font-size:1.35rem}
.opt b{display:block;font-size:1.05rem;line-height:1.3}
.opt .cr{display:block;font-size:.88rem;color:var(--muted);margin-top:.3rem;line-height:1.4}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-hi)}
.opt[aria-pressed="true"] .k{background:var(--green);color:var(--inverse)}
.opt[disabled]{cursor:default}
.gesperrt{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:1.3rem 1.4rem;margin:1.6rem 0;background:var(--surface)}
.code{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.code input{flex:1 1 12rem;text-transform:uppercase;letter-spacing:.08em;font-size:1.2rem}
.fehler{color:var(--red);min-height:1.4em;margin-top:.4rem}
.aufl{border-left:5px solid var(--green);background:var(--surface);border-radius:0 var(--r-lg) var(--r-lg) 0;padding:1.2rem 1.4rem;margin:1.6rem 0}
.aufl .kopfzeile{color:var(--green);font-weight:700;font-size:.95rem;margin-bottom:.4rem}
.aufl ul{padding-left:1.2rem;display:grid;gap:.35rem}
.mat{border:1px solid var(--border);background:var(--surface2);border-radius:var(--r-lg);padding:1.1rem 1.3rem;margin:1.2rem 0}
.mat .kopfzeile{font-weight:700;font-size:.92rem;color:var(--red);margin-bottom:.3rem}
.mat .q{font-size:.82rem;color:var(--muted);margin-top:.4rem}
.spaeter{border-left:5px solid var(--gold);background:var(--gold-hi);border-radius:0 var(--r-lg) var(--r-lg) 0;padding:1.1rem 1.3rem;margin:1.4rem 0}
.spaeter .kopfzeile{color:#5E450F;font-weight:700;font-size:.92rem;margin-bottom:.3rem}
.stimmkarte{position:fixed;inset:0;z-index:50;background:var(--green);color:var(--inverse);display:grid;place-content:center;text-align:center;padding:2rem;gap:1rem}
.stimmkarte .gross{font-family:var(--display);font-weight:600;font-size:min(50vw,50vh);line-height:.9}
.stimmkarte p{font-size:1.3rem;max-width:30rem;margin:auto}
.stimmkarte .zu{position:absolute;top:1rem;right:1rem;background:transparent;border:1px solid rgba(255,250,242,.5);color:var(--inverse);border-radius:var(--r);padding:.6rem 1rem;min-height:48px}

/* Medien */
figure{margin:1.4rem 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
figure svg,figure img{display:block;width:100%;height:auto}
figcaption{padding:.65rem 1rem;font-size:.82rem;color:var(--muted);line-height:1.4}
.bildfehlt{padding:2rem 1.2rem;color:var(--muted);font-size:.95rem}
.zitat{padding:1rem 0;border-bottom:1px solid var(--line)}
.zitat q{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.3;quotes:"„" "“"}
.zitat .wer{font-size:.9rem;color:var(--muted);margin-top:.3rem}
.zahlen{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.zahlen div{background:var(--surface2);border-radius:.7rem;padding:.9rem 1rem}
.zahlen b{font-family:var(--display);font-weight:600;font-size:2.2rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
audio{width:100%;margin:.6rem 0}
.de{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.35;margin:.7rem 0 .15rem}
.en{font-size:.9rem;color:var(--muted)}
.skala{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.skala button{border:1.5px solid var(--border);background:var(--surface2);border-radius:.6rem;min-height:56px;font-family:var(--display);font-weight:600;font-size:1.3rem}
.skala button[aria-pressed="true"]{border-color:var(--red);background:var(--red-hi)}
.skala-leg{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:.3rem}

/* Protokoll / Rückblick */
.prot{display:grid;gap:1rem;margin-top:1rem}
.prot section{border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.2rem;background:var(--surface)}
.prot h3{font-size:1.15rem;margin-bottom:.6rem}
.prot .drei{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.4rem 0 .7rem}
.prot label{font-size:.88rem;color:var(--muted);display:block}
.prot .tat{font-size:.95rem;border-top:1px solid var(--line);margin-top:.7rem;padding-top:.6rem}
.weg-tab{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.95rem}
.weg-tab th,.weg-tab td{border-bottom:1px solid var(--line);padding:.6rem .5rem;text-align:left;vertical-align:top}
.weg-tab th{font-size:.82rem;color:var(--muted)}
.def-box{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.def-box div{border-radius:var(--r-lg);padding:1rem 1.1rem;background:var(--surface)}
.def-box b{font-family:var(--display);font-weight:600;font-size:1.15rem;display:block;margin-bottom:.2rem}
@media (max-width:640px){.def-box,.zahlen{grid-template-columns:1fr}}

/* Lehrkraft */
.lk table{width:100%;border-collapse:collapse;font-size:.92rem;margin:1rem 0}
.lk th,.lk td{border-bottom:1px solid var(--line);padding:.55rem .5rem;text-align:left;vertical-align:top}
.lk th{font-size:.8rem;color:var(--muted)}
.lk .codewort{font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--red);letter-spacing:.04em}
.tafel{background:#2F3B34;color:#F1EFE6;border-radius:var(--r-lg);padding:1.2rem 1.4rem;font-size:.95rem;overflow-x:auto}
.tafel table{min-width:40rem}
.tafel th,.tafel td{border-color:#56655C;color:#F1EFE6}
.tafel th{color:#C9D6CE}


/* Textsorten-Kennzeichnung */
.typ{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:.12rem .6rem;margin-bottom:.45rem}
.typ.quelle{background:var(--red-hi);color:#6E2A1C}
.typ.darst{background:var(--offset);color:var(--muted)}
.typ.lage{background:var(--green-hi);color:#1F4234}
.typ.rueck{background:var(--gold-hi);color:#5E450F}
.legende{display:grid;gap:.45rem;margin:.8rem 0}
.legende div{display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:baseline;font-size:.92rem}
.legende .typ{margin:0;white-space:nowrap}

/* Einstieg in Schritten */
.karte-ein{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);padding:1.3rem 1.4rem;margin:1.2rem 0}
.karte-ein h2{font-size:clamp(1.35rem,1.15rem + .8vw,1.7rem);margin-bottom:.55rem}
.karte-ein p+p{margin-top:.6rem}
.schritt-nr{font-size:.82rem;font-weight:700;color:var(--red);margin-bottom:.2rem}
.zeitl{list-style:none;display:grid;gap:.15rem;margin:.6rem 0}
.zeitl li{display:grid;grid-template-columns:5.4rem 1fr;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.zeitl b{font-family:var(--display);font-weight:600;color:var(--red)}
.zeitl small{display:block;color:var(--muted);font-size:.86rem;margin-top:.15rem}
.akteure{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:.8rem 0}
.akteure div{background:var(--surface2);border:1px solid var(--border);border-radius:.8rem;padding:.8rem .9rem;font-size:.95rem}
.akteure b{display:block;font-family:var(--display);font-weight:600;font-size:1.08rem;margin-bottom:.2rem}
@media (max-width:640px){.akteure{grid-template-columns:1fr}}
.begriff{border-left:4px solid var(--red);padding:.4rem .9rem;margin:.9rem 0;background:var(--surface2);border-radius:0 .6rem .6rem 0;font-size:.95rem}
.begriff b{font-family:var(--display);font-weight:600}
.ebenen{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.8rem 0}
.ebenen div{border-radius:.8rem;padding:.8rem .9rem;background:var(--surface2);border:1px solid var(--border);font-size:.93rem}
.ebenen b{display:block;margin-bottom:.2rem}
@media (max-width:640px){.ebenen{grid-template-columns:1fr}}

/* Sieben Schritte je Entscheidung */
.phase{border-top:1px solid var(--line);padding:1.2rem 0 .4rem}
.phase>h3{font-size:1.3rem;margin-bottom:.5rem}
.phase .pnr{display:block;font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--green);margin-bottom:.15rem;letter-spacing:.02em}
.spiel{display:grid;gap:.55rem;margin:.6rem 0}
.spiel div{display:grid;grid-template-columns:11rem 1fr;gap:.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:.7rem;padding:.7rem .9rem;font-size:.95rem}
.spiel b{font-size:.95rem}
@media (max-width:600px){.spiel div{grid-template-columns:1fr;gap:.2rem}}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.7rem 0}
.zwei>div{border-radius:.8rem;padding:.8rem 1rem;background:var(--surface2);border:1px solid var(--border)}
.zwei h4{font-size:.95rem;margin-bottom:.35rem}
.zwei ul{padding-left:1.1rem;display:grid;gap:.3rem;font-size:.95rem}
@media (max-width:640px){.zwei{grid-template-columns:1fr}}
.optinfo{display:grid;grid-template-columns:2.8rem 1fr;gap:.9rem;align-items:start;border:1.5px solid var(--border);background:var(--surface2);border-radius:.8rem;padding:.85rem 1rem;margin:.55rem 0}
.optinfo .k,.opt .k{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:.55rem;border:1.5px solid var(--green);color:var(--green);font-family:var(--display);font-weight:600;font-size:1.35rem}
.optinfo b{display:block;font-size:1.05rem;line-height:1.3}
.optinfo span.cr{display:block;font-size:.9rem;color:var(--muted);margin-top:.3rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 0}
.tabs button{flex:1 1 9rem;min-height:52px;border:1.5px solid var(--border);border-bottom:0;background:var(--offset);border-radius:.7rem .7rem 0 0;padding:.5rem .7rem;font-weight:700;text-align:left;line-height:1.25}
.tabs button[aria-selected="true"]{background:var(--surface2);border-color:var(--green)}
.tabs button small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.tabs button .gesehen{color:var(--green)}
.folgen{border:1.5px solid var(--green);border-radius:0 0 .8rem .8rem;background:var(--surface2);padding:1rem 1.1rem}
.folgen h4{font-size:1rem;margin:.2rem 0 .4rem}
.kreis{margin:.7rem 0 .2rem;font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.folgen ul{list-style:none;display:grid;gap:.4rem}
.folgen li{font-size:.95rem;line-height:1.45}
.chip{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:.05rem .5rem;margin-right:.35rem;vertical-align:.1em;white-space:nowrap}
.chip.erfahren{background:var(--offset);color:var(--ink)}
.chip.befuerchtet{background:var(--red-hi);color:#6E2A1C}
.chip.erhofft{background:var(--green-hi);color:#1F4234}
.chip.diskutiert{background:var(--gold-hi);color:#5E450F}
.nichtwissen{border:1.5px dashed var(--muted);border-radius:.8rem;padding:.8rem 1rem;margin:1rem 0;font-size:.95rem}
.nichtwissen ul{padding-left:1.1rem;display:grid;gap:.25rem;margin-top:.3rem}
.persp{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin:.5rem 0}
.persp button{border:1.5px solid var(--border);background:var(--surface2);border-radius:999px;padding:.3rem .8rem;min-height:40px;font-weight:700;font-size:.85rem}
.persp button[aria-pressed="true"]{border-color:var(--green);background:var(--green-hi)}
.auswert{border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.2rem;margin:1rem 0;background:var(--surface)}
.auswert h4{font-size:1rem;margin-bottom:.4rem}
.auswert ol{padding-left:1.2rem;display:grid;gap:.35rem}

/* Schrittleiste */
.phasen{list-style:none;display:flex;gap:.3rem;margin:.4rem 0 1rem;flex-wrap:wrap;padding:0}
.phasen li{flex:1 1 5.2rem}
.phasen button{width:100%;min-height:48px;display:flex;align-items:center;gap:.1rem;border:0;border-top:4px solid var(--line);background:transparent;text-align:left;padding:.35rem .2rem;font-size:.8rem;line-height:1.2;color:var(--muted)}
.phasen button .pn{flex:0 0 auto;display:inline-grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;border:1.5px solid currentColor;font-size:.72rem;font-weight:700;margin-right:.3rem}
.phasen button.da{border-top-color:var(--green);color:var(--green)}
.phasen button.akt{border-top-color:var(--red);color:var(--ink);font-weight:700}
.phasen button:disabled{cursor:default}
.phasen button:disabled:not(.da):not(.akt){opacity:.7}
.ziel{background:var(--surface2);border:1px solid var(--border);border-radius:.7rem;padding:.6rem .85rem;margin:.2rem 0 1rem;font-size:.95rem}
.ziel .wozu{display:block;color:var(--muted);font-size:.9rem;margin-top:.15rem}
.ph-titel:focus{outline:none}.ph-titel:focus-visible{outline:3px solid var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
fieldset{border:0;padding:0;margin:0}
fieldset.ohne legend{font-weight:700;margin-bottom:.4rem}
.abw{margin-top:1rem;border-top:1px solid var(--line);padding-top:.8rem}
.abw legend{font-family:var(--display);font-weight:600;font-size:1.08rem;margin-bottom:.5rem}
.tabs button[aria-pressed="true"]{background:var(--surface2);border-color:var(--green)}
.matrix{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.92rem;background:var(--surface2);border-radius:.7rem;overflow:hidden}
.matrix caption{text-align:left;font-weight:700;padding:.2rem 0 .4rem}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:.5rem .4rem;text-align:center}
.matrix th[scope="row"]{text-align:left;font-weight:600}
.matrix thead th{font-size:.8rem;color:var(--muted);font-weight:700}
.matrix .marke{font-size:1.2rem;color:var(--green)}
.matrix .leer{color:var(--line)}
.matrix.kompakt{font-size:.85rem}
.macht{display:grid;gap:.5rem;margin:.6rem 0}
.ebene{display:grid;grid-template-columns:9.5rem 1fr;grid-template-rows:auto auto;column-gap:.9rem;background:var(--surface2);border:1px solid var(--border);border-radius:.7rem;padding:.7rem .9rem;font-size:.95rem}
.ebene .stufe{grid-row:1/3;align-self:start;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-left:5px solid var(--line);padding-left:.5rem}
.ebene.e0 .stufe{border-left-color:var(--red);color:var(--red)}
.ebene.e1 .stufe{border-left-color:var(--green);color:var(--green)}
@media (max-width:600px){.ebene{grid-template-columns:1fr}.ebene .stufe{grid-row:auto;margin-bottom:.3rem}}
.wechsel{border:2px dashed var(--gold);border-radius:.8rem;padding:.7rem 1rem;margin:1.2rem 0;font-size:.95rem;background:var(--surface)}
.wechsel b{display:block;color:#5E450F;text-transform:uppercase;font-size:.78rem;letter-spacing:.06em}
.vergleich{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0}
.vergleich>div{background:var(--surface2);border:1px solid var(--border);border-radius:.7rem;padding:.7rem .9rem;display:grid;gap:.2rem;font-size:.95rem}
.vergleich b{font-family:var(--display);font-size:1.8rem;line-height:1}
@media (max-width:600px){.vergleich{grid-template-columns:1fr}}
details.vertiefung,details.nichtwissen{border:1.5px dashed var(--muted);border-radius:.8rem;padding:.6rem 1rem;margin:1rem 0}
details summary{cursor:pointer;font-weight:700;min-height:32px}
details[open] summary{margin-bottom:.4rem}
details .auswert{border:0;padding:0;margin:.4rem 0;background:none}
.punkte{display:flex;gap:.4rem;margin:.2rem 0 .4rem}.punkte span{width:2.2rem;height:4px;border-radius:2px;background:var(--line)}.punkte span.an{background:var(--red)}
.karte-ein h2:focus{outline:none}
/* Zeitleiste */
.zeitleiste{list-style:none;display:flex;gap:0;overflow-x:auto;margin:.2rem 0 1.4rem;padding:.2rem 0 .4rem;scrollbar-width:thin}
.zeitleiste li{flex:0 0 7.3rem;border-top:3px solid var(--muted);padding:.45rem .5rem 0 0;position:relative;font-size:.8rem;line-height:1.25}
.zeitleiste li::before{content:"";position:absolute;top:-7.5px;left:0;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.zeitleiste .zl-d{display:block;font-weight:700;color:var(--muted)}
.zeitleiste .zl-t{display:block;color:var(--ink)}
.zeitleiste li.jetzt{border-top-color:var(--red)}
.zeitleiste li.jetzt::before{background:var(--red);width:14px;height:14px;top:-8.5px}
.zeitleiste li.jetzt .zl-d{color:var(--red)}
.zeitleiste .zl-hier{display:inline-block;margin-top:.2rem;font-size:.72rem;font-weight:700;background:var(--red);color:var(--inverse);border-radius:999px;padding:.05rem .45rem}
.zeitleiste li.offen{border-top:3px dashed var(--line)}
.zeitleiste li.offen::before{background:var(--bg);border:2px dashed var(--muted)}
.zeitleiste li.offen .zl-t{color:var(--muted);font-style:italic}

/* Karten-Platzhalter */
.platzhalter{border:2px dashed var(--gold);border-radius:var(--r-lg);background:var(--surface);margin:1.4rem 0;overflow:hidden}
.platzhalter .ph-kopf{background:var(--gold-hi);color:#5E450F;font-weight:700;font-size:.85rem;padding:.5rem 1rem}
.platzhalter .ph-text{padding:.7rem 1rem;font-size:.92rem;color:var(--muted)}
.platzhalter svg{display:block;width:100%;height:auto;opacity:.85}
.extern{padding:1rem;font-size:.92rem;color:var(--muted);display:grid;gap:.6rem;justify-items:start}

/* Fußzeile mit Lehrkraftzugang */
.seitenfuss{max-width:46rem;margin:0 auto;padding:0 1.25rem 2.5rem;font-size:.8rem;color:var(--faint);display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between}
.seitenfuss a{color:var(--faint)}
.tor{max-width:28rem;margin:3rem auto;display:grid;gap:.8rem}
.tor input{width:100%;min-height:48px;border:1.5px solid var(--border);border-radius:.6rem;padding:.5rem .8rem;background:var(--surface2)}
@media (max-width:640px){main.lk table{display:block;overflow-x:auto}}

@media (max-width:420px){.legende .typ{white-space:normal}}
.weg-tab td{overflow-wrap:break-word;hyphens:auto}
@media (max-width:600px){.weg-tab thead{display:none}.weg-tab tr{display:grid;border-bottom:1px solid var(--line);padding:.4rem 0}.weg-tab td{border:0;padding:.2rem .3rem}.weg-tab td:first-child{font-weight:700}}
.seite > h1{view-transition-name:stunde-m19}
.vorschau{border-left-color:var(--ink)}
@media print{
  .kopf,.fuss,.protokoll-btn,.nodruck{display:none!important}
  body{background:#fff;font-size:11pt}
  main{max-width:none;padding:0}
  .prot section{break-inside:avoid;background:#fff}
}
</style>
</head>

/* Schrittleiste: erreichte Schritte sind anwählbar, der aktuelle ist markiert.
   Status steht als Text daneben, nicht nur als Farbe. */
function phasenLeiste(key){
  const max = maxPhase(key), pv = sichtPhase(key);
  return `<ol class="phasen" aria-label="Schritte der Entscheidung">${PHASEN.map((t,i)=>{ const n=i+1;
    const zu = n > max, akt = n === pv, da = n < max || (n===max && S.stufe>=ENT[key].stufe);
    const status = akt ? "aktueller Schritt" : da ? "erledigt" : zu ? "noch gesperrt" : "offen";
    return `<li><button class="${akt?"akt":da?"da":""}" data-pv="${key}:${n}" ${zu||n===1?"disabled":""} ${akt?'aria-current="step"':""} aria-label="Schritt ${n}: ${t} – ${status}"><span class="pn">${da&&!akt?`<span class="mv-G" data-mk="G:${key}:${n}">✓</span>`:n}</span>${t}</button></li>`; }).join("")}</ol>`;
}
const maxPhase = key => S.e[key] ? 7 : (S.ph[key] || 2);
const sichtPhase = key => Math.min(S.pv[key] || maxPhase(key), maxPhase(key));

const ZIEL = {
  2:["Lesen Sie, wer damals entschied und was Abgeordnete tun konnten.","Ihre Stimme in der Klasse ist nicht dasselbe wie die Macht einer Regierung."],
  3:["Lesen Sie die drei Möglichkeiten.","Damals waren mehrere Wege denkbar – keiner war von vornherein der richtige."],

  7:["Vergleichen Sie Ihre Entscheidung mit dem, was geschah – und denken Sie über den Unterschied nach.","Erst jetzt kommt das Wissen dazu, das man damals noch nicht hatte."]

const ABW = [["h","Hoffnungen überwiegen"],["g","hält sich die Waage"],["r","Risiken überwiegen"]];
/* Abwägungsmatrix: je Option eine Zeile, die Markierung steht an der gewählten Stelle.

function matrix(key, kompakt){
  const E = ENT[key], a = S.abw[key] || {};

}

/* Die Schritte 2–7 einer Entscheidung. Schritt 1 (Lage) steht darüber auf der Seite.
   Es wird immer nur ein Schritt gezeigt; erledigte Schritte lassen sich über die Leiste wieder öffnen. */
function entscheidungsweg(key){
  const E = ENT[key], max = maxPhase(key), pv = sichtPhase(key), fertig = !!S.e[key], K = KREIS();
  const nav = (n, text, an=true, hinweis="") => `<div class="fuss">${pv>2?`<button class="btn" data-pv="${key}:${pv-1}">Zurück</button>`:"<span></span>"}<span class="hinweis" aria-live="polite">${hinweis}</span>${max>pv?`<button class="btn primary" data-pv="${key}:${pv+1}">Weiter</button>`:`<button class="btn primary" data-ph="${key}:${n}" ${an?"":"disabled"}>${text}</button>`}</div>`;
  let h = `<section class="entscheidung" aria-labelledby="h-${key}"><div class="kopfzeile">Entscheidung ${E.nr} von 3 · ${E.datum}</div>
    <h2 id="h-${key}">${esc(E.frage)}</h2>${phasenLeiste(key)}<div class="phase mv-auf" id="ph-${key}" data-mk="P:${key}:${pv}">`;

  if(pv===2){
    h += `${phKopf(2,"Wer entscheidet – und was können Sie tun?")}${TYP.darst}
      <div class="macht" role="list">${E.spiel.map(([w,t],i)=>`<div class="ebene e${i}" role="listitem"><span class="stufe">${["entscheidet","berät und kontrolliert","nimmt Einfluss"][i] || ""}</span><b>${esc(w)}</b><span>${esc(t)}</span></div>`).join("")}</div>
      <div class="zwei"><div><h4>Als Abgeordnete können Sie …</h4><ul>${E.koennen.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div><h4>Grenzen</h4><ul>${E.grenzen.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
      ${nav(3,"Weiter: die Optionen")}`;
  }

  if(pv===3){
    h += `${phKopf(3,"Welche Möglichkeiten werden in London diskutiert?")}
      ${["A","B","C"].map(k=>`<div class="optinfo"><span class="k" aria-hidden="true">${k}</span><span><b><span class="sr">Option ${k}: </span>${esc(E.opt[k].t)}</b><span class="cr">${esc(E.opt[k].was)}</span></span></div>`).join("")}
      <p class="hinweis">Die Optionen sind für den Unterricht zugespitzt. Sie entsprechen Positionen, die damals vertreten wurden. Die Reihenfolge A–B–C ist keine Rangfolge und keine politische Einordnung.</p>
      ${nav(4,"Weiter: Folgen abwägen")}`;
  }

  if(pv===4){
    const tab = S.tab[key] || "A", F = E.folgen[tab], a = S.abw[key] || {}, n = Object.keys(a).length;
    const liste = arr => ["ich","land","welt"].map(kr=>{ const it = arr.filter(x=>x[0]===kr); if(!it.length) return "";
        return `<div class="kreis">${esc(K[kr])}</div><ul>${it.map(([,c,t])=>`<li><span class="chip ${c}">${CHIP[c]}</span>${esc(t)}</li>`).join("")}</ul>`; }).join("");
    h += `${phKopf(4,"Was könnte jede Option bewirken?")}
      ${perspSchalter()}
      <div class="tabs" role="group" aria-label="Option wählen">${["A","B","C"].map(k=>`<button data-tab="${key}:${k}" aria-pressed="${tab===k}">${k} · ${esc(E.opt[k].t)}<small>${a[k]?"✓ abgewogen":"noch offen"}</small></button>`).join("")}</div>
      <div class="folgen" aria-live="polite"><div class="zwei" style="margin:0"><div><h4>Hoffnungen</h4>${liste(F.H)}</div><div><h4>Risiken</h4>${liste(F.R)}</div></div>
        <fieldset class="abw"><legend>Was überwiegt ${P("für Sie","für die Abgeordnete")} bei Option ${tab}?</legend>
          <div class="seg">${ABW.map(([c,t])=>`<button data-abw="${key}:${tab}:${c}" aria-pressed="${a[tab]===c}" ${fertig?"disabled":""}>${t}</button>`).join("")}</div></fieldset></div>
      <details class="nichtwissen"><summary>Was Sie im ${esc(E.datum)} noch nicht wissen können</summary><ul>${E.nichtwissen.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
      ${n ? matrix(key) : ""}
      <p class="hinweis">„damals erfahren“ = aus eigener Erfahrung oder Berichten bekannt. „befürchtet / erhofft / diskutiert“ = eine Erwartung, keine Gewissheit. Es gibt keine Punkte und keine richtige Lösung.</p>
      ${nav(5,"Weiter: gewichten", n>=3, n<3?`Noch ${3-n} Option${3-n>1?"en":""} abwägen.`:"")}`;
  }

  if(pv===5){
    const ueb = S.ueb[key] || [];
    h += `${phKopf(5,"Was wiegt für Sie am schwersten?")}
      <fieldset class="ohne"><legend>Zwei Überlegungen wählen (${ueb.length} von 2)</legend>
      <div class="liste">${E.ueber.map((t,i)=>{ const an = ueb.includes(i), voll = ueb.length>=2 && !an;
        return `<button class="wahl" data-ueb="${key}:${i}" aria-pressed="${an}" ${fertig||voll?"disabled":""}><span class="box" aria-hidden="true">${an?"✓":""}</span><span>${esc(t)}</span></button>`; }).join("")}</div></fieldset>
      <details class="vertiefung" ${S.pt[key]?"open":""}><summary>Zum Weiterdenken (freiwillig)</summary>
        <p class="frage" style="font-size:1.05rem">${esc(E.pers())}</p>
        ${perspSchalter()}
        <textarea data-pt="${key}" ${fertig?"readonly":""} aria-label="Ihre Gedanken" placeholder="Ihre Gedanken – bleiben auf diesem iPad, niemand sammelt sie ein">${esc(S.pt[key]||"")}</textarea></details>
      ${nav(6,"Weiter zur Abstimmung", ueb.length>=2, ueb.length<2?"Zwei Überlegungen wählen.":"")}`;

  if(pv===6){

      ${matrix(key, true)}
      <fieldset class="ohne"><legend>Ihre Wahl</legend>${["A","B","C"].map(k=>`<button class="opt" data-opt="${key}:${k}" aria-pressed="${v===k}" ${fertig?"disabled":""}><span class="k" aria-hidden="true">${k}</span><span><b><span class="sr">Option ${k}: </span>${esc(E.opt[k].t)}</b><span class="cr">${esc(E.opt[k].was)}</span></span></button>`).join("")}</fieldset>`;
    if(key==="e1") h += `<p class="frage" id="prog-l">Glauben Sie, dass Deutschland danach Ruhe gibt?</p>
      <div class="seg" role="group" aria-labelledby="prog-l">${["ja","nein","weiß nicht"].map(x=>`<button data-prog="${x}" aria-pressed="${S.prog===x}" ${fertig?"disabled":""}>${x}</button>`).join("")}</div>`;

      <p class="hinweis" style="margin-top:.5rem">Dies ist eine Abstimmung in unserer Klasse. Sie zeigt Ihre Haltung – damals entschied die Regierung. Eine Option „unentschieden“ gibt es nicht, weil auch Abwarten eine Politik ist; Ihre Unsicherheit zeigen Sie oben.</p>`;
    if(!fertig) h += `<div class="fuss"><button class="btn" data-pv="${key}:5">Zurück</button><span class="hinweis" data-status="${key}" aria-live="polite">${bereit(key)?"Bereit zur Abstimmung.":"Option wählen, einen Satz schreiben, Sicherheit angeben."}</span><button class="btn green" data-abgabe="${key}" ${bereit(key)?"":"disabled"}>Entscheidung abgeben</button></div>`;
    else h += `<div class="fuss"><span class="hinweis">Ihre Entscheidung: <b>${v}</b> (${esc(S.sich[key]||"")}).</span><span class="stempel" data-mk="F:${key}">ABGEGEBEN</span><button class="btn green" data-karte="${key}">Stimmkarte zeigen</button><button class="btn primary" data-pv="${key}:7">Weiter</button></div>`;
  }

  if(pv===7){
    h += `${phKopf(7,"Vergleichen und nachdenken")}${codeFeld(key, E.stufe)}${S.stufe < E.stufe ? vorschau() : ""}`;
    if(S.stufe >= E.stufe){
      h += `<div class="wechsel" role="note"><b>Perspektivwechsel</b> Bis hierher haben Sie mit dem Wissen von ${esc(E.datum)} entschieden. Ab hier blicken wir zurück.</div>
        <div class="aufl"><div class="kopfzeile">Was dann geschah <span class="marke-h">im Rückblick aufgedeckt</span></div>${aufdecken(E.aufl, key)}</div>
        <div class="vergleich"><div><span class="hinweis">Ihre Entscheidung <span class="stempel" data-mk="F:${key}">ABGEGEBEN</span></span><b>${S.v[key]||"–"}</b><span>${esc(E.opt[S.v[key]]?.t||"")}${S.sich[key]?` · ${esc(S.sich[key])}`:""}</span></div>
          <div><span class="hinweis">Was London tat</span><span>${esc(E.tat)}</span></div></div>
        ${S[key+"b"] ? `<p class="randnotiz" data-mk="J:${key}"><b>Ihre Begründung:</b> ${esc(S[key+"b"])}</p>` : ""}${S.pt[key] ? `<p class="randnotiz" data-mk="J:${key}:pt"><b>Ihr Gedanke:</b> ${esc(S.pt[key])}</p>` : ""}
        <div class="auswert"><h4>Zum Besprechen</h4><ol>${E.fragen.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
        <div class="spaeter">${TYP.rueck}<ul style="padding-left:1.2rem;display:grid;gap:.35rem">${E.rueck.map((x,i)=>`<li><span class="aufgedeckt" data-mk="H:${key}:r${i}">${x}</span></li>`).join("")}</ul>
          <p class="hinweis" style="margin-top:.4rem">Dieses Wissen hatte im ${esc(E.datum)} niemand in London.</p></div>
        <details class="vertiefung"><summary>Mehr dazu (externe Seiten, freiwillig)</summary>${linkliste("", E.links.map(l=>extern(...l)))}</details>
        <p class="hinweis">Übertragen Sie das Tafelbild zu Entscheidung ${E.nr} ins <a href="#" data-geh="protokoll">Protokoll</a>.</p>`;
    }
  }
  return h + `</div></section>`;
}

/* H · Schwärzung: Was damals niemand wusste, bleibt bis zur Abstimmung geschwärzt. */
function vorschau(){
  return `<div class="aufl vorschau"><div class="kopfzeile">Was dann geschah <span class="marke-h">geschwärzt</span></div>
    <div class="geschwaerzt-zeilen" role="img" aria-label="geschwärzter Text"><span class="geschwaerzt" style="width:94%"></span><span class="geschwaerzt" style="width:78%"></span><span class="geschwaerzt" style="width:86%"></span><span class="geschwaerzt" style="width:52%"></span></div>
    <p class="hinweis">Wird nach der Abstimmung in der Klasse aufgedeckt.</p></div>`;
}
function aufdecken(html, key){ let i = 0; return html.replace(/<li>([\s\S]*?)<\/li>/g, (m, inner) => `<li><span class="aufgedeckt" data-mk="H:${key}:a${i++}">${inner}</span></li>`); }

function codeFeld(key, stufe){
  if(S.stufe >= stufe) return "";
  return `<div class="gesperrt nodruck"><b>Abstimmung in der Klasse</b> ${S.e[key]?`<span class="stempel" data-mk="F:${key}">ABGEGEBEN</span>`:""}<p><button class="btn green" data-karte="${key}">Stimmkarte zeigen</button></p><p class="hinweis">Halten Sie Ihre Stimmkarte hoch, wenn die Lehrkraft das Zeichen gibt. Übertragen Sie danach das Tafelbild ins <a href="#" data-geh="protokoll">Protokoll</a>. Das Codewort steht an der Tafel.</p>
    <div class="code"><input type="text" id="code-${key}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Codewort von der Tafel" aria-label="Codewort"><button class="btn primary" data-code="${key}:${stufe}">Weiter</button></div><p class="fehler" id="f-${key}" role="status"></p></div>`;
}

function weiter(nach, text){ return `<div class="fuss"><span></span><button class="btn primary" data-geh="${nach}">${text}</button></div>`; }

function einstieg(){
  const n = S.ein || 1;
  const karten = [
    `<div class="karte-ein"><div class="schritt-nr">1 von 5 · Wo und wann?</div><h2 tabindex="-1">London, Anfang März 1936</h2>${TYP.darst}
      <p>Wir sind in London, der Hauptstadt Großbritanniens. Großbritannien herrscht damals über ein Weltreich, das <i>Empire</i>. Im Parlament, dem <b>Unterhaus</b> (House of Commons), sitzen 615 gewählte Abgeordnete.</p>
      <p>Seit 1933 regiert in Deutschland Adolf Hitler. In London fragen sich viele: Was hat er vor?</p>
      ${karte("europa1936")}</div>`,
    `<div class="karte-ein"><div class="schritt-nr">2 von 5 · Was ist vorher geschehen?</div><h2 tabindex="-1">Fünf Ereignisse, die jeder in London kennt</h2>${TYP.darst}
      <ol class="zeitl">
        <li><b>1914–1918</b><span>Erster Weltkrieg. Großbritannien kämpft gegen Deutschland und gewinnt – mit sehr vielen Toten.<small>Fast jede Stadt hat ein Denkmal für die Gefallenen.</small></span></li>
        <li><b>1919</b><span>Versailler Vertrag. Deutschland muss Gebiete abgeben und darf kaum Soldaten haben.<small>Manche in London halten den Vertrag für zu hart.</small></span></li>
        <li><b>1929</b><span>Weltwirtschaftskrise. Auch in Großbritannien verlieren Millionen ihre Arbeit.<small>Geld für Rüstung ist knapp.</small></span></li>
        <li><b>1933</b><span>Hitler wird Reichskanzler und beseitigt die Demokratie in Deutschland.<small>Britische Zeitungen berichten über die Verfolgung von Gegnern und von Jüdinnen und Juden.</small></span></li>
        <li><b>1935</b><span>Deutschland führt die Wehrpflicht wieder ein. Italien überfällt Abessinien (heute Äthiopien).<small>Der Völkerbund kann beides nicht verhindern.</small></span></li>
      </ol></div>`,
    `<div class="karte-ein"><div class="schritt-nr">3 von 5 · Worum wird gestritten?</div><h2 tabindex="-1">Drei Staaten, drei Ziele</h2>${TYP.darst}
      <div class="akteure"><div><b>Deutschland</b>will den Versailler Vertrag abschütteln, aufrüsten und wieder Großmacht sein.</div>
        <div><b>Frankreich</b>will sich vor Deutschland schützen und setzt auf Verträge und Verbündete.</div>
        <div><b>Großbritannien</b>will Frieden in Europa und sein Weltreich sichern. Ein neuer Krieg soll vermieden werden.</div></div>
      <div class="begriff"><b>Völkerbund</b> – Zusammenschluss von Staaten seit 1920. Er soll Streit friedlich lösen. Deutschland ist 1933 ausgetreten.</div>
      <div class="begriff"><b>Appeasement</b> (englisch: Beschwichtigung) – Konflikte durch Verhandlungen und Zugeständnisse entschärfen. Damals für viele ein positives Wort.</div></div>`,
    `<div class="karte-ein"><div class="schritt-nr">4 von 5 · Was steht auf dem Spiel?</div><h2 tabindex="-1">Erinnerung und Angst</h2>${TYP.darst}
      <p>Im Ersten Weltkrieg sind Hunderttausende britische Soldaten gestorben. Viele Familien haben Väter, Brüder oder Söhne verloren. 1916 wurden junge Männer zum ersten Mal zum Kriegsdienst gezwungen. Auch London wurde aus der Luft angegriffen.</p>
      <p>1934/35 beteiligen sich über elf Millionen Menschen an einer Friedensumfrage, dem <i>Peace Ballot</i>. Die große Mehrheit stimmt für Abrüstung und für den Völkerbund.</p>
      <div class="mat">${TYP.quelle}<p class="de">„Der Mann auf der Straße sollte begreifen, dass ihn keine Macht der Welt davor schützen kann, bombardiert zu werden. … Der Bomber kommt immer durch.“</p>
        <p class="en" lang="en">“I think it is well also for the man in the street to realise that there is no power on earth that can protect him from being bombed. Whatever people may tell him, the bomber will always get through.”</p>
        <p class="q">Stanley Baldwin, damals stellvertretender Regierungschef, im Unterhaus am 10. November 1932 (Hansard) · Übersetzung: eigene, gekürzt.</p></div></div>`,
    `<div class="karte-ein"><div class="schritt-nr">5 von 5 · Ihre Rolle</div><h2 tabindex="-1">Sie sind Abgeordnete im Unterhaus</h2>
      <p>In fünf Bausteinen erfahren Sie, was von 1933 bis 1939 geschieht – immer nur so viel, wie man in London zum jeweiligen Zeitpunkt wusste. Dreimal stimmen Sie ab.</p>
      <h3 style="font-size:1.1rem;margin:1rem 0 .3rem">Drei Dinge auseinanderhalten</h3>
      <div class="ebenen"><div><b>Ihre Haltung</b>Was halten Sie für richtig – mit dem Wissen von damals?</div>

  return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span>Einstieg</span></div>

function seite(){
  const id = S.seite;

  if(id==="start") return einstieg();

  if(id==="b1"){
    const sel = S.vt || [], geprueft = !!S.vtOk;
    const items = VERTRAG.map((x,i)=>{ const an = sel.includes(i); const kl = geprueft ? (x.ok ? "richtig" : (an ? "falsch" : "")) : "";
      return `<button class="wahl ${kl}" data-vt="${i}" aria-pressed="${an}" ${geprueft?"disabled":""}><span class="box">${an||(geprueft&&x.ok)?"✓":""}</span><span>${esc(x.t)}${geprueft?`<span class="fb">${esc(x.fb)}</span>`:""}</span></button>`; }).join("");
    const sorgen = VERTRAG.filter(x=>x.ok).map(x=>`<button class="wahl rund" data-sorge="${esc(x.t)}" aria-pressed="${S.sorge===x.t}"><span class="box">${S.sorge===x.t?"●":""}</span><span>${esc(x.t)}</span></button>`).join("");
    return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span class="nr">Baustein 1</span><span>1933 bis März 1936</span></div>${zeitleiste(id)}
      <h1>Was bedroht uns?</h1>
      ${TYP.darst}<p class="lead">Seit Januar 1933 regiert Adolf Hitler in Deutschland. In wenigen Monaten schaffen die Nationalsozialisten die Demokratie ab. Jüdinnen und Juden werden ausgegrenzt und verfolgt. In London fragt man sich: Bleibt es bei Deutschland selbst – oder bedroht Hitler auch die Nachbarn?</p>
      <div class="mat"><div class="kopfzeile">M1 · Der Bruch mit dem Versailler Vertrag</div>${TYP.darst}
        <p>Schon kurz nach Inkrafttreten des Versailler Vertrages 1920 wollten fast alle politischen Kräfte im Deutschen Reich ihn revidieren, weil sie seine Beschränkungen für zu hart hielten. Adolf Hitler brach nach der „Machtergreifung“ wesentliche Bestimmungen des Vertrages – durch die Aufrüstung, die Einführung der allgemeinen Wehrpflicht und den Einmarsch ins entmilitarisierte Rheinland.</p>
        <p class="q">Nach Padlet M1, gekürzt.${IN_MOODLE?"":" Die Karikatur von D. R. Fitzpatrick zur Reichstagswahl 1930 zeigt die Lehrkraft vorn."}</p></div>

      ${karte("rheinland")}
      ${linkliste("Karte zum Nachschlagen", [extern("https://de.wikipedia.org/wiki/Datei:Karte_des_Deutschen_Reiches,_Weimarer_Republik-Drittes_Reich_1919%E2%80%931937.svg","Karte des Deutschen Reiches 1919–1937","Wikipedia / Wikimedia Commons","Grenzen bis 1937")])}
      <div class="auftrag"><h3>1.1 Der Bruch mit dem Versailler Vertrag</h3><p>Welche dieser Schritte des Deutschen Reiches verstoßen gegen den Versailler Vertrag? Nutzen Sie M1, wählen Sie aus und prüfen Sie dann.</p></div>
      <div class="liste">${items}</div>
      ${geprueft ? "" : `<div class="mehr"><button class="btn" data-pruefen="1" ${sel.length?"":"disabled"}>Prüfen</button></div>`}
      ${geprueft ? `<p class="frage">1.2 Welcher Vertragsbruch verunsichert Sie als britische Abgeordnete am meisten?</p><div class="liste">${sorgen}</div>
        <textarea data-sorget="1" placeholder="Weil … (ein Satz, freiwillig)">${esc(S.sorgeT)}</textarea>` : ""}
      ${geprueft && S.sorge ? weiter("b2","Weiter zu Baustein 2") : ""}</section>`;
  }

  if(id==="b2"){
    const L = [
      "Am Morgen des 7. März 1936 marschieren deutsche Truppen in das entmilitarisierte Rheinland ein. Am selben Tag bietet Hitler neue Nichtangriffspakte und eine Rückkehr in den Völkerbund an.",
      "Frankreich fühlt sich unmittelbar bedroht, will aber nicht ohne Großbritannien handeln. Beide Staaten haben im Locarno-Vertrag von 1925 die entmilitarisierte Zone garantiert.",
      "M2 · Die britische Regierung zeigt teilweise Verständnis für die deutsche Revisionspolitik. Das Land leidet noch unter der Wirtschaftskrise, die Öffentlichkeit ist kriegsmüde: König Georg V. soll gesagt haben, er würde eher abdanken, als seinem Land noch einmal einen Krieg wie 1914–1918 zuzumuten. Zugleich erhöht Großbritannien seine Rüstungsausgaben."
    ];
    const da = alleGelesen("b2", L);
    return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span class="nr">Baustein 2</span><span>London, 7./8. März 1936</span></div>${zeitleiste(id)}
      <h1>Was tun wir? Die Nazis stoppen – aber wie?</h1>
      <p class="hinweis"><b>Schritt 1 von 7 · Lage</b> – lesen Sie die Meldungen nacheinander.</p>
      ${meldungen("b2", L)}
      ${da ? bild("rheinbruecke") + entscheidungsweg("e1") : ""}

  }

  if(id==="b3"){
    const L = [
      "Bundeskanzler Schuschnigg setzt eine Volksabstimmung für ein unabhängiges Österreich an. Hitler erzwingt mit einem Ultimatum ihre Absage und Schuschniggs Rücktritt am 11. März 1938; der Nationalsozialist Seyß-Inquart soll die Regierung übernehmen. Schuschniggs Hilferuf an die europäischen Mächte bleibt ungehört.",
      "Am 12. März marschiert die Wehrmacht ein und stößt auf keinen Widerstand. Viele Menschen jubeln. Hitler, der zunächst wohl nur eine Union beider Staaten plante, entscheidet sich nun für den vollständigen „Anschluss“ (Gesetz vom 13. März).",
      "In Wien werden Regimegegner verhaftet, Jüdinnen und Juden öffentlich gedemütigt und beraubt. London und Paris protestieren, handeln aber nicht."
    ];
    const da = alleGelesen("b3", L);
    return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span class="nr">Baustein 3</span><span>März 1938</span></div>${zeitleiste(id)}
      <h1>Das Ende der Konflikte oder der Beginn von neuen?</h1>
      <p class="datum">Der „Anschluss“ Österreichs</p>
      ${meldungen("b3", L)}
      ${da ? `${bild("heldenplatz")}${karte("lage1938")}
      <p class="hinweis">Nach M3: Bei einer nicht freien Volksabstimmung am 10. April 1938 stimmen offiziell 99,73 % der Österreicher für den „Anschluss“.</p>
      <p class="frage">3.2 Wie erfolgreich war die britische Politik bisher?</p>
      <div class="skala" role="group" aria-label="Skala von 1 bis 6">${[1,2,3,4,5,6].map(x=>`<button data-skala="${x}" aria-pressed="${S.skala===x}">${x}</button>`).join("")}</div>

  if(id==="b4"){

      "M4 · Auf Hitlers Weisung verlangen die Vertreter der Sudetendeutschen weitreichende Autonomie und spitzen die Krise zu. Dann fordert Hitler die Abtretung des „Sudetengebiets“. Er beruft sich auf das Selbstbestimmungsrecht der Völker und betont, dies sei seine letzte territoriale Forderung. Anfang September droht er öffentlich mit einem Einmarsch; Chamberlain fliegt am 15. und 22. September als Vermittler zu ihm.",
      "Frankreich ist mit der Tschechoslowakei verbündet; Großbritannien hat mit Prag keinen Vertrag. In London werden Gasmasken ausgegeben und Schutzgräben ausgehoben."

    const da = alleGelesen("b4", L);
    return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span class="nr">Baustein 4</span><span>London, 27. September 1938</span></div>${zeitleiste(id)}
      <h1>Die Sudetenfrage. Es hört nicht auf!</h1>
      <p class="hinweis"><b>Schritt 1 von 7 · Lage</b> – lesen Sie die Meldungen nacheinander.</p>
      ${meldungen("b4", L)}
      ${da ? `${foto()}${entscheidungsweg("e2")}` : ""}
      ${S.stufe>=2 ? `
      <h2 class="abschnitt">Chamberlain kehrt zurück</h2>
      ${TYP.quelle}<p class="hinweis">Originalton vom Flugplatz Heston bei London, 30. September 1938 (1:08 min). Der Wortlaut steht darunter.</p>
      ${ton()}
      <p class="de">„Die Lösung des tschechoslowakischen Problems, die jetzt erreicht ist, ist meiner Ansicht nach nur der Auftakt zu einer größeren Regelung, in der ganz Europa Frieden finden kann.“</p>
      <p class="en" lang="en">“The settlement of the Czechoslovak problem which has now been achieved is, in my view, only the prelude to a larger settlement in which all Europe may find peace.”</p>
      <p class="hinweis" style="margin-top:.6rem">Aufnahme: Wikimedia Commons · Wortlaut nach D. Faber, Munich 1938 (2008) · Übersetzung: eigene.</p>
      <h2 class="abschnitt">Stimmen aus dem Unterhaus</h2>${TYP.quelle}
      ${ZITATE.map(z=>`<div class="zitat"><q>${esc(z.de)}</q><div class="wer">${esc(z.wer)} · <span lang="en">„${esc(z.en)}“</span> (Hansard, ${z.sp}) · Übersetzung: eigene</div></div>`).join("")}
      <div class="zahlen"><div><span class="hinweis">House of Commons, 6. Oktober 1938</span><b>366 : 144</b><span class="hinweis">für : gegen die Politik der Regierung (Hansard, Sp. 558–562)</span></div>
        <div><span class="hinweis">Unsere Klasse (aus dem Protokoll)</span><b>${klasse("e2")}</b><span class="hinweis">Zustimmung (A + B) : Ablehnung (C)</span></div></div>
      ${weiter("b4b","Weiter: März 1939")}` : ""}</section>`;
  }

  if(id==="b4b"){
    const L = [
      "Am 15. März 1939 besetzen deutsche Truppen Prag. Böhmen und Mähren werden zum „Protektorat“ des Deutschen Reiches, die Slowakei zu einem abhängigen Staat. Die in München gegebenen Zusagen sind gebrochen.",
      "Zum ersten Mal besetzt das Deutsche Reich ein Gebiet, in dem nicht überwiegend Deutsche leben. Hitlers Begründung, er wolle nur die Deutschen vereinen, ist damit hinfällig.",
      "In London kursieren Gerüchte über deutsche Pläne gegen Polen und Rumänien. Was davon zutrifft, ist unklar."
    ];
    const da = alleGelesen("b4b", L);
    return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span class="nr">Baustein 4</span><span>London, Mitte März 1939</span></div>${zeitleiste(id)}

        ${S.erf ? weiter("b5","Weiter zu Baustein 5") : ""}` : ""}</section>`;

  if(id==="b5"){

      "M6 · Das Deutsche Reich fordert den Anschluss der Freien Stadt Danzig und exterritoriale Verkehrswege durch den polnischen „Korridor“ nach Ostpreußen. Polen lehnt ab; die Spannungen wachsen.",

      "Am 1. September 1939 eröffnet das Linienschiff „Schleswig-Holstein“ das Feuer auf die Westerplatte bei Danzig; die Wehrmacht greift Polen an. Am 3. September läuft ein britisches Ultimatum ab: Großbritannien und Frankreich erklären Deutschland den Krieg."

        <li>Die Wehrmacht führt den Krieg vom ersten Tag an mit großer Härte. Deutsche Truppen, Einsatzkommandos von Polizei und SS ermorden eine große Zahl polnischer Zivilisten und Kriegsgefangener (M6).</li>

      <div class="spaeter">${TYP.rueck}<div class="kopfzeile">In London 1939 unbekannt</div>

        <li>Im August 1936 forderte Hitler in einer geheimen Denkschrift zum Vierjahresplan (M7): „I. Die deutsche Armee muß in 4 Jahren einsatzfähig sein. II. Die deutsche Wirtschaft muß in 4 Jahren kriegsfähig sein.“ <span class="hinweis">(zit. nach Lautemann/Schlenke, Geschichte in Quellen, 1961, S. 321 f.)</span></li>
        <li>Am 3. April 1939 ließ er den Angriff auf Polen vorbereiten (Weisung „Fall Weiß“): Er sollte ab dem 1. September 1939 jederzeit möglich sein.</li>

        <p class="hinweis" style="margin-top:.5rem">Diese Dokumente wurden erst nach dem Krieg bekannt, unter anderem im Nürnberger Prozess 1945/46.</p></div>
      ${bild("vierjahresplan")}
      ${weiter("ende","Weiter zur Beurteilung")}` : ""}</section>`;
  }

  if(id==="ende"){
    const row = (t, du, tat) => `<tr><td>${t}</td><td>${du}</td><td>${tat}</td></tr>`;
    const w = k => S.v[k] ? `${S.v[k]}${S.sich[k]?` (${esc(S.sich[k])})`:""}` : "–";
    return `<section class="seite mv-auf" data-mk="S:${S.seite}"><div class="zeit"><span>Konsolidierung</span></div>${zeitleiste("ende")}
      <h1>Ihre abschließende Beurteilung</h1>
      <p class="lead">Vergleichen Sie Ihre Entscheidungen von damals mit dem, was tatsächlich geschah.</p>
      <table class="weg-tab"><thead><tr><th>Zeitpunkt</th><th>Sie</th><th>Was geschah</th></tr></thead><tbody>
      ${row("März 1936 · Rheinland", `${w("e1")}${S.prog?` · Prognose „Ruhe?“: ${esc(S.prog)}`:""}`, "Protest, keine Sanktionen, kein Eingreifen")}
      ${row("März 1938 · „Anschluss“", S.skala?`Erfolg der Politik: ${S.skala} von 6`:"–", "Protest, kein Eingreifen")}
      ${row("September 1938 · Sudeten", w("e2"), "Münchner Abkommen: Abtretung, angekündigte Garantie")}
      ${row("März 1939 · Prag", `${w("e3")}${S.erf?` · Erwartung: ${esc(S.erf)}`:""}`, "Garantie für Polen, Wehrpflicht, Verhandlungen mit der UdSSR ohne Ergebnis")}
      ${row("September 1939", "–", "Angriff auf Polen; Kriegserklärung am 3. September")}
      </tbody></table>
      <div class="spaeter">${TYP.rueck}<div class="kopfzeile">Karten im Rückblick</div>${bild("ausweitung")}
        <ul style="padding-left:1.2rem;display:grid;gap:.35rem">
        ${extern("https://germanhistorydocs.org/de/deutschland-nationalsozialismus-1933-1945/ghdi:map-2884","Territoriale Ausweitung Deutschlands 1935–1939","German History in Documents and Images (GHDI), Deutsches Historisches Institut Washington","Kartografie nach MGFA 1990, überarbeitet 2021")}
        ${extern("https://www.spiegel.de/fotostrecke/maps-the-third-reich-prepares-for-war-fotostrecke-46092.html","Maps: The Third Reich Prepares for War","Der Spiegel (englisch), Fotostrecke")}</ul>
        <p class="hinweis" style="margin-top:.4rem">Externe Seiten öffnen in einem neuen Tab. Dabei erhält der jeweilige Anbieter Ihre IP-Adresse. Fragen Sie beim Betrachten: Was zeigt die Karte, was konnte man 1936, 1938 und 1939 davon schon wissen?</p></div>
      <div class="def-box"><div><b>Retrospektivität</b>Wir blicken zurück und kennen den Ausgang. Das ist unvermeidlich und notwendig: Erst im Rückblick werden Folgen und geheime Pläne sichtbar.</div>
        <div><b>Rückschaufehler</b>Wer den Ausgang kennt, hält ihn leicht für vorhersehbar oder unvermeidlich („Das hätte man doch wissen müssen“). Dann wird die damalige Unsicherheit unterschätzt.</div></div>
      <div class="auftrag"><h3>Nachdenken, bevor Sie urteilen</h3><p>Wo haben Sie mit Wissen entschieden, das 1936–1939 niemand hatte? Wo waren Sie sich unsicher – und warum? Welche Kritik an Appeasement bleibt trotzdem, auch mit dem Wissen von damals?</p></div>

      <h2 class="abschnitt">Urteilsaufgabe</h2>

      <p class="hinweis" style="margin-top:.6rem">Schreiben Sie Ihr Urteil in GoodNotes oder ins Heft. Die <a href="docs/M19_Faktensicherung.pdf" target="_blank" rel="noopener">Faktensicherung (PDF, 2 Seiten)</a> hilft Ihnen dabei.</p>

  }

  if(id==="protokoll") return protokoll();

}

function klasse(key){ const p = S.prot[key]||{}; const a=+p.A||0,b=+p.B||0,c=+p.C||0; return (a+b+c) ? `${a+b} : ${c}` : "–"; }

      <div class="drei">${["A","B","C"].map(k=>`<label>${k} – Stimmen<input type="number" min="0" inputmode="numeric" data-prot="${key}:${k}" value="${esc(p[k]??"")}"></label>`).join("")}</div>

    <div class="fuss nodruck"><span class="hinweis">Am Ende der Stunde: Antworten auf diesem iPad löschen, damit die nächste Person sie nicht sieht.</span><button class="btn" data-loeschen="1">Alles löschen</button></div></section>`;

const FUSS = `<footer class="seitenfuss nodruck"><span>GGK-Labor · keine Namen, keine Übertragung: Antworten bleiben auf diesem Gerät.</span>${IN_MOODLE ? "" : `<a href="?ansicht=lehrkraft">Hinweise für die Lehrkraft</a>`}

let fokusZiel = null;
function zeichne(){
  // Fokus nach dem Neuzeichnen wiederherstellen (Tastaturbedienung)
  const a = document.activeElement; let sel = null;
  if(a && a !== document.body && a.attributes){ for(const at of a.attributes){ if(at.name.startsWith("data-") || at.name==="id"){ sel = at.name==="id" ? "#"+CSS.escape(at.value) : `[${at.name}="${String(at.value).replace(/"/g,'\\"')}"]`; break; } } }
  $("#app").innerHTML = kopf() + `<main>${seite()}</main>` + FUSS + (S.karte ? stimmkarte() : "");
  verdrahten();
  if(window.Bewegung) Bewegung.spiele($("#app"));
  const ziel = fokusZiel ? $(fokusZiel) : (sel ? $(sel) : null); const war = fokusZiel; fokusZiel = null;
  if(ziel){ if(war && ziel.matches(".ph-titel")){ ziel.focus({preventScroll:true}); ziel.closest(".entscheidung").scrollIntoView({block:"start"}); scrollBy(0,-120); } else ziel.focus({preventScroll:true}); }
}
document.addEventListener("keydown", e => { if(e.key==="Escape" && S.karte){ const k=S.karte; fokusZiel=`#ph-${k} .ph-titel`; setze(x=>{ x.karte=null; }); } });

function verdrahten(){
  $$("[data-geh]").forEach(b=>b.onclick=e=>{ e.preventDefault(); const z=b.dataset.geh; const s=SEITEN.find(x=>x.id===z);
    if(s && s.stufe > S.stufe) return; setze(x=>{ if(z==="protokoll" && x.seite!=="protokoll") x.zurueck=x.seite; x.seite=z; }); scrollTo(0,0); });
  $$("[data-ein]").forEach(b=>b.onclick=()=>{ fokusZiel="#einkarte h2"; setze(x=>{ x.ein=+b.dataset.ein; }); });
  $$("[data-pers]").forEach(b=>b.onclick=()=>setze(x=>{ x.pers=b.dataset.pers; }));
  $$("[data-meld]").forEach(b=>b.onclick=()=>setze(x=>{ const k=b.dataset.meld; x.m[k]=(x.m[k]??1)+1; }));
  $$("[data-vt]").forEach(b=>b.onclick=()=>setze(x=>{ const i=+b.dataset.vt; x.vt=x.vt||[]; x.vt = x.vt.includes(i) ? x.vt.filter(y=>y!==i) : [...x.vt,i]; }));
  $$("[data-pruefen]").forEach(b=>b.onclick=()=>setze(x=>{ x.vtOk=true; }));
  $$("[data-sorge]").forEach(b=>b.onclick=()=>setze(x=>{ x.sorge=b.dataset.sorge; }));
  const st=$("[data-sorget]"); if(st) st.oninput=()=>{ S.sorgeT=st.value; speichere(); };
  $$("[data-ph]").forEach(b=>b.onclick=()=>{ const [k,n]=b.dataset.ph.split(":"); fokusZiel=`#ph-${k} .ph-titel`; setze(x=>{ x.ph[k]=Math.max(x.ph[k]||2,+n); x.pv[k]=+n; }); });
  $$("[data-pv]").forEach(b=>b.onclick=()=>{ const [k,n]=b.dataset.pv.split(":"); fokusZiel=`#ph-${k} .ph-titel`; setze(x=>{ x.pv[k]=+n; }); });
  $$("[data-tab]").forEach(b=>b.onclick=()=>{ const [k,o]=b.dataset.tab.split(":"); setze(x=>{ x.tab[k]=o; }); });
  $$("[data-abw]").forEach(b=>b.onclick=()=>{ const [k,o,c]=b.dataset.abw.split(":"); setze(x=>{ x.abw[k]=x.abw[k]||{}; x.abw[k][o]=c; }); });
  $$("[data-ueb]").forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.ueb.split(":"); setze(x=>{ const a=x.ueb[k]||[]; const n=+i; x.ueb[k] = a.includes(n) ? a.filter(y=>y!==n) : (a.length<2 ? [...a,n] : a); }); });
  $$("[data-pt]").forEach(t=>t.oninput=()=>{ S.pt[t.dataset.pt]=t.value; speichere(); });
  $$("[data-opt]").forEach(b=>b.onclick=()=>{ const [k,o]=b.dataset.opt.split(":"); setze(x=>{ x.v[k]=o; }); });
  $$("[data-sich]").forEach(b=>b.onclick=()=>{ const [k,o]=b.dataset.sich.split(":"); setze(x=>{ x.sich[k]=o; }); });
  $$("[data-begr]").forEach(t=>{ t.oninput=()=>{ const k=t.dataset.begr; S[k+"b"]=t.value; speichere();
    const btn=$(`[data-abgabe="${k}"]`), stt=$(`[data-status="${k}"]`); if(btn){ btn.disabled=!bereit(k); stt.textContent = bereit(k)?"Bereit zur Abstimmung.":"Option wählen, einen Satz schreiben, Sicherheit angeben."; } }; });
  $$("[data-prog]").forEach(b=>b.onclick=()=>setze(x=>{ x.prog=b.dataset.prog; }));
  $$("[data-abgabe]").forEach(b=>b.onclick=()=>{ const k=b.dataset.abgabe; fokusZiel=".stimmkarte .zu"; setze(x=>{ x.e[k]=true; x.ph[k]=7; x.pv[k]=7; x.karte=k; }); });
  $$("[data-karte]").forEach(b=>b.onclick=()=>{ const k=b.dataset.karte; fokusZiel = k ? ".stimmkarte .zu" : (S.karte ? `#ph-${S.karte} .ph-titel` : null); setze(x=>{ x.karte=k||null; }); });
  $$("[data-skala]").forEach(b=>b.onclick=()=>setze(x=>{ x.skala=+b.dataset.skala; }));
  $$("[data-erf]").forEach(b=>b.onclick=()=>setze(x=>{ x.erf=b.dataset.erf; }));
  $$("[data-extern]").forEach(b=>b.onclick=()=>setze(x=>{ x.extern[b.dataset.extern]="an"; }));
  $$("[data-code]").forEach(b=>{ const [k,stufe]=b.dataset.code.split(":"); const inp=$("#code-"+k);
    const pr=async()=>{ const v=(inp.value||"").replace(/\s+/g,"").toUpperCase(); const h = await sha256("ggk-m19|"+v);
      if(h===CODE_HASH[k]) setze(x=>{ x.stufe=Math.max(x.stufe,+stufe); }); else $("#f-"+k).textContent="Das Codewort passt nicht. Schauen Sie an die Tafel."; };
    b.onclick=pr; inp.onkeydown=e=>{ if(e.key==="Enter") pr(); }; });
  $$("[data-prot]").forEach(i=>i.oninput=()=>{ const [k,f]=i.dataset.prot.split(":"); S.prot[k]=S.prot[k]||{}; S.prot[k][f]=i.value; speichere(); });
  $$("[data-loeschen]").forEach(b=>b.onclick=()=>{ if(confirm("Alle Antworten auf diesem iPad löschen?")){ try{ localStorage.removeItem(KEY); localStorage.removeItem("ggk-m19-appeasement:v3"); }catch(x){} location.href=location.pathname; } });
}

/* ---------------------------- Lehrkraft -----------------------------
   Der Text steht verschlüsselt im Datenblock lehr-daten auf dieser Seite (aus lk/m19.enc.json,
   eingesetzt mit tools/lk_einsetzen.py). Ohne Passwort kommt nichts davon im Browser an, das man lesen
   könnte. Passwort und Sitzungsschlüssel sind dieselben wie in den anderen Modulen (src/lk-schloss.js). */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const LEHR_ORT = "ggk-lehr:schluessel";
const lehrDaten = () => { try { return JSON.parse(document.getElementById("lehr-daten").textContent); } catch(e) { return null; } };
async function oeffneMit(roh, d){
  const key = await crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(d.iv)}, key, b64(d.ct)));
}
async function entschluesseln(pass, d){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC").trim().replace(/\s+/g, " ")), "PBKDF2", false, ["deriveBits"]);
  const roh = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(d.salt), iterations:d.iter, hash:"SHA-256"}, km, 256));
  const html = await oeffneMit(roh, d);
  try { sessionStorage.setItem(LEHR_ORT, JSON.stringify({salt:d.salt, k:btoa(String.fromCharCode.apply(null, roh))})); } catch(e) {}
  return html;
}
function lehrkraft(){
  document.title = "M19 Appeasement – Lehrkraft";
  $("#app").innerHTML = `<header class="kopf"><div class="kopf-in">${MARK}<div class="titel">M19 · Hinweise für die Lehrkraft<small>geschützter Bereich</small></div><a class="protokoll-btn labor" href="${LABOR}" style="text-decoration:none;color:inherit">← GGK-Labor</a><a class="protokoll-btn" href="appeasement.html" style="text-decoration:none;color:inherit">Schüleransicht</a></div></header>
    <main class="lk" style="max-width:62rem"><form class="tor" id="tor"><h1 style="font-size:1.8rem">Hinweise für die Lehrkraft</h1>
      <p class="hinweis">Dieser Bereich ist verschlüsselt. Das Passwort wird nur auf diesem Gerät geprüft und nicht übertragen.</p>
      <input type="password" id="lkpw" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort">
      <button class="btn primary" type="submit">Öffnen</button><p class="fehler" id="lkf" role="status"></p></form></main>`;
  const d = lehrDaten();
  const zeige = html => {
    $("main").innerHTML = html + `<p class="nodruck" style="margin-top:2rem"><button class="btn" type="button" id="lkzu">Lehrkraftbereich schließen</button></p>`;
    $("#lkzu").onclick = () => { try{ sessionStorage.removeItem(LEHR_ORT); }catch(x){} lehrkraft(); };
    $$("[data-reset]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); if(confirm("Alle Antworten auf diesem Gerät löschen?")){ try{localStorage.removeItem(KEY);}catch(x){} location.href="appeasement.html"; } });
  };
  try { const m = JSON.parse(sessionStorage.getItem(LEHR_ORT) || "null"); if (m && d && m.salt === d.salt) oeffneMit(b64(m.k), d).then(zeige).catch(()=>{ try{ sessionStorage.removeItem(LEHR_ORT); }catch(x){} }); } catch(x) {}
  $("#tor").onsubmit = async e => { e.preventDefault(); const f=$("#lkf"); f.textContent="Wird geöffnet …";
    try{ if(!d || !d.ct) throw new Error("datei"); zeige(await entschluesseln($("#lkpw").value, d)); }
    catch(err){ f.textContent = err.message==="datei" ? "Der verschlüsselte Text fehlt auf dieser Seite." : "Das Passwort passt nicht."; }
  };
}

if(new URLSearchParams(location.search).get("ansicht")==="lehrkraft") lehrkraft(); else zeichne();
