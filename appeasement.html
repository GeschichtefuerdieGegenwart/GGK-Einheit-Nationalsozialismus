<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagezentrum Appeasement</title>
<meta name="description" content="GGK M19 Appeasement: lehrkraftgesteuertes historisches Lagezentrum (Prototyp mit zwei Stationen).">
<style>
:root{
  --paper:#ECEEE8; --paper2:#F6F7F3; --ink:#1B2430; --ink2:#4A5563; --rule:#C9CEC4;
  --red:#A3242B; --map:#5B7086; --brass:#9C7A22; --night:#18202A; --nightink:#E9ECE6;
  --A:#2F5D7C; --B:#7A6A2E; --C:#A3242B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:clamp(16px,1.35vw,24px);line-height:1.45}
button,input,select,textarea{font:inherit;font-family:var(--sans)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopfzeile */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:1.2em;align-items:center;padding:.55em 1.4em;border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:.72em;color:var(--ink2)}
.top .ort{font-weight:600;color:var(--ink)}
.tl{position:relative;height:2.6em}
.tl .axis{position:absolute;left:0;right:0;top:1.25em;height:2px;background:var(--rule)}
.tl .past{position:absolute;left:0;top:1.25em;height:2px;background:var(--ink)}
.tl .yr{position:absolute;top:1.7em;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tl .tick{position:absolute;top:1em;width:1px;height:.6em;background:var(--rule)}
.tl .dot{position:absolute;top:.85em;width:.85em;height:.85em;border-radius:50%;transform:translateX(-50%);background:var(--ink2)}
.tl .dot.now{background:var(--brass);box-shadow:0 0 0 3px rgba(156,122,34,.25)}
.tl .lbl{position:absolute;top:-.35em;transform:translateX(-50%);white-space:nowrap;color:var(--ink);font-weight:600}
.tbtn{background:none;border:1px solid var(--rule);border-radius:4px;padding:.25em .7em;color:var(--ink);cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Bühne */
main{height:calc(100vh - 3.2em);overflow:auto}
.station{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:2.2em;padding:1.4em 1.6em 5em}
.datum{font-size:clamp(2.2em,4.6vw,4em);line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums;margin:0}
.ereignis{font-size:1.25em;margin:.35em 0 .9em;font-weight:normal;color:var(--ink2);font-style:italic}
ol.meld{list-style:none;padding:0;margin:0 0 1em;counter-reset:m}
ol.meld li{counter-increment:m;display:grid;grid-template-columns:1.6em 1fr;gap:.4em;padding:.45em 0;border-top:1px solid var(--rule);animation:in .5s ease}
ol.meld li::before{content:counter(m);font-family:var(--sans);font-weight:700;color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(.3em)}to{opacity:1}}
figure{margin:.4em 0 0}
figure img,figure svg{display:block;width:100%;max-height:31vh;object-fit:contain;background:var(--paper2);border:1px solid var(--rule)}
figcaption{font-family:var(--sans);font-size:.62em;color:var(--ink2);margin-top:.35em;line-height:1.35}
figcaption b{color:var(--ink)}
.frage-bild{font-style:italic;margin:.3em 0 0}
.bildfehlt{padding:1.2em;border:1px dashed var(--ink2);background:var(--paper2);font-family:var(--sans);font-size:.8em}

aside .box{border-top:3px solid var(--ink);padding:.6em 0 .9em;margin-bottom:.6em}
aside h3{font-family:var(--sans);font-size:.72em;margin:0 0 .4em;color:var(--ink)}
.wissen{display:grid;gap:.45em;font-size:.82em}
.wissen div{padding-left:.7em;border-left:4px solid var(--rule)}
.wissen .g{border-color:var(--ink)} .wissen .v{border-color:var(--brass)} .wissen .o{border-color:var(--rule);border-left-style:dashed}
.wissen b{font-family:var(--sans);font-size:.78em;display:block;color:var(--ink2)}
.bedeutung{font-size:.82em;margin-top:.6em}
.frage{font-size:1.05em;margin:0 0 .5em}
.opt{display:grid;grid-template-columns:2em 1fr;gap:.5em;align-items:start;margin:.35em 0;font-size:.88em}
.karte{display:inline-grid;place-items:center;width:1.7em;height:2.1em;border-radius:3px;color:#fff;font-family:var(--sans);font-weight:700}
.kA{background:var(--A)} .kB{background:var(--B)} .kC{background:var(--C)}
.erg{font-family:var(--sans);font-size:.72em}
.erg .runde{margin:.5em 0 .2em;color:var(--ink2)}
.bar{display:grid;grid-template-columns:1.6em 1fr 6.2em;gap:.4em;align-items:center;margin:.18em 0}
.bar .spur{height:1.05em;background:var(--paper2);border:1px solid var(--rule)}
.bar .f{height:100%;transition:width .6s ease}
.bar .z{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sich{color:var(--ink2);margin-top:.3em}
.next{border:1px dashed var(--ink2);padding:.6em .8em;font-size:.82em;color:var(--ink2)}
.next.offen{border:2px solid var(--brass);color:var(--ink);background:var(--paper2)}
.next b{font-family:var(--sans);font-size:.8em;display:block}

/* Fokuskarte (Quiz, Stimmen, Ton, Sicherung) */
.fokus{grid-column:1/-1;max-width:62em}
.fokus .kopf{font-family:var(--sans);font-size:.72em;color:var(--ink2);margin-bottom:.3em}
.aussage{font-size:1.55em;line-height:1.3;margin:.2em 0 .8em}
.kat{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.kat div{border:2px solid var(--rule);padding:.6em .7em;background:var(--paper2)}
.kat div.richtig{border-color:var(--ink);background:#fff}
.kat .n{font-family:var(--sans);font-size:.72em;color:var(--ink2);margin-top:.3em}
.aufl{margin-top:1em;padding:.7em 1em;border-left:5px solid var(--brass);background:var(--paper2)}
.zitate{display:grid;gap:1em}
.zitat{display:grid;grid-template-columns:12em 1fr;gap:1.2em;padding:.8em 0;border-top:1px solid var(--rule);animation:in .5s ease}
.zitat .wer{font-family:var(--sans);font-size:.72em}
.zitat .wer b{display:block;font-size:1.25em}
.zitat q{font-size:1.25em;quotes:"„" "“"}
.zitat .orig{display:block;font-size:.72em;color:var(--ink2);margin-top:.3em;font-family:var(--sans)}
.vergleich{display:grid;grid-template-columns:1fr 1fr;gap:2em;margin-top:.6em}
.vergleich h4{font-family:var(--sans);font-size:.75em;margin:0 0 .3em}
.gross{font-size:3em;line-height:1;font-variant-numeric:tabular-nums}
.hinweis{font-family:var(--sans);font-size:.68em;color:var(--ink2)}
.def{font-size:1.35em;line-height:1.35;border-left:6px solid var(--ink);padding:.3em 0 .3em .8em}
.transkript p{margin:.3em 0}
.transkript .en{font-family:var(--sans);font-size:.7em;color:var(--ink2)}

/* Start */
.start{padding:7vh 6vw;max-width:70em}
.start .ort2{font-family:var(--sans);font-size:.8em;color:var(--ink2)}
.start h1{font-size:clamp(2.6em,6vw,5em);line-height:1;margin:.15em 0 .3em;font-weight:normal}
.start .leit{font-size:1.3em;font-style:italic;color:var(--ink2);max-width:36em}
.start .rolle{margin-top:1.6em;max-width:38em;font-size:1.1em;border-top:3px solid var(--ink);padding-top:.7em}
.karten{display:flex;gap:1.4em;margin-top:1.4em;flex-wrap:wrap;font-family:var(--sans);font-size:.8em;align-items:center}
.karten span.karte{width:2.3em;height:3em;font-size:1.2em}

/* Plenumsstopp */
.stopp{position:fixed;inset:0;background:var(--night);color:var(--nightink);display:grid;place-content:center;text-align:center;padding:6vw;z-index:20}
.stopp h2{font-size:clamp(2.2em,6vw,5em);font-weight:normal;margin:0}
.stopp p{font-size:1.3em;max-width:30em;margin:1em auto 0;color:#B9C1C9;font-style:italic}

/* Landkarte */
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:1em;padding:1.4em 1.6em 5em}
.lk h2{grid-column:1/-1;font-weight:normal;font-size:2em;margin:0}
.lk .t{border-top:3px solid var(--ink);padding-top:.5em;font-size:.85em;min-height:9em}
.lk .t.leer{border-top-style:dashed;color:var(--ink2)}
.lk .t b{font-family:var(--sans);font-size:.85em;display:block}
.lk .t i{display:block;color:var(--ink2);margin:.2em 0 .4em;font-size:.9em}
.lk .t ul{margin:.2em 0;padding-left:1.1em}

/* Lehrkraftleiste */
.leiste{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:.62em;display:flex;flex-wrap:wrap;gap:.4em;align-items:center;padding:.45em .8em;z-index:30}
.leiste button{background:transparent;color:var(--paper);border:1px solid #556070;border-radius:3px;padding:.3em .6em;cursor:pointer}
.leiste button:hover{background:#2A3644}
.leiste .pos{margin-right:auto;opacity:.8}
.leiste.aus{display:none}
.zeige{position:fixed;right:.6em;bottom:.5em;z-index:29;font-family:var(--sans);font-size:.6em;opacity:.5}

/* Eingabe-Dialog */
dialog{border:none;border-radius:6px;padding:1.2em 1.4em;font-family:var(--sans);font-size:.8em;max-width:34em;width:92vw}
dialog::backdrop{background:rgba(24,32,42,.55)}
dialog h3{margin:.1em 0 .6em}
.felder{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.felder label{display:grid;gap:.2em}
.felder input{width:100%;padding:.3em;font-size:1.3em;text-align:center}
dialog textarea,dialog input[type=text],dialog select{width:100%;padding:.35em}
dialog .reihe{margin-top:.8em}
dialog menu{display:flex;gap:.6em;justify-content:flex-end;padding:0;margin:1em 0 0}
dialog menu button{padding:.4em .9em}

/* Lehrkraftfenster */
body.lehrer{font-size:16px;background:#fff}
.lv{display:grid;grid-template-columns:1.2fr 1fr;gap:1.5em;padding:1em 1.4em;font-family:var(--sans);font-size:15px}
.lv h2{font-size:1.1em;margin:.2em 0}
.lv .jetzt{font-size:1.35em;font-weight:600}
.lv .impulse li{margin:.35em 0;font-family:var(--serif);font-size:1.1em}
.lv .knoepfe{display:flex;flex-wrap:wrap;gap:.4em;margin:.8em 0}
.lv .knoepfe button{padding:.5em .8em;border:1px solid var(--ink);background:#fff;border-radius:4px;cursor:pointer}
.lv .knoepfe button.haupt{background:var(--ink);color:#fff}
.lv .meta{color:var(--ink2);font-size:.9em}
.lv .uhr{font-size:2em;font-variant-numeric:tabular-nums}
.lv ol.ablauf{font-size:.85em;max-height:78vh;overflow:auto;padding-left:2.6em}
.lv ol.ablauf li.akt{font-weight:700;color:var(--red)}

@media (max-width:900px){
  .station{grid-template-columns:1fr}
  .zitat{grid-template-columns:1fr}
  .kat,.lk,.vergleich,.lv{grid-template-columns:1fr}
  .top{grid-template-columns:1fr}
}
@media print{.leiste,.zeige,.top{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<dialog id="dlg"></dialog>

<script>
"use strict";
/* ============================================================
   Lagezentrum Appeasement – Prototyp (Stationen S2 und S3)
   Lehrkraftgesteuert. Keine Server, keine Konten, kein Tracking.
   Gespeichert werden nur Summen (Stimmkarten) und Notizen der
   Lehrkraft, lokal auf diesem Gerät.
   Zwei Fenster (Beamer + Lehrkraft) synchronisieren sich auf
   demselben Gerät über BroadcastChannel.
   ============================================================ */

const KEY = "ggk-appeasement:v1";
const ROLLE = new URLSearchParams(location.search).get("rolle") === "lehrkraft" ? "lehrkraft" : "beamer";

/* ---------- Inhalte ---------- */

const KARTEN = {A:"damals bekannt", B:"damals vermutet", C:"erst später bekannt"};

const STATIONEN = {
  S2: {
    jahr: 1938.2, kurz: "März 1938",
    datum: "12./13. März 1938",
    ereignis: "Deutsche Truppen marschieren in Österreich ein",
    meldungen: [
      "Am 12. März überschreiten deutsche Truppen die österreichische Grenze. Sie stoßen auf keinen Widerstand; viele Menschen jubeln ihnen zu.",
      "Am 13. März wird Österreich per Gesetz Teil des Deutschen Reiches. Die NS-Führung begründet das damit, alle Deutschen in einem Reich zu vereinen.",
      "In Wien werden Regimegegner verhaftet, Jüdinnen und Juden öffentlich gedemütigt und beraubt. London und Paris protestieren, handeln aber nicht."
    ],
    medium: "karte",
    bildfrage: "Was bedeutet die neue Grenze für die Tschechoslowakei?",
    wissen: {
      g: "Österreich ist angegliedert. Großbritannien hat keine Verpflichtung, Österreich beizustehen.",
      v: "Hitler will „nur“ Gebiete mit deutschsprachiger Bevölkerung.",
      o: "Was folgt als Nächstes? Die Tschechoslowakei ist jetzt auf drei Seiten von deutschem Gebiet umgeben."
    },
    bedeutung: "Für Großbritannien: Die erste Grenzverschiebung in Europa seit 1919 – ohne Krieg, aber gegen geltende Verträge.",
    naechstes: "September 1938: Hitler fordert von der Tschechoslowakei das Sudetengebiet."
  },
  S3: {
    jahr: 1938.74, kurz: "Sept. 1938",
    datum: "27. September 1938",
    ereignis: "Sudetenkrise: Steht Europa vor einem Krieg?",
    meldungen: [
      "Hitler fordert, dass die Tschechoslowakei die überwiegend deutschsprachigen Grenzgebiete – das „Sudetengebiet“ – abtritt. Dort leben rund drei Millionen Deutschsprachige.",
      "Premierminister Chamberlain ist zweimal zu Hitler geflogen (15. und 22. September). Beim zweiten Treffen verschärft Hitler seine Forderungen und setzt eine Frist.",
      "Frankreich ist mit der Tschechoslowakei verbündet. In London werden Gasmasken ausgegeben und Schutzgräben ausgehoben."
    ],
    medium: "foto",
    bildfrage: "Was erwarten diese Menschen?",
    wissen: {
      g: "Hitler fordert das Sudetengebiet mit Frist. Frankreich müsste der Tschechoslowakei beistehen. Großbritannien hat mit Prag keinen Bündnisvertrag.",
      v: "Es geht Hitler nur um die Deutschsprachigen. Ein Krieg brächte schwere Luftangriffe auf London.",
      o: "Kämpft Frankreich wirklich? Ist die britische Luftverteidigung bereit? Was fordert Hitler danach?"
    },
    bedeutung: "Für Großbritannien: Kämpft Frankreich, kann London kaum abseits stehen.",
    votum: {
      id: "v2",
      frage: "Was soll Großbritannien jetzt tun?",
      opt: {
        A: "Der Abtretung zustimmen, um den Frieden zu sichern.",
        B: "Zustimmen – aber nur gegen eine internationale Garantie für die übrige Tschechoslowakei.",
        C: "Hitler entgegentreten – notfalls Krieg an der Seite Frankreichs."
      }
    },
    naechstes: "29./30. September 1938: Konferenz in München."
  }
};

const QUIZ1 = [
  { t: "Hitler hat in „Mein Kampf“ „Lebensraum im Osten“ gefordert.", a: "A",
    e: "Damals bekannt. Das Buch war seit 1925/26 öffentlich und auch in Großbritannien bekannt – viele hielten es aber für Propaganda aus früheren Jahren." },
  { t: "Hitler will nur Gebiete mit deutschsprachiger Bevölkerung.", a: "B",
    e: "Damals vermutet. Viele in London hielten das für plausibel; die NS-Propaganda sprach von „Selbstbestimmung“. Ob es stimmt, ist im März 1938 offen." },
  { t: "Hitler hat im November 1937 intern Pläne vorgetragen, Österreich und die Tschechoslowakei bei günstiger Gelegenheit zu überwältigen.", a: "C",
    e: "Erst später bekannt. Die Hoßbach-Niederschrift vom 5.11.1937 war ein internes Protokoll; öffentlich wurde sie erst im Nürnberger Prozess 1945/46. Wer hier „damals bekannt“ gewählt hat, hat mit unserem Wissen entschieden." },
  { t: "Die Wehrmacht ist 1938 bereit für einen großen europäischen Krieg.", a: "B",
    e: "Damals vermutet und gefürchtet, vor allem die Stärke der Luftwaffe. Die Forschung urteilt heute, dass die Wehrmacht 1938 für einen langen, großen Krieg nicht gerüstet war." }
];

const ZITATE = [
  { wer: "Neville Chamberlain", rolle: "Premierminister, Konservative", dat: "3. Oktober 1938",
    de: "… eine Katastrophe abgewendet, die die Zivilisation, wie wir sie kennen, beendet hätte.",
    en: "… averted a catastrophe which would have ended civilisation as we have known it", sp: "Sp. 45",
    url: "https://api.parliament.uk/historic-hansard/commons/1938/oct/03/prime-ministers-statement" },
  { wer: "Clement Attlee", rolle: "Oppositionsführer, Labour", dat: "3. Oktober 1938",
    de: "Das war kein Sieg der Vernunft und der Menschlichkeit. Es war ein Sieg der rohen Gewalt.",
    en: "This has not been a victory for reason and humanity. It has been a victory for brute force.", sp: "Sp. 51",
    url: "https://api.parliament.uk/historic-hansard/commons/1938/oct/03/prime-ministers-statement" },
  { wer: "Winston Churchill", rolle: "Abgeordneter, Konservative", dat: "5. Oktober 1938",
    de: "Das ist erst der Anfang der Abrechnung.",
    en: "This is only the beginning of the reckoning.", sp: "Sp. 371",
    url: "https://api.parliament.uk/historic-hansard/commons/1938/oct/05/policy-of-his-majestys-government" }
];

const FOTO = {
  src: "https://coimages.sciencemuseumgroup.org.uk/164/976/large_1983_5236_10691_1.jpg",
  lokal: "media/schutzgraeben-1938.jpg",
  alt: "Mittagspause in London: Eine Menschenmenge schaut Arbeitern zu, die in Lincoln’s Inn Schutzgräben gegen Luftangriffe ausheben.",
  cap: "<b>Schutzgräben in Lincoln’s Inn, London, 27. September 1938.</b> Foto: Reg Sayers, Daily Herald Archive. Science Museum Group Collection, Inv. 1983-5236/10691. Nutzung: nicht-kommerziell, Bedingungen der Science Museum Group (vor Veröffentlichung prüfen)."
};

const TON = {
  mp3: "https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a1/Another_talk_with_the_German_Chancellor%2C_Herr_Hitler.ogg/Another_talk_with_the_German_Chancellor%2C_Herr_Hitler.ogg.mp3",
  ogg: "https://upload.wikimedia.org/wikipedia/commons/a/a1/Another_talk_with_the_German_Chancellor%2C_Herr_Hitler.ogg",
  cap: "Neville Chamberlain nach der Landung am Flugplatz Heston, 30. September 1938, 1:08 min. Wikimedia Commons, dort als gemeinfrei (Crown Copyright abgelaufen) geführt; Herkunft der Aufnahme vor Veröffentlichung prüfen. Wortlaut nach D. Faber, Munich 1938 (2008), und Internet Modern History Sourcebook; deutsche Übersetzung: eigene."
};

/* ---------- Ablauf (Prototyp) ---------- */

const IMP = {
  start: ["Regel setzen: Nur was Sie heute – im jeweiligen Moment – wissen, zählt.", "Stimmkarten A, B, C austeilen. Hochhalten erst auf Ihr Zeichen."],
  s2lage: ["„Ein Volk jubelt – sollen wir dagegen einen Krieg führen?“", "„Ist ein Vertragsbruch automatisch ein Kriegsgrund?“"],
  quiz: ["Karten auf Zeichen hochhalten lassen, dann Zahl schätzen oder zählen.", "„Woher wissen Sie das – von 1938 oder aus dem Unterricht?“"],
  s3lage: ["„Wegen eines Streits um ein Grenzgebiet wollen Sie einen europäischen Krieg riskieren?“", "„Wissen Sie sicher, dass Hitler danach weitere Forderungen stellt?“"],
  votum: ["Karten verdeckt halten, dann gleichzeitig hochhalten.", "Danach per Handzeichen: Wer ist sehr sicher – eher sicher – unsicher?"],
  p2: ["„Wären Sie bereit, einen Angehörigen für das Sudetengebiet in den Krieg zu schicken?“ (hypothetisch, keine Antwortpflicht)", "„Welche Verantwortung tragen Sie gegenüber der Tschechoslowakei, die nicht mit am Tisch sitzt?“", "„Welche Verantwortung tragen Sie gegenüber der eigenen Bevölkerung?“", "„Wie viele Zugeständnisse sind vertretbar, wenn dadurch Frieden erhalten werden könnte?“"],
  m: ["„Wessen Argument haben Sie benutzt?“", "Festhalten: Kritik gab es schon 1938 – sie ist nicht nur Rückschau."],
  unterhaus: ["Vorsicht beim Vergleich: Die Klasse stimmte vor München ab, das Unterhaus danach – und über die Politik der Regierung, nicht über A/B/C."],
  ton: ["Ton erst nach Ankündigung starten. Danach: „Was hofft Chamberlain? Was hofft die Menge?“"],
  sicherung: ["Definition gemeinsam lesen; nachfragen: „Was davon ist Ziel, was ist Mittel?“"],
  lk: ["Beobachtungen der Stunde den Begriffen zuordnen lassen.", "„Welche Kritik bleibt, auch wenn man nur das damalige Wissen nimmt?“"]
};

const SCHRITTE = [
  {id:"start",   typ:"start",   name:"Start: Rolle und Leitfrage", imp:IMP.start},
  {id:"s2-0",    typ:"station", st:"S2", m:0, name:"S2 Datum und Ereignis", imp:IMP.s2lage},
  {id:"s2-1",    typ:"station", st:"S2", m:1, name:"S2 Meldung 1"},
  {id:"s2-2",    typ:"station", st:"S2", m:2, name:"S2 Meldung 2"},
  {id:"s2-3",    typ:"station", st:"S2", m:3, name:"S2 Meldung 3"},
  {id:"s2-med",  typ:"station", st:"S2", m:3, med:1, name:"S2 Medium: Lageskizze"},
  {id:"s2-wis",  typ:"station", st:"S2", m:3, med:1, wis:1, name:"S2 Was wissen wir?"},
  ...QUIZ1.flatMap((q,i)=>[
    {id:"q"+i,     typ:"quiz", qi:i, auf:0, name:"Quiz 1 · Aussage "+(i+1), imp:IMP.quiz},
    {id:"q"+i+"a", typ:"quiz", qi:i, auf:1, name:"Quiz 1 · Auflösung "+(i+1), imp:IMP.quiz}
  ]),
  {id:"s2-next", typ:"station", st:"S2", m:3, med:1, wis:1, nxt:1, name:"S2 Freigabe: Was geschieht als Nächstes?"},
  {id:"s3-0",    typ:"station", st:"S3", m:0, name:"S3 Datum und Ereignis", imp:IMP.s3lage},
  {id:"s3-1",    typ:"station", st:"S3", m:1, name:"S3 Meldung 1"},
  {id:"s3-2",    typ:"station", st:"S3", m:2, name:"S3 Meldung 2"},
  {id:"s3-3",    typ:"station", st:"S3", m:3, name:"S3 Meldung 3"},
  {id:"s3-med",  typ:"station", st:"S3", m:3, med:1, name:"S3 Medium: Foto London", imp:["Bildfrage: „Was erwarten diese Menschen?“"]},
  {id:"s3-wis",  typ:"station", st:"S3", m:3, med:1, wis:1, name:"S3 Was wissen wir?", imp:IMP.s3lage},
  {id:"s3-v1",   typ:"station", st:"S3", m:3, wis:1, vot:"offen", runde:"r1", name:"Votum 2 · Runde 1 öffnen", imp:IMP.votum},
  {id:"s3-e1",   typ:"station", st:"S3", m:3, wis:1, vot:"erg", runde:"r1", name:"Votum 2 · Ergebnis Runde 1", imp:IMP.votum},
  {id:"p2",      typ:"stopp", st:"S3", text:"Stopp: Begründen und diskutieren", unter:"Was soll Großbritannien jetzt tun?", name:"Plenumsstopp P2", imp:IMP.p2},
  {id:"s3-v2",   typ:"station", st:"S3", m:3, wis:1, vot:"offen", runde:"r2", name:"Votum 2 · Runde 2 öffnen", imp:IMP.votum},
  {id:"s3-e2",   typ:"station", st:"S3", m:3, wis:1, vot:"erg", runde:"r2", name:"Votum 2 · Ergebnis beider Runden", imp:IMP.votum},
  {id:"s3-next", typ:"muenchen", st:"S3", name:"S3 Freigabe: Münchner Abkommen"},
  {id:"ton",     typ:"ton", st:"S3", name:"Originalton Heston (30.9.1938)", imp:IMP.ton},
  {id:"m1",      typ:"zitate", st:"S3", n:1, name:"Option M · Stimme 1", imp:IMP.m},
  {id:"m2",      typ:"zitate", st:"S3", n:2, name:"Option M · Stimme 2", imp:IMP.m},
  {id:"m3",      typ:"zitate", st:"S3", n:3, frage:1, name:"Option M · Stimme 3 + Frage", imp:IMP.m},
  {id:"uh",      typ:"unterhaus", st:"S3", name:"Unterhaus 6.10.1938: 366 : 144", imp:IMP.unterhaus},
  {id:"sich",    typ:"sicherung", st:"S3", name:"Vorläufige Sicherung: Appeasement", imp:IMP.sicherung},
  {id:"lk",      typ:"landkarte", name:"Kognitive Landkarte (Ausschnitt)", imp:IMP.lk},
  {id:"ende",    typ:"ende", name:"Ende des Prototyps"}
];

/* ---------- Zustand ---------- */

const LEER = () => ({ i:0, stoppAn:false, ton:false, leiste:true, votes:{v2:{r1:null,r2:null,sicher:null,arg:"",sorge:""}}, quiz:{}, notizen:[], start:null });
let S = laden();
function laden(){ try{ const x = JSON.parse(localStorage.getItem(KEY)); if(x && typeof x.i==="number") return Object.assign(LEER(), x);}catch(e){} return LEER(); }
function sichern(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let kanal = null; try{ kanal = new BroadcastChannel("ggk-appeasement"); }catch(e){}
if(kanal) kanal.onmessage = ev => { if(ev.data && ev.data.S){ S = ev.data.S; zeichnen(); } };
function setze(f){ f(S); sichern(); if(kanal) kanal.postMessage({S}); zeichnen(); }

/* ---------- Hilfen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const summe = o => o ? (+o.A||0)+(+o.B||0)+(+o.C||0) : 0;

function zeitleiste(st){
  const x = j => ((j-1933)/(1939.85-1933)*100).toFixed(2)+"%";
  let h = '<div class="tl" aria-label="Zeitleiste 1933 bis 1939"><div class="axis"></div>';
  const jetzt = st ? STATIONEN[st].jahr : 1933.05;
  h += `<div class="past" style="width:${x(jetzt)}"></div>`;
  for(let y=1933;y<=1939;y++) h += `<div class="tick" style="left:${x(y)}"></div><div class="yr" style="left:${x(y+.0)}">${y}</div>`;
  // Nur bereits erreichte Stationen erscheinen; die Zukunft bleibt leer.
  const reihe = ["S2","S3"];
  for(const k of reihe){
    const s = STATIONEN[k];
    if(st && s.jahr <= jetzt){
      h += `<div class="dot ${k===st?"now":""}" style="left:${x(s.jahr)}"></div>`;
      if(k===st) h += `<div class="lbl" style="left:${x(s.jahr)}">${s.kurz}</div>`;
    }
  }
  return h+'</div>';
}

function kopf(st){
  return `<header class="top">
    <div class="ort">Lagezentrum · House of Commons</div>
    ${zeitleiste(st)}
    <div style="display:flex;gap:.4em">
      <button class="tbtn" id="bTon" aria-pressed="${S.ton}" title="Ton ein/aus (T)">${S.ton?"Ton an":"Ton aus"}</button>
      <button class="tbtn" id="bVoll" title="Vollbild (F)">Vollbild</button>
    </div></header>`;
}

/* Lageskizze März 1938 – bewusst keine Landkarte: Sie zeigt nur, wer an wen grenzt. */
function karte(){
  return `<svg viewBox="0 0 900 470" role="img" aria-label="Lageskizze März 1938: Die Tschechoslowakei grenzt im Norden, Westen und Süden an das Deutsche Reich einschließlich des angegliederten Österreich. Im Osten grenzen Polen und Ungarn an.">
    <style>.w{font:600 21px system-ui,sans-serif;fill:#fff}.l{font:600 22px system-ui,sans-serif;fill:#1B2430}.k{font:italic 19px Georgia,serif;fill:#4A5563}.s{font:15px system-ui,sans-serif;fill:#fff}</style>
    <path d="M70 40H560V200H330V390H70Z" fill="#5B7086" stroke="#1B2430" stroke-width="2"/>
    <path d="M330 290H560V390H330Z" fill="#8A9AAB" stroke="#1B2430" stroke-width="2" stroke-dasharray="8 5"/>
    <path d="M330 200H800V290H330Z" fill="#F6F7F3" stroke="#A3242B" stroke-width="4"/>
    <path d="M560 40H830V200H560Z" fill="none" stroke="#C9CEC4" stroke-width="2"/>
    <path d="M560 290H830V390H560Z" fill="none" stroke="#C9CEC4" stroke-width="2"/>
    <text x="96" y="110" class="w">Deutsches Reich</text>
    <text x="350" y="332" class="w">Österreich</text><text x="350" y="356" class="s">angegliedert 12./13.3.1938</text>
    <text x="350" y="252" class="l">Tschechoslowakei</text>
    <text x="640" y="128" class="k">Polen</text><text x="650" y="348" class="k">Ungarn</text>
    <text x="400" y="436" class="k">Italien</text><text x="120" y="436" class="k">Schweiz</text><text x="6" y="220" class="k" transform="rotate(-90 22 220)">Frankreich</text>
  </svg>`;
}

function medium(st){
  if(st==="S2") return `<figure>${karte()}<figcaption><b>Lageskizze, keine Landkarte:</b> Sie zeigt nur, welche Staaten aneinandergrenzen. Eigene Darstellung.</figcaption></figure><p class="frage-bild">${STATIONEN.S2.bildfrage}</p>`;
  return `<figure><img src="${FOTO.lokal}" data-alt2="${FOTO.src}" alt="${esc(FOTO.alt)}" onerror="bildFehler(this)"><figcaption>${FOTO.cap}</figcaption></figure><p class="frage-bild">${STATIONEN.S3.bildfrage}</p>`;
}
window.bildFehler = img => {
  if(img.dataset.alt2){ const u = img.dataset.alt2; delete img.dataset.alt2; img.src = u; return; }
  const d = document.createElement("div"); d.className = "bildfehlt";
  d.textContent = "Bild nicht geladen (kein Internet oder Datei fehlt). Bildbeschreibung: " + img.alt;
  img.replaceWith(d);
};

function ergebnisHTML(v, runde){
  const vt = S.votes[v.id]; const rn = runde==="r2" ? ["r1","r2"] : ["r1"];
  let h = '<div class="erg">';
  for(const r of rn){
    const d = vt[r]; const n = summe(d);
    h += `<div class="runde">${r==="r1"?"Runde 1":"Runde 2"} · ${n?n+" Stimmen":"noch keine Zahlen eingetragen"}</div>`;
    for(const k of ["A","B","C"]){
      const z = d ? (+d[k]||0) : 0, p = n ? Math.round(z/n*100) : 0;
      h += `<div class="bar"><span class="karte k${k}" aria-hidden="true">${k}</span><div class="spur" role="img" aria-label="Option ${k}: ${z} Stimmen, ${p} Prozent"><div class="f k${k}" style="width:${p}%"></div></div><span class="z">${z} · ${p} %</span></div>`;
    }
  }
  if(vt.sicher && summe({A:vt.sicher.s,B:vt.sicher.e,C:vt.sicher.u})) h += `<div class="sich">Sicherheit: sehr sicher ${vt.sicher.s||0} · eher sicher ${vt.sicher.e||0} · unsicher ${vt.sicher.u||0}</div>`;
  if(vt.arg) h += `<div class="sich"><b>Wichtigstes Argument:</b> ${esc(vt.arg)}</div>`;
  if(vt.sorge) h += `<div class="sich"><b>Größte Sorge:</b> ${esc(vt.sorge)}</div>`;
  return h+'</div>';
}

/* ---------- Bildschirme ---------- */

function station(sch){
  const s = STATIONEN[sch.st];
  const meld = s.meldungen.slice(0, sch.m).map(t => `<li>${esc(t)}</li>`).join("");
  let rechts = "";
  if(sch.wis) rechts += `<div class="box"><h3>Was wissen wir?</h3><div class="wissen">
      <div class="g"><b>gesichert</b>${esc(s.wissen.g)}</div>
      <div class="v"><b>vermutet</b>${esc(s.wissen.v)}</div>
      <div class="o"><b>offen</b>${esc(s.wissen.o)}</div></div>
      <p class="bedeutung">${esc(s.bedeutung)}</p></div>`;
  if(sch.vot && s.votum){
    const v = s.votum;
    rechts += `<div class="box"><h3>Entscheidung${sch.runde==="r2"?" · Runde 2":""}</h3><p class="frage">${esc(v.frage)}</p>
      ${["A","B","C"].map(k=>`<div class="opt"><span class="karte k${k}">${k}</span><span>${esc(v.opt[k])}</span></div>`).join("")}</div>`;
    if(sch.vot==="erg") rechts += `<div class="box"><h3>Wie haben wir entschieden?</h3>${ergebnisHTML(v, sch.runde)}</div>`;
  }
  rechts += `<div class="next ${sch.nxt?"offen":""}"><b>Was geschieht als Nächstes?</b>${sch.nxt ? esc(s.naechstes) : "Gesperrt – wird von der Lehrkraft freigegeben."}</div>`;
  return `<section class="station">
    <div>
      <h1 class="datum">${s.datum}</h1>
      <h2 class="ereignis">${esc(s.ereignis)}</h2>
      <ol class="meld">${meld}</ol>
      ${sch.med && !sch.vot ? medium(sch.st) : ""}
    </div>
    <aside>${rechts}</aside></section>`;
}

function quiz(sch){
  const q = QUIZ1[sch.qi]; const z = S.quiz["q"+sch.qi] || {};
  const n = summe(z);
  const kat = ["A","B","C"].map(k => `<div class="${sch.auf && q.a===k ? "richtig":""}"><span class="karte k${k}">${k}</span> ${KARTEN[k]}${sch.auf && n ? `<div class="n">${+z[k]||0} von ${n}</div>`:""}</div>`).join("");
  return `<section class="station"><div class="fokus">
    <div class="kopf">Was weiß London im März 1938? · Aussage ${sch.qi+1} von ${QUIZ1.length} · Karte hochhalten</div>
    <p class="aussage">${esc(q.t)}</p>
    <div class="kat">${kat}</div>
    ${sch.auf ? `<div class="aufl">${esc(q.e)}${z.sicher!=null && z.sicher!=="" ? `<div class="hinweis">Sehr sicher waren: ${esc(z.sicher)}</div>`:""}</div>` : ""}
  </div></section>`;
}

function muenchen(){
  return `<section class="station"><div>
    <h1 class="datum">29./30. September 1938</h1>
    <h2 class="ereignis">Das Münchner Abkommen</h2>
    <ol class="meld">
      <li>Deutschland, Großbritannien, Frankreich und Italien beschließen in München: Die Tschechoslowakei muss das Sudetengebiet vom 1. bis 10. Oktober räumen.</li>
      <li>Die Tschechoslowakei ist an der Konferenz nicht beteiligt. Die Sowjetunion auch nicht.</li>
      <li>Am Morgen danach unterzeichnen Hitler und Chamberlain eine Erklärung: Beide Völker wollen nie wieder gegeneinander Krieg führen.</li>
    </ol></div>
    <aside><div class="box"><h3>Ihr Votum</h3>${ergebnisHTML(STATIONEN.S3.votum,"r2")}</div>
    <div class="next offen"><b>Was geschieht als Nächstes?</b>30. September 1938: Chamberlain landet in London.</div></aside></section>`;
}

function ton(){
  const player = S.ton
    ? `<audio controls preload="none" style="width:100%"><source src="${TON.mp3}" type="audio/mpeg"><source src="${TON.ogg}" type="audio/ogg"></audio>`
    : `<p class="hinweis">Ton ist aus. Einschalten mit „Ton aus“ oben rechts oder Taste T. Der Wortlaut steht unten.</p>`;
  return `<section class="station"><div class="fokus">
    <div class="kopf">Originalton · Flugplatz Heston bei London · 30. September 1938</div>
    ${player}
    <div class="transkript" style="margin-top:1em">
      <p>„Die Lösung des tschechoslowakischen Problems, die jetzt erreicht ist, ist meiner Ansicht nach nur der Auftakt zu einer größeren Regelung, in der ganz Europa Frieden finden kann.“</p>
      <p class="en">“The settlement of the Czechoslovak problem which has now been achieved is, in my view, only the prelude to a larger settlement in which all Europe may find peace.”</p>
      <p>„Heute Morgen hatte ich ein weiteres Gespräch mit dem deutschen Reichskanzler, Herrn Hitler, und hier ist ein Papier, das seinen Namen trägt und auch meinen.“</p>
      <p class="en">“This morning I had another talk with the German Chancellor, Herr Hitler, and here is a paper which bears his name upon it as well as mine.”</p>
      <p>Aus der verlesenen Erklärung: „Wir betrachten das gestern Abend unterzeichnete Abkommen und das deutsch-englische Flottenabkommen als symbolisch für den Wunsch unserer beiden Völker, nie wieder gegeneinander Krieg zu führen.“</p>
      <p class="en">“We regard the agreement signed last night and the Anglo-German Naval Agreement as symbolic of the desire of our two peoples never to go to war with one another again.”</p>
    </div>
    <p class="hinweis" style="margin-top:1em">${TON.cap}</p>
  </div></section>`;
}

function zitate(sch){
  const z = ZITATE.slice(0, sch.n).map(q => `<div class="zitat"><div class="wer"><b>${q.wer}</b>${q.rolle}<br>${q.dat}</div>
    <div><q>${esc(q.de)}</q><span class="orig">“${esc(q.en)}” – Hansard, ${q.sp} · Übersetzung: eigene</span></div></div>`).join("");
  return `<section class="station"><div class="fokus">
    <div class="kopf">Stimmen aus dem Unterhaus · Debatte über das Münchner Abkommen, Oktober 1938</div>
    <div class="zitate">${z}</div>
    ${sch.frage ? `<p class="aussage" style="margin-top:1em">Wessen Argument haben Sie benutzt?</p>` : ""}
  </div></section>`;
}

function unterhaus(){
  const v = S.votes.v2; const d = v.r2 || v.r1; const n = summe(d);
  const ab = d ? (+d.A||0)+(+d.B||0) : 0, c = d ? (+d.C||0) : 0;
  return `<section class="station"><div class="fokus">
    <div class="kopf">6. Oktober 1938 · Abstimmung im House of Commons über die Politik der Regierung</div>
    <div class="vergleich">
      <div><h4>House of Commons</h4><div class="gross">366 : 144</div>
        <p class="hinweis">Zustimmung : Ablehnung. Churchill und weitere Konservative enthielten sich. Quelle: Hansard, 6.10.1938, Sp. 558–562.</p></div>
      <div><h4>Unsere Klasse (${v.r2?"Runde 2":"Runde 1"})</h4><div class="gross">${n ? ab+" : "+c : "–"}</div>
        <p class="hinweis">Zugeständnis (A + B) : Hitler entgegentreten (C).${n?"":" Noch keine Zahlen eingetragen."}</p></div>
    </div>
    <p class="hinweis" style="margin-top:1em">Vorsicht beim Vergleich: Die Klasse hat vor München entschieden, das Unterhaus danach – und über die Politik der Regierung insgesamt.</p>
  </div></section>`;
}

function sicherung(){
  return `<section class="station"><div class="fokus">
    <div class="kopf">Vorläufige Sicherung</div>
    <p class="def"><b>Appeasement</b> (engl. „Beschwichtigung“) nennt man die Politik Großbritanniens und Frankreichs in den 1930er-Jahren, einen großen Krieg durch Verhandlungen und begrenzte Zugeständnisse an Deutschland zu verhindern – bei gleichzeitiger eigener Aufrüstung.</p>
    <p class="hinweis" style="font-size:.8em">Im Rückblick wird der Begriff oft abwertend für schwaches Nachgeben gegenüber einem Aggressor verwendet.</p>
    <div class="vergleich">
      <div><h4>Was dafür sprach (aus Sicht von 1938)</h4><ul><li>Erfahrung des Ersten Weltkriegs</li><li>Angst vor Luftangriffen auf Städte</li><li>Aufrüstung noch nicht abgeschlossen</li><li>Hoffnung auf begrenzte Ziele Hitlers</li></ul></div>
      <div><h4>Was dagegen sprach (schon 1938)</h4><ul><li>Belohnt Drohung und Gewalt</li><li>Die Tschechoslowakei saß nicht am Tisch</li><li>Deutschland wird stärker</li><li>Vertrauen kleiner Staaten schwindet</li></ul></div>
    </div>
  </div></section>`;
}

function landkarte(){
  const z = S.quiz.q2 || {}; const n = summe(z);
  const retro = n ? `${+z.A||0} von ${n} ordneten Hitlers interne Pläne von 1937 als „damals bekannt“ ein.` : "Quiz 1, Aussage 3: Wie viele hielten die internen Pläne von 1937 für damals bekannt?";
  const v = S.votes.v2; const d = v.r2 || v.r1;
  const persp = `Chamberlain: Katastrophe abgewendet · Attlee: Sieg der Gewalt · Churchill: Anfang der Abrechnung${summe(d)?` · unsere Klasse: A ${+d.A||0}, B ${+d.B||0}, C ${+d.C||0}`:""}`;
  const no = t => S.notizen.filter(x=>x.t===t).map(x=>`<li>${esc(x.x)}</li>`).join("");
  const T = (t, frage, auto) => { const nn = no(t); const leer = !auto && !nn;
    return `<div class="t ${leer?"leer":""}"><b>${t}</b><i>${frage}</i>${auto?`<p>${esc(auto)}</p>`:""}${nn?`<ul>${nn}</ul>`:""}${leer?"Wird im Gespräch gefüllt (Notiz mit Taste B).":""}</div>`; };
  return `<section class="lk"><h2>Kognitive Landkarte</h2>
    ${T("Retrospektivität","Was wissen wir heute, das die damaligen Beteiligten nicht wissen konnten?", retro)}
    ${T("Perspektivität","Warum konnten vernünftige Menschen dieselbe Situation unterschiedlich beurteilen?", persp)}
    ${T("Kontingenz","Welche anderen Entwicklungen erschienen damals möglich?")}
    ${T("Agency","Was konnten sie tun – und was schränkte ihre Handlungsmöglichkeiten ein?")}
    ${T("Sachurteil","Wie ist Appeasement unter den damaligen Voraussetzungen zu beurteilen?")}
    ${T("Werturteil","Welche Verantwortung bestand gegenüber Frieden, Bevölkerung und bedrohten Staaten?")}
  </section>`;
}

function start(){
  return `<section class="start">
    <div class="ort2">London, House of Commons · GGK M19</div>
    <h1>Frieden durch Zugeständnisse?</h1>
    <p class="leit">Warum setzte Großbritannien bis 1939 auf Appeasement – und wie gerecht ist unser heutiges Urteil darüber?</p>
    <div class="rolle">Sie sind Abgeordnete des britischen Unterhauses. Sie entscheiden über die britische Reaktion auf das Vorgehen des nationalsozialistischen Deutschlands. <b>Sie kennen den späteren Verlauf nicht.</b> Entscheiden Sie nur mit den Informationen, die Ihnen im jeweiligen Moment vorliegen.</div>
    <div class="karten"><span class="karte kA">A</span><span class="karte kB">B</span><span class="karte kC">C</span><span>Abgestimmt wird mit Stimmkarten – erst auf Zeichen hochhalten.</span></div>
  </section>`;
}

function ende(){
  return `<section class="start"><div class="ort2">Prototyp</div><h1>Ende des Prototyps</h1>
    <p class="leit">Die vollständige Fassung enthält zusätzlich die Ausgangslage, S1 Rheinland, S4 Prag, S5 Polen, den Rückblick mit Meinungsverlauf, Quiz 2 und die Sicherungsseite.</p></section>`;
}

/* ---------- Zeichnen ---------- */

function zeichnen(){
  if(ROLLE==="lehrkraft") return lehrerZeichnen();
  const sch = SCHRITTE[S.i]; let body = "", st = sch.st || null;
  if(sch.typ==="start") body = start();
  else if(sch.typ==="station") body = station(sch);
  else if(sch.typ==="quiz"){ st = "S2"; body = quiz(sch); }
  else if(sch.typ==="stopp") body = station(SCHRITTE.find(x=>x.id==="s3-e1"));
  else if(sch.typ==="muenchen") body = muenchen();
  else if(sch.typ==="ton") body = ton();
  else if(sch.typ==="zitate") body = zitate(sch);
  else if(sch.typ==="unterhaus") body = unterhaus();
  else if(sch.typ==="sicherung") body = sicherung();
  else if(sch.typ==="landkarte"){ st = "S3"; body = landkarte(); }
  else { st = "S3"; body = ende(); }
  const stopp = sch.typ==="stopp" ? `<div class="stopp" role="dialog" aria-label="Plenumsstopp"><h2>${esc(sch.text)}</h2><p>${esc(sch.unter)}</p></div>`
    : S.stoppAn ? `<div class="stopp" role="dialog" aria-label="Plenumsstopp"><h2>Stopp: Begründen und diskutieren</h2><p>Weiter mit der Leertaste.</p></div>` : "";
  $("#app").innerHTML = kopf(st) + `<main id="main">${body}</main>` + stopp + leiste(sch);
  verdrahten();
}

function leiste(sch){
  if(!S.leiste) return `<button class="zeige tbtn" id="bLeiste">Steuerung (H)</button>`;
  return `<nav class="leiste" aria-label="Lehrkraftsteuerung">
    <span class="pos">${S.i+1}/${SCHRITTE.length} · ${esc(sch.name)}</span>
    <button data-a="zurueck" title="Pfeil links">Zurück</button>
    <button data-a="weiter" title="Leertaste oder Pfeil rechts">Weiter</button>
    ${(sch.vot||sch.typ==="quiz")?`<button data-a="eintragen" title="E">Stimmen eintragen</button>`:""}
    <button data-a="stopp" title="P">Plenumsstopp</button>
    <button data-a="notiz" title="B">Notiz für Landkarte</button>
    <button data-a="landkarte" title="L">Landkarte</button>
    <button data-a="lehrer" title="Zweites Fenster für den Laptop">Lehrkraftfenster</button>
    <button data-a="leiste" title="H">Ausblenden</button>
  </nav>`;
}

/* ---------- Lehrkraftfenster ---------- */

let uhrT = null;
function lehrerZeichnen(){
  document.body.classList.add("lehrer");
  const sch = SCHRITTE[S.i], nx = SCHRITTE[S.i+1];
  const imp = (sch.imp||[]).map(t=>`<li>${esc(t)}</li>`).join("") || "<li class='meta'>Keine Impulse für diesen Schritt.</li>";
  $("#app").innerHTML = `<div class="lv">
    <div>
      <div class="meta">Lehrkraftfenster · Prototyp · Schritt ${S.i+1} von ${SCHRITTE.length}</div>
      <div class="jetzt">${esc(sch.name)}</div>
      <div class="meta">Als Nächstes: ${nx?esc(nx.name):"–"}</div>
      <div class="knoepfe">
        <button data-a="zurueck">Zurück</button>
        <button data-a="weiter" class="haupt">Weiter</button>
        ${(sch.vot||sch.typ==="quiz")?`<button data-a="eintragen">Stimmen eintragen</button>`:""}
        <button data-a="stopp">Plenumsstopp</button>
        <button data-a="notiz">Notiz für Landkarte</button>
        <button data-a="landkarte">Landkarte</button>
        <button data-a="ton">${S.ton?"Ton ausschalten":"Ton einschalten"}</button>
        <button data-a="reset">Alles zurücksetzen</button>
      </div>
      <h2>Impulse (sinngemäße Zuspitzungen)</h2><ul class="impulse">${imp}</ul>
    </div>
    <div>
      <div class="meta">Zeit seit Start</div><div class="uhr" id="uhr">–</div>
      <h2>Ablauf</h2><ol class="ablauf">${SCHRITTE.map((x,i)=>`<li class="${i===S.i?"akt":""}"><a href="#" data-sprung="${i}">${esc(x.name)}</a></li>`).join("")}</ol>
    </div></div>`;
  verdrahten();
  clearInterval(uhrT); uhrT = setInterval(()=>{ const u=$("#uhr"); if(u&&S.start){ const s=Math.floor((Date.now()-S.start)/1000); u.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); } }, 1000);
}

/* ---------- Aktionen ---------- */

function aktion(a){
  const sch = SCHRITTE[S.i];
  if(a==="weiter") setze(s=>{ if(s.stoppAn){ s.stoppAn=false; return; } if(!s.start) s.start = Date.now(); s.i = Math.min(SCHRITTE.length-1, s.i+1); });
  else if(a==="zurueck") setze(s=>{ s.stoppAn=false; s.i = Math.max(0, s.i-1); });
  else if(a==="stopp"){ if(sch.typ==="stopp") aktion("weiter"); else setze(s=>{ s.stoppAn = !s.stoppAn; }); }
  else if(a==="landkarte") setze(s=>{ s.i = SCHRITTE.findIndex(x=>x.id==="lk"); });
  else if(a==="ton") setze(s=>{ s.ton = !s.ton; });
  else if(a==="leiste") setze(s=>{ s.leiste = !s.leiste; });
  else if(a==="lehrer") window.open(location.pathname+"?rolle=lehrkraft","lagezentrum-lehrkraft","width=1100,height=760");
  else if(a==="eintragen") eintragen(sch);
  else if(a==="notiz") notiz();
  else if(a==="reset"){ if(confirm("Alle eingetragenen Stimmen und Notizen löschen und zum Start zurückkehren?")) setze(s=>Object.assign(s, LEER())); }
}

function verdrahten(){
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => aktion(b.dataset.a));
  document.querySelectorAll("[data-sprung]").forEach(b => b.onclick = e => { e.preventDefault(); const n=+b.dataset.sprung; setze(s=>{ s.i=n; }); });
  const t = $("#bTon"); if(t) t.onclick = () => aktion("ton");
  const v = $("#bVoll"); if(v) v.onclick = vollbild;
  const l = $("#bLeiste"); if(l) l.onclick = () => aktion("leiste");
}
function vollbild(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }

function dialog(html, ok){
  const d = $("#dlg"); d.innerHTML = `<form method="dialog">${html}<menu><button value="x">Abbrechen</button><button value="ok" class="haupt">Übernehmen</button></menu></form>`;
  d.onclose = () => { if(d.returnValue==="ok") ok(new FormData(d.querySelector("form"))); };
  d.showModal(); const f = d.querySelector("input,select,textarea"); if(f) f.focus();
}

function eintragen(sch){
  if(sch.typ==="quiz"){
    const k = "q"+sch.qi, z = S.quiz[k]||{};
    dialog(`<h3>Quiz 1 · Aussage ${sch.qi+1}: Karten zählen</h3><p class="hinweis">Schätzen genügt. Leer lassen, wenn nicht gezählt.</p>
      <div class="felder">${["A","B","C"].map(c=>`<label>${c} – ${KARTEN[c]}<input name="${c}" type="number" min="0" inputmode="numeric" value="${z[c]??""}"></label>`).join("")}</div>
      <div class="reihe"><label>Davon „sehr sicher“ (Handzeichen)<input name="sicher" type="number" min="0" value="${z.sicher??""}"></label></div>`,
      fd => setze(s=>{ s.quiz[k] = {A:fd.get("A"),B:fd.get("B"),C:fd.get("C"),sicher:fd.get("sicher")}; }));
    return;
  }
  if(sch.vot){
    const r = sch.runde, v = S.votes.v2, d = v[r]||{}, si = v.sicher||{};
    dialog(`<h3>Votum 2 · ${r==="r1"?"Runde 1":"Runde 2"}: Stimmkarten zählen</h3>
      <div class="felder">${["A","B","C"].map(c=>`<label>Karte ${c}<input name="${c}" type="number" min="0" inputmode="numeric" value="${d[c]??""}"></label>`).join("")}</div>
      <div class="reihe felder"><label>sehr sicher<input name="s" type="number" min="0" value="${si.s??""}"></label><label>eher sicher<input name="e" type="number" min="0" value="${si.e??""}"></label><label>unsicher<input name="u" type="number" min="0" value="${si.u??""}"></label></div>
      <div class="reihe"><label>Wichtigstes Argument (ein Satz)<input type="text" name="arg" maxlength="140" value="${esc(v.arg)}"></label></div>
      <div class="reihe"><label>Größte Sorge (ein Satz)<input type="text" name="sorge" maxlength="140" value="${esc(v.sorge)}"></label></div>`,
      fd => setze(s=>{ s.votes.v2[r] = {A:fd.get("A"),B:fd.get("B"),C:fd.get("C")}; s.votes.v2.sicher = {s:fd.get("s"),e:fd.get("e"),u:fd.get("u")}; s.votes.v2.arg = fd.get("arg"); s.votes.v2.sorge = fd.get("sorge");
        const erg = SCHRITTE.findIndex(x=>x.vot==="erg" && x.runde===r); if(SCHRITTE[s.i].vot==="offen") s.i = erg; }));
  }
}

function notiz(){
  dialog(`<h3>Notiz für die kognitive Landkarte</h3>
    <div class="reihe"><label>Begriff<select name="t">${["Retrospektivität","Perspektivität","Kontingenz","Agency","Sachurteil","Werturteil"].map(t=>`<option>${t}</option>`).join("")}</select></label></div>
    <div class="reihe"><label>Beobachtung aus dem Gespräch (ohne Namen)<textarea name="x" rows="3" maxlength="200"></textarea></label></div>`,
    fd => { const x = (fd.get("x")||"").trim(); if(x) setze(s=>{ s.notizen.push({t:fd.get("t"), x}); }); });
}

document.addEventListener("keydown", e => {
  if($("#dlg").open || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key;
  if(k==="ArrowRight"||k===" "||k==="PageDown"){ e.preventDefault(); aktion("weiter"); }
  else if(k==="ArrowLeft"||k==="PageUp"){ e.preventDefault(); aktion("zurueck"); }
  else if(k==="e"||k==="E") aktion("eintragen");
  else if(k==="p"||k==="P") aktion("stopp");
  else if(k==="b"||k==="B") aktion("notiz");
  else if(k==="l"||k==="L") aktion("landkarte");
  else if(k==="t"||k==="T") aktion("ton");
  else if(k==="h"||k==="H") aktion("leiste");
  else if(k==="f"||k==="F") vollbild();
});

zeichnen();
</script>
</body>
</html>
