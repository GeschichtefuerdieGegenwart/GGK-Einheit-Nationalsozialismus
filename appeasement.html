.de{font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.35;margin:.7rem 0 .15rem}

.prot section{border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.2rem;background:var(--surface)}

.weg-tab{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.95rem}
.weg-tab th,.weg-tab td{border-bottom:1px solid var(--line);padding:.6rem .5rem;text-align:left;vertical-align:top}
.weg-tab th{font-size:.82rem;color:var(--muted)}
.def-box{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.def-box div{border-radius:var(--r-lg);padding:1rem 1.1rem;background:var(--surface)}
.def-box b{font-family:var(--display);font-weight:600;font-size:1.15rem;display:block;margin-bottom:.2rem}
@media (max-width:640px){.def-box,.zahlen{grid-template-columns:1fr}}

.lk table{width:100%;border-collapse:collapse;font-size:.92rem;margin:1rem 0}
.lk th,.lk td{border-bottom:1px solid var(--line);padding:.55rem .5rem;text-align:left;vertical-align:top}

.tafel{background:#2F3B34;color:#F1EFE6;border-radius:var(--r-lg);padding:1.2rem 1.4rem;font-size:.95rem;overflow-x:auto}
.tafel table{min-width:40rem}
.tafel th,.tafel td{border-color:#56655C;color:#F1EFE6}
.tafel th{color:#C9D6CE}

@media print{
  .kopf,.fuss,.protokoll-btn,.nodruck{display:none!important}
  body{background:#fff;font-size:11pt}
  main{max-width:none;padding:0}
  .prot section{break-inside:avoid;background:#fff}
}

function kopf(){
  const i = SEITEN.findIndex(x=>x.id===S.seite);
  return `<header class="kopf"><div class="kopf-in">${MARK}<div class="titel">Der Weg zum Frieden oder in den Krieg?<small>M19 · Appeasement-Politik 1933–1939</small></div>

    <nav class="weg" aria-label="Bausteine">${SEITEN.map((x,k)=>{ const zu = x.stufe > S.stufe;
      return `<button class="${x.id===S.seite?"akt":(i>=0&&k<i)?"da":""} ${zu?"zu":""}" data-geh="${x.id}" ${zu?'aria-disabled="true"':""} ${x.id===S.seite?'aria-current="step"':""}><b>${x.nr?"Baustein "+x.nr:"&nbsp;"}</b>${x.kurz}</button>`; }).join("")}</nav></header>`;
}

function meldungen(id, liste){
  const n = S.m[id] ?? 1;
  const li = liste.slice(0, n).map(t=>`<li>${t}</li>`).join("");
  const mehr = n < liste.length ? `<div class="mehr"><button class="btn" data-meld="${id}">Nächste Meldung (${n} von ${liste.length})</button></div>` : "";
  return `<ol class="meld">${li}</ol>${mehr}`;
}
const alleGelesen = (id, liste) => (S.m[id] ?? 1) >= liste.length;

function bereit(key){ const b = S[key+"b"] || ""; return !!(S.v[key] && b.trim().length >= 10 && (key!=="e1" || S.prog)); }

function entscheidung(key, E, nr, datum){
  const v = S.v[key], fertig = !!S.e[key];
  const opts = ["A","B","C"].map(k=>`<button class="opt" data-opt="${key}:${k}" aria-pressed="${v===k}" ${fertig?"disabled":""}><span class="k">${k}</span><span><b>${esc(E.opt[k].t)}</b><span class="cr">${esc(E.opt[k].cr)}</span></span></button>`).join("");
  let h = `<section class="entscheidung" aria-labelledby="h-${key}"><div class="kopfzeile">Entscheidung ${nr} von 3 · ${datum}</div>
    <h2 id="h-${key}">${esc(E.frage)}</h2>
    <p class="hinweis">Die drei Optionen sind didaktisch zugespitzt. Sie entsprechen Positionen, die damals in London diskutiert wurden.</p>
    ${opts}`;
  if(key==="e1") h += `<p class="frage">Glauben Sie, dass Deutschland danach Ruhe gibt?</p>
    <div class="seg">${["ja","nein","weiß nicht"].map(x=>`<button data-prog="${x}" aria-pressed="${S.prog===x}" ${fertig?"disabled":""}>${x}</button>`).join("")}</div>`;
  h += `<p class="frage">Begründen Sie Ihre Entscheidung in einem Satz.</p>
    <textarea data-begr="${key}" ${fertig?"readonly":""} placeholder="Ich entscheide mich so, weil …">${esc(S[key+"b"]||"")}</textarea>`;
  if(!fertig) h += `<div class="fuss"><span class="hinweis" data-status="${key}">${bereit(key)?"Bereit zur Abstimmung.":"Option wählen und einen Satz schreiben."}</span><button class="btn green" data-abgabe="${key}" ${bereit(key)?"":"disabled"}>Entscheidung abgeben</button></div>`;
  else h += `<div class="fuss"><span class="hinweis">Ihre Entscheidung: <b>${v}</b>. Gleich stimmt die Klasse ab.</span><button class="btn green" data-karte="${key}">Stimmkarte zeigen</button></div>`;
  return h + `</section>`;
}

function codeFeld(key, stufe){
  if(S.stufe >= stufe) return "";
  if(!S.e[key]) return `<div class="gesperrt"><b>Wie es weitergeht, erfahren Sie nach der Abstimmung.</b></div>`;
  return `<div class="gesperrt nodruck"><b>Abstimmung in der Klasse</b><p class="hinweis">Halten Sie Ihre Stimmkarte hoch, wenn die Lehrkraft das Zeichen gibt. Übertragen Sie danach das Tafelbild ins <a href="#" data-geh="protokoll">Protokoll</a>. Das Codewort steht an der Tafel.</p>

}

function seite(){

    const L = [
      "M6 · Das Deutsche Reich fordert den Anschluss der Freien Stadt Danzig und exterritoriale Verkehrswege durch den polnischen „Korridor“ nach Ostpreußen. Polen lehnt ab; die Spannungen wachsen.",
      "Im August 1939 melden deutsche Zeitungen und Rundfunk fast täglich angebliche polnische Grenzverletzungen und Gewalt gegen die deutsche Minderheit. Am 23. August schließen Deutschland und die Sowjetunion einen Nichtangriffspakt – in London und Paris eine Überraschung.",
      "Am 1. September 1939 eröffnet das Linienschiff „Schleswig-Holstein“ das Feuer auf die Westerplatte bei Danzig; die Wehrmacht greift Polen an. Am 3. September läuft ein britisches Ultimatum ab: Großbritannien und Frankreich erklären Deutschland den Krieg."
    ];
    const da = alleGelesen("b5", L);
    return `<section class="seite"><div class="zeit"><span class="nr">Baustein 5</span><span>August und September 1939</span></div>
      <h1>Der Angriff auf Polen</h1>
      ${meldungen("b5", L)}
      ${da ? `<div class="aufl"><div class="kopfzeile">Was dann geschah · September 1939</div><ul>
        <li>Die Wehrmacht führt den Krieg vom ersten Tag an mit großer Härte. Deutsche Truppen, Einsatzkommandos von Polizei und SS ermorden eine große Zahl polnischer Zivilisten und Kriegsgefangener (M6).</li>
        <li>Am 17. September marschiert auch die Sowjetunion in Polen ein. Beide Staaten teilen das Land unter sich auf.</li></ul></div>
      <div class="spaeter"><div class="kopfzeile">Nachträgliches Wissen – in London 1939 unbekannt</div>
        <ul style="padding-left:1.2rem;display:grid;gap:.35rem">
        <li>Schon am 5. November 1937 hatte Hitler vor der Militärführung erklärt, Österreich und die Tschechoslowakei bei günstiger Gelegenheit überwältigen zu wollen (Hoßbach-Niederschrift).</li>
        <li>Im August 1936 forderte Hitler in einer geheimen Denkschrift zum Vierjahresplan (M7): „I. Die deutsche Armee muß in 4 Jahren einsatzfähig sein. II. Die deutsche Wirtschaft muß in 4 Jahren kriegsfähig sein.“ <span class="hinweis">(zit. nach Lautemann/Schlenke, Geschichte in Quellen, 1961, S. 321 f.)</span></li>
        <li>Am 3. April 1939 ließ er den Angriff auf Polen vorbereiten (Weisung „Fall Weiß“): Er sollte ab dem 1. September 1939 jederzeit möglich sein.</li>
        <li>Ein geheimes Zusatzprotokoll zum Pakt vom 23. August teilte Ostmitteleuropa in deutsche und sowjetische Interessensphären auf.</li></ul>
        <p class="hinweis" style="margin-top:.5rem">Diese Dokumente wurden erst nach dem Krieg bekannt, unter anderem im Nürnberger Prozess 1945/46.</p></div>
      ${weiter("ende","Weiter zur Beurteilung")}` : ""}</section>`;
  }

  if(id==="ende"){
    const row = (t, du, tat) => `<tr><td>${t}</td><td>${du}</td><td>${tat}</td></tr>`;
    return `<section class="seite"><div class="zeit"><span>Konsolidierung</span></div>
      <h1>Ihre abschließende Beurteilung</h1>
      <p class="lead">Vergleichen Sie Ihre Entscheidungen von damals mit dem, was tatsächlich geschah.</p>
      <table class="weg-tab"><thead><tr><th>Zeitpunkt</th><th>Sie</th><th>Was geschah</th></tr></thead><tbody>
      ${row("März 1936 · Rheinland", `${S.v.e1||"–"}${S.prog?` · Prognose „Ruhe?“: ${esc(S.prog)}`:""}`, "Protest, keine Sanktionen, kein Eingreifen")}
      ${row("März 1938 · „Anschluss“", S.skala?`Erfolg der Politik: ${S.skala} von 6`:"–", "Protest, kein Eingreifen")}
      ${row("September 1938 · Sudeten", S.v.e2||"–", "Münchner Abkommen: Abtretung, angekündigte Garantie")}
      ${row("März 1939 · Prag", `${S.v.e3||"–"}${S.erf?` · Erwartung: ${esc(S.erf)}`:""}`, "Garantie für Polen, Wehrpflicht, Verhandlungen mit der UdSSR ohne Ergebnis")}
      ${row("September 1939", "–", "Angriff auf Polen; Kriegserklärung am 3. September")}
      </tbody></table>
      <div class="def-box"><div><b>Retrospektivität</b>Wir blicken zurück und kennen den Ausgang. Das ist unvermeidlich und notwendig: Erst im Rückblick werden Folgen und geheime Pläne sichtbar.</div>
        <div><b>Rückschaufehler</b>Wer den Ausgang kennt, hält ihn leicht für vorhersehbar oder unvermeidlich („Das hätte man doch wissen müssen“). Dann wird die damalige Unsicherheit unterschätzt.</div></div>
      <div class="auftrag"><h3>Nachdenken, bevor Sie urteilen</h3><p>Wo haben Sie mit Wissen entschieden, das 1936–1939 niemand hatte? Welche Kritik an Appeasement bleibt trotzdem – auch mit dem Wissen von damals?</p></div>
      <h2 class="abschnitt">Urteilsaufgabe</h2>
      <p>Beurteilen Sie den Erfolg der Appeasement-Politik. Vergleichen Sie dazu die Beweggründe und Ziele dieser Politik mit ihren tatsächlichen Folgen in den Krisen 1933–1939. Unterscheiden Sie dabei, was man damals wissen konnte und was wir heute wissen.</p>
      <p class="hinweis" style="margin-top:.6rem">Schreiben Sie Ihr Urteil in GoodNotes oder ins Heft. Die <a href="docs/M19_Faktensicherung.pdf" target="_blank" rel="noopener">Faktensicherung (PDF, 2 Seiten)</a> hilft Ihnen dabei.</p>
      <div class="fuss nodruck"><span class="hinweis">Ihr Protokoll können Sie ausdrucken oder als PDF sichern.</span><button class="btn" data-geh="protokoll">Zum Protokoll</button></div></section>`;
  }

  if(id==="protokoll") return protokoll();
  return "";
}

function klasse(key){ const p = S.prot[key]||{}; const a=+p.A||0,b=+p.B||0,c=+p.C||0; return (a+b+c) ? `${a+b} : ${c}` : "–"; }

function protokoll(){
  const block = (key, titel, E, tat, stufe) => { const p = S.prot[key]||{};
    return `<section><h3>${titel}</h3><p class="hinweis">${esc(E.frage)} · Ihre Wahl: <b>${S.v[key]||"–"}</b></p>
      <div class="drei">${["A","B","C"].map(k=>`<label>${k} – Stimmen<input type="number" min="0" inputmode="numeric" data-prot="${key}:${k}" value="${esc(p[k]??"")}"></label>`).join("")}</div>
      <label>Stärkstes Argument der Mehrheit<input type="text" data-prot="${key}:arg" value="${esc(p.arg||"")}"></label>
      <label style="margin-top:.5rem">Stärkstes Gegenargument<input type="text" data-prot="${key}:gegen" value="${esc(p.gegen||"")}"></label>
      <div class="tat"><b>Was London tat:</b> ${S.stufe>=stufe ? tat : "<span class='hinweis'>erscheint nach der Abstimmung</span>"}</div></section>`; };
  return `<section class="seite"><div class="zeit"><span>Protokoll · Übertrag von der Tafel</span></div>
    <h1>Unsere Entscheidungen</h1>
    <p class="lead">Tragen Sie nach jeder Abstimmung das Ergebnis und die zentralen Argumente aus dem Tafelbild ein.</p>
    <div class="prot">
      ${block("e1","Entscheidung 1 · März 1936",E1,"Protest, aber keine Sanktionen und kein militärisches Eingreifen; das Rheinland bleibt besetzt.",1)}
      ${block("e2","Entscheidung 2 · September 1938",E2,"Münchner Abkommen: Abtretung des Sudetengebiets, angekündigte Garantie für die übrige Tschechoslowakei.",2)}
      ${block("e3","Entscheidung 3 · März 1939",E3,"Garantie für Polen (31.3.1939), Einführung der Wehrpflicht, Verhandlungen mit der Sowjetunion ohne Ergebnis.",3)}
    </div>
    <div class="fuss nodruck"><button class="btn" data-geh="${S.zurueck||"start"}">Zurück zum Baustein</button><button class="btn primary" onclick="print()">Drucken oder als PDF sichern</button></div></section>`;
}

function stimmkarte(){
  const key = S.karte, k = S.v[key] || "?", E = {e1:E1,e2:E2,e3:E3}[key];
  return `<div class="stimmkarte" role="dialog" aria-label="Stimmkarte"><button class="zu" data-karte="">Schließen</button>
    <div class="gross">${k}</div><p>${esc(E && E.opt[k] ? E.opt[k].t : "")}</p><p style="font-size:1rem;opacity:.8">Hochhalten, wenn die Lehrkraft das Zeichen gibt.</p></div>`;
}

function zeichne(){
  $("#app").innerHTML = kopf() + `<main>${seite()}</main>` + (S.karte ? stimmkarte() : "");
  verdrahten();
}

window.bildFehler = img => {
  if(img.dataset.alt2){ const u=img.dataset.alt2; delete img.dataset.alt2; img.src=u; return; }
  const d=document.createElement("div"); d.className="bildfehlt"; d.textContent="Bild nicht geladen (kein Internet). Bildbeschreibung: "+img.alt; img.replaceWith(d);
};

function verdrahten(){
  document.querySelectorAll("[data-geh]").forEach(b=>b.onclick=e=>{ e.preventDefault(); const z=b.dataset.geh; const s=SEITEN.find(x=>x.id===z);
    if(s && s.stufe > S.stufe) return; setze(x=>{ if(z==="protokoll" && x.seite!=="protokoll") x.zurueck=x.seite; x.seite=z; }); scrollTo(0,0); });
  document.querySelectorAll("[data-meld]").forEach(b=>b.onclick=()=>setze(x=>{ const k=b.dataset.meld; x.m[k]=(x.m[k]??1)+1; }));
  document.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>setze(x=>{ const i=+b.dataset.vt; x.vt=x.vt||[]; x.vt = x.vt.includes(i) ? x.vt.filter(y=>y!==i) : [...x.vt,i]; }));
  document.querySelectorAll("[data-pruefen]").forEach(b=>b.onclick=()=>setze(x=>{ x.vtOk=true; }));
  document.querySelectorAll("[data-sorge]").forEach(b=>b.onclick=()=>setze(x=>{ x.sorge=b.dataset.sorge; }));
  const st=$("[data-sorget]"); if(st) st.oninput=()=>{ S.sorgeT=st.value; speichere(); };
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{ const [k,o]=b.dataset.opt.split(":"); setze(x=>{ x.v[k]=o; }); });
  document.querySelectorAll("[data-begr]").forEach(t=>{ t.oninput=()=>{ const k=t.dataset.begr; S[k+"b"]=t.value; speichere();
    const btn=$(`[data-abgabe="${k}"]`), stt=$(`[data-status="${k}"]`); if(btn){ btn.disabled=!bereit(k); stt.textContent = bereit(k)?"Bereit zur Abstimmung.":"Option wählen und einen Satz schreiben."; } }; });
  document.querySelectorAll("[data-prog]").forEach(b=>b.onclick=()=>setze(x=>{ x.prog=b.dataset.prog; }));
  document.querySelectorAll("[data-abgabe]").forEach(b=>b.onclick=()=>setze(x=>{ x.e[b.dataset.abgabe]=true; x.karte=b.dataset.abgabe; }));
  document.querySelectorAll("[data-karte]").forEach(b=>b.onclick=()=>setze(x=>{ x.karte=b.dataset.karte||null; }));
  document.querySelectorAll("[data-skala]").forEach(b=>b.onclick=()=>setze(x=>{ x.skala=+b.dataset.skala; }));
  document.querySelectorAll("[data-erf]").forEach(b=>b.onclick=()=>setze(x=>{ x.erf=b.dataset.erf; }));
  document.querySelectorAll("[data-code]").forEach(b=>{ const [k,stufe]=b.dataset.code.split(":"); const inp=$("#code-"+k);
    const pr=()=>{ const v=(inp.value||"").trim().toUpperCase(); if(v===CODES[k]) setze(x=>{ x.stufe=Math.max(x.stufe,+stufe); }); else $("#f-"+k).textContent="Das Codewort passt nicht. Schauen Sie an die Tafel."; };
    b.onclick=pr; inp.onkeydown=e=>{ if(e.key==="Enter") pr(); }; });
  document.querySelectorAll("[data-prot]").forEach(i=>i.oninput=()=>{ const [k,f]=i.dataset.prot.split(":"); S.prot[k]=S.prot[k]||{}; S.prot[k][f]=i.value; speichere(); });
}

/* ---------------------------- Lehrkraft ----------------------------- */
function lehrkraft(){
  document.title = "M19 Appeasement – Lehrkraft";
  $("#app").innerHTML = `<header class="kopf"><div class="kopf-in">${MARK}<div class="titel">M19 · Appeasement – Hinweise für die Lehrkraft<small>Ablauf, Codewörter, Tafelbild</small></div><a class="protokoll-btn" href="appeasement.html" style="text-decoration:none;color:inherit">Schüleransicht</a></div></header>
  <main class="lk" style="max-width:62rem">
    <h1 style="font-size:2rem;margin-bottom:.6rem">Ablauf (Vorschlag für 90 Minuten)</h1>

      <tr><td>0–5</td><td>Einstieg</td><td>Rolle lesen</td><td>Leitfrage an die Tafel; Regel: nur damaliges Wissen</td><td>Leitfrage</td></tr>
      <tr><td>5–17</td><td>1 Was bedroht uns?</td><td>Vertragsbrüche prüfen (1.1), Verunsicherung wählen (1.2)</td><td>kurze Rückfrage: Was beunruhigt Sie?</td><td>–</td></tr>
      <tr><td>17–32</td><td>2 Was tun wir?</td><td>Meldungen, <b>Entscheidung 1</b>, Prognose, Begründung</td><td>Abstimmung, zwei Begründungen je Seite, Gegenfragen; Codewort</td><td>Tafel, Zeile 1</td></tr>
      <tr><td>32–40</td><td>3 „Anschluss“</td><td>Meldungen, Skala 3.2</td><td>Skala per Handzeichen kurz abfragen</td><td>–</td></tr>
      <tr><td>40–60</td><td>4 Sudetenfrage</td><td>Meldungen, Foto, <b>Entscheidung 2</b>; nach dem Codewort München, Originalton, Unterhaus</td><td>Abstimmung, Debatte, Codewort, Vergleich mit 366 : 144</td><td>Tafel, Zeile 2</td></tr>
      <tr><td>60–72</td><td>4 März 1939</td><td>Meldungen, <b>Entscheidung 3</b>, nach dem Codewort Abgleich 4.3</td><td>Abstimmung, Codewort</td><td>Tafel, Zeile 3</td></tr>
      <tr><td>72–78</td><td>5 Polen</td><td>Meldungen, Kasten „Nachträgliches Wissen“</td><td>Unterscheidung damals / später</td><td>–</td></tr>
      <tr><td>78–90</td><td>Konsolidierung</td><td>eigener Weg, Begriffe, Urteil beginnen</td><td>Retrospektivität und Rückschaufehler; Faktensicherung ausgeben</td><td>Begriffe unter dem Tafelbild; Urteil als Hausaufgabe</td></tr>
    </tbody></table>
    <h2 style="font-size:1.5rem;margin:2rem 0 .4rem">Codewörter (erst nach der Abstimmung an die Tafel)</h2>

    <h2 style="font-size:1.5rem;margin:2rem 0 .6rem">Tafelbild (wächst über die Stunde)</h2>
    <div class="tafel"><table><thead><tr><th>Entscheidung</th><th>A</th><th>B</th><th>C</th><th>stärkstes Argument der Mehrheit</th><th>stärkstes Gegenargument</th><th>Was London tat</th></tr></thead><tbody>
      <tr><td>1 · März 1936: Rheinland</td><td></td><td></td><td></td><td></td><td></td><td>Protest, kein Eingreifen</td></tr>
      <tr><td>2 · Sept. 1938: Sudeten</td><td></td><td></td><td></td><td></td><td></td><td>Münchner Abkommen</td></tr>
      <tr><td>3 · März 1939: Prag</td><td></td><td></td><td></td><td></td><td></td><td>Garantie für Polen</td></tr>
    </tbody></table><p style="margin-top:.8rem">Am Ende darunter: <b>Retrospektivität</b> (berechtigter Rückblick) ↔ <b>Rückschaufehler</b> („Das hätte man wissen müssen“).</p></div>
    <h2 style="font-size:1.5rem;margin:2rem 0 .4rem">Erhebung des Klassenergebnisses</h2>
    <p>Die iPads sind nicht vernetzt; es gibt keine automatische Auswertung. Nach „Entscheidung abgeben“ zeigt jedes iPad die gewählte Option als große Stimmkarte. Auf Ihr Zeichen halten alle gleichzeitig hoch, Sie zählen A, B, C und schreiben die Zahlen an. Ersatz ohne iPad: Handzeichen.</p>
    <h2 style="font-size:1.5rem;margin:2rem 0 .4rem">Gegenfragen (sinngemäße Zuspitzungen)</h2>
    <ul style="padding-left:1.2rem;display:grid;gap:.35rem">

      <li>Entscheidung 2: „Wären Sie bereit, einen Angehörigen für das Sudetengebiet in den Krieg zu schicken?“ (hypothetisch, keine Antwortpflicht) · „Welche Verantwortung tragen Sie gegenüber der Tschechoslowakei, die nicht mit am Tisch sitzt?“</li>
      <li>Entscheidung 3: „Wissen Sie sicher, was Hitler als Nächstes tut?“ · „Ab wann wird Nachgeben selbst zur Gefahr?“</li>
      <li>Konsolidierung: „Wann hätte man Hitler stoppen sollen?“ – und dann: „Woher wissen Sie das?“</li></ul>

      <tr><td>M2 Umgang mit Vertragsbrüchen</td><td>Baustein 2, Meldung 3</td><td>Georg-V.-Zitat nur als Überlieferung („soll gesagt haben“). Handschlag-Foto Chamberlain/Hitler stammt von 1938 – nicht zu 1935/36 zeigen.</td></tr>
      <tr><td>M3 „Anschluss“ 1938</td><td>Baustein 3, Meldungen 1–2 + Hinweis vor 3.2</td><td>Heldenplatz-Foto (Propagandabild) nur mit Quellenkritik.</td></tr>
      <tr><td>M4 Sudetenkrise</td><td>Baustein 4, Meldung 2; Auflösung</td><td>Überschrift „1939“ → <b>1938</b>. „garantierten den Bestand“ → Garantie nur in Aussicht gestellt, nie vollzogen. Expansionskarte zeigt Ausgänge: erst nach Entscheidung 3.</td></tr>
      <tr><td>M5 Reaktionen</td><td>Baustein 4b, Auflösung</td><td>–</td></tr>
      <tr><td>M6 Angriff auf Polen</td><td>Baustein 5, Meldungen + „Was dann geschah“</td><td>Kriegserklärung erst am <b>3.9.</b> (Ultimatum), nicht „mit dem Angriff“. Schlagbaum-Foto ist inszeniertes Propagandabild.</td></tr>
      <tr><td>M7 Vierjahresplan 1936</td><td>Baustein 5, Kasten „Nachträgliches Wissen“</td><td>Denkschrift war geheim – zeitgenössisch nicht bekannt, daher nur im Rückblick. Titelblatt-Abbildung nicht übernommen.</td></tr>
      <tr><td>Video „Hitlers Außenpolitik einfach erklärt“</td><td>–</td><td>Nur Konsolidierung oder Hausaufgabe; zeigt Ausgänge vorweg.</td></tr>
    </tbody></table></div>
    <p class="hinweis" style="margin-top:2rem">Material: <a href="docs/M19_Faktensicherung.pdf">Faktensicherung (PDF, 2 Seiten)</a> – erst in der Konsolidierung ausgeben. <a href="#" id="reset">Antworten auf diesem Gerät löschen</a>.</p>
  </main>`;
  $("#reset").onclick=e=>{ e.preventDefault(); if(confirm("Alle Antworten auf diesem Gerät löschen?")){ try{localStorage.removeItem(KEY);}catch(x){} location.href="appeasement.html"; } };
}

if(new URLSearchParams(location.search).get("ansicht")==="lehrkraft") lehrkraft(); else zeichne();
</script>
