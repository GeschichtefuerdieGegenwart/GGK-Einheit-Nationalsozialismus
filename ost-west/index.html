<meta name="description" content="GGK Jahrgangsstufe 2: Der Ost-West-Konflikt 1945–1991. Zeitraster mit 16 Ereigniskarten, Ordnen, Vernetzen, Glossar und roter Faden.">
<link rel="stylesheet" href="../assets/gegenwart/bundle.css">
<style>

/* Schriften lokal im Repository (SIL Open Font License) */
@font-face{font-family:"Fraunces";src:url(../assets/fonts/Fraunces72pt-SemiBold.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Fraunces";src:url(../assets/fonts/Fraunces72pt-SemiBoldItalic.woff) format("woff");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(../assets/fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(../assets/fonts/AtkinsonHyperlegible-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(../assets/fonts/AtkinsonHyperlegible-Italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
/* Bewusst nur hell (Beamer, Druck), wie M18–M22. Farben und Formen aus dem Designsystem GGK-Labor.
   Die Bausteine von »Gegenwart« (assets/gegenwart/) laufen über Tokens – hier auf die Farben des GGK-Labors gesetzt. */
:root{
  color-scheme:light;
  --bg:#F3EFE7; --surface:#FAF8F3; --surface2:#FFFDF8; --offset:#E9E2D7; --line:#D5CEC3; --border:rgba(36,34,31,.14);
  --ink:#24221F; --muted:#5F5C56; --faint:#6A655E; --inverse:#FFFAF2; --dunkel:#1B1A17;
  --red:#9B402D; --red-hi:#EAD7CF; --green:#2E5A47; --green-hi:#D6E4DC; --gold:#7D5C12; --gold-hi:#EEE2BF;
  --kuli:#1E4FB5; --kuli-hi:#DCE5F7; --slate:#4B4F57; --slate-hi:#DFE1E5; --marker:#F3D54E;
  /* Säulenfarben (sechs, aus der GGK-Palette abgeleitet) */
  --s-inst:#2E5A47; --s-kult:#7D5C12; --s-sozi:#1E4FB5; --s-geo:#4B6F8F; --s-pol:#9B402D; --s-takt:#4B4F57;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:.75rem; --r-lg:1rem; --ease:cubic-bezier(.23,1,.32,1);
  /* Gegenwart-Tokens → GGK-Labor */
  --grund:var(--bg); --flaeche:var(--surface); --karton:var(--offset); --text:var(--ink); --leise:var(--muted); --stahl:#8F887D; --linie:var(--line);
  --petrol:var(--green); --petrol-hi:var(--green-hi); --auf-petrol:var(--inverse);
  --honig:var(--gold); --honig-hi:var(--gold-hi); --honigplatte:var(--gold-hi); --auf-honig:var(--ink);
  --ueberdruck:var(--slate); --auf-ueberdruck:var(--inverse);
  --oxid:var(--red); --oxid-hi:var(--red-hi);
  --erfolg:var(--green); --erfolg-hi:var(--green-hi); --warnung:var(--gold); --warnung-hi:var(--gold-hi); --fehler:var(--red); --fehler-hi:var(--red-hi);
  --font-display:var(--display); --font-stimme:var(--display); --font-text:var(--body);
  --radius-sm:.6rem; --radius-md:.75rem; --radius-pill:999px; --radius-none:0;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:28px;
  --knopf-hoehe:48px; --tablet-ziel:56px; --platte:6px 6px 0 0 var(--karton); --platte-knopf:4px 4px 0 0 var(--karton); --fokus-innen:inset 0 0 0 2px var(--grund);
  --dauer-druck:100ms; --dauer-schnell:140ms; --dauer-mittel:220ms; --dauer-langsam:300ms; --dauer-staffel:30ms; --dauer-wende:460ms; --dauer-aufdecken:420ms; --dauer-reihe:440ms; --dauer-aus:150ms;
  --kurve-aus:cubic-bezier(.23,1,.32,1); --kurve-beidseits:cubic-bezier(.77,0,.175,1); --kurve-feder:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea,[tabindex]{scroll-margin-top:140px}
html{-webkit-text-size-adjust:none;text-size-adjust:none;overflow-x:clip}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1rem,.95rem + .25vw,1.125rem);line-height:1.58;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.14;text-wrap:balance}
p,li{text-wrap:pretty}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--kuli);outline-offset:3px;border-radius:.35rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:1ms!important}}
html[data-bewegung=weniger] *,html[data-bewegung=weniger] *::before,html[data-bewegung=weniger] *::after{animation:none!important;transition-duration:1ms!important}
@keyframes auf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.g{background:transparent;font-size:inherit;line-height:inherit}
.g .g-frage{font-size:clamp(1.2rem,1.05rem + .7vw,1.5rem)}
.g .g-knopf{min-height:48px}
.g-wahl legend{font-weight:700;font-family:var(--body);font-style:normal;font-size:1.05rem}
.g .g-option span{font-weight:700}
.g .g-option__urteil{font-weight:400;font-style:normal;font-size:.95rem;padding:0;border:0;min-height:0;background:transparent;box-shadow:none}
.g .g-option span span::before,.g .g-option span span::after{display:none!important}
.g .g-balken__zeile{grid-template-columns:minmax(6.5rem,10rem) 1fr 4.2rem}
.g .g-schieber{max-width:none}
.g .g-schieber>label{display:grid;gap:.2rem}.g .g-schieber input[type=range]{width:100%;accent-color:var(--kuli);height:32px}
.g .g-schieber__buehne{aspect-ratio:auto;min-height:14rem}
.g .g-schieber__vor,.g .g-schieber__nach{padding:2.6rem 1.2rem 1.2rem}
.g .g-schieber__vor p,.g .g-schieber__nach p{font-size:.98rem}
.g .g-schieber__vor .zahl,.g .g-schieber__nach .zahl{font:600 2.2rem/1 var(--display)}
.g .g-zeit{padding-top:34px}
@media (max-width:640px){.g .g-zeit{grid-auto-flow:row;grid-auto-columns:auto;gap:var(--space-3)}.g .g-zeit::before{display:none}}
.g .g-schalter input{margin:0}

/* Kopf mit Lernweg */
.kopf{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.kopf-in{max-width:1100px;margin:auto;padding:.55rem max(1.25rem,env(safe-area-inset-right,0px)) .55rem max(1.25rem,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:.6rem .9rem;flex-wrap:wrap}
.mark{width:32px;height:32px;flex:0 0 auto}
.titel{font-weight:700;line-height:1.2;margin-right:auto}.titel small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.pill{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:.45rem 1rem;font-weight:700;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.weg{max-width:1100px;margin:auto;padding:0 1.25rem .6rem;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none}
.weg button{flex:1 0 auto;min-width:7.4rem;border:0;border-top:3px solid var(--line);background:transparent;text-align:left;padding:.45rem .5rem .2rem;color:var(--faint);font-size:.85rem;line-height:1.25;min-height:48px}
.weg button b{display:block;color:inherit;font-size:.78rem}
.weg button.da{color:var(--muted);border-top-color:var(--muted)}
.weg button.akt{color:var(--ink);border-top-color:var(--red)}

main{max-width:46rem;margin:auto;padding:clamp(1.5rem,4vw,3rem) max(1.25rem,env(safe-area-inset-right,0px)) 5rem max(1.25rem,env(safe-area-inset-left,0px))}
main.breit{max-width:62rem}
.zeit{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;color:var(--red);font-weight:700;font-size:.95rem}
.zeit .nr{font-family:var(--display);font-size:1.1rem}
h1{font-size:clamp(2rem,1.4rem + 2.4vw,3.1rem);margin:.5rem 0 .7rem}
.leitfrage{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(1.35rem,1.1rem + .9vw,1.8rem);color:var(--muted);margin-bottom:1.4rem}
.lead{font-size:clamp(1.1rem,1rem + .5vw,1.28rem);color:var(--muted);margin-bottom:1.4rem}
h2.abschnitt{font-size:1.45rem;margin:2.2rem 0 .7rem}
h3.klein{font-size:1.15rem;margin:1.4rem 0 .4rem}
p+p{margin-top:.7rem}
.auftrag{background:var(--ink);color:var(--inverse);border-radius:var(--r-lg);padding:1.2rem 1.4rem;margin:1.5rem 0 1.1rem}
.auftrag h3{font-size:1.2rem;margin-bottom:.35rem}
.auftrag p{color:#DCD5CA}
.auftrag .form{display:inline-block;font-weight:700;color:var(--marker);font-size:.9rem;margin-bottom:.2rem}
.hinweis{font-size:.9rem;color:var(--muted)}
.belastend{border-left:6px solid var(--gold);background:var(--gold-hi);padding:.75rem 1rem;border-radius:0 .5rem .5rem 0;margin:1rem 0}
.merksatz{font-family:var(--display);font-weight:600;font-size:1.25rem;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:.7rem 0;margin:1.4rem 0;text-align:center}
.btn{min-height:48px;border:1px solid var(--border);border-radius:var(--r);padding:.6rem 1.2rem;background:var(--surface2);font-weight:700;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{background:var(--offset)}
.btn.primary{background:var(--red);color:var(--inverse);border-color:transparent}
.btn.primary:hover{background:#86361f}
.btn.dunkel{background:var(--ink);color:var(--inverse);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.reihe{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}
.fuss{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--line);margin-top:2.2rem;padding-top:1.3rem;flex-wrap:wrap}
label{font-weight:700;display:block}
textarea{width:100%;min-height:5rem;border:1.5px solid var(--border);border-radius:var(--r);padding:.7rem .9rem;background:var(--surface2);resize:vertical;margin-top:.35rem}
.feldgruppe{display:grid;gap:1rem;margin-top:1rem}
.karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.3rem}
.karte+.karte{margin-top:1rem}
.kennung{font-weight:700;color:var(--red);font-size:.88rem;margin-bottom:.3rem}
.quelle{font-size:.85rem;color:var(--muted);margin-top:.6rem;line-height:1.4}
.quelle a{color:var(--muted)}
blockquote{margin:.8rem 0;padding:.7rem 1rem;border-left:5px solid var(--kuli);background:var(--kuli-hi);border-radius:0 .5rem .5rem 0;font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.35}
blockquote .wer{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted);margin-top:.35rem}
details.hilfe{margin-top:.8rem;border:1.5px dashed var(--line);border-radius:.6rem;padding:.4rem .8rem}
details.hilfe summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
details.hilfe p{margin:.3rem 0 .4rem}
.status{display:inline-block;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:.35rem;background:var(--slate-hi);color:var(--slate);margin-right:.3rem}
.status.beleg{background:var(--green-hi);color:var(--green)}
.status.modell{background:var(--gold-hi);color:var(--gold)}
.aufdeck{margin-top:1rem;background:var(--offset);border-radius:var(--r-lg);padding:1rem 1.2rem}
.aufdeck.neu{animation:auf 360ms var(--ease) both}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
@media (max-width:640px){.zwei{grid-template-columns:1fr}}
.zwei .alt{background:var(--offset);border-radius:.6rem;padding:.8rem 1rem;min-width:0}

.band{position:relative;background:var(--dunkel);color:var(--inverse);border-radius:var(--r-lg);overflow:hidden;margin:0 0 1.6rem;min-height:9rem;display:grid;grid-template-columns:minmax(0,1fr)}
.band.mit{grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:15rem}
@media (max-width:640px){.band.mit{grid-template-columns:1fr}}
.band .bt{padding:1.3rem 1.4rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem}
.band .bt .ob{font-size:.85rem;font-weight:700;color:#C9BFAE;letter-spacing:.02em}
.band .bt h2{font-size:clamp(1.5rem,1.2rem + 1.4vw,2.2rem);color:var(--inverse)}
.band .bt p{color:#DCD5CA}
.band figure{margin:0;position:relative;min-height:12rem;background:#2A2824}
.band figure img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:.92}
.band.neu figure img{animation:band-ein 650ms var(--ease) both}
@keyframes band-ein{from{opacity:0;transform:translateX(4%) scale(1.03)}to{opacity:.92;transform:none}}
.band figcaption{position:absolute;left:0;right:0;bottom:0;padding:.45rem .8rem;font-size:.75rem;line-height:1.35;color:#E6DFD2;background:linear-gradient(transparent,rgba(27,26,23,.85))}
.band figcaption b{color:var(--inverse)}
.urt{font-size:.95rem}.urt+.urt{margin-top:.3rem}
.urt.zentral b{color:var(--green)}.urt.begruendbar b{color:var(--gold)}.urt.kaum b{color:var(--red)}
.matrix-wrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:.55rem .7rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:.92rem}
th{background:var(--offset)}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Produkt */
.raster3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:.6rem;font-size:.88rem}
@media (max-width:640px){.raster3{grid-template-columns:1fr}}
.raster3 div{background:var(--surface);border:1px solid var(--border);border-radius:.6rem;padding:.6rem .7rem}
.raster3 b{display:block;margin-bottom:.2rem}
.satzanfaenge{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.satzanfaenge button{min-height:44px;border:1.5px solid var(--border);background:var(--surface2);border-radius:.5rem;padding:.3rem .7rem;font-size:.9rem}
.pole{display:flex;justify-content:space-between;gap:1rem;font-weight:700;font-size:.95rem;margin-top:.6rem}
.pole span{max-width:46%}

/* Löschen */
.loesch{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1rem;font-size:.92rem;color:var(--muted);display:flex;gap:.9rem;flex-wrap:wrap;align-items:center}
.loesch-frage{margin-top:.6rem;border:2px solid var(--red);border-radius:.7rem;padding:.8rem 1rem;background:var(--red-hi);color:var(--ink);flex:1 0 100%}
/* ===== Gemeinsamer Kern M25–M27 (Ergänzungen zum Stand von M23) ===== */
.band{margin-top:.2rem}
.ziele{padding-left:1.2rem;display:grid;gap:.3rem;margin:.6rem 0}
.ablauf{list-style:none;display:grid;gap:.35rem;margin:.8rem 0 0}
.ablauf li{display:grid;grid-template-columns:5.6rem 1fr;gap:.8rem;border-top:1px solid var(--line);padding-top:.35rem}
.ablauf li b{color:var(--red);font-variant-numeric:tabular-nums}
.auflage{border-left:6px solid var(--green);background:var(--green-hi);padding:.8rem 1rem;border-radius:0 .6rem .6rem 0;margin:1rem 0}
.auflage.neu,.rm.neu{animation:auf 360ms var(--ease) both}
.rm{border-left:6px solid var(--stahl);background:var(--surface);padding:.7rem 1rem;border-radius:0 .6rem .6rem 0;margin:.7rem 0;font-size:.97rem}
.rm.zentral{border-left-color:var(--green)}.rm.teils{border-left-color:var(--gold)}.rm.kaum{border-left-color:var(--red)}
.rm b.sw{display:block}
.gesperrt{opacity:.45}
.zaehl{font-size:.88rem;color:var(--muted);margin-top:.25rem;font-variant-numeric:tabular-nums}
textarea,input[type=text],select{color:var(--kuli)}
input[type=text],select{width:100%;min-height:48px;border:1.5px solid var(--border);border-radius:var(--r);padding:.5rem .8rem;background:var(--surface2);margin-top:.3rem}
textarea::placeholder,input::placeholder{color:var(--faint);opacity:1}
.felder2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:700px){.felder2{grid-template-columns:1fr}}

/* Quelle zum Markieren (Gegenwart: Markierung) – Sätze sind die Einheiten */
.qwerk{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:1.2rem;align-items:start;margin-top:1rem}
@media (max-width:860px){.qwerk{grid-template-columns:1fr}}
.qblatt{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.3rem}
.qblatt h3{font-size:1.12rem;margin-bottom:.15rem}
.qblatt .qkopf{font-size:.92rem;color:var(--muted);margin-bottom:.7rem}
.qblatt .qtext p{margin:.55rem 0;line-height:1.75;font-size:1.06rem}
.qblatt .qtag{font-weight:700;color:var(--red);font-size:.9rem;margin-right:.3rem}
.qblatt .g-wort{padding:.08em 0;-webkit-tap-highlight-color:transparent}
.qblatt .g-wort:focus-visible{outline:3px solid var(--kuli);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.qblatt .g-wort:hover{background:var(--offset)}}
.qblatt .g-stifte{margin:.2rem 0 .8rem;position:sticky;top:112px;background:var(--surface2);padding:.35rem 0;z-index:2}
.g-stift .z{font-size:.8em;margin-right:.25rem}
.qreiter{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1rem}
.qreiter button{min-height:44px;border:1.5px solid var(--border);border-bottom-width:3px;background:var(--surface);border-radius:.6rem .6rem 0 0;padding:.4rem .9rem;font-weight:700}
.qreiter button[aria-selected=true]{background:var(--surface2);border-bottom-color:var(--red)}
.belege{display:grid;gap:.8rem}
.belege .sp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .9rem;min-height:5.5rem}
.belege .sp h4{font-family:var(--body);font-size:.95rem;margin-bottom:.3rem}
.belege .sp ul{list-style:none;display:grid;gap:.3rem;font-size:.92rem}
.belege .sp li{border-left:4px solid var(--marker);padding-left:.5rem;line-height:1.35}
.belege .sp.b li{border-left:4px dotted var(--kuli)}
.belege .leer{color:var(--faint);font-size:.9rem}

/* Wörter wählen */
.woerter{display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0}
.woerter button{min-height:44px;padding:.35rem .9rem;border-radius:.6rem;border:2px solid var(--stahl);background:var(--surface2);font-weight:700}
.woerter button[aria-pressed=true]{border-color:var(--kuli);background:var(--kuli-hi);color:var(--ink)}
.woerter button[disabled]{opacity:.5}
.wgrp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-top:.6rem}
@media (max-width:760px){.wgrp{grid-template-columns:1fr}}
.wgrp div{background:var(--surface);border:1px solid var(--border);border-radius:.6rem;padding:.6rem .8rem;font-size:.93rem}
.wgrp b{display:block;margin-bottom:.2rem}
.wgrp .dein{font-weight:700;color:var(--kuli)}

/* Landkarten-Moment */
.prinzipien{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.9rem 0}
@media (max-width:860px){.prinzipien{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.prinzipien{grid-template-columns:1fr}}
.prinzipien button{text-align:left;border:2px solid var(--stahl);background:var(--surface2);border-radius:.7rem;padding:.55rem .7rem;min-height:56px;display:grid;gap:.15rem;align-content:start}
.prinzipien button small{font-size:.82rem;color:var(--muted);line-height:1.3}
.prinzipien button[aria-pressed=true]{border-color:var(--kuli);box-shadow:inset 0 0 0 1px var(--kuli)}
.prinzipien button.zentral{border-left:6px solid var(--green)}.prinzipien button.teils{border-left:6px solid var(--gold)}.prinzipien button.kaum{border-left:6px solid var(--red)}
.prinzipien button[disabled]{opacity:.6}.prinzipien button[disabled][aria-pressed=true]{opacity:1}
.trift{margin-top:1.2rem;border:1.5px dashed var(--stahl);border-radius:.7rem;padding:.8rem 1rem;font-size:.96rem}

/* Stimmkarte und Beamer-Tafel */
#ueber:empty{display:none}
.tafel-voll{position:fixed;inset:0;z-index:60;background:var(--dunkel);color:var(--inverse);display:grid;grid-template-rows:auto 1fr;padding:max(1rem,env(safe-area-inset-top,0px)) 1.4rem 1.4rem;overflow:auto}
.tafel-voll .tk{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.tafel-voll .tk .btn{background:transparent;color:var(--inverse);border-color:#6b665d}
.tafel-voll .mitte{display:grid;place-content:center;text-align:center;gap:1rem}
.tafel-voll .buchstabe{font:600 clamp(8rem,34vw,20rem)/.9 var(--display)}
.tafel-voll .wort{font:600 clamp(1.6rem,5vw,3.4rem)/1.15 var(--display)}
.tafel-voll.hell{background:var(--bg);color:var(--ink)}
.tafel-voll.hell .tk .btn{color:var(--ink);border-color:var(--stahl)}
.folie{width:min(100%,calc((100vh - 6.5rem)*16/9));aspect-ratio:16/9;margin:auto;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);padding:clamp(1rem,2.6vw,2.4rem);display:grid;grid-template-rows:auto 1fr auto;gap:.8rem;text-align:left;overflow:hidden}
.folie h2{font-size:clamp(1.4rem,3vw,2.5rem)}
.folie .vier{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1.4rem;align-content:start;font-size:clamp(.85rem,1.45vw,1.25rem);line-height:1.35}
.folie .vier b{display:block;color:var(--red);font-size:.85em}
.folie .vier p{color:var(--kuli);white-space:pre-wrap;overflow-wrap:anywhere}
.folie .fq{font-size:clamp(.75rem,1.1vw,1rem);color:var(--muted)}
@media (max-width:700px){.folie{aspect-ratio:auto}.folie .vier{grid-template-columns:1fr}}
.stimmwahl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:.8rem}
@media (max-width:640px){.stimmwahl{grid-template-columns:1fr}}
.stimmwahl button{min-height:64px;border:2px solid var(--stahl);border-radius:.8rem;background:var(--surface2);font-weight:700;padding:.5rem .8rem;display:grid;gap:.1rem;text-align:left}
.stimmwahl button b{font:600 1.5rem/1 var(--display)}
.stimmwahl button[aria-pressed=true]{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green);background:var(--green-hi)}

/* Zeitleiste klein (Zusammenfassung) */
.zl{list-style:none;display:grid;gap:.25rem;margin-top:.4rem}
.zl li{display:grid;grid-template-columns:7.2rem 1fr;gap:.7rem;font-size:.95rem;border-top:1px solid var(--line);padding-top:.25rem}
.zl li b{font-variant-numeric:tabular-nums}
.begriffe{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;margin-top:.4rem}
.begriffe div{font-size:.95rem;border-left:4px solid var(--line);padding-left:.6rem}
@media (max-width:640px){.begriffe{grid-template-columns:1fr}}
.mein{color:var(--kuli);white-space:pre-wrap;overflow-wrap:anywhere}
.mein.leer{color:var(--faint);font-style:italic}
.zf .werk{background:var(--gold-hi);border-radius:.6rem;padding:.6rem .9rem;margin-top:.5rem;font-size:.95rem}
.zf h1{margin-top:0}
.zf .seitenumbruch{margin-top:2rem;border-top:3px solid var(--ink);padding-top:1rem}
.lk table{font-size:.92rem}
.lk ul{padding-left:1.2rem;display:grid;gap:.4rem;margin-top:.4rem}

@media print{
  @page{size:A4;margin:12mm 13mm}
  body{background:#fff;font-size:10pt;line-height:1.36}
  .kopf,.fuss,.loesch,.nodruck,.reihe,#ueber{display:none!important}
  main{max-width:none;padding:0}
  .zf h1{font-size:18pt;margin:0 0 .15rem}
  .zf .leitfrage{font-size:12pt;margin-bottom:.3rem}
  .zf h2{font-size:12pt;margin:.55rem 0 .2rem;break-after:avoid}
  .zf .merksatz{margin:.45rem 0;padding:.35rem 0;font-size:11pt}
  .zf .begriffe div,.zf .zl li,.zf .werk{font-size:9pt}
  .zf .karte{padding:.4rem .6rem;break-inside:avoid}
  .zf .seitenumbruch{break-before:page;border-top:0;margin-top:0;padding-top:0}
  .zf .mein{font-size:9.5pt}
  .zf th,.zf td{padding:.2rem .4rem;font-size:8.6pt}
  .auflage{background:#fff;border:1px solid #bbb;border-left:4px solid #555}
  a{color:inherit;text-decoration:none}
}

/* Bilder */
.bilder{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;margin:1rem 0;align-items:start}
.bild{margin:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);padding:.5rem}
.bild img{display:block;width:100%;height:auto;border-radius:.5rem;filter:grayscale(1)}
.bild figcaption{font-size:.9rem;line-height:1.4;margin:.45rem .2rem .1rem}
.bild .nachweis{display:block;font-size:.8rem;color:var(--muted);margin-top:.2rem}
.bild.klein{max-width:34rem}
@media print{.bild,.bilder{display:none}}

/* Lesepult: Text links, Arbeitsspalte rechts (bleibt beim Lesen stehen) */
.lesepult{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:1.4rem;align-items:start;margin-top:1rem}
.lesepult>aside{position:sticky;top:122px;padding-bottom:.4rem}
.lesepult>aside.fragenspalte{position:static}
@media (min-height:820px){.lesepult>aside.fragenspalte{position:sticky}}
@media (max-width:900px){.lesepult{grid-template-columns:1fr}.lesepult>aside{position:static;max-height:none}}

/* Rückmeldung je Option erst nach dem Festlegen (die Regel der Bausteine „.g-option span{display:grid}“ ist stärker als deren „display:none“) */
.g .g-wahl:not([data-zu]) .g-option .g-option__urteil{display:none}

/* Herkunftszeile (z. B. M25: nach Offene Geschichte) */
.herkunft{font-size:.95rem;border-left:4px solid var(--kuli,#24221F);padding:.15rem 0 .15rem .7rem;margin:.6rem 0 1rem;max-width:68ch}
.herkunft a{font-weight:700}
/* ===== Ost-West-Einheit: Zeitraster, Ereigniskarten, Ordnen, Netz, Glossar ===== */
:root{--sp-w:var(--kuli);--sp-w-hi:var(--kuli-hi);--sp-e:var(--gold);--sp-e-hi:var(--gold-hi);--sp-d:var(--green);--sp-d-hi:var(--green-hi)}
.spur-w{--sp:var(--sp-w);--sp-hi:var(--sp-w-hi)}.spur-e{--sp:var(--sp-e);--sp-hi:var(--sp-e-hi)}.spur-d{--sp:var(--sp-d);--sp-hi:var(--sp-d-hi)}
main.breit:has(.zraster.gross){max-width:78rem}
.nurdruck{display:none}
.regeln{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.regeln>div{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--ink);border-radius:0 0 var(--r) var(--r);padding:.8rem 1rem;font-size:.97rem}
.regeln b{display:block;font-family:var(--display);font-size:1.08rem;margin-bottom:.2rem}
.standzeile{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin-bottom:.6rem}
.standzeile button{min-height:64px;text-align:left;border:1px solid var(--border);border-left:6px solid var(--red);background:var(--surface2);border-radius:0 var(--r) var(--r) 0;padding:.6rem .9rem;color:var(--muted);font-size:.92rem}
.standzeile b{display:block;font:600 1.5rem/1.1 var(--display);color:var(--ink)}
.stunden{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
.stunden li>a,.stunden li>.nochnicht{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:.3rem .9rem;align-items:center;min-height:64px;padding:.6rem 1rem;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--ink);text-decoration:none}
.stunden li>.nochnicht{background:transparent;border-style:dashed;color:var(--muted)}
.stunden .snr{font:600 1.7rem/1 var(--display);color:var(--red)}
.stunden .nochnicht .snr{color:var(--faint)}
.stunden .st b{display:block;font-size:1.05rem}
.stunden .st small{color:var(--muted);font-size:.85rem}
.stunden .sstat{font-weight:700;font-size:.88rem;color:var(--muted);white-space:nowrap}
.stunden li.fertig>a{border-left:6px solid var(--green)}
.stunden li.fertig .sstat{color:var(--green)}
@media (hover:hover) and (pointer:fine){.stunden li>a:hover{background:var(--surface)}.chip:hover{background:var(--sp-hi)}}
@media (max-width:640px){.regeln,.standzeile{grid-template-columns:1fr}.stunden li>a,.stunden li>.nochnicht{grid-template-columns:2.2rem minmax(0,1fr)}.stunden .sstat{grid-column:2}}

/* Chips: ein Ereignis */
.chip{display:block;width:100%;text-align:left;position:relative;border:1px solid var(--border);border-left:5px solid var(--sp,var(--stahl));background:var(--surface2);border-radius:0 .5rem .5rem 0;padding:.4rem .5rem;min-height:48px;color:var(--ink);font-size:.84rem;line-height:1.2;hyphens:auto;overflow-wrap:anywhere}
.chip b{display:block}.chip small{display:block;color:var(--muted);font-size:.76rem;margin-top:.1rem}
.chip.da{background:var(--sp-hi)}
.chip i{position:absolute;right:.3rem;top:.15rem;font-style:normal;font-weight:700;color:var(--sp)}
.chip em{position:absolute;right:.3rem;bottom:.2rem;font-style:normal;font-size:.72rem;font-weight:700;background:var(--ink);color:var(--inverse);border-radius:999px;min-width:1.2rem;text-align:center;padding:0 .25rem}

/* Zeitraster: neun Phasen nebeneinander, drei Ebenen untereinander */
.zraster{display:grid;gap:.7rem;margin-top:1rem}
.zspur{display:none}
.zphase{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .7rem;display:grid;gap:.4rem}
.zphase h3{margin:0;font-size:1rem;line-height:1.15;border-bottom:3px solid var(--ink);padding-bottom:.3rem}
.zphase h3 b{display:block;font-family:var(--display);font-size:1.15rem}
.zphase h3 small{display:block;font:400 .78rem/1.2 var(--body);color:var(--muted);hyphens:auto}
.zz{display:grid;gap:.35rem;align-content:start}
.zz.leer{display:none}
.zlab{font-size:.74rem;font-weight:700;color:var(--muted)}
@supports (grid-template-rows:subgrid){@media (min-width:1000px){
  .zraster{grid-template-columns:4.2rem repeat(9,minmax(0,1fr));grid-template-rows:auto auto auto auto;gap:0 .3rem}
  .zspur,.zphase{display:grid;grid-row:1/5;grid-template-rows:subgrid;gap:0}
  .zphase{padding:0;border:0;background:transparent;border-radius:0}
  .zphase h3{padding:.2rem .3rem .4rem;align-self:end}
  .zphase h3 b{font-size:1rem}
  .zz,.zz.leer{display:grid;padding:.4rem .2rem;border-bottom:1px solid var(--line);min-height:4.2rem}
  .zz:nth-of-type(odd){background:rgba(36,34,31,.03)}
  .zlab{display:none}
  .ze{font-weight:700;font-size:.82rem;padding:.5rem .2rem;border-bottom:1px solid var(--line);border-left:5px solid var(--sp);padding-left:.4rem;hyphens:auto}
  .chip{font-size:.78rem;padding:.35rem .35rem}
  .chip small{font-size:.7rem}
}}

/* Ereigniskarte */
.ekarte{background:var(--surface2);border:1px solid var(--border);border-top:8px solid var(--sp);border-radius:0 0 var(--r-lg) var(--r-lg);padding:1rem 1.2rem 1.1rem;text-align:left;max-width:44rem}
.ekarte header{margin-bottom:.6rem}
.ekarte .espur{font-size:.8rem;font-weight:700;color:var(--sp)}
.ekarte h3{font-size:1.5rem;margin:.1rem 0}
.ekarte .edatum{font-weight:700;margin:0}
.ekarte h4{font:700 .95rem var(--body);margin:.8rem 0 .2rem;color:var(--muted)}
.ekarte p,.ekarte li{font-size:.98rem}
.ekarte ul{margin:0;padding-left:1.1rem}
.ekarte .ekasten{margin:.9rem 0 .5rem;background:var(--sp-hi);border-left:5px solid var(--sp);padding:.6rem .8rem;border-radius:0 .5rem .5rem 0}
.ekarte .efuss{font-size:.86rem;color:var(--muted);margin:.4rem 0 0}
.ekarte .ebild{margin:.9rem 0 0}
.ekarte .ebild img{max-height:16rem;width:auto;max-width:100%}
.tafel-voll.hell .mitte{place-content:start center;text-align:left;padding-top:1rem}
.kdialog{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:1.4rem;max-width:68rem;align-items:start}
.kdneben h4{font:600 1.1rem var(--display);margin:0 0 .4rem}
.kdneben h4+ul,.kdneben ul{padding-left:1.1rem;margin:.2rem 0 .8rem;font-size:.95rem}
.kdneben .reihe{margin:.4rem 0 1.2rem}
@media (max-width:860px){.kdialog{grid-template-columns:1fr}}

/* Ordnen */
.ordwerk{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1.2rem;align-items:start}
.ordpool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
.ordfolge{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(8,auto);gap:.35rem .6rem}
.ordfolge li button{display:grid;grid-template-columns:1.8rem minmax(0,1fr);gap:.1rem .4rem;width:100%;text-align:left;min-height:48px;align-items:center;border:1px solid var(--border);border-left:5px solid var(--stahl);background:var(--surface2);border-radius:0 .5rem .5rem 0;padding:.35rem .5rem;font-size:.88rem;color:var(--ink)}
.ordfolge li button span{font:600 1.1rem var(--display);color:var(--muted)}
.ordfolge li button small{grid-column:2;color:var(--muted);font-size:.78rem}
.ordfolge li.ok button{border-left-color:var(--green);background:var(--green-hi)}
.ordfolge li.nein button{border-left-color:var(--gold);background:var(--gold-hi)}
.ordfolge li.leer{grid-column:1/-1;color:var(--muted);font-style:italic;border:1.5px dashed var(--stahl);border-radius:.5rem;padding:.8rem}
@media (max-width:760px){.ordwerk{grid-template-columns:1fr}.ordfolge{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr}}

/* Vernetzen */
.netzzeile{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.5rem;margin-bottom:.6rem}
.netzzeile select{min-height:48px;width:100%;border:1.5px solid var(--stahl);border-radius:.5rem;background:var(--surface2);padding:.3rem .5rem;font:inherit;color:var(--ink)}
@media (max-width:700px){.netzzeile{grid-template-columns:1fr}}
.netzliste{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
.netzliste li{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.6rem .9rem}
.netzliste .nk{display:inline-block;border-left:5px solid var(--sp);background:var(--sp-hi);padding:.1rem .5rem;border-radius:0 .4rem .4rem 0;font-weight:700;font-size:.92rem}
.netzliste .nart{margin:0 .45rem;color:var(--muted);font-style:italic;font-size:.92rem}
.netzliste p{margin:.35rem 0 .2rem}
.netzliste .btn.klein,.btn.klein{min-height:44px;padding:.3rem .8rem;font-size:.85rem}
.netzliste.klein li{padding:.3rem .6rem;font-size:.92rem}

/* Glossar */
.glkopf{display:grid;gap:.6rem;margin-bottom:.8rem}
.glkopf input{min-height:48px;border:1.5px solid var(--stahl);border-radius:.5rem;background:var(--surface2);padding:.3rem .7rem;font:inherit;max-width:24rem}
.gl{border-bottom:1px solid var(--line)}
.gl summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer;padding:.2rem 0}
.gl p{margin:0 0 .8rem;max-width:44rem}
.fadenliste{padding-left:1.3rem;display:grid;gap:.45rem}
.fadenliste li b{font-size:.95rem}

/* Verorten und vernetzen (Schluss jeder Stunde) */
.verorten{display:grid;gap:1rem}
.vjahr{display:grid;grid-template-columns:minmax(0,1fr) 7rem;gap:.6rem;align-items:center;border:1px solid var(--border);border-left:5px solid var(--sp);background:var(--surface2);border-radius:0 var(--r) var(--r) 0;padding:.5rem .8rem}
.vjahr input{min-height:48px;border:1.5px solid var(--stahl);border-radius:.5rem;padding:.2rem .5rem;font:inherit;width:100%}
.vjahr .rm{grid-column:1/-1;margin:0}

@media print{
  .nurdruck{display:block}
  .zraster.druck{grid-template-columns:repeat(9,minmax(0,1fr));gap:0 1.2mm;margin-top:1mm}
  .zraster.druck .zspur{display:none}
  .zraster.druck .zphase{display:block;padding:0;border:0;background:transparent}
  .zraster.druck .zphase h3{font-size:7.5pt;border-bottom:1.5pt solid #000;padding-bottom:.6mm;min-height:11mm}
  .zraster.druck .zphase h3 b{font-size:8.5pt}.zraster.druck .zphase h3 small{font-size:6.3pt}
  .zraster.druck .zz{display:block;padding:0}.zraster.druck .zz.leer{display:none}
  .zraster.druck .zlab{display:block;font-size:6pt;margin-top:1mm}
  .zraster.druck .chip{font-size:7pt;min-height:0;padding:.6mm 1mm;margin-top:.6mm;border-left-width:2.5pt;background:#fff}
  .zraster.druck .chip small{font-size:6.2pt}
  .zf .fadenliste{font-size:9pt;gap:.25rem}.zf .netzliste.klein li{font-size:8.5pt;padding:.15rem .4rem}
}

/* Stunden */
.fragen7,.fakten{padding-left:1.3rem;display:grid;gap:.35rem}
.fragen7{grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem 2rem}
.deleg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.deleg .karte+.karte{margin-top:0}
.deleg ul{padding-left:1.1rem;margin:.4rem 0 0;font-size:.95rem;display:grid;gap:.3rem}
@media (max-width:820px){.deleg,.fragen7{grid-template-columns:1fr}}
.vkarte{display:grid;gap:.6rem}
.qblatt.lese .qtext p{margin:0 0 .7rem}
.zweispalt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
@media (max-width:820px){.zweispalt{grid-template-columns:1fr}}
.tab3{width:100%;border-collapse:collapse;font-size:.95rem}
.tab3 th,.tab3 td{border:1px solid var(--line);padding:.4rem .5rem;text-align:left;vertical-align:top}
.tab3 textarea{width:100%;min-height:3.2rem;border:1px solid var(--stahl);border-radius:.4rem;padding:.3rem;font:inherit}
.bslot{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:.3rem .8rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--line)}
.bslot label{font-weight:700}
.bslot select{min-height:48px;border:1.5px solid var(--stahl);border-radius:.5rem;background:var(--surface2);padding:.3rem .5rem;font:inherit;width:100%}
.bslot .rm{grid-column:1/-1;margin:.2rem 0}
@media (max-width:640px){.bslot{grid-template-columns:1fr}}
.ordpool.eins,.ordfolge.eins{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}
.ordpool.eins .chip{font-size:.92rem;padding:.5rem .6rem}
.tab3 th[scope=row]{width:11rem;font-size:.92rem}
.dia{margin:1rem 0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:.8rem}
.dia svg{width:100%;height:auto;display:block}
.dia figcaption{font-size:.88rem;margin-top:.4rem}
.dia .nachweis{display:block;color:var(--muted);font-size:.8rem;margin-top:.2rem}
@media print{.dia{display:none}}
.tabeng table{font-size:.8rem}.tabeng th,.tabeng td{padding:.25rem .3rem}
</style>
</head>
<body>
<header class="kopf"><div class="kopf-in" id="kopf"></div><nav class="weg" id="weg" aria-label="Lernweg"></nav></header>
<main id="main" tabindex="-1"></main>

<script>
window.OWK_GEBAUT = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9"];
"use strict";
/* ===== Gemeinsamer Kern M25–M27. Jede Stunde definiert danach L (Einstellungen), ihre Daten, SEITE_FN und ruft kernStart(). ===== */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = {};
const lade = () => { try { return JSON.parse(localStorage.getItem(L.key)) || {}; } catch(e) { return {}; } };
const speichere = () => { try { localStorage.setItem(L.key, JSON.stringify(S)); } catch(e) {} };
const hol = p => p.split(".").reduce((o, k) => (o == null ? undefined : o[k]), S);
const setz = (p, v) => { const k = p.split("."); let o = S; for (let i = 0; i < k.length - 1; i++) { if (o[k[i]] == null || typeof o[k[i]] !== "object") o[k[i]] = {}; o = o[k[i]]; } o[k[k.length - 1]] = v; speichere(); };
const woerter = t => String(t || "").trim().split(/\s+/).filter(Boolean).length;
const ruhig = () => { try { return !!S.ruhig || matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) { return !!S.ruhig; } };
const neu = (el, k) => { if (!el) return; el.classList.remove(k); void el.offsetWidth; if (!ruhig()) el.classList.add(k); };
const LABOR = /github\.io$/.test(location.hostname) ? "index.html" : "https://geschichtefuerdiegegenwart.github.io/GGK-Einheit-Nationalsozialismus/";
const LK = "https://geschichtefuerdiegegenwart.github.io/kognitive-Landkarte-des-Geschichtsunterrichts/#s-";
const idx = id => Math.max(0, L.seiten.findIndex(s => s[0] === id));

/* ---------- Bausteine für Seiten ---------- */
const zeitKopf = id => { const s = L.seiten[idx(id)]; return `<p class="zeit"><span class="nr">${esc(s[1])}</span><span>${esc(s[2])}</span></p>`; };
const weiter = (nach, text, o = {}) => `<div class="fuss"><span class="hinweis">${o.hinweis || "Dein Stand wird nur auf diesem Gerät gespeichert."}</span><button class="btn primary" data-geh="${nach}">${esc(text)} ›</button></div>`;
const auftrag = (form, titel, text) => `<div class="auftrag"><span class="form">${esc(form)}</span><h3>${esc(titel)}</h3><p>${text}</p></div>`;
const belastend = text => `<p class="belastend"><b>Hinweis vorab.</b> ${text}</p>`;
const status = (art, text) => `<span class="status ${art}">${esc(text)}</span>`;
const band = (ob, titel, text) => `<div class="band"><div class="bt"><span class="ob">${esc(ob)}</span><h2>${esc(titel)}</h2><p>${text}</p></div></div>`;
const hilfe = (titel, html) => `<details class="hilfe"><summary>${esc(titel)}</summary>${html}</details>`;

/* Textfeld mit Satzanfängen und Wortzähler (Gegenwart: Textfeld). pfad = Ort in S. */
function textfeld(pfad, label, o = {}){
  const v = hol(pfad) || "", id = "f-" + pfad.replace(/\W/g, "-");
  return `<div class="tf"><label for="${id}">${label}</label>
  <textarea id="${id}" data-f="${pfad}" rows="${o.rows || 3}" placeholder="${esc(o.platz || "")}">${esc(v)}</textarea>
  ${o.anfaenge ? `<div class="satzanfaenge nodruck" role="group" aria-label="Satzanfänge">${o.anfaenge.map(a => `<button type="button" data-satz="${id}" data-text="${esc(a)}">${esc(a)} …</button>`).join("")}</div>` : ""}
  ${o.zaehl === false ? "" : `<p class="zaehl" data-zaehl="${pfad}">${woerter(v)} Wörter${o.ziel ? " · " + esc(o.ziel) : ""}</p>`}</div>`;
}
const eingabe = (pfad, label, platz = "") => { const id = "f-" + pfad.replace(/\W/g, "-"); return `<div><label for="${id}">${label}</label><input type="text" id="${id}" data-f="${pfad}" value="${esc(hol(pfad) || "")}" placeholder="${esc(platz)}" autocomplete="off"></div>`; };
/* Kriterienraster: erscheint, sobald das Feld pfad mindestens min Wörter hat (P6: Vergleich erst nach dem eigenen Text). */
function raster(pfad, min, titel, zeilen){
  const da = woerter(hol(pfad)) >= min;
  return `<div data-raster="${pfad}" data-min="${min}" ${da ? "" : "hidden"}><h3 class="klein">${esc(titel)}</h3><div class="matrix-wrap"><table><thead><tr><th>Prüfe deinen Text</th><th>Grundlegend</th><th>Sicher</th><th>Souverän</th></tr></thead><tbody>${zeilen.map(z => `<tr><td><b>${esc(z[0])}</b></td><td>${esc(z[1])}</td><td>${esc(z[2])}</td><td>${esc(z[3])}</td></tr>`).join("")}</tbody></table></div></div>
  <p class="hinweis" data-rasterhinweis="${pfad}" ${da ? "hidden" : ""}>Ab ${min} Wörtern erscheint ein Raster, mit dem du deinen Text selbst prüfst.</p>`;
}
/* Vergleich, der erst nach eigenen Antworten erscheint: bed = Liste von Pfaden, die gefüllt sein müssen. */
function vergleich(id, bed, min, titel, html){
  const ok = bed.every(p => String(hol(p) || "").trim().length >= min), offen = !!(S.offen || {})[id];
  return `<div class="reihe nodruck"><button type="button" class="btn dunkel" data-vergleich="${id}" data-bed="${bed.join(",")}" data-min="${min}" data-titel="${esc(titel)}" ${ok ? "" : "disabled"}>${offen ? "Vergleich ausblenden" : esc(titel)}</button><span class="hinweis" data-vergleichhinweis="${id}">${ok ? "" : "Erst deine Antworten, dann der Vergleich."}</span></div>
  <div class="auflage" id="vgl-${id}" ${offen && ok ? "" : "hidden"}>${html}</div>`;
}

/* ---------- Quelle zum Markieren (Muster 11; Gegenwart: Markierung, zwei Stifte) ----------
   QUELLEN[id] = { titel, kopf, abs:[[tag|null, [Sätze…]], …], nachweis, stifte:[[ "a", Zeichen, Name ], [ "b", Zeichen, Name ]] }
   Stand: S.mark[id] = { "0": "a", "3": "b" }, S.stift[id] = "a" */
const STIFTKLASSE = { a:"g-mark g-mark--beleg", b:"g-mark g-mark--gedanke" };

  "2-1-3": ["Partikularität", "Historische Erkenntnisse sind immer nur Ausschnitte der gesamten Vergangenheit."],

function kernStartLeer(r){ S = {}; const d = L.init(); S = Object.assign({ seite:"start", ruhig:r, mark:{}, stift:{}, wahl:{}, offen:{}, lk:{ vermutung:"", prinzip:null, grund:"", ok:false } }, d); speichere(); zeichne(true); }

/* ===== Lehrkraft-Schloss · Quelle: src/lk-schloss.js – nur dort ändern =====
   Der Text für Lehrkräfte steht verschlüsselt auf dieser Seite (Datenblock mit der id lehr-daten): AES-GCM 256,
   Schlüssel per PBKDF2-SHA-256 (600 000 Runden) aus dem Passwort. Weder Passwort noch Klartext stehen im Repository.
   Nach dem Öffnen bleibt der abgeleitete Schlüssel bis zum Schließen des Tabs im sessionStorage, damit andere

    if (p === "suche") { const g = document.getElementById("gliste"); if (g) g.innerHTML = glossarListe(); }
  },
};
const linkBereit = () => S.entwurf.a && S.entwurf.b && S.entwurf.a !== S.entwurf.b && S.entwurf.satz.trim().length >= 15;
const stundeFertig = id => !!(S.faden[id] && S.faden[id].trim());
const linksVon = id => S.links.filter(l => l.a === id || l.b === id);
/* feste Mischung für das Ordnen (bei allen gleich, damit man am Beamer darüber sprechen kann) */
const MISCH = ["k09","k03","k14","k06","k16","k01","k11","k07","k13","k04","k10","k15","k02","k12","k08","k05"];
const TIPP = { k01:"Steht ganz am Anfang: Die Sieger regeln, was aus Deutschland wird.", k02:"Zwei Jahre nach Kriegsende sagen die USA dem Kommunismus den Kampf an.", k03:"Die sowjetische Antwort auf die Truman-Doktrin – also danach.", k04:"Setzt die Eindämmung wirtschaftlich um. Beginnt im Jahr der Truman-Doktrin.", k05:"Anlass war die Währungsreform im Westen – noch bevor es zwei deutsche Staaten gab.", k06:"Folgt direkt auf die Blockade.", k07:"Der erste „heiße“ Krieg – kurz nach der Gründung der beiden deutschen Staaten.", k08:"Eine Reaktion auf den NATO-Beitritt der Bundesrepublik.", k09:"Schließt die letzte offene Grenze, nach 2,7 Millionen Flüchtlingen seit 1949.", k10:"Ein gutes Jahr nach dem Mauerbau.", k11:"Beginnt mit der sozial-liberalen Koalition.", k12:"Umfasst die Ostpolitik und endet mit der Invasion in Afghanistan.", k13:"Beendet die Entspannung.", k14:"Zieht sich über Jahrzehnte. Diese Karte darf an mehreren Stellen liegen.", k15:"Ein neuer Mann kommt in Moskau an die Macht.", k16:"Macht die deutsche Einheit möglich – ganz am Ende." };

function start(){
  const nB = KARTEN.filter(k => S.bearbeitet[k.id]).length, nF = STUNDEN.filter(s => stundeFertig(s[0])).length;
  return `${band("Jahrgangsstufe 2 · Bildungsplaneinheit 3 · neun Doppelstunden", "Der Ost-West-Konflikt", "1945 kämpfen die USA und die Sowjetunion noch gemeinsam. Zwei Jahre später stehen sie einander als Feinde gegenüber – 44 Jahre lang, mit Deutschland in der Mitte.")}
  <p class="leitfrage">${esc(LEITFRAGE)}</p>
  <h2 class="abschnitt">So arbeitest du in dieser Einheit</h2>
  <div class="regeln">
    <div><b>1 · Vernetzen</b>Zieh Verbindungen zwischen Ereignissen und Begriffen. Wie hängen Truman-Doktrin und Zwei-Lager-Theorie zusammen?</div>
    <div><b>2 · Nach der Perspektive fragen</b>Aus wessen Sicht wird hier erzählt? Welche Erzählung wird bedient?</div>
    <div><b>3 · Die Landkarte anwenden</b>Welches Prinzip der kognitiven Landkarte hilft hier: Retrospektivität, Perspektivität, Selektivität, Standortgebundenheit, Narrativität, Konstruktivität?</div>
    <div><b>4 · Nach Handlungsspielraum fragen</b>Wer konnte entscheiden? Wer war Getriebener? Wo liegen die Grenzen des Handelns?</div>
  </div>
  <h2 class="abschnitt">Dein Überblick wächst</h2>
  <div class="standzeile" role="group" aria-label="Dein Stand">
    <button type="button" data-geh="raster"><b>${nB} von 16</b>Karten bearbeitet</button>
    <button type="button" data-geh="netz"><b>${S.links.length}</b>eigene Verbindungen</button>
    <button type="button" data-geh="faden"><b>${nF} von ${STUNDEN.length}</b>Sätze im roten Faden</button>
  </div>
  <p class="hinweis">Jede Stunde endet mit drei Schritten: Karten einordnen, eine Verbindung ziehen, einen Satz zur Leitfrage schreiben. Alles sammelt sich hier.</p>
  <h2 class="abschnitt">Die neun Stunden</h2>
  <ol class="stunden">${STUNDEN.map((s, i) => { const da = GEBAUT.includes(s[0]); return `<li class="${stundeFertig(s[0]) ? "fertig" : ""}">${da ? `<a href="${s[1]}">` : `<span class="nochnicht">`}<span class="snr">${i + 1}</span><span class="st"><b>${esc(s[2])}</b><small>Heft ${esc(s[3])}${s[4].length ? " · Karten: " + s[4].map(id => esc(karte(id).titel)).join(", ") : ""}</small></span><span class="sstat">${stundeFertig(s[0]) ? "✓ Faden geschrieben" : (da ? "öffnen ›" : "in Arbeit")}</span>${da ? "</a>" : "</span>"}</li>`; }).join("")}</ol>
  ${weiter("raster", "Zum Zeitraster")}`;
}

/* ---------- Zeitraster: neun Phasen × drei Ebenen ---------- */
function chip(k){
  const n = linksVon(k.id).length;
  return `<button type="button" class="chip spur-${k.spur} ${S.bearbeitet[k.id] ? "da" : ""}" data-akt="kzeig" data-w="${k.id}" aria-label="${esc(k.titel)}, ${esc(k.datum)}${S.bearbeitet[k.id] ? ", bearbeitet" : ""}${n ? ", " + n + " Verbindungen" : ""}"><b>${esc(k.titel)}</b><small>${esc(k.datum)}</small>${S.bearbeitet[k.id] ? `<i aria-hidden="true">✓</i>` : ""}${n ? `<em aria-hidden="true">${n}</em>` : ""}</button>`;
}
function rasterHtml(o = {}){
  const zelle = (p, sp) => KARTEN.filter(k => k.phase === p[0] && k.spur === sp).map(k => o.druck ? `<span class="chip spur-${k.spur}"><b>${esc(k.titel)}</b><small>${esc(k.datum)}</small></span>` : chip(k)).join("");
  return `<div class="zraster ${o.druck ? "druck" : "gross"}">
    <div class="zspur" aria-hidden="true"><span></span>${["w","e","d"].map(sp => `<span class="ze spur-${sp}">${SPUR[sp]}</span>`).join("")}</div>
    ${PHASEN.map((p, i) => `<section class="zphase" aria-label="Phase ${i + 1}: ${esc(p[1])}, ${esc(p[2])}"><h3><b>${esc(p[1])}</b><small>${esc(p[2])}</small></h3>${["w","e","d"].map(sp => { const z = zelle(p, sp); return `<div class="zz ${z ? "" : "leer"}" ${o.druck ? "" : `role="group" aria-label="${SPUR[sp]}"`}><span class="zlab">${SPUR[sp]}</span>${z}</div>`; }).join("")}</section>`).join("")}
  </div>`;
}
function zeitraster(){
  return `${zeitKopf("raster")}<h1>Das Zeitraster</h1>
  <p class="lead">Neun Phasen von 1945 bis 1991, drei Ebenen: die Welt, Europa, Deutschland. Tippe eine Karte an, um sie zu lesen. Ein Haken zeigt, dass du sie in einer Stunde bearbeitet hast; die Zahl zeigt deine Verbindungen.</p>
  ${rasterHtml()}
  <p class="hinweis" style="margin-top:.6rem">${status("modell", "Modell")}Die Einteilung in Phasen stammt aus dem Glossar M28. Sie ist eine Deutung: Andere Darstellungen setzen die Grenzen anders. Was lässt dieses Raster weg? Zum Beispiel die Blockfreien und alles, was nicht in eine Spalte passt.</p>
  ${weiter("ordnen", "Weiter: Ordnen")}`;
}
function karteDialog(id){
  const k = karte(id), ls = linksVon(id);
  tafel(`<div class="kdialog">${karteHtml(k)}
    <div class="kdneben"><h4>Deine Verbindungen</h4>${ls.length ? `<ul>${ls.map(l => `<li><b>${esc(karte(l.a).titel)}</b> ${esc(artWort(l.art))} <b>${esc(karte(l.b).titel)}</b><br><span class="mein">${esc(l.satz)}</span></li>`).join("")}</ul>` : `<p class="hinweis">Noch keine. Verbinde diese Karte mit einer anderen.</p>`}
    <div class="reihe"><button type="button" class="btn dunkel" data-akt="kverbind" data-w="${id}">Diese Karte verbinden</button></div>
    <h4>Vier Fragen an die Karte</h4><ul class="vierfragen"><li>Womit hängt sie zusammen?</li><li>Aus wessen Sicht ist sie erzählt?</li><li>Welches Prinzip der Landkarte steckt im Kasten „${esc(k.kasten[0])}“?</li><li>Wer hatte hier Handlungsspielraum?</li></ul></div></div>`, { hell:true, titel:"Ereigniskarte " + k.nr + " von 16" });
}

/* ---------- Ordnen: die Aufgabe „__/16“ aus dem Heft ---------- */
function ordnungPruefen(){
  const f = S.ordnen.folge, ohne14 = f.filter(x => x !== "k14"), soll = KARTEN.map(k => k.id).filter(x => x !== "k14"), res = {};
  ohne14.forEach((id, i) => { let ok = soll[i] === id; if (!ok && ((id === "k11" && soll[i] === "k12") || (id === "k12" && soll[i] === "k11"))) ok = true; res[id] = ok; });
  const p14 = f.indexOf("k14"); res.k14 = p14 >= 6; return res;
}
function ordnen(){
  const o = S.ordnen, frei = MISCH.filter(id => !o.folge.includes(id)), res = o.gepr ? ordnungPruefen() : {}, alle = o.folge.length === 16;
  const falsch = o.gepr ? o.folge.filter(id => !res[id]) : [], erste = falsch[0];
  return `${zeitKopf("ordnen")}<h1>Ordnen</h1>
  ${auftrag("Allein oder zu zweit · 10 Minuten · ohne Heft", "Was kam wann?", "Bring die 16 Ereignisse in die richtige Reihenfolge. Tippe das Ereignis an, das als Nächstes kommt. Ein Tipp auf ein Ereignis in deiner Reihe nimmt es wieder heraus. Wenn alle liegen: prüfen.")}
  <div class="ordwerk">
    <div><h3 class="klein" style="margin-top:0">Noch offen (${frei.length})</h3><div class="ordpool" role="group" aria-label="Noch nicht eingeordnet">${frei.map(id => `<button type="button" class="chip spur-${karte(id).spur}" data-akt="ordrein" data-w="${id}"><b>${esc(karte(id).titel)}</b></button>`).join("") || `<p class="hinweis">Alles liegt.</p>`}</div></div>
    <div><h3 class="klein" style="margin-top:0">Deine Reihenfolge</h3><ol class="ordfolge" aria-label="Deine Reihenfolge">${o.folge.map((id, i) => `<li class="${o.gepr ? (res[id] ? "ok" : "nein") : ""}"><button type="button" data-akt="ordraus" data-w="${id}" aria-label="${i + 1}. ${esc(karte(id).titel)} – herausnehmen"><span>${i + 1}</span><b>${esc(karte(id).titel)}</b>${o.gepr && o.zeig ? `<small>${esc(karte(id).datum)}</small>` : ""}</button></li>`).join("") || `<li class="leer">Tippe links das erste Ereignis an.</li>`}</ol></div>
  </div>
  <div class="reihe"><button type="button" class="btn dunkel" data-akt="ordpruef" ${alle && !o.gepr ? "" : "disabled"}>Prüfen</button>${o.n >= 1 ? `<button type="button" class="btn" data-akt="ordzeig" ${o.zeig ? "disabled" : ""}>Daten einblenden</button>` : ""}<button type="button" class="btn" data-akt="ordneu">Neu beginnen</button></div>
  <div aria-live="polite">${o.gepr ? (falsch.length ? `<div class="rm teils"><b>${16 - falsch.length} von 16 liegen richtig.</b> Grüne Kante: passt. Goldene Kante: noch einmal prüfen. Ein Hinweis zu „${esc(karte(erste).titel)}“: ${esc(TIPP[erste])}</div>` : `<div class="rm zentral"><b>Alle 16 liegen richtig.</b> Jetzt die schwierigere Frage: Welche zwei Ereignisse hängen am engsten zusammen – und warum? Halte es unter „Vernetzen“ fest.</div>`) : ""}</div>
  <p class="hinweis" style="margin-top:.6rem">Ostpolitik und Entspannungspolitik dürfen die Plätze tauschen, die „Stellvertreterkriege weltweit“ dürfen an mehreren Stellen liegen: Beide Karten beschreiben Zeiträume, keine einzelnen Tage.</p>
  ${weiter("netz", "Weiter: Vernetzen")}`;
}

/* ---------- Vernetzen ---------- */
function netz(){
  const e = S.entwurf, wahl = (p, v) => `<select data-f="${p}" data-neu aria-label="Karte wählen">${KARTEN.map(k => `<option value="${k.id}" ${v === k.id ? "selected" : ""}>${k.nr} · ${esc(k.titel)}</option>`).join("")}</select>`;
  const inseln = KARTEN.filter(k => !linksVon(k.id).length);
  return `${zeitKopf("netz")}<h1>Vernetzen</h1>
  ${auftrag("Allein · immer wieder", "Eine Verbindung, ein Satz", "Wähle zwei Karten und die Art der Verbindung. Schreib dann in einem Satz, wie sie zusammenhängen. So entsteht dein eigenes Netz des Ost-West-Konflikts. Es gibt keine vorgegebene Lösung – dein Satz muss die Verbindung begründen.")}
  <div class="karte netzbau">
    <div class="netzzeile">${wahl("entwurf.a", e.a)}<select data-f="entwurf.art" data-neu aria-label="Art der Verbindung">${ARTEN.map(a => `<option value="${a[0]}" ${e.art === a[0] ? "selected" : ""}>${esc(a[1])}</option>`).join("")}</select>${wahl("entwurf.b", e.b)}</div>
    ${textfeld("entwurf.satz", "Wie hängen die beiden zusammen?", { rows:2, platz:"Zum Beispiel: Die Zwei-Lager-Theorie antwortet auf …, weil …", zaehl:false })}
    <div class="reihe"><button type="button" class="btn dunkel" data-akt="linkneu" ${linkBereit() ? "" : "disabled"}>Verbindung festhalten</button>${e.a === e.b ? `<span class="hinweis">Wähle zwei verschiedene Karten.</span>` : ""}</div>
  </div>
  <h2 class="abschnitt">Dein Netz (${S.links.length})</h2>
  ${S.links.length ? `<ul class="netzliste">${S.links.map((l, i) => `<li><span class="nk spur-${karte(l.a).spur}">${esc(karte(l.a).titel)}</span><span class="nart">${esc(artWort(l.art))}</span><span class="nk spur-${karte(l.b).spur}">${esc(karte(l.b).titel)}</span><p class="mein">${esc(l.satz)}</p>${l.von ? `<small class="hinweis">aus Stunde ${esc(l.von.replace("s", ""))}</small>` : ""}<button type="button" class="btn klein nodruck" data-akt="linkweg" data-w="${i}" aria-label="Verbindung entfernen">Entfernen</button></li>`).join("")}</ul>` : `<p class="hinweis">Noch keine Verbindung. Ein Anfang steht schon oben: Truman-Doktrin und Zwei-Lager-Theorie.</p>`}
  ${S.links.length >= 3 ? `<div class="auflage"><p><b>Inseln in deinem Netz.</b> ${inseln.length ? "Diese Karten haben noch keine Verbindung: " + inseln.map(k => esc(k.titel)).join(" · ") + "." : "Jede Karte ist mit mindestens einer anderen verbunden."}</p><p>Prüffrage: Verbindest du nur Nachbarn in der Zeit – oder auch Ereignisse, die Jahrzehnte auseinanderliegen?</p></div>` : ""}
  ${weiter("glossar", "Weiter: Glossar")}`;
}

/* ---------- Glossar ---------- */
const GRUPPEN = [["g","Grundbegriffe und Ideologien"],["i","Institutionen"],["a","Akteur*innen"],["k","Konzepte der Geschichtswissenschaft"]];
function glossarListe(){
  const q = S.suche.trim().toLowerCase();
  const l = GLOSSAR.filter(e => q ? (e.t + " " + e.x).toLowerCase().includes(q) : e.g === S.gruppe);
  const fmt = e => e.g === "a" && /^Rolle:/.test(e.x) ? e.x.replace(/^Rolle: (.*?) Politik: (.*)$/, (m, r, p) => `<b>Rolle:</b> ${esc(r)}<br><b>Politik:</b> ${esc(p)}`) : esc(e.x);
  return (l.map(e => `<details class="gl"><summary>${esc(e.t)}</summary><p>${fmt(e)}</p></details>`).join("") || `<p class="hinweis">Kein Eintrag gefunden.</p>`)
    + (!q && S.gruppe === "a" ? `<div class="trift"><b>Und die Frauen?</b> ${esc(GLOSSAR_FRAUEN)}</div>` : "");
}
function glossar(){
  return `${zeitKopf("glossar")}<h1>Glossar</h1>
  <p class="lead">Dieses Glossar ist kein Lexikon zum Auswendiglernen. Es soll dir helfen, Geschichte als etwas Erzähltes zu sehen – aus einer Perspektive, mit Folgen bis heute.</p>
  <div class="glkopf"><div class="qreiter" role="tablist" aria-label="Gruppe">${GRUPPEN.map(g => `<button type="button" role="tab" aria-selected="${!S.suche && S.gruppe === g[0]}" data-akt="setz" data-p="gruppe" data-w="${g[0]}">${esc(g[1])}</button>`).join("")}</div>
  <label class="sr" for="f-suche">Im Glossar suchen</label><input type="text" id="f-suche" data-f="suche" value="${esc(S.suche)}" placeholder="Suchen, z. B. KSZE" autocomplete="off"></div>
  <div id="gliste">${glossarListe()}</div>
  <p class="quelle">Texte: Glossar M28 aus dem Unterrichtsheft. Die 16 Ereignisse stehen im Zeitraster.</p>
  ${weiter("faden", "Weiter: Roter Faden")}`;
}

/* ---------- Roter Faden und Orientierungsblatt ---------- */
function faden(){
  const m = (t, leer = "noch offen") => `<span class="mein ${String(t || "").trim() ? "" : "leer"}">${esc(String(t || "").trim() || leer)}</span>`;
  return `<div class="zf"><div class="nodruck">${zeitKopf("faden")}<h1>Der rote Faden</h1>
  <p class="lead">Am Ende jeder Stunde schreibst du einen Satz zur Leitfrage. Hier stehen sie nebeneinander. Am Ende der Einheit wird daraus dein eigener Text.</p></div>
  <h1 class="nurdruck">Der Ost-West-Konflikt · Orientierungsblatt</h1>
  <p class="leitfrage">${esc(LEITFRAGE)}</p>
  <h2>Das Zeitraster ${status("modell", "Modell")}</h2>${rasterHtml({ druck:true })}
  <div class="seitenumbruch"><h2 style="margin-top:0">Mein roter Faden</h2>
  <ol class="fadenliste">${STUNDEN.map(s => `<li><b>${esc(s[2])}</b><br>${m(S.faden[s[0]])}</li>`).join("")}</ol>
  <h2>Meine Verbindungen (${S.links.length})</h2>
  ${S.links.length ? `<ul class="netzliste klein">${S.links.map(l => `<li><b>${esc(karte(l.a).titel)}</b> ${esc(artWort(l.art))} <b>${esc(karte(l.b).titel)}</b>: ${m(l.satz)}</li>`).join("")}</ul>` : `<p class="mein leer">noch keine</p>`}
  <h2>Meine Antwort auf die Leitfrage</h2>
  <div class="nodruck">${auftrag("Allein · am Ende der Einheit · 20 Minuten", "Dein Orientierungstext", "Beantworte die Leitfrage in zehn bis zwölf Sätzen. Nutze deine Sätze aus den Stunden und mindestens drei deiner Verbindungen. Nenne Ideologien, Machtinteressen und Handlungsspielräume je mit einem Beispiel.")}
  ${textfeld("text", "Mein Text", { rows:10, anfaenge:["Der Ost-West-Konflikt entstand, weil","Ideologien spielten eine Rolle, zum Beispiel","Machtinteressen zeigten sich, als","Handlungsspielraum hatten","Erinnert wird der Konflikt heute"], ziel:"Ziel: etwa 150 Wörter" })}
  ${raster_("text")}</div>
  <p class="mein nurdruck">${esc(S.text || "")}</p></div></div>
  <div class="reihe nodruck"><button type="button" class="btn dunkel" data-drucken>Orientierungsblatt drucken oder als PDF sichern</button><span class="hinweis">Zwei Seiten A4.</span></div>
  ${weiter("start", "Zur Übersicht")}`;
}
const raster_ = pfad => { return raster(pfad, 90, "Selbstprüfung", [["Drei Faktoren", "Ich nenne einen Faktor.", "Ich nenne Ideologien, Machtinteressen und Handlungsspielräume je mit Beispiel.", "Ich gewichte die drei Faktoren gegeneinander."],["Vernetzung", "Ich zähle Ereignisse auf.", "Ich verbinde mindestens drei Ereignisse mit „weil“ oder „deshalb“.", "Ich verbinde Ebenen: Welt, Europa, Deutschland."],["Perspektive und Erinnerung", "Ich erzähle aus einer Sicht.", "Ich nenne zwei Sichtweisen auf dasselbe Ereignis.", "Ich zeige, wie heute verschieden erinnert wird, und nenne meinen Standort."]]); };

/* Für Lehrkräfte: Der Text liegt verschlüsselt in lk/ (Klartext nicht im Repository). Anzeige und Schloss: src/lk-schloss.js. */

AKTION.kzeig = t => karteDialog(t.dataset.w);
AKTION.kverbind = t => { S.entwurf.a = t.dataset.w; if (S.entwurf.b === t.dataset.w) S.entwurf.b = KARTEN.find(k => k.id !== t.dataset.w).id; S.entwurf.satz = ""; speichere(); geh("netz"); };
AKTION.ordrein = t => { S.ordnen.folge.push(t.dataset.w); S.ordnen.gepr = false; speichere(); zeichneBehalte(); };
AKTION.ordraus = t => { S.ordnen.folge = S.ordnen.folge.filter(x => x !== t.dataset.w); S.ordnen.gepr = false; speichere(); zeichneBehalte(); };
AKTION.ordpruef = () => { S.ordnen.gepr = true; S.ordnen.n++; speichere(); zeichneBehalte(); };
AKTION.ordzeig = () => { S.ordnen.zeig = true; S.ordnen.gepr = true; speichere(); zeichneBehalte(); };
AKTION.ordneu = () => { S.ordnen = { folge:[], gepr:false, n:0, zeig:false }; speichere(); zeichneBehalte(); };
AKTION.linkneu = () => { if (!linkBereit()) return; const e = S.entwurf; S.links.push({ a:e.a, b:e.b, art:e.art, satz:e.satz.trim() }); S.entwurf.satz = ""; speichere(); zeichneBehalte(); };
AKTION.linkweg = t => { S.links.splice(+t.dataset.w, 1); speichere(); zeichneBehalte(); };
const SEITE_FN = { start, raster:zeitraster, ordnen, netz, glossar, faden, lehrkraft };
kernStart();
</script>
</body>
</html>
