function bildFig(id, o = {}){
  const b = BILDER[id]; if (!b || FEHLT.has(id)) return "";

}
function band(bild, ob, titel, text){

  <div class="karte" id="vorhersage"><div class="g"><div class="g-wahl" ${zu ? 'data-zu=""' : ""}><fieldset><legend>Meine Vorhersage</legend>${KARTE_OPTIONEN.map((l, i) => `<label class="g-option"><input type="radio" name="karte" value="${i}" data-karte ${k.wahl === i ? "checked" : ""} ${zu ? "disabled" : ""}><span>${esc(l)}</span></label>`).join("")}</fieldset>

  <div class="g-wahl__fuss">${zu ? `<span class="g-stempel">Festgelegt</span>` : `<button class="g-knopf g-knopf--primaer" data-kartefest ${k.wahl === null || k.grund.trim().length < 8 ? "disabled" : ""}>Zahlen zeigen</button><span class="hinweis" id="kartehinweis">${k.wahl === null ? "Land wählen und einen Satz schreiben." : (k.grund.trim().length < 8 ? "Jetzt noch einen Satz schreiben." : "")}</span>`}</div></div></div></div>
  ${zu ? `<div class="aufdeck" id="aufdeck"><p class="kennung"><span class="status beleg">Beleg</span>Anteil der Ermordeten an der jüdischen Bevölkerung vor der Verfolgung</p>
  <p>Deine Vorhersage: <b>${esc(KARTE_OPTIONEN[k.wahl])}</b>. ${k.wahl === 0 ? "Das trifft: In Dänemark überlebten über 98 Prozent." : "Die niedrigste Rate der vier hat Dänemark – unter 2 Prozent. Die höchste Rate hat die Niederlande."}</p>
  <div class="g" style="margin-top:.8rem"><div class="g-balken" id="balken" role="img" aria-label="Balken: Anteil der Ermordeten je Land, von Dänemark unter 2 Prozent bis Polen 83 bis 90 Prozent">${balken}</div></div>
  <p class="quelle">Zahlen: United States Holocaust Memorial Museum, Holocaust Encyclopedia, „Jewish Losses by Country“ (Bestand vor der Verfolgung · Ermordete). Die Prozente sind hier gerundet berechnet; bei Spannen steht die Spanne. Ungarn in den Grenzen von 1941. Bulgarien fehlt in der Reihe: Im Kernland wurde niemand deportiert, aus den von Bulgarien besetzten Gebieten 11.343 Menschen – dazu später mehr.</p>
  <div class="feldgruppe"><label>Was fällt dir auf – und welche Frage ergibt sich daraus?<textarea data-feld="kartefrage" rows="3" placeholder="Mir fällt auf, dass … Daraus ergibt sich die Frage: …">${esc(k.frage)}</textarea></label></div>
  <details class="hilfe"><summary>Hilfe: Woran könnte es liegen?</summary><p>Alle diese Länder waren besetzt oder mit Deutschland verbündet. Trotzdem unterscheiden sich die Raten um das Vierzigfache. Die Frage dieser Stunde: Welche Merkmale einer Gesellschaft haben geschützt – und welche nicht?</p></details></div>` : ""}
  ${weiter("daenemark", "Weiter: Dänemark 1943", { aus: !zu, hinweis: zu ? undefined : "Erst festlegen, dann weiter." })}`;
}

function daenemark(){
  const li = DK_ZEIT.map((z, i) => `<li ${i === (S.zeit || 0) ? "data-hier" : ""} data-mehr="${esc(z.mehr)}"><button type="button" data-zeit="${i}"><span class="g-zeit__jahr">${esc(z.jahr)}</span><span class="g-zeit__text">${esc(z.text)}</span></button></li>`).join("");
  const z = DK_ZEIT[S.zeit || 0];
  return `${zeitKopf("daenemark")}<h1>Dänemark 1943</h1>
  <p class="lead">Im August 1943 leben etwa 7.500 Jüdinnen und Juden in Dänemark, fast alle in Kopenhagen. Sie tragen keinen Stern, ihre Geschäfte sind offen, ihre Kinder gehen zur Schule. Sechs Wochen später sind fast alle in Schweden. Wie ging das so schnell?</p>
  ${auftrag("Bewegung · Zeit ziehen", "Wie wurde aus Sicherheit Flucht?", "Tipp die Stationen an oder geh mit der Tastatur durch. Lies zu jeder, was sich geändert hat. Danach schiebst du den Vorher-nachher-Vergleich hin und her.")}
  <div class="karte"><p class="kennung"><span class="status beleg">Beleg</span>Zeitleiste nach USHMM, „Rescue in Denmark“</p>
  <div class="g"><ol class="g-zeit" data-g="zeit" id="dkzeit">${li}<span class="g-zeit__hier">Du bist hier</span></ol><p class="sr" aria-live="polite"></p></div>
  <div class="aufdeck" id="zeittext" style="margin-top:1.2rem"><p class="kennung">${esc(z.jahr)} · ${esc(z.text)}</p><p>${esc(z.mehr)}</p></div></div>

  <h2 class="abschnitt">Vorher – nachher</h2>
  <p>Zieh den Griff nach links: Der Oktober schiebt sich über den August. Die Zahlen bleiben daneben stehen; die Bewegung zeigt nur, wie wenig Zeit dazwischen lag.</p>
  <div class="karte"><div class="g"><div class="g-schieber" data-g="schieber" data-vorher="August 1943" data-nachher="Oktober 1943" data-autoplay data-dauer="4">
    <div class="g-schieber__buehne" role="img" aria-label="Vorher-nachher-Vergleich: August 1943, etwa 7.500 Jüdinnen und Juden leben in Dänemark ohne Sondergesetze. Oktober 1943: rund 7.200 sind in Schweden, etwa 470 nach Theresienstadt deportiert.">
      <div class="g-schieber__vor"><span class="g-schieber__marke">August 1943</span><span class="zahl">≈ 7.500</span><p>leben in Dänemark – ohne Stern, ohne Register, mit Regierung, König und Polizei, die sich an die Zusage von 1940 halten.</p></div>
      <div class="g-schieber__nach"><span class="g-schieber__marke">Oktober 1943</span><span class="zahl">≈ 7.200</span><p>sind in Schweden, etwa 700 nichtjüdische Angehörige dazu. Etwa 470 Menschen wurden gefasst und nach Theresienstadt deportiert.</p></div>
      <div class="g-schieber__griff"></div>
    </div>
    <label>Vergleich ziehen<input type="range" min="0" max="100" step="any" value="100" aria-label="Vorher–nachher: ganz rechts August 1943, ganz links Oktober 1943"></label>
    <div class="reihe"><button type="button" class="g-knopf g-knopf--sekundaer" data-g-abspielen aria-pressed="false">Hin und her</button><span class="g-schieber__stand"></span></div>
    <span class="sr" aria-live="polite"></span>
  </div></div><p class="quelle">Zahlen: USHMM, „Rescue in Denmark“ (etwa 7.200 Jüdinnen und Juden und rund 700 Angehörige nach Schweden; 470 Deportierte, von denen alle bis auf 51 überlebten).</p></div>

  <h2 class="abschnitt">Einer von ihnen: Bent Melchior, 14</h2>
  <p>Sein Vater ist Rabbiner in Kopenhagen. Was er erlebte, erzählt er als alter Mann im Kurzfilm „Voices in the Void“ (2021). Fünf Stationen, nach seiner Erzählung:</p>
  ${MELCHIOR.map((m, i) => `<div class="karte"><p class="kennung">${i + 1} · ${esc(m.t)}</p><p>${esc(m.s)}</p></div>`).join("")}
  <blockquote>„Überlasst es nicht anderen – tut es selbst.“<span class="wer">Bent Melchior (1929–2021), später Oberrabbiner Dänemarks, zitiert im Heft M23</span></blockquote>
  <div class="feldgruppe"><label>Was war an Dänemark anders? Notiere drei Stichworte – du brauchst sie gleich.<textarea data-feld="idee" rows="3" placeholder="1. … 2. … 3. …">${esc(S.ablauf.idee)}</textarea></label></div>
  ${weiter("saeulen", "Weiter: Sechs Säulen")}`;
}

function saeulen(){
  const n = DK_FAKTEN.filter(f => (S.saeulen[f.id] || {}).zu).length;
  return `${zeitKopf("saeulen")}<h1>Sechs Säulen</h1>
  <p class="lead">Dein Heft bietet ein Modell an: sechs Merkmale, an denen man eine Gesellschaft unter Besatzung vergleichen kann. Es ist ein Werkzeug deiner Lehrkraft, keine Theorie aus der Forschung – also prüfe es.</p>
  <p class="kennung"><span class="status modell">Modell</span>Sechs Säulen – Was schützt eine Gesellschaft?</p>
  <div class="saeulen" id="saeulen-modell">${SAEULEN.map((s, i) => `<div class="saeule"><b>${i + 1} · ${esc(s.name)}</b><span class="kf">${esc(s.kern)}</span><span>${esc(s.was)}</span></div>`).join("")}</div>
  ${auftrag("Muster 3 · Zuordnen mit Begründung", "Sechs Fakten aus Dänemark – welche Säule trägt sie?", "Zu jedem Fakt werden dir drei Säulen angeboten. Wähle die, die den Fakt am besten erklärt, begründe in einem Satz, leg fest. Dann siehst du zu jeder der drei Säulen, wie gut sie passt. Es gibt keine „falsche“ Zuordnung – aber eine, die am meisten erklärt.")}
  ${DK_FAKTEN.map((f, i) => `<div class="karte" id="w-${f.id}"><p class="kennung">Fakt ${i + 1}</p><p><b>${esc(f.fakt)}</b></p>${gWahl("saeulen", f.id, "Welche Säule erklärt diesen Fakt am stärksten?", f.optionen, { saeulen:true })}</div>`).join("")}
  <p class="hinweis" id="saeulenstand">${n} von 6 festgelegt.${n >= 4 ? " Weiter ist frei." : " Ab vier geht es weiter."}</p>
  <details class="hilfe"><summary>Was lässt dieses Modell weg?</summary><p>Das Modell sortiert Bedingungen. Es sagt nichts über den Einzelnen: Ein Fischer, der Geld nimmt, und einer, der umsonst fährt, stehen in derselben Säule. Es erklärt auch nicht, warum ausgerechnet <em>diese</em> Nachbarn halfen und andere nicht. Dafür brauchst du den Blick aus M22 – und die Position am Ende der Stunde.</p></details>
  ${weiter("vergleich", "Weiter: Drei Länder", { aus: n < 4, hinweis: n < 4 ? "Mindestens vier Fakten zuordnen, dann weiter." : undefined })}`;
}

function vergleich(){
  const n = LAENDER.filter(l => (S.laender[l.id] || {}).zu).length;
  return `${zeitKopf("vergleich")}<h1>Drei Länder</h1>
  <p class="lead">Dänemark ist der Ausnahmefall. Drei andere Länder zeigen, was passiert, wenn eine oder mehrere Säulen fehlen – oder wenn ein Staat in beide Richtungen handelt.</p>
  ${auftrag("Muster 3 · Zuordnen mit Begründung", "Welche Säule erklärt am stärksten?", "Lies die vier Fakten je Land. Wähle die Säule, begründe, leg fest. Dann siehst du die Erklärung zu allen drei Angeboten.")}
  <div class="laender">${LAENDER.map(l => `<div class="land"><p class="kennung">${esc(l.land)}</p><p class="rate">${esc(l.rate)}<small>${esc(l.unter)}</small></p><p class="hinweis"><b>Besatzung:</b> ${esc(l.besatzung)}</p><ul>${l.fakten.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`).join("")}</div>
  <p class="quelle">Zahlen und Abläufe: USHMM Holocaust Encyclopedia, Artikel „The Netherlands“, „Bulgaria“, „Hungary after the German Occupation“ und „Jewish Losses by Country“.</p>
  ${LAENDER.map(l => `<div class="karte" id="w-${l.id}"><p class="kennung">${esc(l.land)}</p>${gWahl("laender", l.id, esc(l.frage), l.optionen, { saeulen:true })}</div>`).join("")}

  <h2 class="abschnitt">Dein Vergleich</h2>
  ${auftrag("Eigene Sätze", "Wo waren die Opferraten am niedrigsten, wo am höchsten?", "Zwei Sätze, mit Säulen aus dem Modell. Danach kannst du sie mit der Fassung deiner Lehrkraft vergleichen.")}
  <div class="feldgruppe"><label>Die Opferraten waren dort am niedrigsten, wo …<textarea data-feld="nied" rows="2">${esc(S.nied)}</textarea></label>
  <label>Die Opferraten waren dort am höchsten, wo …<textarea data-feld="hoch" rows="2">${esc(S.hoch)}</textarea></label></div>
  ${(S.nied.trim().length >= 15 && S.hoch.trim().length >= 15) ? `<div class="aufdeck"><p class="kennung"><span class="status modell">Fassung der Lehrkraft</span>Aus dem Erwartungshorizont M23</p><div class="zwei"><div class="alt"><b>Am niedrigsten, wo …</b><ul style="padding-left:1.1rem;margin-top:.3rem"><li>staatliche Strukturen intakt blieben und sich schützend vor ihre Bürger stellten,</li><li>Gleichheit und demokratische Tradition fest verankert waren,</li><li>Juden als Mitbürger galten, nicht als „Andere“,</li><li>Staat und Zivilgesellschaft zusammen handelten – „von oben“ und „von unten“.</li></ul></div><div class="alt"><b>Am höchsten, wo …</b><ul style="padding-left:1.1rem;margin-top:.3rem"><li>lokale Behörden aktiv mitarbeiteten oder selbst verfolgten,</li><li>Deutschland direkt kontrollierte, besonders durch SS-Zivilverwaltung,</li><li>Antisemitismus tief verwurzelt und staatlich gefördert war,</li><li>Vernichtungslager auf eigenem Boden standen (Polen).</li></ul></div></div><p class="hinweis" style="margin-top:.6rem">Was steht bei dir, das hier fehlt? Was hier, das du nicht hast? Markiere es für das Plenum.</p></div>` : `<p class="hinweis">Sobald beide Sätze stehen, erscheint die Fassung deiner Lehrkraft zum Vergleich.</p>`}
  ${weiter("position", "Weiter: Deine Position", { aus: n < 2, hinweis: n < 2 ? "Mindestens zwei Länder festlegen, dann weiter." : undefined })}`;
}

function position(){
  const m22 = m22Position(), p = S.pos;
  const n = S.urteil.trim().split(/\s+/).filter(Boolean).length;
  return `${zeitKopf("position")}<h1>Deine Position</h1>
  <p class="lead">Dänemark zeigt: Bedingungen entscheiden mit. Bent Melchior sagt: Entscheide selbst. Beides steht nebeneinander. Wo stehst du?</p>
  <div class="zwei">${["A","B"].map(k => { const P = POSITIONEN[k]; return `<div class="karte" style="margin:0"><p class="kennung">Position ${k} · ${esc(P.unter)}</p><h3 class="klein" style="margin-top:0">${esc(P.titel)}</h3><p><em>${esc(P.these)}</em></p><ul style="padding-left:1.1rem;margin-top:.5rem;display:grid;gap:.25rem;font-size:.95rem">${P.arg.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`; }).join("")}</div>
  ${auftrag("Skala mit Bezugsmarke", "Umwelt oder Ich?", "Setz den Regler. Danach kannst du deine Marke aus M22 einblenden: Dort hast du dich zwischen „Person“ und „Umstände“ positioniert – für die Täter. Jetzt geht es um alle, auch um dich.")}
  <div class="karte"><div class="g"><div class="g-skala" data-g="skala" data-referenz="${m22 ?? 50}" id="skala">
    <div class="g-skala__spur"><input type="range" min="0" max="100" value="${p.wert}" step="1" data-pos aria-label="Position zwischen Umwelt (0) und Ich (100)"><span class="g-skala__ref" ${p.ref && m22 !== null ? `style="left:${m22}%"` : "hidden"}></span></div>
    <div class="g-skala__enden"><span>A · Die Umgebung entscheidet</span><span>B · Ich entscheide</span></div>
    <p>Dein Wert: <span class="g-skala__wert"></span></p>
    <div class="reihe">${m22 !== null ? `<button type="button" class="g-knopf g-knopf--sekundaer" data-g-vergleichen ${p.ref ? "disabled" : ""}>Marke aus M22 zeigen</button><span class="g-skala__ref-text" ${p.ref ? "" : "hidden"}>M22, Täter: ${m22 < 35 ? "eher Person" : (m22 > 65 ? "eher Umstände" : "dazwischen")} (${m22})</span>` : `<span class="hinweis">Keine Marke aus M22 auf diesem Gerät gefunden. Du kannst die Position aus deinem Heft nehmen.</span>`}</div>
  </div></div></div>
  <p class="hinweis">Die Skala in M22 lief von „Person“ (links) nach „Umstände“ (rechts). Hier ist es umgekehrt: Umgebung links, Ich rechts. Die Marke wird nicht gespiegelt – vergleiche also die Richtung, nicht die Zahl.</p>

  <h2 class="abschnitt">Dein Urteil</h2>
  ${auftrag("Muster 10 · Satzanfänge → Raster", "Vier Sätze", "Nimm die Satzanfänge oder deine eigenen. Nenne mindestens ein Land und eine Säule. Ab 40 Wörtern erscheint das Raster.")}
  <div class="satzanfaenge nodruck">${SATZANFAENGE.map(a => `<button type="button" data-anfang="${esc(a)}">${esc(a)} …</button>`).join("")}</div>
  <textarea id="urteil" data-feld="urteil" rows="7" aria-label="Dein Urteil">${esc(S.urteil)}</textarea><p class="hinweis">${n} Wörter. Ab 40 Wörtern erscheint das Raster.</p>
  ${n >= 40 ? `<div class="raster3" id="raster"><div><b>Grundlegend</b>Du nennst eine Position und ein Land.</div><div><b>Sicher</b>Du begründest mit einer Säule und einem Fakt aus der Stunde.</div><div><b>Souverän</b>Du zeigst, was die andere Position richtig sieht – und was dein Vergleich (Länder) über das Einzelne (Melchior) hinaus zeigt.</div></div>` : ""}
  ${weiter("plenum", "Weiter: Plenum")}`;
}

function plenum(){
  return `${zeitKopf("plenum")}<h1>Plenum</h1>
  <p class="lead">iPad zu. Drei Fragen für das Gespräch – deine Lehrkraft wählt aus.</p>
  <div class="karte"><ol style="padding-left:1.3rem;display:grid;gap:.6rem">
  <li><b>Die Säule, die am meisten erklärt:</b> Welche habt ihr bei Dänemark am häufigsten gewählt – und welche bei den Niederlanden? Ist es dieselbe?</li>
  <li><b>Bulgarien:</b> Derselbe Staat liefert 11.343 Menschen aus und schützt 50.000. Was heißt das für das Modell?</li>
  <li><b>Umwelt oder Ich:</b> Wer hat die Marke aus M22 gesehen und sich bewegt? In welche Richtung – und warum?</li></ol></div>
  <p class="merksatz">Dänemark war kein Land besserer Menschen. Es war ein Land, in dem Helfen leichter war – und in dem trotzdem jemand anfangen musste.</p>
  ${weiter("zusammenfassung", "Zur Zusammenfassung")}`;
}

function zusammenfassung(){
  return `<div class="zf"><div class="reihe nodruck"><button class="btn" data-drucken>Drucken (2 Seiten A4)</button><span class="hinweis">Zum Abheften im Ordner. Deine Eingaben sind als Felder dabei.</span></div>
  <p class="zeit"><span class="nr">GGK · M23</span><span>Zusammenfassung</span></p>
  <h1>Die Gesellschaft, in der ich leb(t)e?</h1>
  <p class="leitfrage">Wenn es keine Monster brauchte – was brauchte es dann?</p>
  <h2>Opferraten (Auswahl)</h2>
  <div class="matrix-wrap"><table><thead><tr><th>Land</th><th>Anteil Ermordete</th><th>Bevölkerung · Tote</th></tr></thead><tbody>${RATEN.filter(r => ["Dänemark","Frankreich","Belgien","Norwegen","Ungarn (1941)","Niederlande","Polen"].includes(r.land)).map(r => `<tr><td>${esc(r.land)}</td><td class="n">${esc(r.text)}</td><td class="n">${esc(r.n)}</td></tr>`).join("")}<tr><td>Bulgarien</td><td class="n">Kernland 0</td><td class="n">11.343 aus besetzten Gebieten deportiert</td></tr></tbody></table></div>
  <p class="quelle">USHMM, „Jewish Losses by Country“; Raten gerundet berechnet.</p>
  <h2>Dänemark 1943 in sechs Stationen</h2>
  <div class="matrix-wrap"><table><tbody>${DK_ZEIT.map(z => `<tr><td class="n"><b>${esc(z.jahr)}</b></td><td>${esc(z.mehr)}</td></tr>`).join("")}</tbody></table></div>
  <h2>Sechs Säulen (Modell)</h2>
  <div class="saeulen">${SAEULEN.map((s, i) => `<div class="saeule"><b>${i + 1} · ${esc(s.name)}</b><span class="kf">${esc(s.kern)}</span></div>`).join("")}</div>
  <div class="seitenumbruch"></div>
  <h2>Meine Zuordnungen</h2>
  <div class="matrix-wrap"><table><thead><tr><th>Fakt / Land</th><th>Meine Säule</th><th>Begründung</th></tr></thead><tbody>
  ${DK_FAKTEN.map((f, i) => { const st = S.saeulen[f.id] || {}; return `<tr><td>Dänemark, Fakt ${i + 1}</td><td>${st.zu ? esc(SAEULE(f.optionen[st.o][0]).name) : "–"}</td><td>${esc(st.grund || "")}</td></tr>`; }).join("")}
  ${LAENDER.map(l => { const st = S.laender[l.id] || {}; return `<tr><td>${esc(l.land)}</td><td>${st.zu ? esc(SAEULE(l.optionen[st.o][0]).name) : "–"}</td><td>${esc(st.grund || "")}</td></tr>`; }).join("")}</tbody></table></div>
  <h2>Mein Vergleich</h2>
  <div class="zw"><div class="karte"><b>Am niedrigsten, wo …</b><p>${esc(S.nied) || "–"}</p></div><div class="karte"><b>Am höchsten, wo …</b><p>${esc(S.hoch) || "–"}</p></div></div>
  <h2>Meine Position: ${S.pos.wert} (0 = Umgebung, 100 = Ich)</h2>
  <div class="karte"><p>${esc(S.urteil) || "–"}</p></div>
  <h2>Abrufübung (für die nächste Stunde)</h2>
  ${ABRUFZ.map(a => gWahl("abrufz", a.id, esc(a.frage), a.optionen, { ohneGrund:true, mind:0 })).join("")}
  <p class="merksatz">Nicht die besseren Menschen – die besseren Bedingungen. Und jemand, der anfängt.</p>
  </div>${weiter("start", "Zur Startseite")}`;
}

function lehrkraft(){
  return `<p class="zeit"><span class="nr">Für Lehrkräfte</span><span>M23 · Die Gesellschaft, in der ich leb(t)e?</span></p>
  <h1>Lehrkraft-Ansicht</h1>
  <p class="lead">Was die Seite anders macht als das Heft, was du vor dem Kopieren prüfen solltest, und was nur du kannst.</p>
  <h2 class="abschnitt">Ablauf (90 Minuten, Variante B)</h2>
  <div class="matrix-wrap"><table><thead><tr><th>Min.</th><th>Phase</th><th>Muster / Bewegung</th><th>Papierprobe</th></tr></thead><tbody>
  <tr><td class="n">0–10</td><td>Die Karte</td><td>1 Vorhersage → Auflösung; Balken (Gegenwart)</td><td>Zahlen erst nach der Festlegung → Lernmehrwert</td></tr>
  <tr><td class="n">10–32</td><td>Dänemark 1943</td><td>Zeitleiste „Du bist hier“; Vorher–nachher-Schieber mit Autoplay (Bewegung ist Lerngegenstand)</td><td>Verlauf und Tempo sind der Gegenstand → Lernmehrwert; Melchior-Stationen gingen auch auf Papier</td></tr>
  <tr><td class="n">32–50</td><td>Sechs Säulen</td><td>3 Zuordnen mit Begründung (6 Fakten × 3 Säulen)</td><td>Erklärung je Säule erst nach Festlegung → Lernmehrwert</td></tr>
  <tr><td class="n">50–68</td><td>Drei Länder</td><td>3 Zuordnen; eigene Sätze vor der Lehrkraft-Fassung</td><td>Vergleich erst nach eigenem Text → Lernmehrwert</td></tr>
  <tr><td class="n">68–80</td><td>Position</td><td>Skala mit Bezugsmarke aus M22; 10 Satzanfänge → Raster</td><td>Marke aus M22 kann nur das Gerät → Lernmehrwert</td></tr>
  <tr><td class="n">80–90</td><td>Plenum</td><td>analog</td><td>Gespräch</td></tr></tbody></table></div>
  <h2 class="abschnitt">Vor dem Kopieren prüfen</h2>
  <ul style="padding-left:1.2rem;display:grid;gap:.4rem">
  <li><b>Opferraten:</b> Die Seite rechnet aus den USHMM-Zahlen („Jewish Losses by Country“). Der Erwartungshorizont im Heft nennt Belgien 40 % und Norwegen 35 %; nach USHMM sind es etwa 27 % (24.400 von 90.000) und etwa 42 % (758 von 1.800). Frankreich 25 % im Heft, hier „etwa 23 %“. Rumänien („variabel“) ist weggelassen, weil die USHMM-Tabelle dafür keine belastbare Gesamtzahl gibt.</li>
  <li><b>„11 Millionen“</b> aus der Wannsee-Konferenz steht nicht auf der Seite; die Zahl ist die Planungsgröße des Protokolls, nicht die Zahl der Bedrohten (siehe M21).</li>
  <li><b>Dänemark:</b> 470 Deportierte (USHMM) statt 472 (Heft); „rund 7.200“ statt 7.056; Dauer und Bezahlung der Überfahrten nach USHMM. Der Protestbrief der Bischöfe vom 3. Oktober 1943 ist belegt.</li>
  <li><b>Bulgarien:</b> Die Seite nennt beides – Rettung im Kernland und Auslieferung von 11.343 Menschen aus Thrakien, Makedonien und Pirot. Das Heft hat Bulgarien nicht in der Tabelle; so wird aus der „Rettung“ keine Heldengeschichte.</li>
  <li><b>Ungarn:</b> Raten in den Grenzen von 1941 (825.000), nicht in denen von 1938. Das macht einen Unterschied von mehreren Hunderttausend.</li>
  <li><b>Das Video</b> „Voices in the Void“ (18 Min., YouTube) ist nicht verlinkt: keine externen Links in der Arbeitsphase. Wenn du es zeigen willst: am Beamer, vor der Zeitleiste (dann 10–32 Min. auf 10–40 strecken und das Melchior-Kapitel auf der Seite überspringen).</li>
  <li><b>Die Säulen</b> sind als Modell gekennzeichnet (dein Werkzeug), nicht als Forschungsstand. Die Hilfe „Was lässt dieses Modell weg?“ ist die Brücke zu M22.</li>
  <li><b>Position A / B</b> sind aus dem Heft übernommen. Die Skala ist bewusst gegenläufig zu M22 beschriftet (dort Person ↔ Umstände, hier Umgebung ↔ Ich); ein Hinweis auf der Seite sagt das. Wenn dich das stört: In der Datei <code>data-referenz</code> auf <code>100 − pos</code> setzen.</li>
  <li><b>KI-Quellen:</b> Die 67 Quellen des Hefts (Perplexity, darunter Reddit und Wikipedia) sind nicht übernommen. Alle Zahlen auf der Seite stammen aus der USHMM Holocaust Encyclopedia.</li></ul>
  <h2 class="abschnitt">Gegenwart-Probe</h2>
  <p>Diese Stunde nutzt zum ersten Mal die Bausteine des Design-Systems „Gegenwart“ (Wahl, Balken, Zeitleiste, Schieber, Skala) in den Farben des GGK-Labors. Farben, Wortmarke und Metapher bleiben die des Projekts; die Bausteine laufen über Tokens (<code>assets/gegenwart/</code>). Schalter „Weniger Bewegung“ unten setzt beide Systeme um.</p>
  <h2 class="abschnitt">Nur du kannst das</h2>
  <ul style="padding-left:1.2rem;display:grid;gap:.4rem"><li>Das Moral-Ranking abfangen: Wenn „die Dänen waren halt besser“ fällt, Fakt 6 (Bezahlung) und Bulgarien aufrufen.</li><li>Die Brücke zu M22: Die Marke aus M22 ist nur auf demselben Gerät sichtbar. Frag im Plenum, wer sich bewegt hat.</li><li>Lernende, die bei der Karte „Dänemark“ vorhersagen, weil sie es schon wissen: Die Begründung zählt, nicht der Treffer.</li></ul>

  <p class="hinweis" style="margin-top:1rem">Speicherschlüssel <code>${KEY}</code>; M22-Marke aus <code>ggk-m22-taeter:v2</code>. Eingaben bleiben im Browser des Geräts.</p>

}

/* ---------- Zeichnen ---------- */
const SEITE_FN = { start, karte, daenemark, saeulen, vergleich, position, plenum, zusammenfassung, lehrkraft };
function loeschBereich(){
  return `<div class="loesch nodruck"><button class="btn" data-loeschfrage>Eingaben löschen</button><label class="g-schalter" style="font-family:var(--body)"><input type="checkbox" role="switch" data-bewegung ${S.ruhig ? "checked" : ""}> Weniger Bewegung</label><span>Alles bleibt auf diesem Gerät.</span>
  <div id="loesch-frage" hidden class="loesch-frage"><p><b>Wirklich alles löschen?</b> Vorhersage, Zuordnungen, Sätze, Position und Urteil werden auf diesem Gerät entfernt.</p><div class="reihe"><button class="btn primary" data-loeschen="ja">Ja, alles löschen</button><button class="btn" data-loeschen="nein">Abbrechen</button></div></div></div>`;
}
let LETZTE_SEITE = null;
function zeichne(fokus){
  if (!SEITE_FN[S.seite]) S.seite = "start";
  document.documentElement.classList.toggle("ruhig", !!S.ruhig);
  if (S.ruhig) document.documentElement.setAttribute("data-bewegung", "weniger"); else document.documentElement.removeAttribute("data-bewegung");
  kopf();
  const m = document.getElementById("main");
  m.classList.toggle("breit", ["lehrkraft", "zusammenfassung", "vergleich", "saeulen", "position"].includes(S.seite));
  m.innerHTML = SEITE_FN[S.seite]() + loeschBereich();
  window.Gegenwart && Gegenwart.init(m);
  nachInit();
  if (LETZTE_SEITE !== S.seite) { const b = document.getElementById("band"); if (b && b.classList.contains("mit")) neu(b, "neu"); }
  LETZTE_SEITE = S.seite;
  if (fokus) { m.focus({ preventScroll:true }); window.scrollTo(0, 0); }
}
/* Festlegen erst mit Wahl und Begründung (der Baustein allein ließe eine leere Begründung durch) */
function pruefeWahl(w){
  if (w.hasAttribute("data-zu")) return;
  const gew = w.querySelector("input:checked"), ta = w.querySelector("textarea"), f = w.querySelector("[data-g-festlegen]");
  if (f) f.disabled = !gew || (ta && ta.value.trim().length < 8);
}
/* Nach Gegenwart.init: Zustände aus S wiederherstellen, die der Baustein nicht selbst speichert */
function nachInit(){
  document.querySelectorAll(".g-wahl[data-feld]").forEach(pruefeWahl);
  schieberEinmal();
  document.querySelectorAll(".g-wahl[data-feld]").forEach(w => {
    const st = S[w.dataset.feld][w.dataset.id] || {};
    if (st.zu) { w.querySelectorAll("input").forEach(i => { i.disabled = true; }); const f = w.querySelector("[data-g-festlegen]"); if (f) f.disabled = true; }
  });
  const sk = document.getElementById("skala"); if (sk && S.pos.ref) { const k = sk.querySelector("[data-g-vergleichen]"); if (k) k.disabled = true; }
  const u = document.getElementById("urteil"); if (u) u.nextElementSibling.textContent = `${S.urteil.trim().split(/\s+/).filter(Boolean).length} Wörter. Ab 40 Wörtern erscheint das Raster.`;
}
/* Der Schieber des Bundles pendelt endlos; nach den Regeln aus »bewegung-als-lernmittel« pendelt er höchstens einmal (hin und zurück) und steht dann. */
function schieberEinmal(){
  const el = document.querySelector(".g-schieber[data-g]"); if (!el) return;
  const r = el.querySelector("input[type=range]"), k = el.querySelector("[data-g-abspielen]"), aus = el.querySelector(".g-schieber__stand"); let oben = false;
  /* Der Griff ist die Grenze: links davon der Oktober, rechts der August – der Stand sagt es so, wie es zu sehen ist */
  const stand = () => { const p = Math.round(+r.value); if (aus) aus.textContent = `${100 - p} % Oktober 1943 · ${p} % August 1943`; };
  r.addEventListener("input", stand); r.addEventListener("scrub", stand); stand();
  r.addEventListener("scrub", () => { const v = +r.value; if (v >= +r.max) oben = true; if (oben && v <= 0 && k && k.getAttribute("aria-pressed") === "true") { k.click(); oben = false; } });
  if (k) k.addEventListener("click", () => { oben = false; });
}
const geh = id => { S.seite = id; speichere(); zeichne(true); };
const halteScroll = fn => { const sy = window.scrollY; fn(); window.scrollTo(0, sy); };
const SEITENSTAND = { saeulen: () => { const n = DK_FAKTEN.filter(f => (S.saeulen[f.id] || {}).zu).length; const h = document.getElementById("saeulenstand"); if (h) h.textContent = `${n} von 6 festgelegt.${n >= 4 ? " Weiter ist frei." : " Ab vier geht es weiter."}`; const w = document.querySelector("[data-geh='vergleich'].primary"); if (w) { w.disabled = n < 4; w.previousElementSibling.textContent = n < 4 ? "Mindestens vier Fakten zuordnen, dann weiter." : "Dein Stand wird nur auf diesem Gerät gespeichert."; } },
  laender: () => { const n = LAENDER.filter(l => (S.laender[l.id] || {}).zu).length; const w = document.querySelector("[data-geh='position'].primary"); if (w) { w.disabled = n < 2; w.previousElementSibling.textContent = n < 2 ? "Mindestens zwei Länder festlegen, dann weiter." : "Dein Stand wird nur auf diesem Gerät gespeichert."; } } };

/* ---------- Ereignisse ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button, [data-geh]"); if (!t) return;
  const d = t.dataset, tast = ev.detail === 0;
  if (d.geh) { ev.preventDefault(); geh(d.geh); return; }
  if ("loeschfrage" in d) { const f = document.getElementById("loesch-frage"); f.hidden = false; f.querySelector("button").focus(); return; }
  if (d.loeschen === "nein") { document.getElementById("loesch-frage").hidden = true; return; }
  if (d.loeschen === "ja") { try { localStorage.removeItem(KEY); } catch(e) {} location.reload(); return; }
  if ("kartefest" in d) { S.karte.zu = true; speichere(); halteScroll(zeichne); const a = document.getElementById("aufdeck"); if (!tast) neu(a, "neu"); a.scrollIntoView({ block:"start", behavior: ruhig() || tast ? "auto" : "smooth" }); if (!tast) balkenWachsen(); return; }
  if (d.zeit !== undefined) { S.zeit = +d.zeit; speichere(); const z = DK_ZEIT[S.zeit]; const box = document.getElementById("zeittext"); box.innerHTML = `<p class="kennung">${esc(z.jahr)} · ${esc(z.text)}</p><p>${esc(z.mehr)}</p>`; if (!tast) neu(box, "neu"); return; }
  if ("gFestlegen" in d || t.hasAttribute("data-g-festlegen")) { const w = t.closest(".g-wahl[data-feld]"); if (!w) return; const gew = w.querySelector("input:checked"); if (!gew) return; const feld = w.dataset.feld, id = w.dataset.id; S[feld][id] = { o: +gew.value, grund: (w.querySelector("textarea") || {}).value || "", zu: true }; speichere(); w.querySelector(".g-wahl__fuss").insertAdjacentHTML("beforeend", `<button type="button" class="btn nodruck" data-neu-wahl>Noch einmal</button>`); if (SEITENSTAND[feld]) SEITENSTAND[feld](); return; }
  if ("neuWahl" in d) { const w = t.closest(".g-wahl[data-feld]"); delete S[w.dataset.feld][w.dataset.id]; speichere(); halteScroll(zeichne); return; }
  if (t.hasAttribute("data-g-vergleichen")) { S.pos.ref = true; speichere(); return; }
  if (d.anfang) { const ta = document.getElementById("urteil"); const v = ta.value; ta.value = (v && !v.endsWith("\n") && v.trim() ? v + "\n" : v) + d.anfang + " "; S.urteil = ta.value; speichere(); ta.focus(); return; }
  if ("drucken" in d) { window.print(); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if ("bewegung" in d) { S.ruhig = t.checked; speichere(); halteScroll(zeichne); return; }
  if ("karte" in d) { S.karte.wahl = +t.value; speichere(); karteKnopf(); return; }
  if (t.type === "radio" && t.closest(".g-wahl[data-feld]")) { const w = t.closest(".g-wahl"); const st = S[w.dataset.feld][w.dataset.id] || {}; S[w.dataset.feld][w.dataset.id] = Object.assign(st, { o: +t.value }); speichere(); pruefeWahl(w); return; }
});
function balkenWachsen(){ if (!window.Gegenwart) return; document.querySelectorAll("#balken .g-balken__wert").forEach((b, i) => Gegenwart.bewegen(b, [{ transform:"scaleX(0)" }, { transform:"scaleX(1)" }], { dauer:440, verzug:i * 30 })); document.querySelectorAll("#balken .g-balken__zahl").forEach((b, i) => Gegenwart.bewegen(b, [{ opacity:0 }, { opacity:1 }], { dauer:440, verzug:120 + i * 30, fade:true })); }
function karteKnopf(){ const b = document.querySelector("[data-kartefest]"); if (!b) return; const ok = S.karte.wahl !== null && S.karte.grund.trim().length >= 8; b.disabled = !ok; document.getElementById("kartehinweis").textContent = ok ? "" : (S.karte.wahl === null ? "Land wählen und einen Satz schreiben." : "Jetzt noch einen Satz schreiben."); }
document.addEventListener("input", ev => {
  const t = ev.target, d = t.dataset;
  if (d.feld === "kartegrund") { S.karte.grund = t.value; speichere(); karteKnopf(); return; }
  if (d.feld === "kartefrage") { S.karte.frage = t.value; speichere(); return; }
  if (d.feld === "idee") { S.ablauf.idee = t.value; speichere(); return; }
  if ("grundFeld" in d) { const w = t.closest(".g-wahl[data-feld]"); const st = S[w.dataset.feld][w.dataset.id] || {}; S[w.dataset.feld][w.dataset.id] = Object.assign(st, { grund: t.value }); speichere(); pruefeWahl(w); return; }
  if (d.feld === "nied" || d.feld === "hoch") { S[d.feld] = t.value; speichere(); if (S.nied.trim().length >= 15 && S.hoch.trim().length >= 15 && !document.querySelector(".zwei .alt")) halteScroll(zeichne); return; }
  if ("pos" in d) { S.pos.wert = +t.value; speichere(); return; }
  if (d.feld === "urteil") { S.urteil = t.value; speichere(); const n = t.value.trim().split(/\s+/).filter(Boolean).length; t.nextElementSibling.textContent = `${n} Wörter. Ab 40 Wörtern erscheint das Raster.`; if (n >= 40 && !document.getElementById("raster")) halteScroll(zeichne); return; }
});

zeichne();
</script>
