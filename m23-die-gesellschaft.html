@font-face{font-family:"Fraunces";src:url(assets/fonts/Fraunces72pt-SemiBoldItalic.woff) format("woff");font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(assets/fonts/AtkinsonHyperlegible-Bold.woff2) format("woff2");font-weight:700;font-display:swap}

/* Bewusst nur hell (Beamer, Druck), wie M18–M22. Farben und Formen aus dem Designsystem GGK-Labor.
   Die Bausteine von »Gegenwart« (assets/gegenwart/) laufen über Tokens – hier auf die Farben des GGK-Labors gesetzt. */
:root{
  color-scheme:light;
  --bg:#F3EFE7; --surface:#FAF8F3; --surface2:#FFFDF8; --offset:#E9E2D7; --line:#D5CEC3; --border:rgba(36,34,31,.14);
  --ink:#24221F; --muted:#5F5C56; --faint:#6A655E; --inverse:#FFFAF2; --dunkel:#1B1A17;
  --red:#9B402D; --red-hi:#EAD7CF; --green:#2E5A47; --green-hi:#D6E4DC; --gold:#7D5C12; --gold-hi:#EEE2BF;
  --kuli:#1E4FB5; --kuli-hi:#DCE5F7; --slate:#4B4F57; --slate-hi:#DFE1E5; --marker:#F3D54E;
  /* Säulenfarben (sechs, aus der GGK-Palette abgeleitet) */
  --s-inst:#2E5A47; --s-kult:#7D5C12; --s-sozi:#1E4FB5; --s-geo:#4B6F8F; --s-pol:#9B402D; --s-takt:#4B4F57;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:.75rem; --r-lg:1rem; --ease:cubic-bezier(.23,1,.32,1);
  /* Gegenwart-Tokens → GGK-Labor */
  --grund:var(--bg); --flaeche:var(--surface); --karton:var(--offset); --text:var(--ink); --leise:var(--muted); --stahl:#8F887D; --linie:var(--line);
  --petrol:var(--green); --petrol-hi:var(--green-hi); --auf-petrol:var(--inverse);
  --honig:var(--gold); --honig-hi:var(--gold-hi); --honigplatte:var(--gold-hi); --auf-honig:var(--ink);
  --ueberdruck:var(--slate); --auf-ueberdruck:var(--inverse);
  --oxid:var(--red); --oxid-hi:var(--red-hi);
  --erfolg:var(--green); --erfolg-hi:var(--green-hi); --warnung:var(--gold); --warnung-hi:var(--gold-hi); --fehler:var(--red); --fehler-hi:var(--red-hi);
  --font-display:var(--display); --font-stimme:var(--display); --font-text:var(--body);
  --radius-sm:.6rem; --radius-md:.75rem; --radius-pill:999px; --radius-none:0;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:28px;
  --knopf-hoehe:48px; --tablet-ziel:56px; --platte:6px 6px 0 0 var(--karton); --platte-knopf:4px 4px 0 0 var(--karton); --fokus-innen:inset 0 0 0 2px var(--grund);
  --dauer-druck:100ms; --dauer-schnell:140ms; --dauer-mittel:220ms; --dauer-langsam:300ms; --dauer-staffel:30ms; --dauer-wende:460ms; --dauer-aufdecken:420ms; --dauer-reihe:440ms; --dauer-aus:150ms;
  --kurve-aus:cubic-bezier(.23,1,.32,1); --kurve-beidseits:cubic-bezier(.77,0,.175,1); --kurve-feder:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea,[tabindex]{scroll-margin-top:140px}
html{-webkit-text-size-adjust:none;text-size-adjust:none;overflow-x:clip}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(1rem,.95rem + .25vw,1.125rem);line-height:1.58;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.14;text-wrap:balance}
p,li{text-wrap:pretty}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--kuli);outline-offset:3px;border-radius:.35rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:1ms!important}}
html[data-bewegung=weniger] *,html[data-bewegung=weniger] *::before,html[data-bewegung=weniger] *::after{animation:none!important;transition-duration:1ms!important}
@keyframes auf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.g{background:transparent;font-size:inherit;line-height:inherit}
.g .g-frage{font-size:clamp(1.2rem,1.05rem + .7vw,1.5rem)}
.g .g-knopf{min-height:48px}
.g-wahl legend{font-weight:700;font-family:var(--body);font-style:normal;font-size:1.05rem}
.g .g-option span{font-weight:700}
.g .g-option__urteil{font-weight:400;font-style:normal;font-size:.95rem;padding:0;border:0;min-height:0;background:transparent;box-shadow:none}
.g .g-option span span::before,.g .g-option span span::after{display:none!important}
.g .g-balken__zeile{grid-template-columns:minmax(6.5rem,10rem) 1fr 4.2rem}
.g .g-schieber{max-width:none}
.g .g-schieber>label{display:grid;gap:.2rem}.g .g-schieber input[type=range]{width:100%;accent-color:var(--kuli);height:32px}
.g .g-schieber__buehne{aspect-ratio:auto;min-height:14rem}
.g .g-schieber__vor,.g .g-schieber__nach{padding:2.6rem 1.2rem 1.2rem}
.g .g-schieber__vor p,.g .g-schieber__nach p{font-size:.98rem}
.g .g-schieber__vor .zahl,.g .g-schieber__nach .zahl{font:600 2.2rem/1 var(--display)}
.g .g-zeit{padding-top:34px}
@media (max-width:640px){.g .g-zeit{grid-auto-flow:row;grid-auto-columns:auto;gap:var(--space-3)}.g .g-zeit::before{display:none}}
.g .g-schalter input{margin:0}

/* Kopf mit Lernweg */
.kopf{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.kopf-in{max-width:1100px;margin:auto;padding:.55rem max(1.25rem,env(safe-area-inset-right,0px)) .55rem max(1.25rem,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:.6rem .9rem;flex-wrap:wrap}
.mark{width:32px;height:32px;flex:0 0 auto}
.titel{font-weight:700;line-height:1.2;margin-right:auto}.titel small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.pill{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:.45rem 1rem;font-weight:700;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.weg{max-width:1100px;margin:auto;padding:0 1.25rem .6rem;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none}
.weg button{flex:1 0 auto;min-width:7.4rem;border:0;border-top:3px solid var(--line);background:transparent;text-align:left;padding:.45rem .5rem .2rem;color:var(--faint);font-size:.85rem;line-height:1.25;min-height:48px}
.weg button b{display:block;color:inherit;font-size:.78rem}
.weg button.da{color:var(--muted);border-top-color:var(--muted)}
.weg button.akt{color:var(--ink);border-top-color:var(--red)}

main{max-width:46rem;margin:auto;padding:clamp(1.5rem,4vw,3rem) max(1.25rem,env(safe-area-inset-right,0px)) 5rem max(1.25rem,env(safe-area-inset-left,0px))}
main.breit{max-width:62rem}
.zeit{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;color:var(--red);font-weight:700;font-size:.95rem}
.zeit .nr{font-family:var(--display);font-size:1.1rem}
h1{font-size:clamp(2rem,1.4rem + 2.4vw,3.1rem);margin:.5rem 0 .7rem}
.leitfrage{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(1.35rem,1.1rem + .9vw,1.8rem);color:var(--muted);margin-bottom:1.4rem}
.lead{font-size:clamp(1.1rem,1rem + .5vw,1.28rem);color:var(--muted);margin-bottom:1.4rem}
h2.abschnitt{font-size:1.45rem;margin:2.2rem 0 .7rem}
h3.klein{font-size:1.15rem;margin:1.4rem 0 .4rem}
p+p{margin-top:.7rem}
.auftrag{background:var(--ink);color:var(--inverse);border-radius:var(--r-lg);padding:1.2rem 1.4rem;margin:1.5rem 0 1.1rem}
.auftrag h3{font-size:1.2rem;margin-bottom:.35rem}
.auftrag p{color:#DCD5CA}
.auftrag .form{display:inline-block;font-weight:700;color:var(--marker);font-size:.9rem;margin-bottom:.2rem}
.hinweis{font-size:.9rem;color:var(--muted)}
.belastend{border-left:6px solid var(--gold);background:var(--gold-hi);padding:.75rem 1rem;border-radius:0 .5rem .5rem 0;margin:1rem 0}
.merksatz{font-family:var(--display);font-weight:600;font-size:1.25rem;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:.7rem 0;margin:1.4rem 0;text-align:center}
.btn{min-height:48px;border:1px solid var(--border);border-radius:var(--r);padding:.6rem 1.2rem;background:var(--surface2);font-weight:700;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{background:var(--offset)}
.btn.primary{background:var(--red);color:var(--inverse);border-color:transparent}
.btn.primary:hover{background:#86361f}
.btn.dunkel{background:var(--ink);color:var(--inverse);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:active{transform:scale(.97)}
.reihe{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}
.fuss{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid var(--line);margin-top:2.2rem;padding-top:1.3rem;flex-wrap:wrap}
label{font-weight:700;display:block}
textarea{width:100%;min-height:5rem;border:1.5px solid var(--border);border-radius:var(--r);padding:.7rem .9rem;background:var(--surface2);resize:vertical;margin-top:.35rem}
.feldgruppe{display:grid;gap:1rem;margin-top:1rem}
.karte{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.3rem}
.karte+.karte{margin-top:1rem}
.kennung{font-weight:700;color:var(--red);font-size:.88rem;margin-bottom:.3rem}
.quelle{font-size:.85rem;color:var(--muted);margin-top:.6rem;line-height:1.4}
.quelle a{color:var(--muted)}
blockquote{margin:.8rem 0;padding:.7rem 1rem;border-left:5px solid var(--kuli);background:var(--kuli-hi);border-radius:0 .5rem .5rem 0;font-family:var(--display);font-weight:600;font-size:1.12rem;line-height:1.35}
blockquote .wer{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted);margin-top:.35rem}
details.hilfe{margin-top:.8rem;border:1.5px dashed var(--line);border-radius:.6rem;padding:.4rem .8rem}
details.hilfe summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
details.hilfe p{margin:.3rem 0 .4rem}
.status{display:inline-block;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:.35rem;background:var(--slate-hi);color:var(--slate);margin-right:.3rem}
.status.beleg{background:var(--green-hi);color:var(--green)}
.status.modell{background:var(--gold-hi);color:var(--gold)}
.aufdeck{margin-top:1rem;background:var(--offset);border-radius:var(--r-lg);padding:1rem 1.2rem}
.aufdeck.neu{animation:auf 360ms var(--ease) both}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
@media (max-width:640px){.zwei{grid-template-columns:1fr}}
.zwei .alt{background:var(--offset);border-radius:.6rem;padding:.8rem 1rem;min-width:0}

/* AJ · Bildband */
.band{position:relative;background:var(--dunkel);color:var(--inverse);border-radius:var(--r-lg);overflow:hidden;margin:0 0 1.6rem;min-height:9rem;display:grid;grid-template-columns:minmax(0,1fr)}
.band.mit{grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:15rem}
@media (max-width:640px){.band.mit{grid-template-columns:1fr}}
.band .bt{padding:1.3rem 1.4rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem}
.band .bt .ob{font-size:.85rem;font-weight:700;color:#C9BFAE;letter-spacing:.02em}
.band .bt h2{font-size:clamp(1.5rem,1.2rem + 1.4vw,2.2rem);color:var(--inverse)}
.band .bt p{color:#DCD5CA}
.band figure{margin:0;position:relative;min-height:12rem;background:#2A2824}
.band figure img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:.92}
.band.neu figure img{animation:band-ein 650ms var(--ease) both}
@keyframes band-ein{from{opacity:0;transform:translateX(4%) scale(1.03)}to{opacity:.92;transform:none}}
.band figcaption{position:absolute;left:0;right:0;bottom:0;padding:.45rem .8rem;font-size:.75rem;line-height:1.35;color:#E6DFD2;background:linear-gradient(transparent,rgba(27,26,23,.85))}
.band figcaption b{color:var(--inverse)}

/* Säulen (Modell) */
.saeulen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-top:1rem}
@media (max-width:700px){.saeulen{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.saeulen{grid-template-columns:1fr}}
.saeule{background:var(--surface);border:1px solid var(--border);border-radius:.7rem;padding:.7rem .8rem;display:grid;gap:.2rem;font-size:.92rem;line-height:1.4}
.saeule b{font-family:var(--display);font-size:1.08rem}
.saeule .kf{font-style:italic;color:var(--muted)}
.laender{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1rem}
@media (max-width:760px){.laender{grid-template-columns:1fr}}
.land{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.1rem;display:grid;gap:.4rem;align-content:start}
.land .rate{font-family:var(--display);font-size:2rem;line-height:1}
.land .rate small{display:block;font-family:var(--body);font-size:.85rem;color:var(--muted)}
.land ul{padding-left:1.1rem;font-size:.95rem;display:grid;gap:.2rem}

/* B · Säulentafel */
.tafel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.5rem}
.tafel.nirgends{grid-template-columns:1fr;margin-top:.5rem}
@media (max-width:760px){.tafel{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.tafel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spalte{border:0;border-top:6px solid var(--s);background:var(--surface2);border-radius:.6rem;padding:.5rem .55rem;min-height:150px;display:grid;align-content:start;gap:.35rem;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background var(--dauer-mittel) var(--ease)}
.tafel.nirgends .spalte{min-height:0;grid-template-columns:auto auto 1fr;align-items:center;column-gap:.6rem}
.spalte b{font-size:.85rem;line-height:1.2}
.spalte i{font-size:.78rem;color:var(--muted);line-height:1.25}
.spalte.ziel{background:color-mix(in srgb,var(--s) 12%,var(--surface2));outline:2px solid var(--s)}
.spalte.leer::after{content:"leer";font-size:.75rem;color:var(--muted);border:1px dashed var(--line);border-radius:.4rem;padding:.15rem .4rem;justify-self:start}
.chip{border-radius:.5rem;background:var(--offset);padding:.35rem .5rem;font-size:.85rem;line-height:1.25;text-align:left;border-left:4px solid var(--s,var(--line));min-height:44px;display:grid;align-content:center;font:inherit;color:inherit}
.chip.im{animation:auf var(--dauer-langsam) var(--ease) both}
.ablage-b{margin-top:.8rem;border:1.5px dashed var(--line);border-radius:.7rem;padding:.6rem;display:flex;gap:.5rem;flex-wrap:wrap}
.ablage-b .chip{flex:1 1 200px;cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-left:4px solid var(--line);font-size:.92rem}
.ablage-b .chip[aria-pressed=true]{outline:3px solid var(--kuli);background:var(--kuli-hi)}
/* A · Fächer */
.a-ablagen{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.45rem}
@media (max-width:760px){.a-ablagen{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ablage{min-height:84px;border:2px dashed var(--line);border-radius:.7rem;padding:.3rem .4rem;display:grid;align-content:start;gap:.3rem;text-align:left;background:var(--surface2);transition:border-color var(--dauer-mittel) var(--ease),background var(--dauer-mittel) var(--ease),opacity var(--dauer-mittel)}
.ablage b{font-size:.8rem;line-height:1.2;color:var(--s);overflow-wrap:anywhere;hyphens:auto}
.ablage i{font-size:.72rem;color:var(--muted)}
.ablage.dim{opacity:.45}
.ablage.ziel{border-color:var(--s);border-style:solid;background:color-mix(in srgb,var(--s) 12%,var(--surface2));cursor:pointer}
.ablage .ab-btn{text-align:left;padding:.15rem .1rem;min-height:40px;display:grid;gap:.1rem;border:0;border-radius:.4rem;background:transparent;color:inherit;width:100%}
.ablage .ab-btn[disabled]{cursor:not-allowed}
.ablage.ziel .ab-btn{cursor:pointer}
.ablage .minis{display:flex;gap:.25rem;flex-wrap:wrap}
.ablage .mini{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:.4rem;background:var(--s);color:var(--inverse);font-weight:700;font-size:.85rem;cursor:pointer}
.hand{position:relative;height:270px;margin-top:.6rem;overflow:hidden}
.fkarte{position:absolute;left:50%;bottom:0;width:min(320px,80vw);min-height:180px;background:var(--surface2);border:1px solid var(--border);border-radius:.9rem;padding:.8rem 1rem .7rem;box-shadow:0 6px 18px rgba(0,0,0,.08);transform-origin:50% 130%;transform:translateX(-50%) rotate(var(--rot)) translateY(var(--ty));transition:transform var(--dauer-wende) var(--ease),opacity var(--dauer-langsam) var(--ease);text-align:left;font:inherit;color:inherit;font-size:.95rem;line-height:1.35}
.fkarte .nr{display:block;font-weight:700;color:var(--red);font-size:.8rem;margin-bottom:.3rem}
.fkarte.vorn{z-index:9;--ty:-24px!important;--rot:0deg!important;box-shadow:0 14px 30px rgba(0,0,0,.16);cursor:default}
.fkarte.weg{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-280px) scale(.6)}
.fkarte:not(.vorn){cursor:pointer}
.fgrund{margin-top:.8rem}
.fdots{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.fdots button{min-width:40px;min-height:40px;border-radius:999px;border:2px solid var(--s);background:var(--surface2);font-weight:700;color:var(--ink)}
.fdots button[aria-pressed=true]{background:var(--ink);color:var(--inverse);border-color:var(--ink)}
.fdots button[disabled]{background:var(--s);color:var(--inverse);opacity:.7}
.urt{font-size:.95rem}.urt+.urt{margin-top:.3rem}
.urt.zentral b{color:var(--green)}.urt.begruendbar b{color:var(--gold)}.urt.kaum b{color:var(--red)}
html.ruhig .fkarte,html[data-bewegung=weniger] .fkarte{transition:none}
/* D · Rad */
.rad{width:min(100%,360px);aspect-ratio:1;display:block;margin:auto}
.rad.klein{width:min(100%,200px)}
.rad path[data-rad]{cursor:pointer;transition:transform var(--dauer-langsam) var(--ease);transform-origin:200px 200px}
.rad path[data-rad]:hover,.rad path[data-rad]:focus-visible{transform:scale(1.04)}
.rad path.stark{stroke:var(--ink);stroke-width:5}
.rad text{font-family:var(--body);font-weight:700;font-size:14px;fill:var(--inverse);pointer-events:none}
.rad .mitte{fill:var(--surface2);stroke:var(--border)}
.rad .mt{fill:var(--ink);font-family:var(--display);font-size:32px;font-weight:600}
.rad .punkt{fill:var(--ink);stroke:var(--surface2);stroke-width:2}
.rad-wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1rem;align-items:center;margin:.6rem 0 1rem}

const weiter = (nach, text, o = {}) => `<div class="fuss"><span class="hinweis">${o.hinweis || "Dein Stand wird nur auf diesem Gerät gespeichert."}</span><button class="btn primary" data-geh="${nach}" ${o.aus ? "disabled" : ""}>${esc(text)} ›</button></div>`;

  <p>Deine Vorhersage: <b>${esc(KARTE_OPTIONEN[k.wahl])}</b>. ${k.wahl === 0 ? "Das trifft: In Dänemark überlebten über 98 Prozent." : "Die niedrigste Rate der vier hat Dänemark – unter 2 Prozent. Die höchste Rate hat die Niederlande."}</p>

let FILM_FEHLT = false; /* nur für diese Sitzung, nicht gespeichert: ein anderer Browser kann den Film abspielen */

  ${auftrag("Beobachtungsauftrag", "Was machte die Rettung möglich?", "Der Film läuft am Beamer (18 Minuten). Achte auf diese fünf Fragen; nach dem Film trägst du deine Faktoren ein – in deinen Worten, ohne Modell.")}

  <div class="karte"><div class="feldgruppe" style="margin-top:0">${S.faktoren.map((f, i) => `<label>Faktor ${i + 1}<input type="text" data-faktor="${i}" value="${esc(f)}" placeholder="${i === 0 ? "z. B. Jemand hat rechtzeitig gewarnt" : ""}" style="width:100%;border:1.5px solid var(--border);border-radius:var(--r);padding:.6rem .9rem;background:var(--surface2);margin-top:.3rem;min-height:48px"></label>`).join("")}</div>

  <h2 class="abschnitt">Vorher – nachher</h2>

      <div class="g-schieber__vor"><span class="g-schieber__marke">August 1943</span><span class="zahl">≈ 7.500</span><p>leben in Dänemark – ohne Stern, ohne Register, mit Regierung, König und Polizei, die sich an die Zusage von 1940 halten.</p></div>
      <div class="g-schieber__nach"><span class="g-schieber__marke">Oktober 1943</span><span class="zahl">≈ 7.200</span><p>sind in Schweden, etwa 700 nichtjüdische Angehörige dazu. Etwa 470 Menschen wurden gefasst und nach Theresienstadt deportiert.</p></div>

    <span class="sr" aria-live="polite"></span>
  </div></div><p class="quelle">Zahlen: USHMM, „Rescue in Denmark“ (etwa 7.200 Jüdinnen und Juden und rund 700 Angehörige nach Schweden; 470 Deportierte, von denen alle bis auf 51 überlebten).</p></div>

  <blockquote>„Überlasst es nicht anderen – tut es selbst.“<span class="wer">Bent Melchior, zitiert im Heft M23</span></blockquote>

/* ---------- Bausteine für Tafel (B), Fächer (A) und Rad (D) ---------- */
const FARBE = id => (SAEULE(id) || {}).farbe || "var(--line)";
/* B · Säulentafel: eigene Faktoren als Chips in sechs Spalten plus „passt nirgends“ (offen, ohne Wertung) */
let TAFEL_CHIP = null; /* gewählter Chip, nur für diese Sitzung */
function tafel(){
  const meine = S.faktoren.map((f, i) => [f, i]).filter(x => x[0].trim().length >= 3);
  const frei = meine.filter(x => !S.zuordnung[x[1]]);
  const spalte = (id, name, kern) => { const drin = meine.filter(x => S.zuordnung[x[1]] === id); return `<button type="button" class="spalte${drin.length ? "" : " leer"}${TAFEL_CHIP !== null ? " ziel" : ""}" style="--s:${id === "keine" ? "var(--line)" : FARBE(id)}" data-spalte="${id}" aria-label="${esc(name)}${drin.length ? ", " + drin.length + " Faktoren" : ", leer"}"><b>${esc(name)}</b>${kern ? `<i>${esc(kern)}</i>` : ""}${drin.map(([f]) => `<span class="chip im">${esc(f)}</span>`).join("")}</button>`; };
  return `<div class="tafel">${SAEULEN.map(sa => spalte(sa.id, sa.name, sa.kern)).join("")}</div>
  <div class="tafel nirgends">${spalte("keine", "Passt nirgends", "Was das Modell nicht fasst – ein Punkt für das Plenum")}</div>
  <div class="ablage-b" aria-label="Deine Faktoren">${frei.length ? frei.map(([f, i]) => `<button type="button" class="chip" data-chip="${i}" aria-pressed="${TAFEL_CHIP === i}">${esc(f)}</button>`).join("") : `<span class="hinweis">Alle Faktoren liegen in der Tafel. Spalte antippen holt den letzten Chip zurück.</span>`}</div>
  <p class="hinweis" id="tafelhinweis">${TAFEL_CHIP !== null ? "Jetzt eine Spalte antippen." : (frei.length ? "Faktor antippen, dann Spalte." : "")}</p>`;
}
function abgleich(){
  const meine = S.faktoren.map((f, i) => [f, i]).filter(x => x[0].trim().length >= 3);
  if (!meine.length || meine.some(x => !S.zuordnung[x[1]])) return `<p class="hinweis" style="margin-top:.6rem">Sobald alle Faktoren liegen, erscheint der Abgleich.</p>`;
  const leer = SAEULEN.filter(sa => !meine.some(x => S.zuordnung[x[1]] === sa.id)).map(sa => sa.name);
  const nirgends = meine.filter(x => S.zuordnung[x[1]] === "keine").map(x => x[0]);
  return `<div class="aufdeck" style="margin-top:1rem"><p class="kennung">Dein Abgleich</p><p>${leer.length ? `<b>Leer bei dir:</b> ${esc(leer.join(", "))}. Fehlt das im Film – oder im Modell?` : "<b>Alle sechs Säulen</b> kommen in deiner Liste vor."}${nirgends.length ? ` <b>Passt nirgends:</b> ${esc(nirgends.join(", "))} – ein Punkt für das Plenum: Was fehlt dem Modell?` : ""}</p></div>`;
}

/* A · Fächer: sechs belegte Fakten als Kartenhand; die vordere Karte wird mit Begründung auf eine der drei angebotenen Ablagen gelegt (Muster 3 mit Rückmeldung) */
function faecher(){
  const F = S.faecher, offen = F.reihe.filter(i => !(S.saeulen[DK_FAKTEN[i].id] || {}).zu);
  const vorn = offen.length ? DK_FAKTEN[offen[0]] : null;
  const angeboten = vorn ? vorn.optionen.map(o => o[0]) : [];
  const ok = vorn && F.grund.trim().length >= 8;
  const ablagen = SAEULEN.map(sa => {
    const drin = DK_FAKTEN.map((f, i) => [f, i]).filter(([f]) => { const st = S.saeulen[f.id]; return st && st.zu && f.optionen[st.o][0] === sa.id; });
    const an = angeboten.includes(sa.id);
    return `<div class="ablage${an && ok ? " ziel" : ""}${vorn && !an ? " dim" : ""}" style="--s:${sa.farbe}"><button type="button" class="ab-btn" data-ablage="${sa.id}" ${!vorn || !an || !ok ? "disabled" : ""} aria-label="${esc(sa.name)}${vorn && !an ? ", nicht angeboten" : ""}"><b>${esc(sa.name)}</b>${vorn && !an ? `<i>nicht angeboten</i>` : ""}</button><span class="minis">${drin.map(([f, i]) => `<button type="button" class="mini" data-mini="${f.id}" aria-label="Fakt ${i + 1} zurücknehmen">${i + 1}</button>`).join("")}</span></div>`;
  }).join("");
  const hand = DK_FAKTEN.map((f, i) => {
    const pos = offen.indexOf(i), n = offen.length, ist = pos === 0;
    const rot = (pos - (n - 1) / 2) * 13, ty = Math.abs(pos - (n - 1) / 2) * 4;
    return `<button type="button" class="fkarte${ist ? " vorn" : ""}${pos < 0 ? " weg" : ""}" style="--rot:${rot}deg;--ty:${ty}px;z-index:${10 - Math.max(pos, 0)}" data-vorn="${i}" ${pos < 0 ? 'tabindex="-1" aria-hidden="true"' : ""}><span class="nr">Fakt ${i + 1}</span>${esc(f.fakt)}</button>`;
  }).join("");
  const letzt = F.letzt && S.saeulen[F.letzt.id] && S.saeulen[F.letzt.id].zu ? F.letzt : null;
  const n = DK_FAKTEN.filter(f => (S.saeulen[f.id] || {}).zu).length;
  return `<div class="faecher"><div class="a-ablagen">${ablagen}</div>
  <div class="hand" id="hand">${hand}</div>
  <div class="fdots" role="group" aria-label="Karte nach vorn holen">${DK_FAKTEN.map((f, i) => { const st = S.saeulen[f.id] || {}; return `<button type="button" data-vorn="${i}" data-dot aria-pressed="${vorn && vorn.id === f.id}" ${st.zu ? 'disabled title="liegt schon"' : ""} style="--s:${st.zu ? FARBE(f.optionen[st.o][0]) : "var(--line)"}">${i + 1}</button>`; }).join("")}</div>
  ${vorn ? `<label class="fgrund">Begründung für Fakt ${DK_FAKTEN.indexOf(vorn) + 1} in einem Satz<textarea data-feld="faechergrund" rows="2" placeholder="Ich lege ihn auf …, weil …">${esc(F.grund)}</textarea></label>
  <p class="hinweis" id="faecherhinweis">${ok ? "Jetzt oben auf eine der drei hellen Ablagen tippen." : "Erst einen Satz schreiben, dann wird die Ablage frei. Eine andere Karte antippen holt sie nach vorn."}</p>` : `<p class="hinweis">Alle sechs Karten liegen. Eine Zahl in einer Ablage antippen nimmt die Karte zurück.</p>`}
  ${letzt ? `<div class="aufdeck neu" id="faecherfb"><p class="kennung">Fakt ${DK_FAKTEN.findIndex(f => f.id === letzt.id) + 1} liegt auf ${esc(SAEULE(letzt.sid).name)}</p>${DK_FAKTEN.find(f => f.id === letzt.id).optionen.map(o => `<p class="urt ${o[1]}"><b>${esc(SAEULE(o[0]).name)}: ${STUFENWORT[o[1]]}</b> – ${esc(o[2])}</p>`).join("")}</div>` : ""}
  <p class="hinweis" id="saeulenstand">${n} von 6 abgelegt.${n >= 3 ? " Weiter ist frei." : " Ab drei geht es weiter."}</p></div>`;
}

/* D · Rad: sechs Säulen als Segmente, Punkte je zugeordnetem Fakt – ein Profil je Land */
function segPfad(i, n, r0, r1){ const a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2, g = .03; const P = (a, r) => `${(200 + Math.cos(a) * r).toFixed(1)},${(200 + Math.sin(a) * r).toFixed(1)}`; return `M${P(a0 + g, r1)} A${r1},${r1} 0 0 1 ${P(a1 - g, r1)} L${P(a1 - g, r0)} A${r0},${r0} 0 0 0 ${P(a0 + g, r0)} Z`; }
/* zu: { key: saeulenId } · mitte: Text in der Mitte · aktiv: Segmente antippbar (data-rad=land) · stark: hervorgehobene Säule */
function rad(zu, o = {}){
  const n = SAEULEN.length, werte = Object.values(zu);
  const segs = SAEULEN.map((sa, i) => {
    const am = ((i + .5) / n) * Math.PI * 2 - Math.PI / 2, punkte = Object.entries(zu).filter(([k, v]) => v === sa.id);
    const dots = punkte.map(([k], j) => { const r = 96 + j * 15; return `<circle class="punkt" cx="${(200 + Math.cos(am) * r).toFixed(1)}" cy="${(200 + Math.sin(am) * r).toFixed(1)}" r="7"><title>${esc(o.titel ? o.titel(k) : k)}</title></circle>`; }).join("");
    const t = `<text x="${(200 + Math.cos(am) * 150).toFixed(1)}" y="${(200 + Math.sin(am) * 150 + 5).toFixed(1)}" text-anchor="middle">${esc(sa.kurz)}</text>`;
    const stark = o.stark === sa.id ? ' class="stark"' : "";
    return `<path d="${segPfad(i, n, 78, 190)}" fill="${sa.farbe}" opacity="${punkte.length || o.stark === sa.id ? 1 : .42}"${stark} ${o.aktiv ? `data-rad="${o.aktiv}" data-sid="${sa.id}" tabindex="0" role="button" aria-label="${esc(sa.name)}"` : ""}></path>${t}${dots}`;
  }).join("");
  return `<svg class="rad${o.klein ? " klein" : ""}" viewBox="0 0 400 400" role="img" aria-label="${esc(o.label || "Profil")}: ${werte.length ? SAEULEN.filter(sa => werte.includes(sa.id)).map(sa => sa.name + " " + werte.filter(v => v === sa.id).length).join(", ") : "noch leer"}">${segs}<circle class="mitte" cx="200" cy="200" r="60"/><text class="mt" x="200" y="${o.mitteKlein ? 207 : 212}" text-anchor="middle" style="${o.mitteKlein ? "font-size:22px" : ""}">${esc(o.mitte || "")}</text></svg>`;
}
const DK_PROFIL = () => { const z = {}; DK_FAKTEN.forEach((f, i) => { const st = S.saeulen[f.id]; if (st && st.zu) z[i + 1] = f.optionen[st.o][0]; }); return z; };

function saeulen(){
  const n = DK_FAKTEN.filter(f => (S.saeulen[f.id] || {}).zu).length;
  return `${zeitKopf("saeulen")}<h1>Sechs Säulen</h1>
  <p class="lead">Du hast aus dem Film Faktoren gesammelt. Dein Heft bietet dafür ein Modell an: sechs Merkmale, an denen man eine Gesellschaft unter Besatzung vergleichen kann. Es ist ein Werkzeug deiner Lehrkraft, keine Theorie aus der Forschung – also prüfe es an deiner Liste.</p>
  <p class="kennung"><span class="status modell">Modell</span>Sechs Säulen – Was schützt eine Gesellschaft?</p>
  <div class="saeulen" id="saeulen-modell">${SAEULEN.map((s, i) => `<div class="saeule" style="border-top:5px solid ${s.farbe}"><b>${i + 1} · ${esc(s.name)}</b><span class="kf">${esc(s.kern)}</span><span>${esc(s.was)}</span></div>`).join("")}</div>

  <h2 class="abschnitt">Deine Faktoren an der Tafel</h2>
  ${auftrag("Abgleich · deine Liste gegen das Modell", "Wohin gehört jeder deiner Faktoren?", "Faktor antippen, dann Spalte antippen. Was in keine Säule passt, kommt nach „Passt nirgends“. Dann siehst du, welche Säulen bei dir leer bleiben. Das ist keine Lücke bei dir: Vielleicht zeigt der Film sie nicht, vielleicht braucht das Modell sie nicht.")}
  <div class="karte" id="tafelkarte">${tafel()}${abgleich()}</div>

  <h2 class="abschnitt">Sechs belegte Fakten</h2>
  ${auftrag("Konsolidieren · Fächer", "Sechs Fakten aus der Forschung – welche Säule trägt sie?", "Jetzt umgekehrt: Die Fakten liegen als Kartenfächer. Die vordere Karte ist dran; drei Ablagen sind angeboten. Schreib deine Begründung, dann leg die Karte ab. Du siehst zu jeder der drei Säulen, wie gut sie passt. Es gibt keine „falsche“ Ablage – aber eine, die am meisten erklärt.")}
  <div class="karte" id="faecherkarte">${faecher()}</div>

  <h2 class="abschnitt">Deine These</h2>
  ${auftrag("These bilden", "Was schützt eine Gesellschaft?", "Ein Satz aus deinen Faktoren und den Säulen. Diese These testest du gleich an drei anderen Ländern.")}
  <div class="feldgruppe"><label>Unsere These: Die Opferrate war dort niedrig, wo …<textarea data-feld="these" rows="3" placeholder="… der Staat …, die Nachbarn …, und …">${esc(S.these)}</textarea></label></div>
  <details class="hilfe"><summary>Was lässt dieses Modell weg?</summary><p>Das Modell sortiert Bedingungen. Es sagt nichts über den Einzelnen: Ein Fischer, der Geld nimmt, und einer, der umsonst fährt, stehen in derselben Säule. Es erklärt auch nicht, warum ausgerechnet <em>diese</em> Nachbarn halfen und andere nicht. Dafür brauchst du den Blick aus M22 – und die Position am Ende der Stunde.</p></details>
  ${weiter("vergleich", "Weiter: Thesen testen", { aus: n < 3 || S.these.trim().length < 15, hinweis: (n < 3 || S.these.trim().length < 15) ? "Mindestens drei Fakten ablegen und die These schreiben, dann weiter." : undefined })}`;
}

/* Land: Rad als Eingabe (jeder der vier Fakten bekommt eine Säule), darunter die festgelegte Wahl mit Rückmeldung */
function landBlock(l){
  const z = S.rad[l.id] || {}, st = S.laender[l.id] || {};
  const offen = l.fakten.map((f, i) => i).filter(i => !z[i]);
  const akt = offen.length ? offen[0] : null;
  return `<div class="karte landblock" id="w-${l.id}"><p class="kennung">${esc(l.land)} · ${esc(l.rate)}</p>
  <div class="rad-wrap"><div>${rad(z, { aktiv: l.id, mitte: akt !== null ? String(akt + 1) : "✓", label: "Profil " + l.land, titel: k => l.fakten[k], stark: st.zu ? l.optionen[st.o][0] : undefined })}</div>
  <div class="d-seite"><p class="hinweis"><b>Besatzung:</b> ${esc(l.besatzung)}</p>
  <ol class="radfakten">${l.fakten.map((f, i) => `<li class="${z[i] ? "da" : ""}${i === akt ? " akt" : ""}"><span class="rp" style="--s:${z[i] ? FARBE(z[i]) : "var(--line)"}">${i + 1}</span><span>${esc(f)}${z[i] ? ` <b style="color:${FARBE(z[i])}">→ ${esc(SAEULE(z[i]).name)}</b>` : ""}</span></li>`).join("")}</ol>
  <p class="hinweis">${akt !== null ? `Fakt ${akt + 1} ist dran: Segment antippen. Eine erledigte Zeile antippen nimmt die Zuordnung zurück.` : "Alle vier Fakten liegen im Rad. Eine Zeile antippen nimmt die Zuordnung zurück."}</p></div></div>
  ${gWahl("laender", l.id, esc(l.frage), l.optionen, { saeulen:true })}</div>`;
}

function vergleich(){
  const n = LAENDER.filter(l => (S.laender[l.id] || {}).zu).length;
  const dk = DK_PROFIL();
  return `${zeitKopf("vergleich")}<h1>Thesen testen</h1>
  <p class="lead">Dänemark ist der Ausnahmefall. Drei andere Länder sind der Test: Hält deine These, wenn Säulen fehlen – oder wenn ein Staat in beide Richtungen handelt?</p>
  <div class="karte" style="border-left:6px solid var(--kuli)"><p class="kennung">Unsere These</p><p><b>Die Opferrate war dort niedrig, wo …</b> ${esc(S.these)}</p></div>
  ${auftrag("Profil · Rad", "Welche Säulen tragen das Land – und welche erklärt am stärksten?", "Je Land vier belegte Fakten. Leg jeden Fakt auf eine Säule im Rad – so entsteht ein Profil wie bei Dänemark. Dann wähle die Säule, die die Opferrate am stärksten erklärt, begründe und leg fest: Du siehst die Erklärung zu allen drei Angeboten.")}
  <p class="quelle">Zahlen und Abläufe: USHMM Holocaust Encyclopedia, Artikel „The Netherlands“, „Bulgaria“, „Hungary after the German Occupation“ und „Jewish Losses by Country“.</p>
  ${LAENDER.map(landBlock).join("")}

  <h2 class="abschnitt">Vier Profile</h2>
  <p>Deine Zuordnungen als Bild: Dänemark aus dem Fächer, die drei Länder aus den Rädern. Die hervorgehobene Säule ist die, die du als stärkste festgelegt hast.</p>
  <div class="profile">${[["Dänemark", dk, (S.saeulen && Object.keys(dk).length) ? undefined : undefined, "unter 2 %"]].concat(LAENDER.map(l => [l.land, S.rad[l.id] || {}, (S.laender[l.id] || {}).zu ? l.optionen[S.laender[l.id].o][0] : undefined, l.rate])).map(([name, z, stark, rate]) => `<figure class="profil">${rad(z, { klein:true, mitte: rate, mitteKlein:true, label: "Profil " + name, stark })}<figcaption><b>${esc(name)}</b> ${esc(rate)}</figcaption></figure>`).join("")}</div>
  <p class="hinweis">Lies die Räder wie Fingerabdrücke: Wo häufen sich Punkte, wo bleibt ein Segment leer? Dänemark hat sechs Punkte, die anderen vier – vergleiche die Form, nicht die Zahl.</p>

  <h2 class="abschnitt">Hält die These?</h2>
  ${auftrag("Eigene Sätze", "Was bleibt von der These – und was fehlt ihr?", "Erst der Test, dann zwei Sätze zum Vergleich. Danach kannst du sie mit der Fassung deiner Lehrkraft vergleichen.")}
  <div class="feldgruppe"><label>Die These hält bei … / Sie muss ergänzt werden um …<textarea data-feld="test" rows="3" placeholder="Bei den Niederlanden hält sie, weil … Bulgarien zeigt aber, dass …">${esc(S.test)}</textarea></label><label>Die Opferraten waren dort am niedrigsten, wo …<textarea data-feld="nied" rows="2">${esc(S.nied)}</textarea></label>
  <label>Die Opferraten waren dort am höchsten, wo …<textarea data-feld="hoch" rows="2">${esc(S.hoch)}</textarea></label></div>
  ${(S.nied.trim().length >= 15 && S.hoch.trim().length >= 15) ? `<div class="aufdeck"><p class="kennung"><span class="status modell">Fassung der Lehrkraft</span>Aus dem Erwartungshorizont M23</p><div class="zwei"><div class="alt"><b>Am niedrigsten, wo …</b><ul style="padding-left:1.1rem;margin-top:.3rem"><li>staatliche Strukturen intakt blieben und sich schützend vor ihre Bürger stellten,</li><li>Gleichheit und demokratische Tradition fest verankert waren,</li><li>Juden als Mitbürger galten, nicht als „Andere“,</li><li>Staat und Zivilgesellschaft zusammen handelten – „von oben“ und „von unten“.</li></ul></div><div class="alt"><b>Am höchsten, wo …</b><ul style="padding-left:1.1rem;margin-top:.3rem"><li>lokale Behörden aktiv mitarbeiteten oder selbst verfolgten,</li><li>Deutschland direkt kontrollierte, besonders durch SS-Zivilverwaltung,</li><li>Antisemitismus tief verwurzelt und staatlich gefördert war,</li><li>Vernichtungslager auf eigenem Boden standen (Polen).</li></ul></div></div><p class="hinweis" style="margin-top:.6rem">Was steht bei dir, das hier fehlt? Was hier, das du nicht hast? Markiere es für das Plenum.</p></div>` : `<p class="hinweis">Sobald beide Sätze stehen, erscheint die Fassung deiner Lehrkraft zum Vergleich.</p>`}
  ${weiter("position", "Weiter: Deine Position", { aus: n < 2, hinweis: n < 2 ? "Mindestens zwei Länder festlegen, dann weiter." : undefined })}`;
}

function position(){
  const m22 = m22Position(), p = S.pos;
  const n = S.urteil.trim().split(/\s+/).filter(Boolean).length;
  return `${zeitKopf("position")}<h1>Deine Position</h1>

  ${auftrag("Skala mit Bezugsmarke", "Umwelt oder Ich?", "Setz den Regler. Danach kannst du deine Marke aus M22 einblenden: Dort hast du dich zwischen „Person“ und „Umstände“ positioniert – für die Täter. Jetzt geht es um alle, auch um dich.")}

  </div></div></div>

  ${n >= 40 ? `<div class="raster3" id="raster"><div><b>Grundlegend</b>Du nennst eine Position und ein Land.</div><div><b>Sicher</b>Du begründest mit einer Säule und einem Fakt aus der Stunde.</div><div><b>Souverän</b>Du zeigst, was die andere Position richtig sieht – und was dein Vergleich (Länder) über das Einzelne (Melchior) hinaus zeigt.</div></div>` : ""}
  ${weiter("plenum", "Weiter: Plenum")}`;
}

function plenum(){

  <p class="lead">iPad zu. Drei Fragen für das Gespräch – deine Lehrkraft wählt aus.</p>

  <h2>Sechs Säulen (Modell)</h2>

  <p class="merksatz">Nicht die besseren Menschen – die besseren Bedingungen. Und jemand, der anfängt.</p>
  <div class="seitenumbruch"></div>
  <h2>Meine Faktoren aus dem Film</h2>
  <div class="karte"><p>${esc(S.faktoren.filter(f => f.trim()).map((f, i) => `${i + 1}. ${f}${S.zuordnung[S.faktoren.indexOf(f)] ? " (" + (S.zuordnung[S.faktoren.indexOf(f)] === "keine" ? "passt nirgends" : SAEULE(S.zuordnung[S.faktoren.indexOf(f)]).name) + ")" : ""}`).join(" · ")) || "–"}</p></div>
