  <tbody>${AUF.map(a => `<tr><td>${a.nr}</td><td>${esc(a.name)}</td><td class="form">${esc(a.form)}</td><td>${a.min || ""}</td></tr>`).join("")}<tr><td></td><td>zusammen</td><td></td><td>${SUMME}</td></tr></tbody></table>
  <div class="ab-info"><p><b>Hinweis:</b> Es geht um Verfolgung und Massenmord. Die Texte nennen Zahlen und Abläufe, keine Einzelheiten der Gewalt. Es gibt keine Bilder von Gewalt. Wenn dich etwas belastet, sprich mit deiner Lehrkraft.</p></div>
  <p class="merksatz">Nicht die besseren Menschen – die besseren Bedingungen. Oder doch nicht?</p>
  <div class="ab-fuss nodruck"><a class="btn" href="${HEFTER}">‹ Zum Hefter</a><span></span><button class="btn primary" data-geh="karte">1 Die Karte ›</button></div>`;
}

function karte(){
  const k = S.karte, zu = k.zu;
  const balken = RATEN.map(r => `<div class="g-balken__zeile"><span>${esc(r.land)}</span><span class="g-balken__spur"><span class="g-balken__wert" style="--w:${r.rate};--farbe:var(--${r.farbe || "slate"})"></span></span><span class="g-balken__zahl">${esc(r.text)}</span></div>`).join("");
  return `${zeitKopf("karte")}<h1>Die Karte</h1>
  <p class="lead">Sechs Millionen – aber nicht überall gleich. In manchen Ländern wurden fast alle Jüdinnen und Juden ermordet, in anderen fast niemand. Bevor du die Zahlen siehst: Leg dich fest.</p>
  ${auftrag("Muster 1 · Vorhersage", "In welchem dieser vier Länder überlebte der größte Teil der jüdischen Bevölkerung?", "Wähle und schreib in einem Satz, warum du das vermutest. Erst dann erscheinen die Zahlen.")}
  <div class="karte" id="vorhersage"><div class="g"><div class="g-wahl" ${zu ? 'data-zu=""' : ""}><fieldset><legend>Meine Vorhersage</legend>${KARTE_OPTIONEN.map((l, i) => `<label class="g-option"><input type="radio" name="karte" value="${i}" data-karte ${k.wahl === i ? "checked" : ""} ${zu ? "disabled" : ""}><span>${esc(l)}</span></label>`).join("")}</fieldset>
  <label>Warum vermutest du das?<textarea data-feld="kartegrund" rows="2" ${zu ? "readonly" : ""} placeholder="Ich vermute … , weil …">${esc(k.grund)}</textarea></label>
  <div class="g-wahl__fuss">${zu ? `<span class="g-stempel">Festgelegt</span>` : `<button class="g-knopf g-knopf--primaer" data-kartefest ${k.wahl === null || k.grund.trim().length < 8 ? "disabled" : ""}>Zahlen zeigen</button><span class="hinweis" id="kartehinweis">${k.wahl === null ? "Land wählen und einen Satz schreiben." : (k.grund.trim().length < 8 ? "Jetzt noch einen Satz schreiben." : "")}</span>`}</div></div></div></div>
  ${zu ? `<div class="aufdeck" id="aufdeck"><p class="kennung"><span class="status beleg">Beleg</span>Anteil der Ermordeten an der jüdischen Bevölkerung vor der Verfolgung</p>
  <p>Deine Vorhersage: <b>${esc(KARTE_OPTIONEN[k.wahl])}</b>. ${k.wahl === 0 ? "Das trifft: In Dänemark überlebten über 98 Prozent." : "Die niedrigste Rate der vier hat Dänemark – unter 2 Prozent. Die höchste Rate hat die Niederlande."}</p>
  <div class="g" style="margin-top:.8rem"><div class="g-balken" id="balken" role="img" aria-label="Balken: Anteil der Ermordeten je Land, von Dänemark unter 2 Prozent bis Polen 83 bis 90 Prozent">${balken}</div></div>
  <p class="quelle">Zahlen: United States Holocaust Memorial Museum, Holocaust Encyclopedia, „Jewish Losses by Country“ (Bestand vor der Verfolgung · Ermordete). Die Prozente sind hier gerundet berechnet; bei Spannen steht die Spanne. Ungarn in den Grenzen von 1941. Bulgarien fehlt in der Reihe: Im Kernland wurde niemand deportiert, aus den von Bulgarien besetzten Gebieten 11.343 Menschen – dazu später mehr.</p>
  <div class="feldgruppe"><label>Was fällt dir auf – und welche Frage ergibt sich daraus?<textarea data-feld="kartefrage" rows="3" placeholder="Mir fällt auf, dass … Daraus ergibt sich die Frage: …">${esc(k.frage)}</textarea></label></div>
  <details class="hilfe"><summary>Hilfe: Woran könnte es liegen?</summary><p>Alle diese Länder waren besetzt oder mit Deutschland verbündet. Trotzdem unterscheiden sich die Raten um das Vierzigfache. Die Frage dieser Stunde: Welche Merkmale einer Gesellschaft haben geschützt – und welche nicht?</p></details></div>` : ""}
  ${weiter("daenemark", "Weiter: Dänemark 1943", { aus: !zu, hinweis: zu ? undefined : "Erst festlegen, dann weiter." })}`;
}

let FILM_FEHLT = false; /* nur für diese Sitzung, nicht gespeichert: ein anderer Browser kann den Film abspielen */
function filmFehlt(){ FILM_FEHLT = true; const f = document.getElementById("film"); if (f) f.innerHTML = filmErsatz(); }
function filmErsatz(){ return `<div class="aufdeck" style="margin:0"><p><b>Der Film liegt nicht auf diesem Gerät.</b> Er lässt sich von YouTube laden – erst nach Klick, ohne Cookies von Google bis dahin.</p><div class="reihe"><button class="btn primary" data-ytladen>Video von YouTube laden (18 Min.)</button><a class="btn" href="${FILM.url}" target="_blank" rel="noopener">Auf YouTube öffnen</a></div></div>`; }
function daenemark(){
  const li = DK_ZEIT.map((z, i) => `<li ${i === (S.zeit || 0) ? "data-hier" : ""} data-mehr="${esc(z.mehr)}"><button type="button" data-zeit="${i}"><span class="g-zeit__jahr">${esc(z.jahr)}</span><span class="g-zeit__text">${esc(z.text)}</span></button></li>`).join("");
  const z = DK_ZEIT[S.zeit || 0];
  const nF = S.faktoren.filter(f => f.trim().length >= 3).length;
  return `${zeitKopf("daenemark")}<h1>Der Film: Dänemark 1943</h1>
  <p class="lead">Im August 1943 leben etwa 7.500 Jüdinnen und Juden in Dänemark, fast alle in Kopenhagen. Sie tragen keinen Stern, ihre Geschäfte sind offen. Sechs Wochen später sind fast alle in Schweden. Bent Melchior war 14 und dabei. Sein Film erzählt, wie das ging – und du sammelst daraus, was die Rettung möglich machte.</p>
  ${auftrag("Beobachtungsauftrag", "Was machte die Rettung möglich?", "Der Film läuft am Beamer (18 Minuten). Achte auf diese fünf Fragen; nach dem Film trägst du deine Faktoren ein – in deinen Worten, ohne Modell.")}
  <div class="karte"><ol style="padding-left:1.3rem;display:grid;gap:.3rem">${BEOBACHTUNG.map(b => `<li>${esc(b)}</li>`).join("")}</ol></div>
  <div class="karte" id="film">${FILM_FEHLT ? filmErsatz() : `<video controls preload="metadata" playsinline style="width:100%;max-height:60vh;background:#000;border-radius:.6rem" aria-label="Voices in the Void, Kurzfilm, 18 Minuten"><source src="${FILM.datei}" type="video/mp4" onerror="filmFehlt()">Dein Browser spielt das Video nicht ab.</video>`}
  <p class="quelle" style="margin-top:.6rem">„Voices in the Void“, animierter Dokumentarfilm, Humanity in Action, 2021, 18 Min. Bent Melchior (1929–2021), später Oberrabbiner Dänemarks, erzählt selbst. Rechte beim Herausgeber; die lokale Kopie liegt nur im Unterrichtspaket.</p></div>

  <h2 class="abschnitt">Deine Faktoren</h2>
  ${auftrag("Induktiv · Faktoren sammeln", "Was hat dazu geführt, dass so viele gerettet wurden?", "Trag bis zu sechs Faktoren ein, je ein Stichwort oder ein kurzer Satz. Mindestens drei, dann geht es weiter. Diese Liste ist deine Schablone – sie wird gleich am Modell geprüft, nicht umgekehrt.")}
  <div class="karte"><div class="feldgruppe" style="margin-top:0">${S.faktoren.map((f, i) => `<label>Faktor ${i + 1}<input type="text" data-faktor="${i}" value="${esc(f)}" placeholder="${i === 0 ? "z. B. Jemand hat rechtzeitig gewarnt" : ""}" style="width:100%;border:1.5px solid var(--border);border-radius:var(--r);padding:.6rem .9rem;background:var(--surface2);margin-top:.3rem;min-height:48px"></label>`).join("")}</div>
  <p class="hinweis" id="faktorenstand">${nF} von 6 eingetragen.</p></div>

  <h2 class="abschnitt">Der Verlauf, verdichtet</h2>
  <p>Der Film erzählt sechs Wochen. Hier liegen sie auf einer Linie – mit dem, was die Forschung dazu belegt. Prüfe: Kommt alles, was du notiert hast, in der Zeitleiste vor?</p>
  <div class="karte"><p class="kennung"><span class="status beleg">Beleg</span>Zeitleiste nach USHMM, „Rescue in Denmark“</p>
  <div class="g"><ol class="g-zeit" data-g="zeit" id="dkzeit">${li}<span class="g-zeit__hier">Du bist hier</span></ol><p class="sr" aria-live="polite"></p></div>
  <div class="aufdeck" id="zeittext" style="margin-top:1.2rem"><p class="kennung">${esc(z.jahr)} · ${esc(z.text)}</p><p>${esc(z.mehr)}</p></div></div>

  <h2 class="abschnitt">Vorher – nachher</h2>
  <p>Zieh den Griff nach links: Der Oktober schiebt sich über den August. Die Zahlen bleiben daneben stehen; die Bewegung zeigt nur, wie wenig Zeit dazwischen lag.</p>
  <div class="karte"><div class="g"><div class="g-schieber" data-g="schieber" data-vorher="August 1943" data-nachher="Oktober 1943" data-autoplay data-dauer="4">
    <div class="g-schieber__buehne" role="img" aria-label="Vorher-nachher-Vergleich: August 1943, etwa 7.500 Jüdinnen und Juden leben in Dänemark ohne Sondergesetze. Oktober 1943: rund 7.200 sind in Schweden, etwa 470 nach Theresienstadt deportiert.">
      <div class="g-schieber__vor"><span class="g-schieber__marke">August 1943</span><span class="zahl">≈ 7.500</span><p>leben in Dänemark – ohne Stern, ohne Register, mit Regierung, König und Polizei, die sich an die Zusage von 1940 halten.</p></div>
      <div class="g-schieber__nach"><span class="g-schieber__marke">Oktober 1943</span><span class="zahl">≈ 7.200</span><p>sind in Schweden, etwa 700 nichtjüdische Angehörige dazu. Etwa 470 Menschen wurden gefasst und nach Theresienstadt deportiert.</p></div>
      <div class="g-schieber__griff"></div>
    </div>
    <label>Vergleich ziehen<input type="range" min="0" max="100" step="any" value="100" aria-label="Vorher–nachher: ganz rechts August 1943, ganz links Oktober 1943"></label>
    <div class="reihe"><button type="button" class="g-knopf g-knopf--sekundaer" data-g-abspielen aria-pressed="false">Hin und her</button><span class="g-schieber__stand"></span></div>
    <span class="sr" aria-live="polite"></span>
  </div></div><p class="quelle">Zahlen: USHMM, „Rescue in Denmark“ (etwa 7.200 Jüdinnen und Juden und rund 700 Angehörige nach Schweden; 470 Deportierte, von denen alle bis auf 51 überlebten).</p></div>

  <blockquote>„Überlasst es nicht anderen – tut es selbst.“<span class="wer">Bent Melchior, zitiert im Heft M23</span></blockquote>
  ${weiter("saeulen", "Weiter: Sechs Säulen", { aus: nF < 3, hinweis: nF < 3 ? "Mindestens drei Faktoren eintragen, dann weiter." : undefined })}`;
}

/* ---------- Bausteine für Tafel (B), Fächer (A) und Rad (D) ---------- */
const FARBE = id => (SAEULE(id) || {}).farbe || "var(--line)";
/* B · Säulentafel: eigene Faktoren als Chips in sechs Spalten plus „passt nirgends“ (offen, ohne Wertung) */
let TAFEL_CHIP = null; /* gewählter Chip, nur für diese Sitzung */
function tafel(){
  const meine = S.faktoren.map((f, i) => [f, i]).filter(x => x[0].trim().length >= 3);
  const frei = meine.filter(x => !S.zuordnung[x[1]]);
  const spalte = (id, name, kern) => { const drin = meine.filter(x => S.zuordnung[x[1]] === id); return `<button type="button" class="spalte${drin.length ? "" : " leer"}${TAFEL_CHIP !== null ? " ziel" : ""}" style="--s:${id === "keine" ? "var(--line)" : FARBE(id)}" data-spalte="${id}" aria-label="${esc(name)}${drin.length ? ", " + drin.length + " Faktoren" : ", leer"}"><b>${esc(name)}</b>${kern ? `<i>${esc(kern)}</i>` : ""}${drin.map(([f]) => `<span class="chip im">${esc(f)}</span>`).join("")}</button>`; };
  return `<div class="tafel">${SAEULEN.map(sa => spalte(sa.id, sa.name, sa.kern)).join("")}</div>
  <div class="tafel nirgends">${spalte("keine", "Passt nirgends", "Was das Modell nicht fasst – ein Punkt für das Plenum")}</div>
  <div class="ablage-b" aria-label="Deine Faktoren">${frei.length ? frei.map(([f, i]) => `<button type="button" class="chip" data-chip="${i}" aria-pressed="${TAFEL_CHIP === i}">${esc(f)}</button>`).join("") : `<span class="hinweis">Alle Faktoren liegen in der Tafel. Spalte antippen holt den letzten Chip zurück.</span>`}</div>
  <p class="hinweis" id="tafelhinweis">${TAFEL_CHIP !== null ? "Jetzt eine Spalte antippen." : (frei.length ? "Faktor antippen, dann Spalte." : "")}</p>`;
}
function abgleich(){
  const meine = S.faktoren.map((f, i) => [f, i]).filter(x => x[0].trim().length >= 3);
  if (!meine.length || meine.some(x => !S.zuordnung[x[1]])) return `<p class="hinweis" style="margin-top:.6rem">Sobald alle Faktoren liegen, erscheint der Abgleich.</p>`;
  const leer = SAEULEN.filter(sa => !meine.some(x => S.zuordnung[x[1]] === sa.id)).map(sa => sa.name);
  const nirgends = meine.filter(x => S.zuordnung[x[1]] === "keine").map(x => x[0]);
  return `<div class="aufdeck" style="margin-top:1rem"><p class="kennung">Dein Abgleich</p><p>${leer.length ? `<b>Leer bei dir:</b> ${esc(leer.join(", "))}. Fehlt das im Film – oder im Modell?` : "<b>Alle sechs Säulen</b> kommen in deiner Liste vor."}${nirgends.length ? ` <b>Passt nirgends:</b> ${esc(nirgends.join(", "))} – ein Punkt für das Plenum: Was fehlt dem Modell?` : ""}</p></div>`;
}

/* A · Fächer: sechs belegte Fakten als Kartenhand; die vordere Karte wird mit Begründung auf eine der drei angebotenen Ablagen gelegt (Muster 3 mit Rückmeldung) */
function faecher(){
  const F = S.faecher, offen = F.reihe.filter(i => !(S.saeulen[DK_FAKTEN[i].id] || {}).zu);
  const vorn = offen.length ? DK_FAKTEN[offen[0]] : null;
  const angeboten = vorn ? vorn.optionen.map(o => o[0]) : [];
  const ok = vorn && F.grund.trim().length >= 8;
  const ablagen = SAEULEN.map(sa => {
    const drin = DK_FAKTEN.map((f, i) => [f, i]).filter(([f]) => { const st = S.saeulen[f.id]; return st && st.zu && f.optionen[st.o][0] === sa.id; });
    const an = angeboten.includes(sa.id);
    return `<div class="ablage${an && ok ? " ziel" : ""}${vorn && !an ? " dim" : ""}" style="--s:${sa.farbe}"><button type="button" class="ab-btn" data-ablage="${sa.id}" ${!vorn || !an || !ok ? "disabled" : ""} aria-label="${esc(sa.name)}${vorn && !an ? ", nicht angeboten" : ""}"><b>${esc(sa.name)}</b>${vorn && !an ? `<i>nicht angeboten</i>` : ""}</button><span class="minis">${drin.map(([f, i]) => `<button type="button" class="mini" data-mini="${f.id}" aria-label="Fakt ${i + 1} zurücknehmen">${i + 1}</button>`).join("")}</span></div>`;
  }).join("");
  const hand = DK_FAKTEN.map((f, i) => {
    const pos = offen.indexOf(i), n = offen.length, ist = pos === 0;
    const rot = (pos - (n - 1) / 2) * 13, ty = Math.abs(pos - (n - 1) / 2) * 4;
    return `<button type="button" class="fkarte${ist ? " vorn" : ""}${pos < 0 ? " weg" : ""}" style="--rot:${rot}deg;--ty:${ty}px;z-index:${10 - Math.max(pos, 0)}" data-vorn="${i}" ${pos < 0 ? 'tabindex="-1" aria-hidden="true"' : ""}><span class="nr">Fakt ${i + 1}</span>${esc(f.fakt)}</button>`;
  }).join("");
  const letzt = F.letzt && S.saeulen[F.letzt.id] && S.saeulen[F.letzt.id].zu ? F.letzt : null;
  const n = DK_FAKTEN.filter(f => (S.saeulen[f.id] || {}).zu).length;
  return `<div class="faecher"><div class="a-ablagen">${ablagen}</div>
  <div class="hand" id="hand">${hand}</div>
  <div class="fdots" role="group" aria-label="Karte nach vorn holen">${DK_FAKTEN.map((f, i) => { const st = S.saeulen[f.id] || {}; return `<button type="button" data-vorn="${i}" data-dot aria-pressed="${vorn && vorn.id === f.id}" ${st.zu ? 'disabled title="liegt schon"' : ""} style="--s:${st.zu ? FARBE(f.optionen[st.o][0]) : "var(--line)"}">${i + 1}</button>`; }).join("")}</div>
  ${vorn ? `<label class="fgrund">Begründung für Fakt ${DK_FAKTEN.indexOf(vorn) + 1} in einem Satz<textarea data-feld="faechergrund" rows="2" placeholder="Ich lege ihn auf …, weil …">${esc(F.grund)}</textarea></label>
  <p class="hinweis" id="faecherhinweis">${ok ? "Jetzt oben auf eine der drei hellen Ablagen tippen." : "Erst einen Satz schreiben, dann wird die Ablage frei. Eine andere Karte antippen holt sie nach vorn."}</p>` : `<p class="hinweis">Alle sechs Karten liegen. Eine Zahl in einer Ablage antippen nimmt die Karte zurück.</p>`}
  ${letzt ? `<div class="aufdeck neu" id="faecherfb"><p class="kennung">Fakt ${DK_FAKTEN.findIndex(f => f.id === letzt.id) + 1} liegt auf ${esc(SAEULE(letzt.sid).name)}</p>${DK_FAKTEN.find(f => f.id === letzt.id).optionen.map(o => `<p class="urt ${o[1]}"><b>${esc(SAEULE(o[0]).name)}: ${STUFENWORT[o[1]]}</b> – ${esc(o[2])}</p>`).join("")}</div>` : ""}
  <p class="hinweis" id="saeulenstand">${n} von 6 abgelegt.${n >= 3 ? " Weiter ist frei." : " Ab drei geht es weiter."}</p></div>`;
}

/* D · Rad: sechs Säulen als Segmente, Punkte je zugeordnetem Fakt – ein Profil je Land */
function segPfad(i, n, r0, r1){ const a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2, g = .03; const P = (a, r) => `${(200 + Math.cos(a) * r).toFixed(1)},${(200 + Math.sin(a) * r).toFixed(1)}`; return `M${P(a0 + g, r1)} A${r1},${r1} 0 0 1 ${P(a1 - g, r1)} L${P(a1 - g, r0)} A${r0},${r0} 0 0 0 ${P(a0 + g, r0)} Z`; }
/* zu: { key: saeulenId } · mitte: Text in der Mitte · aktiv: Segmente antippbar (data-rad=land) · stark: hervorgehobene Säule */
function rad(zu, o = {}){
  const n = SAEULEN.length, werte = Object.values(zu);
  const segs = SAEULEN.map((sa, i) => {
    const am = ((i + .5) / n) * Math.PI * 2 - Math.PI / 2, punkte = Object.entries(zu).filter(([k, v]) => v === sa.id);
    const dots = punkte.map(([k], j) => { const r = 96 + j * 15; return `<circle class="punkt" cx="${(200 + Math.cos(am) * r).toFixed(1)}" cy="${(200 + Math.sin(am) * r).toFixed(1)}" r="7"><title>${esc(o.titel ? o.titel(k) : k)}</title></circle>`; }).join("");
    const t = `<text x="${(200 + Math.cos(am) * 150).toFixed(1)}" y="${(200 + Math.sin(am) * 150 + 5).toFixed(1)}" text-anchor="middle">${esc(sa.kurz)}</text>`;
    const stark = o.stark === sa.id ? ' class="stark"' : "";
    return `<path d="${segPfad(i, n, 78, 190)}" fill="${sa.farbe}" opacity="${punkte.length || o.stark === sa.id ? 1 : .42}"${stark} ${o.aktiv ? `data-rad="${o.aktiv}" data-sid="${sa.id}" tabindex="0" role="button" aria-label="${esc(sa.name)}"` : ""}></path>${t}${dots}`;
  }).join("");
  return `<svg class="rad${o.klein ? " klein" : ""}" viewBox="0 0 400 400" role="img" aria-label="${esc(o.label || "Profil")}: ${werte.length ? SAEULEN.filter(sa => werte.includes(sa.id)).map(sa => sa.name + " " + werte.filter(v => v === sa.id).length).join(", ") : "noch leer"}">${segs}<circle class="mitte" cx="200" cy="200" r="60"/><text class="mt" x="200" y="${o.mitteKlein ? 214 : 212}" text-anchor="middle" style="${o.mitteKlein ? "font-size:34px" : ""}">${esc(o.mitte || "")}</text></svg>`;
}
const radLegende = () => `<p class="rad-leg">Säulen im Uhrzeigersinn, oben beginnend: ${SAEULEN.map(sa => `<span><i style="background:${sa.farbe}" aria-hidden="true"></i>${esc(sa.name)}</span>`).join("")}</p>`;
/* Die Schrift im Rad bleibt bei jeder Breite mindestens 16 px: --k = 400 ÷ gezeigte Breite */
const radMass = () => document.querySelectorAll("svg.rad").forEach(s => { const w = s.getBoundingClientRect().width; if (w) s.style.setProperty("--k", (400 / w).toFixed(3)); });
window.addEventListener("resize", radMass);
const DK_PROFIL = () => { const z = {}; DK_FAKTEN.forEach((f, i) => { const st = S.saeulen[f.id]; if (st && st.zu) z[i + 1] = f.optionen[st.o][0]; }); return z; };

function saeulen(){
  const n = DK_FAKTEN.filter(f => (S.saeulen[f.id] || {}).zu).length;
  return `${zeitKopf("saeulen")}<h1>Sechs Säulen</h1>
  <p class="lead">Du hast aus dem Film Faktoren gesammelt. Dein Heft bietet dafür ein Modell an: sechs Merkmale, an denen man eine Gesellschaft unter Besatzung vergleichen kann. Es ist ein Werkzeug deiner Lehrkraft, keine Theorie aus der Forschung – also prüfe es an deiner Liste.</p>
  <p class="kennung"><span class="status modell">Modell</span>Sechs Säulen – Was schützt eine Gesellschaft?</p>
  <div class="saeulen" id="saeulen-modell">${SAEULEN.map((s, i) => `<div class="saeule" style="border-top:5px solid ${s.farbe}"><b>${i + 1} · ${esc(s.name)}</b><span class="kf">${esc(s.kern)}</span><span>${esc(s.was)}</span></div>`).join("")}</div>

  <h2 class="abschnitt">Deine Faktoren an der Tafel</h2>
  ${auftrag("Abgleich · deine Liste gegen das Modell", "Wohin gehört jeder deiner Faktoren?", "Faktor antippen, dann Spalte antippen. Was in keine Säule passt, kommt nach „Passt nirgends“. Dann siehst du, welche Säulen bei dir leer bleiben. Das ist keine Lücke bei dir: Vielleicht zeigt der Film sie nicht, vielleicht braucht das Modell sie nicht.")}
  <div class="karte" id="tafelkarte">${tafel()}${abgleich()}</div>

  <h2 class="abschnitt">Sechs belegte Fakten</h2>

  const offen = l.fakten.map((f, i) => i).filter(i => !z[i]);
  const akt = offen.length ? offen[0] : null;
  return `<div class="karte landblock" id="w-${l.id}"><p class="kennung">${esc(l.land)} · ${esc(l.rate)}</p>
  <div class="rad-wrap"><div>${rad(z, { aktiv: l.id, mitte: akt !== null ? String(akt + 1) : "✓", label: "Profil " + l.land, titel: k => l.fakten[k], stark: st.zu ? l.optionen[st.o][0] : undefined })}</div>

    dlg = document.createElement('dialog'); dlg.id = 'lk-fenster'; dlg.setAttribute('aria-label', 'Kognitive Landkarte');
    var kopf = document.createElement('div'); kopf.className = 'lkf-kopf';
    var name = document.createElement('b'); name.textContent = 'Kognitive Landkarte';
    tab = document.createElement('a'); tab.className = 'lkf-tab'; tab.target = '_blank'; tab.rel = 'noopener'; tab.textContent = 'In neuem Tab öffnen';
    zu = document.createElement('button'); zu.type = 'button'; zu.className = 'lkf-zu'; zu.textContent = 'Zurück zum Arbeitsblatt';
    kopf.appendChild(name); kopf.appendChild(tab); kopf.appendChild(zu);
    raum = document.createElement('div'); raum.className = 'lkf-raum';
    dlg.appendChild(kopf); dlg.appendChild(raum); document.body.appendChild(dlg);
    zu.addEventListener('click', function () { dlg.close(); });
    dlg.addEventListener('close', function () {
      raum.textContent = '';
      if (woher && document.contains(woher) && woher.focus) woher.focus();
      woher = null;
    });
  }
  function auf(adresse, von) {
    if (!dlg) bau();
    if (typeof dlg.showModal !== 'function') return false;
    woher = von || null; tab.href = adresse; raum.textContent = '';
    var f = document.createElement('iframe'); f.title = 'Kognitive Landkarte'; f.src = adresse; raum.appendChild(f);
    if (!dlg.open) dlg.showModal();
    zu.focus();
    return true;
  }
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.closest('#lk-fenster')) return;
    if (!/apps\/landkarte\/index\.html/.test(a.getAttribute('href') || '')) return;
    if (a.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    if (auf(a.href, a)) e.preventDefault();
  }, true);
  window.addEventListener('message', function (e) {
    if (dlg && dlg.open && e.data && e.data.typ === 'lk-schliessen') dlg.close();
  });
})();
</script>
