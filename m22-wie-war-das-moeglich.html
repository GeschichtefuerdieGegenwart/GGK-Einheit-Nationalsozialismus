/* Bewusst nur hell (Beamer, Druck), wie M18–M20. Farben aus dem GGK-Labor. */
:root{

/* Kopf mit Lernweg */
.kopf{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}

.mark{width:32px;height:32px;flex:0 0 auto}
.titel{font-weight:700;line-height:1.2;margin-right:auto}.titel small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.pill{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:.45rem 1rem;font-weight:700;min-height:44px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}

.weg button{flex:1 0 auto;min-width:7.4rem;border:0;border-top:3px solid var(--line);background:transparent;text-align:left;padding:.45rem .5rem .2rem;color:var(--faint);font-size:.85rem;line-height:1.25;min-height:48px}

main{max-width:46rem;margin:auto;padding:clamp(1.5rem,4vw,3rem) max(1.25rem,env(safe-area-inset-right,0px)) 5rem max(1.25rem,env(safe-area-inset-left,0px))}

.merksatz{font-family:var(--display);font-weight:600;font-size:1.25rem;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:.7rem 0;margin:1.4rem 0;text-align:center}
.btn{min-height:48px;border:1px solid var(--border);border-radius:var(--r);padding:.6rem 1.2rem;background:var(--surface2);font-weight:700;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn:hover{background:var(--offset)}

.btn[disabled]{opacity:.45;cursor:not-allowed}

.reihe{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}

label{font-weight:700;display:block}

.feldgruppe{display:grid;gap:1rem;margin-top:1rem}

.ebene{font-size:.85rem;font-weight:700;padding:.1rem .55rem;border-radius:.35rem;display:inline-block;margin-right:.3rem}
.e-person{background:var(--kuli-hi);color:var(--kuli)} .e-situation{background:var(--green-hi);color:var(--green)}
.e-weltbild{background:var(--red-hi);color:var(--red)} .e-apparat{background:var(--slate-hi);color:var(--slate)}
.e-vorteil{background:var(--gold-hi);color:var(--gold)}

/* X · Versiegelte erste Antwort */
.umschlag .siegel{display:none;align-items:center;gap:1rem;background:var(--offset);border:2px dashed var(--muted);border-radius:var(--r);padding:1rem 1.1rem;margin-top:.6rem}

/* AF · Phasen */
.phasen{display:grid;gap:.8rem;margin-top:1rem}

/* Z · Faktencheck-Karte */
.dreh{perspective:1200px;margin-top:1.2rem}
.dreh-in{display:grid;transition:transform 460ms var(--ease);transform-style:preserve-3d}
.dreh.um .dreh-in{transform:rotateY(180deg)}
.dreh .seite{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.2rem 1.3rem}
.dreh .hinten{transform:rotateY(180deg);background:var(--green-hi);border-color:var(--green)}
.dreh .hinten[hidden]{display:block!important;visibility:hidden}

.dreh.um .hinten{visibility:visible!important}
@media (prefers-reduced-motion:reduce){.dreh-in{transition:none}.dreh.um .dreh-in{transform:none}.dreh .hinten{transform:none}.dreh.um .vorne{display:none}.dreh .hinten[hidden]{display:none!important}}
.floskel{font-family:var(--display);font-size:clamp(1.35rem,1.1rem + 1vw,1.7rem);font-style:italic;line-height:1.2}

.optionen{display:grid;gap:.45rem;margin-top:.8rem}

/* AI · Input-Stapel mit Y */
.input-kopf{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:1rem}
.spur{display:flex;align-items:flex-start;gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.6rem 1.25rem 1rem;margin:0 -1.25rem;scrollbar-width:thin;outline-offset:-3px}
.spur>.ikarte{flex:0 0 calc(100% - 3.2rem);scroll-snap-align:start;scroll-snap-stop:always;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.2rem 1.3rem;display:grid;gap:.6rem}
.ikarte .kn{font-weight:700;color:var(--red);font-size:.88rem}
.ikarte h3{font-size:1.4rem}
@supports (animation-timeline: view()){@media (prefers-reduced-motion:no-preference){
  .spur>.ikarte{animation:tiefe linear both;animation-timeline:view(inline);animation-range:cover}}}

.beamer .ikarte{font-size:1.3rem}

.steuer{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.dots{display:flex}
.dots button{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;position:relative}
.dots button::before{content:"";width:.75rem;height:.75rem;border-radius:50%;background:var(--line)}
.dots button[aria-current=true]::before{background:var(--ink)}

.feld{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;max-width:30rem;margin-top:.4rem}

/* AA · Aktenregal */
.filter{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0 .8rem}

.ruecken{flex:0 0 auto;width:4.6rem;height:12.5rem;border-radius:.4rem .4rem 0 0;border:2px solid var(--ink);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.5rem .2rem;transition:transform 220ms var(--ease)}
.ruecken .s{font-weight:600;font-size:1.3rem;font-family:var(--display)}
.ruecken .t{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:.95rem}
.ruecken[aria-pressed=true]{transform:translateY(-14px);background:var(--ink);color:var(--inverse)}
.ruecken.blass{opacity:.42}
.deckel{margin-top:1rem;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r-lg);padding:1.1rem 1.2rem}

.stufen{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:1rem;max-width:100%}

.modell{display:grid;gap:.9rem;margin-top:.8rem}

.b-person b{background:var(--kuli)} .b-situation b{background:var(--green)} .b-weltbild b{background:var(--red)} .b-apparat b{background:var(--slate)} .b-vorteil b{background:var(--gold)}

.pole{display:flex;justify-content:space-between;gap:1rem;font-weight:700;font-size:.95rem;margin-top:1rem}

/* Zusammenfassung */
.zf h2{font-size:1.25rem;margin:1.2rem 0 .4rem}

@media (max-width:640px){.zf .zw{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:13mm 14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.38}
  .kopf,.fuss,.loesch,.nodruck,.reihe{display:none!important}
  main{max-width:none;padding:0}
  .zf h1{font-size:19pt;margin:0 0 .2rem}

<script>

const speichere = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const ruhig = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) { return false; } };
const neu = (el, k) => { if (!el) return; el.classList.remove(k); void el.offsetWidth; if (!ruhig()) el.classList.add(k); };
const LABOR = /github\.io$/.test(location.hostname) ? "index.html" : "https://geschichtefuerdiegegenwart.github.io/GGK-Einheit-Nationalsozialismus/";
const MARK = `<svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="4" width="24" height="26" rx="3" fill="none" stroke="#24221F" stroke-width="2.4"/><rect x="9" y="10" width="16" height="3" rx="1.5" fill="#9B402D"/><rect x="9" y="16" width="12" height="3" rx="1.5" fill="#24221F"/><rect x="9" y="22" width="14" height="3" rx="1.5" fill="#24221F"/></svg>`;

/* ---------- Lernweg ---------- */
const SEITEN = [
  ["start","Start","",""],
  ["einstieg","1 · Einstieg","0–8 Min.","Jede Phase brauchte Menschen"],
  ["fakten","2 · Faktencheck","8–18 Min.","Drei Sätze im Faktencheck"],
  ["jozefow","3 · Józefów","18–30 Min.","Józefów, 13. Juli 1942"],
  ["akte","4 · Deine Akte","30–50 Min.","Eine Akte der Forschung"],
  ["markt","5 · Marktplatz","50–68 Min.","Marktplatz der Erklärungen"],
  ["diskussion","6 · Diskussion","68–80 Min.","Gibt es die eine Antwort?"],
  ["rueckblick","7 · Rückblick","80–87 Min.","Was denkst du jetzt?"],
  ["zusammenfassung","Zusammenfassung","",""],
];
const idx = id => SEITEN.findIndex(s => s[0] === id);

const EBENEN = [
  ["person","Person","Charakter, Erziehung, Denken"],
  ["situation","Situation","Gruppe, Befehl, Krieg"],
  ["weltbild","Weltbild","Antisemitismus, neue Normen"],
  ["apparat","Apparat","Bürokratie, Arbeitsteilung"],
  ["vorteil","Vorteil","Karriere, Raub, Aufstieg"],
];
const EB = Object.fromEntries(EBENEN.map(e => [e[0], e[1]]));
const STUFE = ["kaum","etwas","wichtig","sehr wichtig","entscheidend"];

/* ---------- Faktencheck (Z) ---------- */
const FLOSKELN = [
  { id:"f1", satz:"„Das waren ein paar Verrückte.“",
    frage:"Wie viele Deutsche und Österreicher waren nach Schätzungen der Forschung unmittelbar an den Morden beteiligt?",
    opt:["Einige Hundert","Einige Tausend","200.000 bis 250.000","Fast alle Erwachsenen"],
    befund:"Die Forschung schätzt rund 200.000 bis 250.000 deutsche und österreichische Täter*innen. Dazu kamen Helfer aus anderen Ländern. Nach 1945 testeten Psychologen die Angeklagten in Nürnberg. Sie fanden keine einheitliche krankhafte Persönlichkeit. Spätere Auswertungen der Rorschach-Tests von über 200 NS-Tätern kamen zum selben Ergebnis.",
    rueck:"Wenn es so viele waren und sie nicht krank waren: Was machte sie dann zu Tätern?",
    quelle:`Pohl 2003, S. 29, nach Bajohr: <a href="https://doks.zeitgeschichte-digital.de/doks/files/243/docupedia_bajohr_neuere_taeterforschung_v1_de_2013.pdf" target="_blank" rel="noopener">Neuere Täterforschung, Docupedia-Zeitgeschichte 2013</a> · Zillmer, Harrower, Ritzler, Archer: The Quest for the Nazi Personality, 1995` },
  { id:"f2", satz:"„Wer nicht mitmachte, wurde erschossen.“",
    frage:"Wie viele Fälle kennt die Forschung, in denen jemand hingerichtet wurde, weil er sich weigerte, Zivilisten zu erschießen?",
    opt:["Sehr viele, Tausende","Einige Hundert","Wenige Einzelfälle","Keinen einzigen"],
    befund:"Es ist kein einziger Fall nachgewiesen, in dem diese Weigerung mit dem Tod bestraft wurde. Nach 1945 beriefen sich viele Angeklagte auf einen „Befehlsnotstand“. Vor Gericht hielt das nie stand. Wer sich weigerte, musste aber mit Nachteilen rechnen: Versetzung, Spott, ein Ende der Karriere.",
    rueck:"Wenn Nein-Sagen möglich war: Warum machten trotzdem so viele mit?",
    quelle:`Kitterman: Those Who Said „No!“, German Studies Review 1988 · <a href="https://www.bpb.de/500005/befehlsnotstand/" target="_blank" rel="noopener">bpb-Lexikon: Befehlsnotstand</a>` },
  { id:"f3", satz:"„Das waren Hitler und die SS.“",
    frage:"Fritz Ertl plante Häftlingsbaracken in Auschwitz-Birkenau. Wo hatte er studiert?",
    opt:["An einer Schule der SS","Am Bauhaus in Dessau","An einer Militärakademie","Er hatte nicht studiert"],
    befund:"Ertl studierte 1928 bis 1931 am Bauhaus, der berühmten Schule für moderne Architektur. Ab 1940 arbeitete er für die SS-Bauleitung in Auschwitz, ab 1942 als stellvertretender Leiter. 1942 leitete er eine Besprechung zum Bau weiterer Krematorien. 1972 sprach ihn ein Gericht in Wien frei. Am Mord wirkten Polizisten, Beamte, Juristen, Ärzte, Bahnbeamte und Ingenieure mit.",
    rueck:"Wenn so viele Berufe beteiligt waren: Wie wurde aus Arbeit Beihilfe zum Mord?",
    quelle:`<a href="https://www.auschwitz.at/fritz-ertl-en" target="_blank" rel="noopener">Nationalfonds der Republik Österreich: Fritz Ertl</a>` },
];

/* ---------- Józefów (AI, Y) ---------- */
const JOZEFOW = [
  { h:"Wer?", t:"<p>Das Reserve-Polizeibataillon 101 aus Hamburg hatte etwa 500 Männer. Sie waren im Schnitt 39 Jahre alt. 63 Prozent waren Arbeiter, 35 Prozent kleine Angestellte und Händler. Ein Viertel war 1942 in der NSDAP.</p><p>Für diese Aufgabe ausgewählt wurden sie nicht. Für den Kriegsdienst an der Front galten sie als zu alt.</p>" },
  { h:"Wo und wann?", t:"<p>Józefów ist ein Dorf im besetzten Polen. Am 13. Juli 1942, früh am Morgen, erfahren die Männer ihren Auftrag. Sie sollen die jüdischen Einwohner*innen zusammentreiben. Arbeitsfähige Männer sollen in ein Lager kommen. Alle anderen sollen erschossen werden.</p>" },
  { h:"Das Angebot", y:true, t:"<p>Major Wilhelm Trapp ist sichtlich bewegt. Er bietet an: Wer sich der Aufgabe nicht gewachsen fühlt, darf beiseitetreten.</p>" },
  { h:"Der Tag", t:"<p>Mindestens 1.500 jüdische Frauen, Männer und Kinder werden ermordet. Etwa 300 Männer werden als Arbeitskräfte in ein Lager gebracht.</p><p>Einige Polizisten bitten im Laufe des Tages, aufhören zu dürfen. Andere machen weiter.</p>" },
  { h:"Danach", t:"<p>Mit der Zeit entziehen sich 10 bis 20 Prozent der Männer dem Töten. Bestraft wird dafür keiner. Bis Ende 1943 erschießt das Bataillon mindestens 38.000 Menschen und bringt mindestens 45.000 in das Vernichtungslager Treblinka.</p>" },
  { h:"Die Frage", t:"<p class='floskel'>Warum traten so wenige heraus? Und warum traten überhaupt welche heraus?</p><p>Sprich mit deinem Nachbarn oder deiner Nachbarin: Welche Erklärung aus deiner ersten Antwort passt nicht mehr?</p>" },
];
const JQUELLE = `Browning: Ganz normale Männer, Rowohlt 1993 · <a href="https://www.bpb.de/themen/holocaust/facing-police-and-holocaust/" target="_blank" rel="noopener">bpb: Facing History – Police and Holocaust</a> · <a href="https://wwv.yadvashem.org/download/education/conf/Rosenblum.pdf" target="_blank" rel="noopener">Yad Vashem (Rosenblum)</a> · <a href="https://www.ushmm.org/m/pdfs/Publication_OP_1996-01.pdf" target="_blank" rel="noopener">USHMM 1996</a>`;

/* ---------- Akten A–F (AA, AB) ---------- */
const AKTEN = [
 { s:"A", name:"Adorno", jahr:"1950 / 1966", e:["person"], titel:"Adorno und die Frankfurter Schule",
   frage:"Gibt es einen Charakter, der anfällig ist – und kann Erziehung schützen?", passt:"wenn du gern über Erziehung und Psychologie nachdenkst",
   s1:`<p>Theodor W. Adorno war Philosoph und Soziologe in Frankfurt. Er musste Deutschland verlassen und lebte ab 1938 in den USA. Dort fragte er mit anderen Forschenden: Gibt es einen Charakter, der Menschen anfällig für den Faschismus macht?</p><p>1950 erschien ihre Studie „The Authoritarian Personality“ (Die autoritäre Persönlichkeit). Ein Fragebogen, die F-Skala, sollte die Anfälligkeit messen (F für Faschismus). Typisch seien zum Beispiel: sich nach oben unterordnen, nach unten treten, an starren Regeln festhalten und in Macht und Stärke denken.</p><p>1966 sprach Adorno im Radio über „Erziehung nach Auschwitz“. Seine Folgerung: Erziehung muss Menschen so stark machen, dass sie nicht mitmachen.</p>`,
   s2:`<blockquote>„Die Forderung, daß Auschwitz nicht noch einmal sei, ist die allererste an Erziehung.“<span class="wer">Adorno: Erziehung nach Auschwitz, Vortrag im Hessischen Rundfunk am 18.4.1966; Gesammelte Schriften 10.2, S. 674</span></blockquote><blockquote>„Die einzig wahrhafte Kraft gegen das Prinzip von Auschwitz wäre Autonomie, wenn ich den Kantischen Ausdruck verwenden darf: die Kraft zur Reflexion, zur Selbstbestimmung, zum Nicht-Mitmachen.“<span class="wer">ebd., zitiert nach: der Freitag</span></blockquote><p>Adorno warnt auch vor der „Kälte“: der Gleichgültigkeit gegenüber dem, was anderen geschieht.</p>`,
   s3:`<p><b>Kritik:</b> Die Menschen, die die Studie befragte, waren nicht repräsentativ. Außerdem zählte die F-Skala jede Zustimmung zu einer Aussage als „autoritär“. Sie misst also zum Teil nur, wie leicht jemand zustimmt.</p><p><b>Und die Täter?</b> Die Hamburger Polizisten aus Józefów wurden nicht nach ihrem Charakter ausgesucht. Trotzdem schoss die große Mehrheit. Psychologische Tests nach 1945 fanden keinen einheitlichen „Tätertyp“.</p>`,
   hilfe:"Schau auf Adornos Satz zur Autonomie: Was hätte den Männern in Józefów nach Adorno gefehlt?",
   quellen:"Adorno, Frenkel-Brunswik, Levinson, Sanford: The Authoritarian Personality, Harper 1950 · Adorno: Erziehung nach Auschwitz (1966), in: Gesammelte Schriften 10.2, WBG 1998 · Kritik nach Christie/Jahoda (Hg.) 1954 und Bass 1956" },
 { s:"B", name:"Arendt", jahr:"1963", e:["person"], titel:"Arendt: die Banalität des Bösen",
   frage:"War Eichmann ein Monster – oder ein Beamter, der nicht dachte?", passt:"wenn dich Philosophie und Gerichtsprozesse interessieren",
   s1:`<p>Adolf Eichmann war im Reichssicherheitshauptamt dafür zuständig, die Deportationen der Jüdinnen und Juden zu organisieren. Ab dem 11. April 1961 stand er in Jerusalem vor Gericht.</p><p>Die Philosophin Hannah Arendt beobachtete den Prozess für eine Zeitschrift. Sie war selbst als Jüdin aus Deutschland geflohen. Sie erwartete ein Monster und sah einen Beamten, der in Floskeln sprach. Ihr Begriff dafür lautet „Banalität des Bösen“.</p><p>Eichmann wurde im Dezember 1961 zum Tod verurteilt und in der Nacht vom 31. Mai auf den 1. Juni 1962 hingerichtet.</p>`,
   s2:`<blockquote>„Es war gewissermaßen schiere Gedankenlosigkeit — etwas, was mit Dummheit keineswegs identisch ist —, die ihn dafür prädisponierte, zu einem der größten Verbrecher jener Zeit zu werden.“<span class="wer">Arendt: Eichmann in Jerusalem. Ein Bericht von der Banalität des Bösen, Piper 1964</span></blockquote><p>Arendt sagt selbst, das sei eine „Lektion“ und keine Theorie. „Banal“ heißt bei ihr nicht harmlos. Banal ist der Täter, nicht die Tat.</p>`,
   s3:`<p><b>Kritik:</b> Die Philosophin Bettina Stangneth wertete 2011 Gespräche aus, die Eichmann in Argentinien mit dem früheren SS-Mann Willem Sassen geführt hatte. Ihr Ergebnis: Eichmann war ein überzeugter Antisemit. In Jerusalem spielte er bewusst den kleinen Befehlsempfänger.</p><p>Ob das Arendt widerlegt, ist umstritten. Manche sagen: Stangneth baut auf Arendt auf.</p>`,
   hilfe:"Überlege: Waren die Männer in Józefów „gedankenlos“? Sie hatten ja einen Moment, in dem sie entscheiden konnten.",
   quellen:`Arendt: Eichmann in Jerusalem, Piper 1964 (engl. 1963) · <a href="https://www.bpb.de/shop/zeitschriften/apuz/archiv/527061/vorrede-zur-deutschen-ausgabe/" target="_blank" rel="noopener">APuZ 45/1964</a> · Stangneth: Eichmann vor Jerusalem, Arche 2011 · <a href="https://www.yadvashem.org/yv/de/exhibitions/eichmann/eichmann-trial.asp" target="_blank" rel="noopener">Yad Vashem: Der Eichmann-Prozess</a>` },
 { s:"C", name:"Browning", jahr:"1992", e:["situation"], titel:"Browning: Ganz normale Männer",
   frage:"Wie wurden Hamburger Polizisten zu Mördern?", passt:"wenn du nah an den Quellen arbeiten willst",
   s1:`<p>Der US-Historiker Christopher Browning las die Verhöre von 210 Männern des Reserve-Polizeibataillons 101. Die Staatsanwaltschaft Hamburg hatte sie in den 1960er-Jahren befragt. Daraus entstand 1992 sein Buch „Ganz normale Männer“.</p><p>Browning findet keinen besonderen Charakter. Er nennt mehrere Gründe, die zusammenwirken. Am wichtigsten ist für ihn die Anpassung an die Gruppe: Niemand wollte als Schwächling gelten oder die Kameraden die „Drecksarbeit“ allein machen lassen.</p>`,
   s2:`<p><b>Weitere Gründe nach Browning:</b></p><ul style="padding-left:1.2rem"><li>Gehorsam gegenüber Vorgesetzten</li><li>Sorge um die Karriere</li><li>Krieg und Feindbilder: Jüdinnen und Juden galten als Feinde.</li><li>Propaganda, die die Opfer entmenschlichte</li><li>Arbeitsteilung: Einige trieben zusammen, andere schossen.</li><li>Abstumpfung, die er eher als Folge sieht, nicht als Ursache</li></ul><p>Browning beschreibt drei Gruppen: wenige, die eifrig töteten, eine große Mehrheit, die mitmachte, und 10 bis 20 Prozent, die sich entzogen.</p>`,
   s3:`<p><b>Kritik:</b> Daniel Goldhagen wertete dieselben Akten aus und kam zum gegenteiligen Ergebnis: Die Männer hätten aus Judenhass getötet (Akte D). Browning antwortete: Goldhagen mache aus „ganz gewöhnlichen Deutschen“ Wesen, die nur noch Antisemiten seien.</p><p><b>Frage zum Weiterdenken:</b> Wenn Anpassung so stark wirkt – was machten die Männer anders, die heraustraten?</p>`,
   hilfe:"Nimm die rund zwölf Männer, die heraustraten: Welcher Grund aus Brownings Liste wirkte bei ihnen nicht?",
   quellen:`Browning: Ganz normale Männer, Rowohlt 1993 (engl. 1992) · <a href="https://www.ushmm.org/m/pdfs/Publication_OP_1996-01.pdf" target="_blank" rel="noopener">USHMM 1996: The „Willing Executioners“/„Ordinary Men“ Debate</a> · <a href="https://wwv.yadvashem.org/download/education/conf/Rosenblum.pdf" target="_blank" rel="noopener">Yad Vashem (Rosenblum)</a>` },
 { s:"D", name:"Goldhagen", jahr:"1996", e:["weltbild"], titel:"Goldhagen: Hitlers willige Vollstrecker",
   frage:"War der Judenhass der Deutschen der Grund?", passt:"wenn du Streit in der Forschung magst",
   s1:`<p>Der US-Politologe Daniel Goldhagen veröffentlichte 1996 das Buch „Hitlers willige Vollstrecker“. Seine These: In Deutschland war ein „eliminatorischer Antisemitismus“ tief verwurzelt. Gemeint ist ein Judenhass, der die Jüdinnen und Juden beseitigen will. Er habe ganz gewöhnliche Deutsche zu willigen Tätern gemacht.</p><p>In Deutschland löste das Buch 1996 eine große Debatte aus. Bei Lesungen waren die Säle voll. Viele Leserinnen und Leser stimmten zu, die meisten Fachleute blieben skeptisch.</p>`,
   s2:`<blockquote>„the vast majority … of ordinary Germans … were prepared to kill Jews“<span class="wer">Goldhagens These, zitiert nach USHMM 1996, S. 2 (englisch: Die große Mehrheit gewöhnlicher Deutscher war bereit, Juden zu töten.)</span></blockquote><p>Goldhagen untersuchte wie Browning das Reserve-Polizeibataillon 101. Er betont die Grausamkeit, die über Befehle hinausging. Eine Kollektivschuld aller Deutschen lehnt er ausdrücklich ab.</p>`,
   s3:`<p><b>Kritik:</b> Die These erklärt alles mit einer einzigen Ursache. Der Historiker Hans Mommsen nannte den Antisemitismus eine „notwendige, aber keineswegs hinreichende Bedingung“: Ohne ihn ging es nicht, aber er allein erklärt den Mord nicht.</p><p>Offen bleibt auch: Warum retteten manche Deutsche Jüdinnen und Juden? Und warum mordeten auch Helfer aus anderen Ländern?</p>`,
   hilfe:"Mommsens Satz ist der Schlüssel: Welche Ursache braucht es nach ihm noch, damit aus Judenhass Mord wird?",
   quellen:`Goldhagen: Hitlers willige Vollstrecker, Siedler 1996 · <a href="https://www.ushmm.org/m/pdfs/Publication_OP_1996-01.pdf" target="_blank" rel="noopener">USHMM 1996</a> · <a href="https://www.yadvashem.org/articles/academic/german-historians-versus-goldhagen.html" target="_blank" rel="noopener">Yad Vashem Studies 26 (1998): German Historians versus Goldhagen</a>` },
 { s:"E", name:"Milgram", jahr:"1963", e:["situation"], titel:"Milgram: Gehorsam im Experiment",
   frage:"Gehorchen Menschen jeder Autorität?", passt:"wenn dich Experimente und ihre Grenzen interessieren",
   s1:`<p>Der Psychologe Stanley Milgram wollte an der Yale University in den USA wissen: Würden Menschen einem anderen Menschen Schmerzen zufügen, nur weil eine Autorität es verlangt?</p><p>Die Versuchspersonen sollten einem „Schüler“ bei jedem Fehler einen Stromschlag geben, immer stärker. Der Schüler war ein Schauspieler, die Stromschläge waren nicht echt. Das wussten die Versuchspersonen aber nicht. Ein Versuchsleiter im grauen Kittel drängte sie weiterzumachen.</p>`,
   s2:`<blockquote>„Of the 40 subjects, 26 obeyed the orders of the experimenter to the end“<span class="wer">Milgram: Behavioral Study of Obedience, Journal of Abnormal and Social Psychology 67 (1963), S. 371–378 (englisch: Von 40 Versuchspersonen folgten 26 den Anweisungen bis zum Ende.)</span></blockquote><p>Das sind 65 Prozent, bis zur höchsten Stufe von 450 Volt. In späteren Varianten sank der Gehorsam deutlich: wenn das Opfer näher war, wenn der Versuchsleiter nur telefonisch Anweisungen gab oder wenn andere sich weigerten.</p>`,
   s3:`<p><b>Kritik:</b> Über alle rund 30 Varianten hinweg verweigerte die Mehrheit. Die Forscherin Gina Perry wertete 2012 Milgrams Archiv aus und meint, er habe Ergebnisse geschönt.</p><blockquote>„they knew what they were doing, and believed it to be right“<span class="wer">Haslam und Reicher, PLoS Biology 2012 (englisch: Sie wussten, was sie taten, und hielten es für richtig.)</span></blockquote><p>Die beiden sprechen von „engagierter Gefolgschaft“: Menschen machen mit, wenn sie das Ziel teilen, nicht aus blindem Gehorsam. Das berühmte Stanford-Prison-Experiment von 1971 gilt heute als kaum belastbar, weil die Wärter Anweisungen bekamen.</p>`,
   hilfe:"Vergleiche: Der Versuchsleiter drängte, aber Trapp bot an aufzuhören. Was heißt das für die Erklärung „Gehorsam“?",
   quellen:`Milgram 1963 · Milgram: Obedience to Authority, Harper & Row 1974 · Perry: Behind the Shock Machine, 2012 · Haslam/Reicher, PLoS Biology 10 (2012), e1001426 · Le Texier: Debunking the Stanford Prison Experiment, American Psychologist 2019` },
 { s:"F", name:"Bauman · Welzer", jahr:"1989 / 2005", e:["apparat","weltbild"], titel:"Bauman und Welzer: Apparat und Referenzrahmen",
   frage:"Wie machen Ordnung, Bürokratie und neue Normen das Töten möglich?", passt:"wenn du in Systemen denkst",
   s1:`<p>Der Soziologe Zygmunt Bauman schrieb 1989: Der Holocaust war kein Rückfall in die Barbarei. Moderne Strukturen machten ihn erst möglich.</p><ul style="padding-left:1.2rem"><li><b>Bürokratie und Arbeitsteilung:</b> Viele tun je ein kleines Stück, etwa Listen schreiben, Züge planen oder Baracken entwerfen. Niemand fühlt sich für das Ganze verantwortlich.</li><li><b>Fachwissen statt Gewissen:</b> Es zählt, ob eine Aufgabe gut erledigt ist, nicht, ob sie richtig ist.</li><li><b>Distanz:</b> Wer die Opfer nicht sieht, hat weniger Hemmungen.</li></ul>`,
   s2:`<p>Der Sozialpsychologe Harald Welzer verbindet 2005 Situation und Weltbild. Sein Begriff ist der „Referenzrahmen“: Seit 1933 verschob sich in Deutschland, was als richtig und falsch galt. Die Jüdinnen und Juden wurden aus der Gemeinschaft ausgeschlossen, für die moralische Regeln galten.</p><p>In diesem Rahmen konnte das Töten den Tätern als Arbeit erscheinen: als schwer, aber notwendig. Viele Täter klagten über Schlafstörungen und Übelkeit, also über die eigene Belastung. Schuld gegenüber den Opfern empfanden sie kaum.</p>`,
   s3:`<p><b>Kritik:</b> Browning meint, Welzer unterschätze die Skrupel der Täter.</p><p><b>Frage zum Weiterdenken:</b> Wenn die Moderne den Holocaust möglich machte, warum geschah er dann nicht in jeder modernen Gesellschaft? Das untersuchst du in M23.</p>`,
   hilfe:"Denk an Fritz Ertl aus dem Faktencheck: Welches Stück aus Baumans Liste passt zu ihm?",
   quellen:`Bauman: Dialektik der Ordnung. Die Moderne und der Holocaust, EVA 1992 (engl. 1989) · Welzer: Täter. Wie aus ganz normalen Menschen Massenmörder werden, S. Fischer 2005 · <a href="https://www.bpb.de/lernen/historisch-politische-bildung/541159/wie-werden-menschen-zu-moerdern/" target="_blank" rel="noopener">bpb: Wie werden Menschen zu Mördern?</a>` },
];
const AKTE = s => AKTEN.find(a => a.s === s);

/* ---------- Phasen aus M21 (AF) ---------- */
const PHASEN = [
  { n:"Phase 2", h:"Ausgrenzung und Entrechtung", wer:["Ministerialbeamte und der Reichstag: die Nürnberger Gesetze vom 15. September 1935","Behörden, die jüdische Beamte entließen: Gesetz vom 7. April 1933","Ämter, Gerichte, Arbeitgeber, die die Gesetze anwandten"] },
  { n:"Phase 3", h:"Räumliche Trennung und Konzentration", wer:["Polizei und Gestapo: Listen, Festnahmen","Die Reichsbahn: Fahrpläne und Züge für die Deportationen","Verwaltungen in den besetzten Gebieten: Ghettos"] },
  { n:"Phase 4", h:"Ermordung", wer:["Einsatzgruppen und Polizeibataillone wie das Reserve-Polizeibataillon 101","Das Personal der Vernichtungslager","Architekten und Ingenieure, etwa Fritz Ertl in Auschwitz"] },

const PQUELLE = `USHMM Holocaust Encyclopedia: <a href="https://encyclopedia.ushmm.org/content/en/article/the-nuremberg-race-laws" target="_blank" rel="noopener">The Nuremberg Race Laws</a> · <a href="https://encyclopedia.ushmm.org/content/de/article/deportations-to-killing-centers" target="_blank" rel="noopener">Deportationen in die Vernichtungslager</a> · <a href="https://encyclopedia.ushmm.org/content/de/article/einsatzgruppen" target="_blank" rel="noopener">Einsatzgruppen</a> · Nationalfonds Österreich (Ertl)`;

/* ---------- Bausteine ---------- */

const weiter = (nach, text) => `<div class="fuss"><span class="hinweis">Dein Stand wird nur auf diesem Gerät gespeichert.</span><button class="btn primary" data-geh="${nach}">${esc(text)} ›</button></div>`;
function auftrag(form, titel, text){ return `<div class="auftrag"><span class="form">${esc(form)}</span><h3>${esc(titel)}</h3><p>${text}</p></div>`; }
const balken = (k, v) => `<div class="balken b-${k}"><b style="--w:${(v+1)/5}"></b></div>`;

function kopf(){
  document.getElementById("kopf").innerHTML = `${MARK}<div class="titel">M22 · Wie war das möglich?<small>„Große Verbrechen brauchen keine Monster!“</small></div><a class="pill" href="${LABOR}">← GGK-Labor</a><button class="pill" data-geh="lehrkraft">Für Lehrkräfte</button>`;
  const a = idx(S.seite);
  document.getElementById("weg").innerHTML = SEITEN.slice(1).map((s, i) => {
    const k = i + 1, cls = k === a ? "akt" : (k < a ? "da" : "");

function start(){

  <div class="belastend"><b>Hinweis:</b> In dieser Stunde geht es um Massenmord. Die Texte beschreiben ihn knapp und ohne Einzelheiten der Gewalt. Bilder von Tätern oder Tatorten gibt es nicht. Wenn dich etwas belastet, sprich mit deiner Lehrkraft.</div>

  ${auftrag("Plenum · 3 Minuten","Wer war beteiligt?","Schreib zu jeder Phase deine Vermutung auf: Welche Menschen, Berufe oder Behörden waren beteiligt? Dann deckt ihr gemeinsam auf.")}

    <div class="wer" id="afw${i}"${S.afo[i] ? "" : " hidden"}><ul>${p.wer.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div></div>`).join("")}</div>
  <p class="quelle">${PQUELLE}</p>
  ${auftrag("Allein · 5 Minuten","Deine erste Antwort","Warum war die Shoah möglich? Schreib zwei oder drei Sätze, so wie du es jetzt denkst. Danach versiegelst du deine Antwort. Du öffnest sie erst am Ende der Stunde.")}
  <div class="umschlag${x.zu ? " zu" : ""}" id="umschlag">

      <div class="reihe"><button class="btn dunkel" data-siegeln ${x.text.trim().length < 10 ? "disabled" : ""}>Versiegeln</button><span class="hinweis" id="xhinweis">${x.text.trim().length < 10 ? "Schreib mindestens einen Satz." : ""}</span></div></div>
    <div class="siegel"><span class="stempel">ver&shy;siegelt<br>${esc(x.zeit)}</span><p>Deine Antwort ist versiegelt. Du öffnest sie in Schritt 7.</p></div>
  </div>

}

function fakten(){
  return `${zeitKopf("fakten")}<h1>Drei Sätze im Faktencheck</h1>
  <p class="lead">Diese drei Sätze hört man oft, wenn es um die Täter geht. Prüfe sie: erst schätzen, dann umdrehen.</p>
  ${auftrag("Input · Lehrkraft und alle · 10 Minuten","Erst schätzen, dann umdrehen","Wähle bei jeder Karte deine Schätzung. Die Karte dreht sich erst danach. Auf der Rückseite stehen der Befund und eine neue Frage.")}

    return `<div class="dreh${um ? " um" : ""}" id="dreh-${f.id}"><div class="dreh-in">

    </div></div>`; }).join("")}

}

function jozefow(){
  return `${zeitKopf("jozefow")}<h1>Józefów, 13. Juli 1942</h1>

  <button class="btn" data-hier>Hier waren wir</button><span class="hiertext" id="hiertext" aria-live="polite">${S.hier >= 0 ? "Im Unterricht bis Karte " + (S.hier + 1) : ""}</span></div>

}
function yFeld(){

}

function akte(){

  <div class="filter" role="group" aria-label="Nach Ebene filtern">${[["alle","Alle"],...EBENEN.map(e => [e[0], e[1]])].map(([k, n]) => `<button data-filter="${k}" aria-pressed="${(S.filter || "alle") === k}">${esc(n)}</button>`).join("")}</div>
  <div class="regal" id="regal">${AKTEN.map(x => `<button class="ruecken${S.filter && S.filter !== "alle" && !x.e.includes(S.filter) ? " blass" : ""}" data-akte="${x.s}" aria-pressed="${S.akte === x.s}" aria-label="Akte ${x.s}: ${esc(x.name)}"><span class="s">${x.s}</span><span class="t">${esc(x.name)}</span></button>`).join("")}</div>
  <div id="deckel">${a ? deckel(a, st, k) : `<p class="hinweis" style="margin-top:1rem">Tippe auf eine Akte. Jede gehört zu einer Ebene: ${EBENEN.map(e => `<span class="ebene e-${e[0]}">${e[1]}</span>`).join(" ")}</p>`}</div>

}
function deckel(a, st, k){

  <p>${a.e.map(e => `<span class="ebene e-${e}">Ebene ${EB[e]}</span>`).join("")}</p>

  </div>
  <details class="hilfe"><summary>Hilfe 1: Satzanfang</summary><p>„Laut ${esc(a.name.split(" ")[0])} wurden Menschen zu Tätern, weil … Das passt zu Józefów, weil … Es erklärt aber nicht, warum …“</p></details>
  <details class="hilfe"><summary>Hilfe 2: Ein Denkanstoß</summary><p>${esc(a.hilfe)}</p></details>

}

function markt(){

  <p class="lead">Jede Akte bekommt einen Stand. Die Hälfte der Klasse steht an ihrem Stand und erklärt, die andere Hälfte besucht Stände. Dann wird getauscht.</p>

  <div class="runden"><div><b>Runde 1</b><br>Akten A, C, E stehen am Stand.<br>B, D, F besuchen.</div><div><b>Runde 2</b><br>Akten B, D, F stehen am Stand.<br>A, C, E besuchen.</div></div>

    <div class="feldgruppe"><div><label for="n-${x.s}-t">These</label><input type="text" id="n-${x.s}-t" data-notiz="${x.s}" data-n="these" value="${esc(n.these)}"></div>
    <div><label for="n-${x.s}-g">Grenze: Was erklärt sie nicht?</label><input type="text" id="n-${x.s}-g" data-notiz="${x.s}" data-n="grenze" value="${esc(n.grenze)}"></div></div></details>`; }).join("")}
  <h2 class="abschnitt">Euer Erklärungsmodell</h2>
  ${auftrag("Tischgruppe · 4 Minuten · ein iPad","Gewichte verteilen","Zurück am Tisch sitzen Expertinnen und Experten verschiedener Akten. Verteilt die Gewichte für den Fall Józefów. Für das wichtigste Gewicht schreibt ihr eine Begründung. Eure Lehrkraft trägt euer Modell am Beamer ein.")}
  <div class="modell" id="modell">${EBENEN.map(([k, n, u]) => `<div class="fak"><label for="m-${k}">${n}<span class="u">${u}</span></label><div><input type="range" id="m-${k}" data-modell="${k}" min="0" max="4" value="${S.modell[k]}" aria-valuetext="${STUFE[S.modell[k]]}">${balken(k, S.modell[k])}<span class="wert" id="mw-${k}">${STUFE[S.modell[k]]}</span></div></div>`).join("")}</div>
  <p class="satz" id="msatz" aria-live="polite">${modellSatz(S.modell)}</p>
  <label for="mgrund" style="margin-top:.9rem">Begründung für das wichtigste Gewicht</label><textarea id="mgrund" data-feld="grund" rows="2" placeholder="Am wichtigsten ist für uns …, weil in Józefów …">${esc(S.grund)}</textarea>
  ${weiter("diskussion","Zur Diskussion")}`;
}
function modellSatz(m){
  let max = -1, top = [];
  EBENEN.forEach(([k, n]) => { const v = +m[k]; if (v > max) { max = v; top = [n]; } else if (v === max) top.push(n); });
  return top.length === 5 ? "Alle Ebenen sind gleich gewichtet. Was ist für euch am wichtigsten?" : `Euer Modell: Am stärksten gewichtet ${top.length > 1 ? "sind" : "ist"} ${top.join(" und ")} (${STUFE[max]}).`;
}

  <p class="lead">Am Beamer stehen die Modelle aller Tischgruppen nebeneinander. Die Diskussion beginnt dort, wo ihr euch am wenigsten einig seid.</p>

function rueckblick(){

const posSatz = v => v < 35 ? "Du neigst zur Person: Charakter, Erziehung und eigenes Denken entscheiden." : v > 65 ? "Du neigst zu den Umständen: Gruppe, Befehle, Normen und Apparat entscheiden." : "Du stehst in der Mitte: Person und Umstände wirken zusammen.";

function zusammenfassung(){
  const a = S.akte ? AKTE(S.akte) : null, k = a ? (S.karte[a.s] || {}) : {};
